[project]
name = "release-orchestrator"
version = "0.0.1"
description = "Local Python harness for multi-repo orchestration via the Claude Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "release-core",
]

[project.scripts]
orc = "orchestrator.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.uv.sources]
release-core = { workspace = true }
