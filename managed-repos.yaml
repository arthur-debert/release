# The single source of truth for the list of repos this release/ portfolio manages.
# Source of truth for audit-portfolio, managed-repos, release-verify-fleet,
# and any future per-fleet tooling. README.md's "Managed repos" table is
# the human-readable mirror.
#
# THIS FILE IS THE ONLY SOURCE OF TRUTH FOR THE FLEET. There is no
# ruleset/gh-api auto-discovery — that path caused recurring bugs and is
# deliberately gone. To add a repo: append it under the right project. To
# remove: delete the entry.
#
# Each entry is `{ repo: <owner>/<name>, path: <dir-relative-to-REPOS_ROOT> }`.
# The `path` is stated EXPLICITLY so on-disk location needs zero inference:
# a tool resolves a repo to `$REPOS_ROOT/<path>` and nothing else. No
# single-vs-multi heuristics, no org-vs-project-name guessing. $REPOS_ROOT
# defaults to ~/h on a dev machine; release-verify-fleet points it at a
# throwaway dir for a hermetic sweep.
#
# An entry may carry an optional `expect-verify-fail: <reason>` annotation
# (#594): `release-core admin repos verify` classifies that repo's gate FAIL
# as EXPECTED — the reason is environmental (e.g. a sibling checkout the
# hermetic clone can't have) and not mechanically inferable from the failing
# checks. Shrink-only ratchet: the moment the annotated repo PASSES, verify
# flags the annotation as STALE — remove it. npm-deps artifacts (eslint /
# prettier / typecheck failing with no `npm install`) need NO annotation;
# verify classifies those mechanically by failing check.
#
# Note the path is NOT derivable from `repo`: the lex project's repos are
# `lex-fmt/*` but live under `lex-fmt/` while phos's `phos-editor/*`
# live under `phos/` (as `phos-app`/`phos-core`), and single-repo projects collapse to a bare dir
# (`arthur-debert/dodot` -> `dodot`, not `dodot/dodot`). That non-derivability
# is exactly why the path is written down rather than computed.

projects:
  phos:
    - repo: phos-editor/app
      path: phos/phos-app
      expect-verify-fail: gate needs the phos parity sibling checkouts, absent in the hermetic clone
    - { repo: phos-editor/core, path: phos/phos-core }

  burgertocow:
    - { repo: arthur-debert/burgertocow, path: burgertocow }

  clapfig:
    - { repo: arthur-debert/clapfig, path: clapfig }

  dodot:
    - { repo: arthur-debert/dodot, path: dodot }

  # Secondary stack — brew-tap. Different lifecycle (formulas land via
  # release-workflow pushes, not PR loop). Out of audit scope for now;
  # uncomment when the brew-tap stack workstream picks up.
  # homebrew-tools:
  #   - { repo: arthur-debert/homebrew-tools, path: homebrew-tools }

  lex:
    - { repo: lex-fmt/comms,           path: lex-fmt/comms }
    - { repo: lex-fmt/lex,             path: lex-fmt/lex }
    - { repo: lex-fmt/lexed,           path: lex-fmt/lexed }
    - { repo: lex-fmt/nvim,            path: lex-fmt/nvim }
    - { repo: lex-fmt/tree-sitter-lex, path: lex-fmt/tree-sitter-lex }
    - { repo: lex-fmt/vscode,          path: lex-fmt/vscode }
    - { repo: lex-fmt/zed-lex,         path: lex-fmt/zed-lex }

  padz:
    - { repo: arthur-debert/padz, path: padz }

  # release/ itself — the source-of-truth repo doesn't carry many of
  # the per-consumer baseline files (it IS the source). Out of audit
  # scope for now; will need a release/-specific check set if we
  # want to track its own hygiene.
  # release:
  #   - { repo: arthur-debert/release, path: release }

  rustloc:
    - { repo: arthur-debert/rustloc, path: rustloc }

  simple-gal:
    - { repo: arthur-debert/simple-gal,    path: simple-gal/simple-gal }
    # gh-action stack — secondary, not yet tackled (#108).
    # Uncomment when the gh-action stack workstream picks up.
    # - { repo: arthur-debert/simple-gal-action, path: simple-gal/simple-gal-action }
    - { repo: arthur-debert/simple-gal-ui, path: simple-gal/simple-gal-ui }

  standout:
    - { repo: arthur-debert/standout, path: standout }

  supage:
    - { repo: arthur-debert/supage, path: supage }

  wave-term:
    - { repo: arthur-debert/wave-term, path: wave-term }

# Canary consumers (#587) — release-owned synthetic repos exercised by
# `release-core admin canary run` BEFORE a cut. Deliberately a TOP-LEVEL
# block, NOT under `projects:`: the fleet sweeps (verify / migrate / inbox /
# audit) iterate `projects:` only and must never include the canaries
# (owner decision OQ6). One entry per family: `<family>: <owner>/<name>`.
# Entries are maintained by `release-core admin canary init` (#604), which
# seeds each repo from its `tests/fixtures/<kind>/` fixture (the dir whose
# `.canary-family` marker names the family) and appends here on first init.
canaries:
  rust: arthur-debert/release-canary-rust
  vscode-ext: arthur-debert/release-canary-vscode-ext

