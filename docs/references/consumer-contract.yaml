# consumer-contract.yaml — the consumer-tree contract (epic #583, WS-A #584).
#
# GENERATED — do not hand-edit. Source of truth: release_core/sync.py
# (constants + classification predicates) applied to this repo's templates/
# tree. Regenerate with:
#
#   release-core admin contract dump
#
# A PR that changes the contract (sync.py classification, templates/ dests,
# retired_files) MUST regenerate this file in the same PR — the root lefthook.yml
# `consumer-contract-check` gate entry fails when the file is out of sync.
#
# This manifest is PRESCRIPTIVE, not descriptive (#583 owner constraint): it
# states what a consumer tree MUST look like. Where a repo diverges, the fix
# is a one-time consumer normalization PR — never a manifest exception or a
# central knob. Escape hatches shrink, not grow.
#
# Sections:
#   tracked_real_files    — the only files release tracks in a consumer: the
#                           bootstrap quartet (must work on a fresh clone,
#                           BEFORE .release/ exists) + .github/workflows/*
#                           managed real copies (GitHub won't deref symlinks).
#   gitignored            — the ephemeral .release/ build dir (WS4).
#   untracked_mirrors     — symlink dests recomposed every init, excluded via
#                           .git/info/exclude, NEVER tracked (WS7).
#   gate_internal         — live only inside .release/ (WS3).
#   retired_files         — retired dests init removes (provenance-gated, WS6).
#   managed_path_prefixes — path prefixes whose presence in a CI job means the
#                           job MUST install `.release/` first (arm-gate /
#                           release-core init); the assumption lint
#                           (bin-internal/lint-consumer-contract.sh) enforces
#                           this over every workflow + composite action.

contract_schema: 1
tracked_real_files:
  bootstrap:
    - ".claude/settings.json"
    - "bin/delegate-guard"
    - "bin/install-release-core"
    - "bin/pr-loop-guard"
  workflow_copies:
    - ".github/workflows/copilot-review.yml"
gitignored:
  - ".release/"
untracked_mirrors:
  - ".claude/skills/electron-e2e-testing/SKILL.md"
  - ".claude/skills/gh-pr-review-loop/SKILL.md"
  - ".claude/skills/lex-multirepo/SKILL.md"
  - ".claude/skills/lex-primer/SKILL.md"
  - ".claude/skills/macos-signing-notarization/SKILL.md"
  - ".editorconfig"
  - ".github/CODEOWNERS"
  - ".github/copilot-instructions.md"
  - ".github/dependabot.yml"
  - ".github/pull_request_template.md"
  - "CHANGELOG/README.txt"
  - "bin/build"
  - "bin/check"
  - "bin/check-docs"
  - "bin/check-e2e"
  - "bin/check-gate"
  - "bin/check-shell"
  - "bin/check-tests"
  - "bin/diff-since-release"
  - "bin/e2e"
  - "lib/bats-harness.bash"
  - "tests/e2e/bats/helpers/setup.bash"
gate_internal:
  - ".markdownlint.json"
  - ".markdownlintignore"
  - ".prettierignore"
  - ".shellcheckrc"
  - ".yamllint"
  - "lefthook.yml"
retired_files:
  blob:
    - ".release/ORIENTATION.md"
    - "app-bin/smoke-hook.sh"
    - "bin/changelog"
    - "bin/changelog-add"
    - "bin/changelog-cut"
    - "bin/changelog-render"
    - "bin/check-fmt"
    - "bin/check-lint"
    - "bin/gh-release-issue"
    - "bin/gh-task-status"
    - "bin/semver"
    - "bin/share/semver-tool/LICENSE"
    - "bin/share/semver-tool/README.md"
    - "bin/share/semver-tool/semver"
    - "lefthook.yml"
    - "scripts/check"
    - "scripts/check-fmt"
    - "scripts/check-lint"
    - "scripts/check-tests"
    - "scripts/setup-dev-env.sh"
    - "scripts/smoke.sh"
    - "vendor/semver-tool/LICENSE"
    - "vendor/semver-tool/README.md"
    - "vendor/semver-tool/semver"
  fingerprint:
    - "bin/release"
    - "bin/setup-dev-env.sh"
    - "scripts/setup-dev-env.sh"
managed_path_prefixes:
  - ".release/"
  - "bin/check"
  - "lib/release_core/"
