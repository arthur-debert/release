# Virtual workspace root for release/'s Python code.
#
# Two members, split by the environment line (see
# docs/proposals/dev-workflow-state-engine.lex §6.2):
#   - templates/commons/lib/release_gh : the PR state engine. stdlib + `gh` only,
#                      runs in CI and Cloud. ZERO third-party runtime deps.
#   - orchestrator   : local-only harness. May use the Claude Agent SDK
#                      because it never runs in CI/Cloud.
#
# Toolchain (ruff, pytest) is configured ONCE here and covers both.
[tool.uv.workspace]
# release_gh lives under templates/commons/ because it's a release-managed file
# set distributed to consumers (like templates/commons/bin/*). The maintainer's
# bin/gh-task-status is a symlink into it; release-sync materializes it into a
# consumer's .release/lib/. It is still the single canonical copy.
members = [
  "templates/commons/lib/release_gh",
  "templates/commons/lib/release_core",
  "orchestrator",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/.venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# release_core's tests live ALONGSIDE the package (templates/commons/lib/
# release_core/tests/) — the gh-task-status suite's tests/python/ split is for
# the older release_gh package; the migration substrate keeps its tests next to
# the code. Both roots are collected by the bare `pytest` CI step.
testpaths = ["tests/python", "templates/commons/lib/release_core/tests"]
# Import release_gh + release_core + orchestrator without a build/install step,
# mirroring the runtime sys.path-shim model. orchestrator.watch is importable
# for its pure logic because it lazy-imports the Claude Agent SDK (so these
# tests need no SDK — they run under the light py-lint CI job).
pythonpath = [
  "templates/commons/lib/release_gh",
  "templates/commons/lib/release_core",
  "orchestrator",
]
