# shell-quality lefthook fragment.
# Merged into the consumer's lefthook.yml by release-sync.
# Priority 2 = check-only (no auto-fix and re-stage).

pre-commit:
  commands:
    markdownlint:
      glob: "**/*.md"
      run: markdownlint {staged_files}
      priority: 2
    yamllint:
      glob: "**/*.{yml,yaml}"
      run: yamllint {staged_files}
      priority: 2
    shellcheck:
      # Lefthook's glob matches by name; extensionless shell scripts
      # under scripts/ and bin/ (a near-universal portfolio convention
      # — `scripts/check`, `bin/release-create`, etc.) wouldn't match
      # **/*.{sh,bash} alone. Include those directories explicitly.
      # A non-shell file under those dirs (e.g. a .py) would fail
      # shellcheck loudly — that's acceptable feedback ("this isn't
      # actually a shell script, move it or rename it").
      glob:
        - "**/*.{sh,bash}"
        - "scripts/*"
        - "bin/*"
      run: shellcheck {staged_files}
      priority: 2
