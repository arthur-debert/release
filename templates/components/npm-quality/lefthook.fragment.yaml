# npm-quality lefthook fragment.
# Merged into the consumer's lefthook.yml by release-sync.
# Priority 2 = pre-commit gate. prettier runs in auto-fix mode
# (--write + stage_fixed); eslint and typecheck are check-only
# (rule violations need code changes, not formatting).
#
# Frontend hygiene shared across npm-based Stacks (electron-app,
# tauri-app, vscode-ext, anything with a package.json front end).
#
# Design: pre-commit hooks run the tool DIRECTLY (npx) against the
# staged files only. The portfolio convention is that
# `npm run lint` / `npm run format:check` lint the WHOLE project
# (the right shape for CI), so plumbing {staged_files} through them
# either (a) widens the scope back to "everything" because the
# project glob is hard-coded in the script (lexed pattern) or
# (b) defeats the point. The umbrella `bin/check-lint` /
# `bin/check-fmt` calls the npm scripts — pre-commit calls the
# tool directly. Two layers, two scopes.
#
# typecheck has no per-file form (tsc operates on the project), so
# it goes through `npm run typecheck` when staged TS changes.
#
# `npx --no-install` so the tool resolves to the version pinned in
# the consumer's local `node_modules` (whichever lockfile produced
# it — package-lock.json, npm-shrinkwrap.json, pnpm-lock.yaml,
# yarn.lock). If the tool isn't a declared dep, the hook fails
# loudly — that's correct (a project staging *.ts files without
# eslint installed is misconfigured).
#
# `eslint --max-warnings 0` matches the portfolio's npm `lint`
# convention: a warning is a failure. Without it the hook would
# accept warnings while CI's `bin/check-lint` (via `npm run lint`)
# would reject them — confusing.

pre-commit:
  commands:
    eslint:
      # Catch ESLint config edits too — a rule change should re-lint
      # everything staged. mjs/cjs included for tooling files written
      # in modern module syntax (vite.config.mjs, eslint.config.mjs).
      #
      # `--no-warn-ignored` (requires ESLint >= 8.51.0): pre-commit hands
      # eslint the STAGED set, which can include files eslint's own config
      # ignores (build output, or a monorepo's `shared/**` / `packages/**`
      # that lint under their own setup). Without this flag eslint emits a
      # "File ignored because of a matching ignore pattern" WARNING for each,
      # and `--max-warnings 0` turns that into a commit failure — punishing
      # the consumer for a file eslint was *told* to ignore. Same class as
      # the check-shell shim skip: a staged-files linter must not fail on
      # files it was asked to skip. (Consumers previously hand-rolled this in
      # a lefthook-local.yml shadow; folding it upstream retires those.)
      # Glob form per release#531 F4: leading `**/` never matches a repo-root
      # file — which is exactly where eslint.config.* / tsconfig.json live.
      # Bare `*` crosses `/` (root + any depth); root configs get their
      # literal entry alongside the nested `**/` form.
      glob:
        - "*.{js,jsx,ts,tsx,vue,mjs,cjs}"
        - ".eslintrc*"
        - "**/.eslintrc*"
        - "eslint.config.*"
        - "**/eslint.config.*"
      run: npx --no-install eslint --no-warn-ignored --max-warnings 0 -- {staged_files}
      priority: 2
    prettier:
      # Auto-fix + re-stage. Prettier's whole value is mechanical
      # formatting; failing the commit for fixable whitespace is
      # friction with no payoff. `stage_fixed: true` writes the
      # fixes back to the working tree AND re-stages them in the
      # same hook run, so the commit goes through with the
      # formatted content. If prettier can't fix something (rare),
      # it'll exit non-zero and the commit fails as before.
      #
      # Symlink filter: prettier 3.x explicitly refuses symlinks
      # passed as explicit paths ("Explicitly specified pattern X
      # is a symbolic link"). With the build-dir + symlinks sync
      # model (ADR-0001), most managed files are symlinks pointing
      # into .release/, so we strip them before invoking prettier.
      # The real files (under .release/) are in the same staged
      # set when changed, and still get formatted.
      glob:
        - "*.{js,jsx,ts,tsx,vue,svelte,json,html,css,scss,md,yml,yaml}"
      #
      # --ignore-path REPLACES prettier's default [.gitignore, .prettierignore]
      # discovery, so we re-pass both (when present) PLUS the managed
      # .release/.prettierignore (WS3, release#524 — the managed ignore, which
      # skips the generated CHANGELOG, no longer mirrors to the consumer root).
      # Multiple --ignore-path values are accepted and merged.
      run: >-
        set --;
        for f in {staged_files}; do
          [ -L "$f" ] || set -- "$@" "$f";
        done;
        [ $# -eq 0 ] && exit 0;
        ig="";
        [ -f .gitignore ] && ig="$ig --ignore-path .gitignore";
        [ -f .prettierignore ] && ig="$ig --ignore-path .prettierignore";
        [ -f .release/.prettierignore ] && ig="$ig --ignore-path .release/.prettierignore";
        npx --no-install prettier --write $ig -- "$@";
      stage_fixed: true
      priority: 2
    typecheck:
      # tsc operates on the project as a whole — no per-file invocation.
      # The glob exists so the hook only fires when TS files are staged;
      # editing only a README.md shouldn't trigger a full typecheck.
      #
      # HARD gate (WS3, release#524): TS files are staged (the glob fired), so a
      # `typecheck` script MUST exist — an absent runner FAILS LOUD, it does not
      # silently no-op. The old `--if-present` let a misconfigured TS project
      # (staging .ts with no typecheck script) show a hollow green — exactly the
      # absent-runner class WS8-round-1 flagged. `npm pkg get scripts.typecheck`
      # prints `{}` when the script is absent.
      glob:
        - "*.{ts,tsx}"
        - "tsconfig*.json"
        - "**/tsconfig*.json"
      run: >-
        if [ "$(npm pkg get scripts.typecheck 2>/dev/null)" = "{}" ]; then
          echo "ERROR: TS files staged but no 'typecheck' npm script — the gate does not skip. Add a 'typecheck' script (e.g. \"tsc --noEmit\") or remove the TS files." >&2;
          exit 1;
        fi;
        npm run --silent typecheck
      priority: 2
