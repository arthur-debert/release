# go-quality lefthook fragment.
# Merged into the consumer's lefthook.yml by release-sync.
# Priority 2 = check-only (no auto-fix).

pre-commit:
  commands:
    gofmt:
      # gofmt -l prints unformatted file names and exits 0 even when
      # there are unformatted files; we want the hook to fail in that
      # case. Pipe through a test that succeeds only when stdin is
      # empty. Glob matches Go sources anywhere in the tree.
      glob: "**/*.go"
      run: |
        # `gofmt -l` lists unformatted files but exits 0 either way —
        # the non-empty output is the signal. A real gofmt failure
        # (e.g. parse error) DOES exit non-zero, though, and we want
        # that to fail the hook too. `set -e` makes the failing gofmt
        # propagate before the `if` overwrites $?.
        set -e
        unformatted=$(gofmt -l {staged_files})
        if [ -n "$unformatted" ]; then
          echo "Files not gofmt'd:" >&2
          echo "$unformatted" >&2
          echo "Run 'gofmt -w .' to fix." >&2
          exit 1
        fi
      priority: 2
    go-vet:
      # go vet operates on import paths, not files. Glob still gates
      # which staged files trigger the hook, but the command lints the
      # whole module — that matches what CI does and catches
      # cross-package issues (a vet warning that touches a file you
      # didn't stage but lives in the same package).
      glob:
        - "**/*.go"
        - "**/go.mod"
        - "**/go.sum"
      run: go vet ./...
      priority: 2
    golangci-lint:
      # HARD gate: a missing tool exits non-zero (never skips). CI installs
      # it via the canonical setup-go action; locally the bootstrap
      # (setup-dev-env.sh) installs it for Go repos.
      glob:
        - "**/*.go"
        - "**/go.mod"
      run: |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run ./...
        else
          echo "ERROR: golangci-lint not installed — the gate does not skip. Re-run the bootstrap (setup-dev-env.sh)." >&2
          exit 1
        fi
      priority: 2
