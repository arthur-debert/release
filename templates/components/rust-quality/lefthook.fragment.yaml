# rust-quality lefthook fragment.
# Merged into the consumer's lefthook.yml by release-sync.
# Priority 2 = check-only.
#
# rust-quality intentionally ships no config files — rustfmt's defaults
# match the portfolio (0/21 repos override). Add a templates/components/
# rust-quality/rustfmt.toml here if defaults need to change for everyone.

pre-commit:
  commands:
    cargo-fmt:
      glob: "**/*.rs"
      run: cargo fmt --all -- --check
      priority: 2
    cargo-clippy:
      # Match any Rust source OR any Cargo.toml (workspace root + per-
      # crate manifests). Dependency / feature changes trigger clippy
      # the same as code edits. Other TOMLs (rustfmt.toml, clippy.toml,
      # tooling configs) are intentionally NOT in the glob — they don't
      # affect what clippy reports.
      glob:
        - "**/*.rs"
        - "**/Cargo.toml"
      run: cargo clippy --all-targets -- -D warnings
      priority: 2
