# rust-quality lefthook fragment.
# Merged into the consumer's lefthook.yml by release-sync.
# Priority 2 = check-only.
#
# rust-quality intentionally ships no config files — rustfmt's defaults
# match the portfolio (0/21 repos override). Add a templates/components/
# rust-quality/rustfmt.toml here if defaults need to change for everyone.

pre-commit:
  commands:
    cargo-fmt:
      # rustfmt.toml in the glob so format-config changes trigger a
      # re-check of formatting against the new rules.
      #
      # Glob form per release#531 F4: leading `**/` never matches a repo-root
      # file (it requires ≥1 dir segment), so the ROOT rustfmt.toml/Cargo.toml
      # need their literal entry alongside the `**/` nested form; bare `*.rs`
      # crosses `/` and covers root + any depth.
      glob:
        - "*.rs"
        - "rustfmt.toml"
        - "**/rustfmt.toml"
      # Check-only, but SUMMARIZE the failure instead of dumping rustfmt's
      # colorized unified diff (release#691). A bare `cargo fmt -- --check`
      # spews a long, escape-code-laden diff on the very first run of a repo
      # with unformatted code — noisy and hard to action. We add `-l` so
      # rustfmt lists the files that need formatting (one per line) instead,
      # and on failure print that list plus the one remedy: `cargo fmt`.
      #
      # We deliberately do NOT auto-apply (`cargo fmt` without `--check`):
      # auto-formatting inside the gate would silently modify files the
      # commit didn't touch — the same class of bug as the #713 prettier
      # `--write`-on-`--all-files` problem. The author runs `cargo fmt`
      # deliberately. Exit stays non-zero on a fmt nit, consistent with the
      # check-only cargo-clippy step below.
      run: >-
        errf="$(mktemp "${TMPDIR:-/tmp}/cargo-fmt.XXXXXX")";
        out="$(cargo fmt --all -- --check -l 2>"$errf")";
        rc=$?;
        if [ "$rc" -ne 0 ]; then
          if [ -n "$out" ]; then
            n="$(printf '%s\n' "$out" | grep -c .)";
            echo "cargo-fmt: ${n} file(s) need formatting — run \`cargo fmt\` to fix:" >&2;
            printf '%s\n' "$out" | sed 's/^/  /' >&2;
          else
            echo "cargo-fmt: failed (not a formatting diff) — rustfmt/toolchain error:" >&2;
            cat "$errf" >&2;
          fi;
          rm -f "$errf";
          exit "$rc";
        fi;
        rm -f "$errf"
      priority: 2
    cargo-clippy:
      # Match any Rust source OR Cargo manifest OR Cargo.lock. Dependency
      # / feature changes trigger clippy the same as code edits — and
      # Cargo.lock specifically because new dep versions can introduce
      # new clippy warnings (deprecations, lint upgrades). Other TOMLs
      # (clippy.toml, tooling configs) are intentionally NOT in the
      # glob — they don't affect what clippy reports.
      glob:
        - "*.rs"
        - "Cargo.toml"
        - "**/Cargo.toml"
        - "Cargo.lock"
        - "**/Cargo.lock"
      # No `--workspace` flag: clippy without it lints the workspace's
      # `[workspace.default-members]` (which defaults to ALL members when
      # not set). Consumers with target-specific crates that can't
      # host-compile (e.g. lex-fmt/lex's `lex-wasm`) declare
      # `default-members` in their root Cargo.toml excluding those
      # crates, and the host hook stops trying to lint them. Consumers
      # without `default-members` get the same coverage as before.
      # See release#128 for the design rationale (option C).
      #
      # `--all-features` exercises every feature-gated path that clippy
      # could find, matching what bin/check-tests does — pre-commit
      # signal mirrors CI, no "passes locally fails in CI" surprise.
      run: cargo clippy --all-targets --all-features -- -D warnings
      priority: 2
