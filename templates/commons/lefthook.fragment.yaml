# commons lefthook fragment — the universal shell/markdown/yaml gate.
# Lives in templates/commons/ so release-sync applies it to EVERY
# consumer structurally, independent of Kind manifests (release#320).
# Previously this was the `shell-quality` Capability, universal only
# by every manifest happening to list it; promoting it to commons
# closes the gap for newly-added or manifest-less Kinds.
# Merged into the consumer's lefthook.yml by release-sync.
# Priority 2 = pre-commit gate. markdownlint runs in auto-fix mode
# (--fix + stage_fixed); yamllint and shellcheck are check-only
# (no auto-fix available).
#
# Each hook is `command -v`-guarded so a contributor without the tool
# installed gets a clear skip-with-notice rather than a cryptic "command
# not found" hook failure. Cloud Claude Code sessions have all three
# tools installed by env/setup.sh; local dev pre-installs via
# `brew install markdownlint-cli yamllint shellcheck` (or equivalent).

pre-commit:
  commands:
    markdownlint:
      # Auto-fix + re-stage. markdownlint --fix handles most
      # whitespace/style issues mechanically. Content-level rules
      # (MD041 first-line-heading, unbalanced refs) still fail the
      # commit when they can't be auto-fixed — that's the right gate.
      glob: "**/*.md"
      run: >-
        if command -v markdownlint >/dev/null 2>&1; then
          markdownlint --fix -- {staged_files};
        else
          echo "markdownlint not installed (skipping; install via npm i -g markdownlint-cli or brew install markdownlint-cli)" >&2;
        fi
      stage_fixed: true
      priority: 2
    yamllint:
      glob: "**/*.{yml,yaml}"
      run: >-
        if command -v yamllint >/dev/null 2>&1; then
          yamllint {staged_files};
        else
          echo "yamllint not installed (skipping; install via pip install yamllint or brew install yamllint)" >&2;
        fi
      priority: 2
    shellcheck:
      # Extensionless executables under bin/ and scripts/ are the
      # portfolio convention (`bin/check`, `bin/release-create`,
      # `scripts/setup-dev-env.sh`, etc.). Recursive `**` so nested
      # subdirectories are covered too.
      #
      # exclude: list filters out common non-shell file types that
      # may legitimately live under scripts/ or bin/ (README.md, a
      # tool's .json config, a Python helper). Shell-extension files
      # (*.sh / *.bash) anywhere in the tree still match via the
      # first glob entry. False positives from less common types (a
      # Lua script in scripts/, say) will fail shellcheck loudly —
      # acceptable signal to rename or move.
      #
      # All owned shell gets full strictness, including test helpers
      # under live-tests/ and tests/. bats `$status`/`$output` false
      # positives (SC2154) are handled per-file with a documented
      # `# shellcheck disable=SC2154` header in the helpers, not by
      # excluding the whole tree. app-bin/** is globbed so extensionless
      # app scripts living there are linted too.
      glob:
        - "**/*.{sh,bash}"
        - "scripts/**"
        - "bin/**"
        - "app-bin/**"
      # NOTE on glob syntax: lefthook's `exclude` field uses glob, NOT
      # regex (despite some docs suggesting otherwise). Empirically:
      # `**/*.foo` does NOT work (the `**/` prefix breaks). `*.foo`
      # DOES match recursively (treated as ends-with). `dir/**` works
      # for excluding a subtree.
      #
      # Only non-shell file types and generated/vendored artifacts are
      # excluded. completions/** are idiomatic (bash-3 compgen word-split
      # that `mapfile` can't replace) and bin/share/** is vendored — both
      # stay out permanently. Test paths are NOT excluded: their real
      # debt is linted; bats false positives use per-file disables.
      exclude:
        - "*.{md,json,yaml,yml,toml,py,rb,rs,js,ts,mjs,cjs,html,css,txt,lock}"
        - "*LICENSE*"
        - "completions/**"
        - "*/completions/**"
        - "bin/share/**"
        # gh-task-status is a release-provided Python shim (extensionless, it
        # imports the release_gh package), so the `*.py` exclude above can't
        # catch it and shellcheck SC1071's on every consumer that syncs the
        # engine. A leading-`*` glob can't cross `/`; `**/` can (cf.
        # bin/share/**), so match it path-anchored. (release#348)
        - "**/gh-task-status"
      # --severity=info passed as a CLI flag (not via .shellcheckrc)
      # because Ubuntu 24.04 ships shellcheck 0.9.0 which silently
      # ignores the `severity=` directive in the rc file (that's a
      # 0.10+ feature). The CLI flag works on all versions. Keep the
      # rc-file setting too so local invocations (without lefthook)
      # still get the same severity floor on modern shellchecks.
      #
      # Floor is `info` (not `warning`): surfaces the high-value info
      # checks — notably SC2086 (unquoted expansion) — while staying
      # above `style`-level nitpicks. Consumers were cleaned to this
      # floor before it was tightened here.
      run: >-
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck --severity=info -- {staged_files};
        else
          echo "shellcheck not installed (skipping; install: see https://github.com/koalaman/shellcheck#installing)" >&2;
        fi
      priority: 2
