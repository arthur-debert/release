# commons lefthook fragment — the universal shell/markdown/yaml gate.
# Lives in templates/commons/ so release-sync applies it to EVERY
# consumer structurally, independent of Kind manifests (release#320).
# Previously this was the `shell-quality` Capability, universal only
# by every manifest happening to list it; promoting it to commons
# closes the gap for newly-added or manifest-less Kinds.
# Merged into the consumer's lefthook.yml by release-sync.
# Priority 2 = pre-commit gate. markdownlint runs in auto-fix mode
# (--fix + stage_fixed); yamllint and shellcheck are check-only
# (no auto-fix available).
#
# This is a HARD gate: a missing tool exits NON-ZERO (never skips). A
# missing tool is a BOOTSTRAP failure, not a reason to pass — re-run
# `release-core gate --provision` to arm the toolset. Cloud + local Claude
# Code sessions install all three tools via `release-core init` (SessionStart);
# or `brew install markdownlint-cli yamllint shellcheck`.

pre-commit:
  commands:
    markdownlint:
      # Auto-fix + re-stage. markdownlint --fix handles most
      # whitespace/style issues mechanically. Content-level rules
      # (MD041 first-line-heading, unbalanced refs) still fail the
      # commit when they can't be auto-fixed — that's the right gate.
      #
      # Lefthook glob semantics (spiked on the pinned 2.1.9, release#531 F4):
      # a leading `**/` requires ≥1 directory segment, so `**/*.md` NEVER
      # matches a repo-root file; a bare `*` crosses `/`, so `*.md` matches
      # root AND any depth. Hence the bare form, here and in every fragment.
      glob: "*.md"
      # --config / --ignore-path point at the managed copies in the ephemeral
      # .release/ build dir (WS3, release#524): the gate configs no longer mirror
      # to the consumer root, so the tool can't auto-discover them from cwd.
      #
      # markdownlint-cli's --ignore-path takes a SINGLE file and REPLACES its
      # default .markdownlintignore discovery (it does NOT merge, and unlike
      # prettier it accepts only one --ignore-path). So passing only the managed
      # .release/.markdownlintignore silently DROPS a consumer's own root
      # .markdownlintignore carve-outs (e.g. `docs/research/`), and
      # `markdownlint --fix` would then rewrite files the project deliberately
      # keeps as-is. To honor the consumer-local ignore — symmetric with how the
      # npm-quality prettier fragment merges .prettierignore — we concatenate the
      # consumer's .markdownlintignore (when present) onto the managed one into a
      # temp file and pass that; otherwise we use the managed file directly.
      # The merged temp file is removed afterward (no $TMPDIR litter across
      # repeated commits), and markdownlint's exit status is captured BEFORE the
      # cleanup so the gate returns the lint result, never `rm`'s status — a
      # masked exit code would silently pass real failures.
      run: >-
        if ! command -v markdownlint >/dev/null 2>&1; then
          echo "ERROR: markdownlint not installed — the gate does not skip. Re-run `release-core gate --provision`." >&2;
          exit 1;
        fi;
        ign=.release/.markdownlintignore;
        if [ -f .markdownlintignore ]; then
          ign="$(mktemp "${TMPDIR:-/tmp}/mdlint-ignore.XXXXXX")";
          cat .release/.markdownlintignore .markdownlintignore > "$ign";
        fi;
        markdownlint --fix --config .release/.markdownlint.json --ignore-path "$ign" -- {staged_files};
        rc=$?;
        [ "$ign" = .release/.markdownlintignore ] || rm -f "$ign";
        exit $rc
      stage_fixed: true
      priority: 2
    yamllint:
      glob: "*.{yml,yaml}"
      # -c points at the managed config in .release/ (WS3, release#524) — no
      # longer mirrored to the consumer root for cwd auto-discovery.
      run: >-
        if command -v yamllint >/dev/null 2>&1; then
          yamllint -c .release/.yamllint -- {staged_files};
        else
          echo "ERROR: yamllint not installed — the gate does not skip. Re-run `release-core gate --provision`." >&2;
          exit 1;
        fi
      priority: 2
    shellcheck:
      # The unified gate: file selection lives in bin/check-shell (a single
      # distributed runner), NOT in glob/exclude here. The runner picks shell
      # by CONTENT — a shell shebang or .sh/.bash, vendored share/ exempt — so
      # non-shell files that live under bin/ (the changelog Python shim,
      # Dockerfiles, etc.) fall out STRUCTURALLY. This kills the whole class of
      # "shellcheck SC1071's on a non-shell file": the old glob+exclude couldn't
      # catch extensionless non-shell files and wasn't honoured the same way
      # across lefthook modes (staged vs --all-files). check-shell is invoked
      # identically by pre-commit, CI, and `release-core admin repos verify`, and release
      # dogfoods it over its own distributed output.
      #
      # The glob just decides WHEN this step runs (and what {staged_files}
      # holds); the runner does the real selection, so no `exclude` is needed.
      glob:
        - "*.{sh,bash}"
        - "bin/**"
        - "app-bin/**"
      run: bin/check-shell {staged_files}
      priority: 2
