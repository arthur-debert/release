# Kind default manifest for `zed-extension` (detected via extension.toml
# at repo root + Cargo.toml — Zed extensions are Rust crates compiled to
# wasm32-wasip2; the wasm IS the published artifact).
# Consumers can override with `.release-sync.yaml` at their repo root.

kind: zed-extension
capabilities: []
# The shell/markdown/yaml lint gate is no longer a Capability — it
# ships in templates/commons/ and applies to every consumer
# structurally (release#320), so it is not listed here.
# Opt-in Capabilities (bats, mkdocs) are not listed here. Consumers that
# want them ship a .release-sync.yaml that includes them in addition to
# the defaults above.
#
# Note: there is NO rust-quality Capability in the defaults. The
# rust-quality Capability's `cargo clippy` hook doesn't pass
# `--target wasm32-wasip2`, but a Zed extension built for the host
# target won't link against `zed_extension_api`'s wasm-only ABI. The
# clippy hook lives in this Kind's lefthook.fragment.yaml with the
# wasm target wired in — same pattern as tauri-app's src-tauri/-scoped
# override. See lefthook.fragment.yaml.
