# Stack default manifest for `rust` (detected via Cargo.toml).
# Consumers can override with .release-sync.yaml at their repo root.
#
# Note: detect-stack returns "rust" today; the README matrix distinguishes
# rust-cli vs rust-lib. Naming reconciliation is a separate workstream.

stack: rust
components:
  - shell-quality
  - rust-quality
# Opt-in Components like bats are not listed here. Consumers that want
# them ship a .release-sync.yaml that includes them in addition to the
# defaults above.
