# --------------------------------------------------------------------------
# Commons lefthook fragment — copy-paste into your stack's lefthook.yml
# --------------------------------------------------------------------------
#
# WHAT THIS IS
#   Hooks for the file types every repo has regardless of stack: Markdown,
#   YAML, shell. Paste under the `pre-commit.commands:` block of your
#   stack's `lefthook.yml`, alongside the stack-specific commands.
#
# WHY NOT A COMPOSER
#   See `Composition principle` in the README. At our scale (~10 stacks,
#   ~16 consumers) the value of a fragment-merge generator is below its
#   maintenance cost. Documented copy-paste is the cheap path; re-copy
#   from here when this file changes.
#
# DEPENDENCIES (consumer installs once, locally + in CI)
#   - markdownlint:  `npm install -g markdownlint-cli` (or use markdownlint-cli2)
#                    Config: `.markdownlint.json` at repo root
#                    (`{"MD013": false, "line-length": false}` is the
#                    portfolio default — long lines tolerated.)
#   - yamllint:      `pip install yamllint` or `apt install yamllint`
#                    Config: `.yamllint` at repo root
#   - shellcheck:    `apt install shellcheck` or `brew install shellcheck`
#                    Config: `.shellcheckrc` at repo root
#
# PRIORITY CONVENTION
#   Priority 1 = auto-fix (modifies staged files, re-stages).
#   Priority 2 = check-only (fails on issue, no fix).
#   These hooks are check-only — paste them at priority 2 alongside
#   `clippy` / `tests` / equivalents.
#
# COPY THE BLOCK BELOW INTO YOUR `pre-commit.commands:` SECTION
# ---------- BEGIN FRAGMENT ----------

    markdownlint:
      glob: '**/*.md'
      run: markdownlint {staged_files}
      priority: 2

    yamllint:
      glob: '**/*.{yml,yaml}'
      run: yamllint {staged_files}
      priority: 2

    shellcheck:
      glob: '**/*.{sh,bash}'
      run: shellcheck {staged_files}
      priority: 2

# ---------- END FRAGMENT ------------
