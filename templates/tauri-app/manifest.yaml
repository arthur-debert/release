# Kind default manifest for `tauri-app` (detected via src-tauri/Cargo.toml
# AND package.json — a Tauri app has both a Rust core under src-tauri/
# and a frontend at repo root).
# Consumers can override with `.release-sync.yaml` at their repo root.

kind: tauri-app
capabilities:
  - npm-quality
# The shell/markdown/yaml lint gate is no longer a Capability — it
# ships in templates/commons/ and applies to every consumer
# structurally (release#320), so it is not listed here.
# Opt-in Capabilities (bats, mkdocs, playwright-eventually) are not
# listed here. Consumers that want them ship a .release-sync.yaml
# that includes them in addition to the defaults above.
#
# Note: there is NO rust-quality Capability in the defaults. The
# Rust hooks for tauri-app live in this Kind's lefthook.fragment.yaml
# (cwd-scoped to src-tauri/) because the rust-quality Capability
# assumes Cargo.toml at the repo root. See lefthook.fragment.yaml.
