# tauri-app stack-level lefthook fragment.
# Merged into the consumer's lefthook.yml by release-sync.
# Priority 2 = check-only (no auto-fix and re-stage).
#
# Why a Stack-level fragment instead of reusing the rust-quality
# Component:
#
# rust-quality assumes Cargo.toml at the repo ROOT and globs `**/*.rs`
# at the root. In a Tauri app the Cargo workspace lives in `src-tauri/`
# (the standard Tauri layout) — the consumer's repo root is the frontend.
# Running `cargo fmt` from root would error ("could not find Cargo.toml
# in /path/or any parent dir").
#
# The fix is to scope these hooks to src-tauri/: glob matches files
# under src-tauri/**, and the `run` block `cd`s into src-tauri/ before
# invoking cargo. Same tool, same flags as rust-quality — just rooted
# under the Tauri subproject. We don't ship a "tauri-rust-quality"
# Capability for this: a Kind-level fragment is the right home for a
# one-off layout variation like the src-tauri/ subdirectory.

pre-commit:
  commands:
    tauri-cargo-fmt:
      # Glob form per release#531 F4: `dir/**/X` requires ≥1 segment between
      # dir and X, so it MISSED src-tauri/Cargo.toml and src-tauri/build.rs.
      # `src-tauri/*.rs` crosses `/` (direct + any depth); literal files get
      # their exact entry.
      glob:
        - "src-tauri/*.rs"
        - "src-tauri/rustfmt.toml"
        - "src-tauri/**/rustfmt.toml"
      # Summarize the failure (file list + remedy) rather than dumping
      # rustfmt's colorized unified diff — `-l` lists the files needing
      # formatting; see rust-quality for the rationale (release#691). No
      # auto-apply (gate must never silently rewrite files, cf. #713).
      run: >-
        cd src-tauri;
        errf="$(mktemp)";
        out="$(cargo fmt --all -- --check -l 2>"$errf")";
        rc=$?;
        if [ "$rc" -ne 0 ]; then
          if [ -n "$out" ]; then
            n="$(printf '%s\n' "$out" | grep -c .)";
            echo "tauri-cargo-fmt: ${n} file(s) need formatting — run \`cargo fmt\` (in src-tauri/) to fix:" >&2;
            printf '%s\n' "$out" | sed 's/^/  /' >&2;
          else
            echo "tauri-cargo-fmt: failed (not a formatting diff) — rustfmt/toolchain error:" >&2;
            cat "$errf" >&2;
          fi;
          rm -f "$errf";
          exit "$rc";
        fi;
        rm -f "$errf"
      priority: 2
    tauri-cargo-clippy:
      # Match any Rust source OR Cargo manifest OR Cargo.lock under
      # src-tauri/. Dependency / feature changes trigger clippy the
      # same as code edits — and Cargo.lock specifically because new
      # dep versions can introduce new clippy warnings (deprecations,
      # lint upgrades).
      glob:
        - "src-tauri/*.rs"
        - "src-tauri/Cargo.toml"
        - "src-tauri/**/Cargo.toml"
        - "src-tauri/Cargo.lock"
        - "src-tauri/**/Cargo.lock"
      # `--all-features` exercises every feature-gated path that
      # clippy could find, matching what bin/check-tests does —
      # pre-commit signal mirrors CI, no "passes locally fails in CI"
      # surprise.
      run: cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings
      priority: 2
