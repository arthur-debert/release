# Kind default manifest for `github-action` (detected via action.yml
# or action.yaml at repo root — a composite or javascript GitHub
# Action repo).
# Consumers can override with `.release-sync.yaml` at their repo root.

kind: github-action
capabilities: []
# GitHub Action repos are typically minimal: action.yml + maybe some
# shell helpers + README. The shell/markdown/yaml lint gate (markdownlint
# / yamllint / shellcheck) is the full pre-commit surface and now ships
# universally from templates/commons/ (release#320) — no Capability needs
# to be listed. No language-specific quality Capability applies (the
# action's implementation could be composite shell, JavaScript, or
# Docker — we don't gate on those uniformly).
