name: 'Setup Rust'
description: 'Install Rust toolchain from rust-toolchain.toml and cache dependencies'

inputs:
  components:
    description: 'Extra rustup components (e.g. clippy, rustfmt)'
    required: false
    default: ''
  targets:
    description: 'Extra Rust targets to install'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Read toolchain from rust-toolchain.toml
      id: toolchain
      shell: bash
      run: |
        if [ -f rust-toolchain.toml ]; then
          CHANNEL=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
        else
          CHANNEL=stable
        fi
        echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Add extra targets to project toolchain
      # `dtolnay/rust-toolchain@master with: targets:` adds targets to the
      # *active* toolchain, but if rust-toolchain.toml pins a different
      # channel, those targets aren't available when cargo runs. Re-add
      # them via rustup to be safe.
      if: inputs.targets != ''
      shell: bash
      run: rustup target add ${{ inputs.targets }}

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Install repo-selected fast linker
      # Install the fast linker a repo opts into via .cargo/config.toml
      # (`-fuse-ld=mold` on Linux, `-fuse-ld=lld` on macOS), so the link step
      # doesn't fail on a missing linker. Detection-based: a repo that selects
      # no custom linker pays nothing (the grep finds nothing → no install), so
      # this is free for the rest of the fleet. Idempotent — skipped when the
      # linker is already present. Used by rust-ci / rust-cli / rust-lib /
      # tauri-ci via this composite; tauri-app.yml installs its own (it doesn't
      # use setup-rust). Robustness, not speed (see phos-editor/app#318).
      shell: bash
      run: |
        set -euo pipefail
        # Detect the selected linker in TRACKED .cargo/config.toml files only
        # (git ls-files) — never walk target/, which Swatinem/rust-cache has
        # just restored, so detection stays cheap for repos that select nothing.
        sel() {
          local f
          while IFS= read -r f; do
            grep -q "fuse-ld=$1" "$f" 2>/dev/null && return 0
          done < <(git ls-files 2>/dev/null | grep -E '(^|/)\.cargo/config\.toml$')
          return 1
        }
        case "$(uname -s)" in
          Linux)
            if sel mold && ! command -v mold >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y mold
            fi ;;
          Darwin)
            if sel lld && ! command -v ld64.lld >/dev/null 2>&1; then
              brew install lld
            fi ;;
        esac
