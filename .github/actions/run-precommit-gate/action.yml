name: Run consumer pre-commit gate
description: |
  Run the consumer's own pre-commit gate against staged files before
  the release workflow auto-commits a version bump. Holds the bot to
  the same lint/format gate as a human committer, so the bot's bump
  commit doesn't get rejected by the consumer's regular CI for drift
  the workflow itself introduced (jq writing 2-space indent into a
  tab-formatted JSON file, awk rewriting a Cargo.toml, etc.).

  Detects (in order):
    1. lefthook  (lefthook.yml / lefthook.yaml / .lefthook.yml)
    2. pre-commit framework  (.pre-commit-config.yaml / .yml)
    3. husky  (.husky/pre-commit)

  No-op when none is configured. Failure exits non-zero so the
  release halts cleanly before pushing a commit the consumer's CI
  would reject anyway.

  Auto-fix support: if the gate modifies tracked files (lefthook
  `stage_fixed: true`, prettier --write, etc.) the action re-stages
  them via `git add -u` so the bot commit captures the fix.

  ## Why this composite exists

  Bot commits from inside the release workflow bypass client-side
  hooks by design — there is no `.git/hooks/pre-commit` symlink in
  the CI checkout. Each stack's prepare step rewrites version files
  with `jq` / `awk` / `perl`, none of which preserve consumer
  formatting. Per-stack patches (re-running prettier inline, etc.)
  fragment ops across the matrix. This action centralizes the gate:
  the consumer defines what runs (via their lefthook /
  pre-commit-config / husky), the workflow just invokes it.

  ## Opting out

  Set the env var `SKIP_PRECOMMIT_GATE=true` in the calling job (or
  pass `skip: 'true'`) to bypass. Use sparingly — opting out means
  the bot commit may trip the consumer's regular CI.

inputs:
  working-directory:
    description: 'Repo root to run the gate from.'
    required: false
    default: '.'
  skip:
    description: 'Set to "true" to bypass the gate entirely.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Run pre-commit gate on staged files
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GATE_SKIP_INPUT: ${{ inputs.skip }}
      run: |
        set -euo pipefail

        if [ "${GATE_SKIP_INPUT}" = "true" ] || [ "${SKIP_PRECOMMIT_GATE:-false}" = "true" ]; then
          echo "Pre-commit gate skipped (input or SKIP_PRECOMMIT_GATE)."
          exit 0
        fi

        # Collect staged files (newline-separated → space-separated for CLI args).
        # If nothing is staged, the gate has nothing to do.
        mapfile -t staged_arr < <(git diff --cached --name-only)
        if [ "${#staged_arr[@]}" -eq 0 ]; then
          echo "No staged files — pre-commit gate has nothing to check."
          exit 0
        fi
        printf 'Staged files (%d):\n' "${#staged_arr[@]}"
        printf '  %s\n' "${staged_arr[@]}"

        # Build --file flags once for lefthook 2.x (one per staged file).
        lefthook_file_args=()
        for f in "${staged_arr[@]}"; do
          lefthook_file_args+=(--file "$f")
        done

        run_lefthook() {
          # Lefthook 2.x: pass per-file --file flags so command-level
          # globs in the consumer's lefthook.yml still scope each hook
          # correctly to the bumped files only.
          if [ -f pnpm-lock.yaml ]; then
            corepack enable >/dev/null 2>&1 || true
            echo "→ pnpm install (frozen, no scripts) for lefthook deps"
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm exec lefthook run pre-commit "${lefthook_file_args[@]}"
          elif [ -f package-lock.json ]; then
            echo "→ npm ci (no scripts) for lefthook deps"
            npm ci --ignore-scripts
            npx --no-install lefthook run pre-commit "${lefthook_file_args[@]}"
          elif [ -f yarn.lock ]; then
            corepack enable >/dev/null 2>&1 || true
            echo "→ yarn install (frozen, no scripts) for lefthook deps"
            yarn install --frozen-lockfile --ignore-scripts
            yarn exec lefthook run pre-commit "${lefthook_file_args[@]}"
          else
            # No JS package manager detected: lefthook may still be on PATH
            # (Go binary install), or fall back to a one-shot npx fetch.
            if command -v lefthook >/dev/null 2>&1; then
              lefthook run pre-commit "${lefthook_file_args[@]}"
            else
              npx --yes lefthook run pre-commit "${lefthook_file_args[@]}"
            fi
          fi
        }

        run_precommit_framework() {
          # Python pre-commit framework. pipx is preinstalled on
          # ubuntu-latest runners; if it isn't, fall back to python -m pip.
          if command -v pipx >/dev/null 2>&1; then
            pipx run pre-commit run --files "${staged_arr[@]}"
          else
            python3 -m pip install --user --quiet pre-commit
            "$(python3 -m site --user-base)/bin/pre-commit" run --files "${staged_arr[@]}"
          fi
        }

        run_husky() {
          # Husky's pre-commit is a plain shell script. Execute it
          # directly; it'll honor whatever the consumer wired into it.
          bash .husky/pre-commit
        }

        gate_ran=0
        if [ -f lefthook.yml ] || [ -f .lefthook.yml ] || [ -f lefthook.yaml ]; then
          echo "Detected lefthook config — running gate."
          run_lefthook
          gate_ran=1
        elif [ -f .pre-commit-config.yaml ] || [ -f .pre-commit-config.yml ]; then
          echo "Detected pre-commit framework — running gate."
          run_precommit_framework
          gate_ran=1
        elif [ -d .husky ] && [ -f .husky/pre-commit ]; then
          echo "Detected husky pre-commit — running gate."
          run_husky
          gate_ran=1
        else
          echo "No pre-commit gate detected (no lefthook / pre-commit / husky config) — skipping."
        fi

        # Re-stage auto-fixes (prettier --write, eslint --fix, lefthook
        # stage_fixed:true, etc.) so the upcoming `git commit` picks
        # them up. Only restages tracked, already-modified files —
        # untracked files stay out.
        if [ "${gate_ran}" = "1" ] && ! git diff --quiet; then
          echo "Gate produced auto-fixes — re-staging modified files."
          git diff --name-only
          git add -u
        fi
