name: 'Reseal macOS dmg'
description: 'Rebuild a .dmg from a signed .app with hdiutil (post-hoc signing — never re-bundle, which strips the signature)'

inputs:
  app-path:
    description: 'Path to the SIGNED .app bundle'
    required: true
  dmg-out:
    description: 'Output path for the resealed .dmg'
    required: true
  volname:
    description: 'dmg volume name (default: the .app basename without .app)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Reseal dmg from signed app
      shell: bash
      env:
        APP_PATH: ${{ inputs.app-path }}
        DMG_OUT: ${{ inputs.dmg-out }}
        VOLNAME: ${{ inputs.volname }}
      run: bash "${{ github.action_path }}/../../../bin-internal/reseal-mac-dmg.sh"
