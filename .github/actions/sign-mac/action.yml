name: 'Sign macOS artifacts'
description: 'Import a Developer ID cert and codesign one or more paths with hardened runtime'

inputs:
  cert-p12-base64:
    description: 'Base64-encoded .p12 cert (Developer ID Application). Empty → skip signing.'
    required: false
    default: ''
  cert-password:
    description: 'Password for the .p12 cert. Optional — leave empty for passwordless .p12s (valid per PKCS#12; signing still runs).'
    required: false
    default: ''
  paths:
    description: 'Newline-separated paths to sign (in order; outer last for nested bundles)'
    required: true
  entitlements:
    description: 'Path to entitlements .plist (optional; mac apps with QL/Spotlight extensions usually need this)'
    required: false
    default: ''

outputs:
  signed:
    description: '"true" if signing happened, "false" if skipped (empty cert)'
    value: ${{ steps.sign.outputs.signed }}
  identity:
    description: 'Identity used for signing (empty if skipped)'
    value: ${{ steps.sign.outputs.identity }}

runs:
  using: 'composite'
  steps:
    - name: Import certificate and sign
      id: sign
      shell: bash
      env:
        CERT_P12_BASE64: ${{ inputs.cert-p12-base64 }}
        CERT_PASSWORD: ${{ inputs.cert-password }}
        PATHS: ${{ inputs.paths }}
        ENTITLEMENTS: ${{ inputs.entitlements }}
      run: |
        set -euo pipefail

        # Skip ONLY when no certificate is supplied. An EMPTY password is
        # valid — a passwordless .p12 is legal per PKCS#12, and `security
        # import -P ""` imports it fine. Gating the skip on the password too
        # (the old `|| [ -z "$CERT_PASSWORD" ]`) made this action silently skip
        # codesign for passwordless-cert consumers (e.g. phos), leaving every
        # binary ad-hoc-signed → notary rejection. The cert presence is the
        # only real signal of "signing requested".
        if [ -z "$CERT_P12_BASE64" ]; then
          echo "::warning::No signing certificate configured — skipping codesign."
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "identity=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # UNIQUE keychain + cert paths per invocation. The post-hoc signer calls
        # this action MORE THAN ONCE in a single job (Sign .app, then Sign .dmg),
        # so a fixed `$RUNNER_TEMP/signing.keychain-db` made the 2nd
        # `security create-keychain` collide ("A keychain with the same name
        # already exists", exit 48). PID + a random hex make each call's names
        # unique. (NOT `mktemp -u "...XXXXXX.keychain-db"` — BSD/macOS mktemp only
        # substitutes a trailing XXXXXX, so a suffix after it stays literal.)
        UNIQ="$$-$(openssl rand -hex 4)"
        KEYCHAIN="$RUNNER_TEMP/signing-${UNIQ}.keychain-db"
        CERT_P12="$RUNNER_TEMP/cert-${UNIQ}.p12"
        KEYCHAIN_PASS="$(openssl rand -hex 16)"

        # Clean up THIS call's keychain + cert on exit (success or failure):
        # delete-keychain removes it from the user search list AND deletes the
        # file, so calls don't accumulate keychains (which could confuse a later
        # `security find-identity`). Best-effort — never fail the step on cleanup.
        cleanup() {
          security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
          rm -f "$CERT_P12" "$KEYCHAIN" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_P12"
        security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
        security set-keychain-settings -lut 3600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
        security import "$CERT_P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
        # Prepend this keychain to the user search list (keeping the existing
        # ones) so codesign + find-identity in THIS call see the imported cert.
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed 's/.*"\(.*\)"/\1/')

        if [ -z "$IDENTITY" ]; then
          echo "::error::No codesigning identity found in imported keychain"
          exit 1
        fi
        echo "Found identity: $IDENTITY"

        # Determine whether to pass --entitlements. Avoid bash 3.2 (macOS)
        # tripping on `"${arr[@]}"` under `set -u` when arr is empty.
        USE_ENT=false
        if [ -n "$ENTITLEMENTS" ] && [ -f "$ENTITLEMENTS" ]; then
          USE_ENT=true
        fi

        # Sign each path. The caller supplies them in order (outer last for
        # nested bundles like .app containing inner .appex / helpers).
        while IFS= read -r path; do
          [ -z "$path" ] && continue
          path=$(echo "$path" | xargs) # trim
          [ -e "$path" ] || { echo "::error::Path to sign not found: $path"; exit 1; }
          echo "→ signing $path"
          if [ "$USE_ENT" = "true" ]; then
            codesign --force --sign "$IDENTITY" --options runtime --timestamp \
              --entitlements "$ENTITLEMENTS" "$path"
          else
            codesign --force --sign "$IDENTITY" --options runtime --timestamp "$path"
          fi
          codesign --verify --strict "$path"
        done <<< "$PATHS"

        # cert.p12 + keychain are removed by the EXIT trap (cleanup()).
        echo "signed=true" >> "$GITHUB_OUTPUT"
        echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
