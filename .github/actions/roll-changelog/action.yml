name: 'Roll changelog'
description: 'Extract `## [Unreleased]` notes for a release; optionally roll into a versioned section'

inputs:
  changelog-path:
    description: 'Path to CHANGELOG.md'
    required: false
    default: 'CHANGELOG.md'
  version:
    description: 'Version being released (no leading v)'
    required: true
  mode:
    description: '`extract` (just read notes) or `roll` (read + rewrite changelog)'
    required: false
    default: 'extract'
  notes-path:
    description: 'Where to write the extracted release notes'
    required: false
    default: 'release-notes.md'

outputs:
  notes-path:
    description: 'Path to the file containing the extracted release notes'
    value: ${{ inputs.notes-path }}

runs:
  using: 'composite'
  steps:
    - name: Run roll-changelog.sh
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
        VERSION: ${{ inputs.version }}
        MODE: ${{ inputs.mode }}
        NOTES: ${{ inputs.notes-path }}
      run: |
        set -euo pipefail
        if [ "$MODE" = "roll" ]; then
          bash "${{ github.action_path }}/../../../scripts/roll-changelog.sh" \
            roll "$CHANGELOG" "$VERSION" "$NOTES"
        else
          bash "${{ github.action_path }}/../../../scripts/roll-changelog.sh" \
            extract "$CHANGELOG" "$NOTES"
        fi
