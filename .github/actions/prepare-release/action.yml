name: 'Prepare release'
description: |
  Validate a version, bump Cargo.toml(s) workspace-wide, roll the changelog,
  commit + tag + push. Resume-on-failure: if the tag already exists at the
  given version, skip the bump and emit the tag's SHA so downstream jobs can
  re-run cleanly.

inputs:
  version:
    description: 'Version to release (e.g. 0.18.0 or 1.0.0-rc.1)'
    required: true
  changelog-path:
    description: 'Path to CHANGELOG.md (Keep-a-Changelog format with `## [Unreleased]` section)'
    required: false
    default: 'CHANGELOG.md'

outputs:
  version:
    description: 'Validated version (no leading v)'
    value: ${{ steps.outputs.outputs.version }}
  release-sha:
    description: 'Commit SHA of the tag (for downstream jobs to checkout)'
    value: ${{ steps.outputs.outputs.sha }}
  prerelease:
    description: '"true" if version contains a pre-release suffix'
    value: ${{ steps.outputs.outputs.prerelease }}
  notes-path:
    description: 'Path to extracted release notes file'
    value: 'release-notes.md'

runs:
  using: 'composite'
  steps:
    - name: Check changelog fragments
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
      run: bash "${{ github.action_path }}/../../../bin-internal/check-changelog-fragments.sh"

    - name: Validate and detect resume case
      id: detect
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        SEMVER: ${{ github.action_path }}/../../../templates/commons/bin/share/semver-tool/semver
      run: |
        set -euo pipefail

        if [[ "$NEW_VERSION" =~ ^[vV] ]] \
            || [[ "$("$SEMVER" validate "$NEW_VERSION")" != "valid" ]] \
            || [[ -n "$("$SEMVER" get build "$NEW_VERSION")" ]]; then
          echo "::error::version must be MAJOR.MINOR.PATCH[-PRERELEASE] (got: $NEW_VERSION)"
          exit 1
        fi

        IS_PRERELEASE=false
        if [[ -n "$("$SEMVER" get prerel "$NEW_VERSION")" ]]; then
          IS_PRERELEASE=true
        fi
        echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

        TAG="v$NEW_VERSION"
        git fetch --tags origin >/dev/null 2>&1 || true

        # Resume case: tag already exists. Validate that Cargo.toml at that
        # commit matches NEW_VERSION (otherwise we'd be re-running against
        # a different release accidentally).
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          TAG_SHA=$(git rev-list -n 1 "$TAG")

          # Find any Cargo.toml at the tag with a literal `version = "..."`
          # field. Skips workspace-only Cargo.tomls and `version.workspace = true`.
          TAG_VERSION=""
          for f in Cargo.toml crates/*/Cargo.toml; do
            v=$(git show "$TAG:$f" 2>/dev/null | grep -E '^version = "[^"]+"' | head -1 | sed -E 's/^version = "([^"]+)"/\1/' || true)
            if [ -n "$v" ]; then
              TAG_VERSION="$v"
              break
            fi
          done

          if [ "$TAG_VERSION" = "$NEW_VERSION" ]; then
            echo "tag $TAG already exists at $TAG_SHA (Cargo.toml=$TAG_VERSION) — resuming"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::tag $TAG exists but Cargo.toml at that commit is '$TAG_VERSION', not '$NEW_VERSION'"
          exit 1
        fi

        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Install cargo-edit
      if: steps.detect.outputs.skip != 'true'
      shell: bash
      run: |
        # cargo-edit's transitive deps require rust >= 1.89, which can be
        # newer than the project's rust-toolchain.toml pin. Use stable for
        # the install; the resulting `cargo set-version` is a standalone
        # binary that doesn't go through the active toolchain.
        if ! command -v cargo-set-version >/dev/null 2>&1; then
          RUSTUP_TOOLCHAIN=stable cargo install cargo-edit --locked
        fi

    - name: Bump workspace versions
      if: steps.detect.outputs.skip != 'true'
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # set-version --workspace handles every workspace shape: single-crate,
        # workspace.package + workspace.dependencies pins, per-crate versions.
        # It also rewrites intra-workspace deps to point at the new version.
        cargo set-version --workspace "$NEW_VERSION"
        # Refresh Cargo.lock so the bumped versions appear there too. Use
        # --workspace to scope to local crates and avoid pulling registry
        # updates into the bump commit.
        cargo update -w

    - name: Roll changelog (final release only)
      if: steps.detect.outputs.skip != 'true' && steps.detect.outputs.prerelease != 'true'
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
        NEW_VERSION: ${{ inputs.version }}
      run: |
        bash "${{ github.action_path }}/../../../bin-internal/roll-changelog.sh" \
          roll "$CHANGELOG" "$NEW_VERSION" release-notes.md

    - name: Extract changelog notes (prerelease)
      if: steps.detect.outputs.skip != 'true' && steps.detect.outputs.prerelease == 'true'
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
      run: |
        # Prereleases share Unreleased entries with the final they lead to;
        # extract for release notes but don't roll into a versioned section.
        bash "${{ github.action_path }}/../../../bin-internal/roll-changelog.sh" \
          extract "$CHANGELOG" release-notes.md

    - name: Commit, tag, push
      id: push
      if: steps.detect.outputs.skip != 'true'
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        CHANGELOG: ${{ inputs.changelog-path }}
        IS_PRERELEASE: ${{ steps.detect.outputs.prerelease }}
      run: |
        set -euo pipefail
        TAG="v$NEW_VERSION"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Stage only the files cargo-edit + roll-changelog should have
        # touched: every Cargo.toml under the workspace, Cargo.lock, and
        # the changelog (when rolled).
        git add Cargo.lock 2>/dev/null || true
        find . -name Cargo.toml -not -path './target/*' -print0 | xargs -0 git add 2>/dev/null || true
        if [ "$IS_PRERELEASE" != "true" ] && [ -f "$CHANGELOG" ]; then
          git add "$CHANGELOG"
          # Fragment-dir convention (#201): roll-changelog.sh routes
          # through bin/changelog when CHANGELOG/ exists. That creates
          # CHANGELOG/<version>.md and deletes the unreleased-*.md
          # fragments — stage both. Resolve sibling-of-changelog so
          # this works even when CHANGELOG.md lives in a subdir.
          CHANGELOG_DIR="$(dirname "$CHANGELOG")/CHANGELOG"
          if [ -d "$CHANGELOG_DIR" ]; then
            git add "$CHANGELOG_DIR/"
          fi
        fi

        if git diff --cached --quiet; then
          echo "::error::No changes staged after version bump — was set-version a no-op? Cargo.toml may already be at $NEW_VERSION."
          exit 1
        fi

        # Pre-commit gate — hold the bot commit to the consumer's own
        # gate. Equivalent to .github/actions/run-precommit-gate@v1
        # (canonical reference); inlined because this step is a single
        # `run:` block. Set SKIP_PRECOMMIT_GATE=true to bypass.
        if [ "${SKIP_PRECOMMIT_GATE:-false}" != "true" ]; then
          # --diff-filter=ACMR excludes Deleted: the changelog roll deletes
          # unreleased-*.md fragments, and a deleted path can't be
          # linted/formatted. Feeding one to lefthook's prettier
          # (stage_fixed: true) makes it `git add --force` a vanished file
          # → exit 128. The deletion still commits via the staged index.
          mapfile -t staged_arr < <(git diff --cached --name-only --diff-filter=ACMR)
          if [ "${#staged_arr[@]}" -gt 0 ]; then
            if [ -f lefthook.yml ] || [ -f .lefthook.yml ] || [ -f lefthook.yaml ]; then
              echo "Pre-commit gate: lefthook"
              lefthook_file_args=()
              for f in "${staged_arr[@]}"; do
                lefthook_file_args+=(--file "$f")
              done
              if [ -f pnpm-lock.yaml ]; then
                corepack enable >/dev/null 2>&1 || true
                pnpm install --frozen-lockfile --ignore-scripts
                pnpm exec lefthook run pre-commit "${lefthook_file_args[@]}"
              elif [ -f package-lock.json ]; then
                npm ci --ignore-scripts
                npx --yes lefthook run pre-commit "${lefthook_file_args[@]}"
              elif [ -f yarn.lock ]; then
                corepack enable >/dev/null 2>&1 || true
                yarn install --frozen-lockfile --ignore-scripts
                yarn exec lefthook run pre-commit "${lefthook_file_args[@]}"
              elif command -v lefthook >/dev/null 2>&1; then
                lefthook run pre-commit "${lefthook_file_args[@]}"
              else
                npx --yes lefthook run pre-commit "${lefthook_file_args[@]}"
              fi
            elif [ -f .pre-commit-config.yaml ] || [ -f .pre-commit-config.yml ]; then
              echo "Pre-commit gate: pre-commit framework"
              if command -v pipx >/dev/null 2>&1; then
                pipx run pre-commit run --files "${staged_arr[@]}"
              else
                python3 -m pip install --user --quiet pre-commit
                "$(python3 -m site --user-base)/bin/pre-commit" run --files "${staged_arr[@]}"
              fi
            elif [ -d .husky ] && [ -f .husky/pre-commit ]; then
              echo "Pre-commit gate: husky"
              bash .husky/pre-commit
            fi
            if ! git diff --quiet; then
              echo "Pre-commit gate produced auto-fixes — re-staging."
              git add -u
            fi
          fi
        fi

        git commit -m "chore: Release $TAG"
        # Annotate the tag with the rolled release notes when available
        # (per #201's "tag + GH release notes from the fragment" addendum).
        # Falls back to a plain "Release vX.Y.Z" message for prereleases
        # or when release-notes.md is missing/empty.
        if [ -s release-notes.md ]; then
          git tag -a "$TAG" -F release-notes.md
        else
          git tag -a "$TAG" -m "Release $TAG"
        fi
        git push origin HEAD
        git push origin "$TAG"

        SHA=$(git rev-parse HEAD)
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Extract notes for resume case
      if: steps.detect.outputs.skip == 'true'
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
        NEW_VERSION: ${{ inputs.version }}
        IS_PRERELEASE: ${{ steps.detect.outputs.prerelease }}
      run: |
        # On resume, the tag's commit already has the rolled changelog.
        # For prereleases, [Unreleased] is still populated; extract it.
        # For final releases, the rolled section is `## [<version>]`; read it.
        set -euo pipefail
        if [ "$IS_PRERELEASE" = "true" ]; then
          bash "${{ github.action_path }}/../../../bin-internal/roll-changelog.sh" \
            extract "$CHANGELOG" release-notes.md
        else
          # Read the already-rolled versioned section.
          awk -v v="$NEW_VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$CHANGELOG" > release-notes.md
          if ! grep -qE '\S' release-notes.md; then
            echo "Release v$NEW_VERSION" > release-notes.md
          fi
        fi

    - name: Emit outputs
      id: outputs
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        IS_PRERELEASE: ${{ steps.detect.outputs.prerelease }}
        RESUME_SHA: ${{ steps.detect.outputs.sha }}
        PUSH_SHA: ${{ steps.push.outputs.sha }}
      run: |
        SHA="${PUSH_SHA:-$RESUME_SHA}"
        if [ -z "$SHA" ]; then
          echo "::error::Internal: neither push.sha nor detect.sha is set"
          exit 1
        fi
        echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

    - name: Upload release notes for downstream jobs
      # release-notes.md is written by the roll/extract step above. Upload
      # so create-release (different job) can use it without re-deriving
      # which is brittle: after roll, [Unreleased] is empty so the original
      # "extract from [Unreleased]" pattern can't be reused for final
      # releases.
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: release-notes.md
        if-no-files-found: error
        retention-days: 7
