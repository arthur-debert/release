name: Arm the gate toolset
description: |
  Install the lint/format toolset the hardened gate (lefthook.yml) needs, in CI.

  THE single definition of "arm the gate in CI" (release#416, the gate doctrine:
  one definition, invoked everywhere — never re-listed per workflow). It replaces
  the inline "Arm the gate toolset" block that #417/#419 had to copy into every
  reusable stack-CI workflow + the rust-cli prepare job + release's own ci.yml.

  This action is THIN by design: the provisioning logic lives in the wheel-carried
  `release-core gate --provision` (release_core.toolset — its own concern, the
  single source of pins, reached identically by the local boot `release-core init`
  → provisioning). WS8 (#765) removed the shell bin-internal/provision-gate-toolset.sh
  the action used to invoke; the action now invokes the verb.

  Assumes Node and Python are already set up by the caller (mirrors the inline
  blocks it replaces) — the verb installs tools into the active toolchains, and
  this action does NOT run setup-node/setup-python itself so it can't switch the
  interpreter out from under the caller's build steps.

inputs:
  ruff-version:
    description: |
      Override the pinned ruff version. Empty (default) → the verb's own pin
      (release_core.toolset is the SINGLE source of truth for the pins, so
      they can't drift between here and there).
    required: false
    default: ''
  actionlint-version:
    description: |
      Override the pinned actionlint version (NOT "latest" — a new release can add
      rules that turn an unrelated PR red). Empty (default) → the script's own pin.
    required: false
    default: ''
  install_tree:
    description: |
      Install the consumer's `.release/` temp dir before the gate runs
      (release#521 / WS4). `.release/` is gitignored, so the gate entry `bin/check`
      (a committed symlink into `.release/`) would dangle on a fresh checkout — so
      CI installs the pinned `release_core` wheel and runs `release-core init` to
      write `.release/` + repair the mirrors, the same as SessionStart does locally
      ("invoke, don't discover"; ADR-0005). Defaults to 'true'; the ONE caller that
      opts out is release's OWN repo (ci.yml): release has real root configs, no
      detectable Kind, and never writes `.release/`.
    required: false
    default: 'true'
  toolset:
    description: |
      Provision the lint/format toolset (release-core gate --provision)
      after the install. 'false' → install-only mode: run ONLY the install step
      (wheel install + `release-core init --no-commit`) and skip toolset
      provisioning — the building block for a CONSUMER-AUTHORED job that invokes
      managed bin/ tools (e.g. `bin/check-e2e`) but never runs the lint gate
      (release#581; supage#163 had to hand-copy the install recipe before this
      input existed). One composite, one recipe: a separate install-only composite
      would be a second definition of the same step ("invoke, don't reimplement").
      Defaults to 'true' — gate jobs want both.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Install FIRST: the gate's `bin/check` symlink resolves into `.release/`,
    # which is gitignored + written on-demand (WS4). Install the wheel WITHOUT
    # running its bundled init (--no-init), then run `release-core init --no-commit`
    # explicitly — CI must never auto-commit the managed paths into a checkout.
    # install-release-core symlinks the console-scripts into XDG_BIN_HOME and
    # persists $GITHUB_PATH for LATER steps; within THIS step we add that dir to
    # PATH so the very next `release-core` call resolves.
    - name: Install the .release/ temp dir
      if: inputs.install_tree == 'true'
      shell: bash
      env:
        # install-release-core resolves the release_core wheel via `gh api`
        # (repos/<owner>/release/releases...), and `gh` REQUIRES a token even
        # for a public repo — without one it exits non-zero and reddens
        # ci/check fleet-wide (release#535). The job's default GITHUB_TOKEN can
        # read arthur-debert/release's public releases and satisfies gh's auth,
        # so expose it as GH_TOKEN for both install-release-core and any gh call
        # `release-core init` makes.
        GH_TOKEN: ${{ github.token }}
        # The ref THIS composite was resolved at (`v2`, an exact `v2.15.0`, a
        # branch, or a SHA) — how the step picks its wheel source below
        # (released wheel of the vN line vs from-source from this very tree).
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        # THE INVARIANT (release#541, extended by release#587 OQ4, refined by
        # WS7 release#764, simplified WS8 release#765): the wheel source is
        # decided by the composite's OWN resolved ref — two ref classes, no
        # canary special-case, no skip flag:
        #   - vN / vN.x.y ref (a real consumer pin) → install the released wheel
        #     of a major line. The major is the consumer's committed
        #     `.release.major.txt` (the LOGIC-version source of truth `init`
        #     seeds), which the WHOLE fleet now carries (WS8 confirmed 19/19
        #     convergence). It is REQUIRED for a clean vN ref — an absent/blank
        #     file FAILS LOUD (no action_ref fallback anymore: that transitional
        #     prop-G fallback was removed in WS8). The resolver's default
        #     `releases/latest` would hand a consumer pinned at @v2 the v3 wheel
        #     the moment a v3 release exists, so the major is always pinned
        #     explicitly from the file.
        #   - ANY other ref (a `canary/<sha12>` branch, a bare SHA, a feature
        #     branch) → the wheel is built `--from-source` from the very tree
        #     GitHub staged at the action's resolved ref (action_path), so a
        #     candidate's sync.py/init changes are the code under test — the
        #     old fall-through to `releases/latest` installed the PREVIOUS
        #     wheel and silently un-tested them. `.release.major.txt` is IGNORED
        #     in this class (see the vN-only guard below).
        ref_major=""
        case "${ACTION_REF:-}" in
          v[0-9]*)
            ref_major="${ACTION_REF%%.*}"
            # Only a pure vN survives — a branch like `v2-experiments` would
            # otherwise leak through the glob as a bogus --major value.
            case "$ref_major" in
              v*[!0-9]*) ref_major="" ;;
            esac ;;
        esac
        # WS7 (release#764, proposal G) decoupled the STRUCTURAL @vN launcher from
        # the release-core LOGIC major; WS8 (#765) made the file the SOLE source.
        # For a clean vN ref (a real consumer pin) the wheel major comes from the
        # consumer's committed `.release.major.txt` (sync.py RELEASE_MAJOR_FILE — a
        # bare integer line) and is REQUIRED: an absent/blank/malformed file FAILS
        # LOUD, no action_ref fallback. A non-vN ref (canary/<sha>, bare SHA,
        # feature branch) leaves ref_major empty → the --from-source path below
        # builds release's OWN candidate, and `.release.major.txt` is intentionally
        # IGNORED there so a fixture/consumer file can never divert a candidate test
        # to a released wheel (preserves the release#541/#587 OQ4 invariant).
        major=""
        if [ -n "$ref_major" ]; then
          major_file="${GITHUB_WORKSPACE:-.}/.release.major.txt"
          if [ ! -f "$major_file" ]; then
            echo "::error::.release.major.txt is missing on a @${ref_major} ref — it is the release-core major source of truth (seeded by 'release-core init'). Run init and commit the file, then re-run." >&2
            exit 1
          fi
          # Mirror release_core.sync.read_release_major: strip only OUTER
          # whitespace, then reject anything non-integer. INTERNAL whitespace
          # (a malformed multi-line file like "3\n4") must FAIL LOUD, not be
          # silently squeezed into a bogus "34" — `tr -d` would do the latter.
          # `$(cat)` drops trailing newlines; the two expansions strip
          # leading/trailing blanks; any internal newline/space then survives
          # into the [!0-9] check below.
          file_major="$(cat "$major_file")"
          file_major="${file_major#"${file_major%%[![:space:]]*}"}"
          file_major="${file_major%"${file_major##*[![:space:]]}"}"
          case "$file_major" in
            "" | *[!0-9]*)
              # Sanitize before printing: the malformed value may carry
              # newlines/control chars, which would split the ::error:: line and
              # let a crafted file smuggle extra ::workflow:: commands into the
              # log. Whitelist to a single safe line (everything else → '?'),
              # mirroring read_release_major's escaped repr. A blank file is
              # equally fatal now (no fallback to fall back TO).
              safe_major="$(printf '%s' "$file_major" | tr -c '[:alnum:] ._-' '?')"
              echo "::error::.release.major.txt must contain a bare major integer (e.g. '3'), got '${safe_major}' — fix the file to re-seed." >&2
              exit 1 ;;
            *) major="v${file_major}" ;;
          esac
        fi
        resolver="${{ github.action_path }}/../../../bin/install-release-core"
        if [ -n "$major" ]; then
          bash "$resolver" --no-init --major "$major"
        else
          # Install the candidate: GitHub stages the WHOLE repo at the action's
          # resolved ref under action_path; --from-source accepts the checkout
          # root and builds the wheel from that exact tree.
          bash "$resolver" --no-init --from-source "${{ github.action_path }}/../../.."
        fi
        export PATH="${XDG_BIN_HOME:-$HOME/.local/bin}:$PATH"
        # --no-provision: CI installs the managed tree only — toolset arming + hook
        # wiring are NOT a CI concern (the "Provision the gate toolset" step below
        # arms the toolset via `release-core gate --provision`; CI runs the gate as
        # `lefthook run --all-files`, never through a wired git hook). Without this,
        # init (WS5/E) would also try to wire hooks + run app-bin/post-setup-hook.sh
        # in the runner. Keep --no-commit too (CI must never auto-commit).
        release-core init --no-commit --no-provision
    - name: Provision the gate toolset
      if: inputs.toolset == 'true'
      shell: bash
      env:
        RUFF_VERSION: ${{ inputs.ruff-version }}
        ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
      # WS5/I (#762): arm the toolset through the wheel verb — the Python port of
      # provision-gate-toolset.sh (release_core.toolset). One definition, reached
      # by CI here and by the local boot (init → toolset.provision). The HARD
      # provisioner (a tool it can't reconcile is a non-zero exit — the gate never
      # skips). The RUFF_VERSION/ACTIONLINT_VERSION env overrides flow through
      # toolset.pin() exactly as the shell `${VAR:-default}` did.
      #
      # `release-core gate --provision` is the ONLY provisioner now (WS8 #765
      # removed the shell bin-internal/provision-gate-toolset.sh dual-source). When
      # release-core is already on PATH (the install_tree:true path installed it),
      # just call the verb. When it is NOT — release's OWN ci.yml runs this
      # composite with install_tree:false (no wheel install step) — install
      # release_core --from-source from this very checkout first (action_path is a
      # release tree), so the verb is available. Tolerant export of GITHUB_PATH.
      run: |
        set -euo pipefail
        export PATH="${XDG_BIN_HOME:-$HOME/.local/bin}:$PATH"
        if ! command -v release-core >/dev/null 2>&1; then
          # No wheel installed (install_tree:false). Install release_core from the
          # checkout this composite was resolved at — no network for the package,
          # no init — so `gate --provision` is reachable.
          bash "${{ github.action_path }}/../../../bin/install-release-core" \
            --no-init --from-source "${{ github.action_path }}/../../.."
          export PATH="${XDG_BIN_HOME:-$HOME/.local/bin}:$PATH"
        fi
        release-core gate --provision
