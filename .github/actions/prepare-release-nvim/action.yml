name: 'Prepare Neovim plugin release'
description: |
  Validate semver, sanity-check plugin layout, bump optional
  M.version in a Lua file, roll changelog, run pre-commit gate,
  commit + tag + push. Supports bare-tag cuts for plugins without
  a version constant.

inputs:
  version:
    description: 'Version to release (bare semver). No leading v.'
    required: true
  changelog-path:
    description: 'Path to CHANGELOG.md.'
    required: false
    default: 'CHANGELOG.md'
  plugin-root:
    description: 'Plugin root directory (where lua/ and/or plugin/ live).'
    required: false
    default: '.'
  version-file:
    description: 'Lua file with M.version to bump.'
    required: false
    default: ''
  prep-script:
    description: 'Optional consumer prep-script, run before the bump.'
    required: false
    default: ''

outputs:
  version:
    description: 'Validated version (no leading v)'
    value: ${{ steps.prep.outputs.version }}
  release-sha:
    description: 'Commit SHA of the tag'
    value: ${{ steps.prep.outputs.release-sha }}
  prerelease:
    description: '"true" if version contains a pre-release suffix'
    value: ${{ steps.prep.outputs.prerelease }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python for release_core console-scripts
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install release_core console-scripts (changelog, semver)
      shell: bash
      run: bash "${{ github.action_path }}/../../../bin-internal/install-release-core-pkg.sh"

    # The prep script below runs the consumer's HARD gate (#412) on the bump
    # commit; a missing linter FAILS the release (it never skips). Arm the
    # toolset first — Python is already set up above (for the release_core
    # console-scripts), Node here, then `release-core gate --provision` installs
    # lefthook/prettier/markdownlint/ruff/yamllint/shellcheck. #437 (P2) armed
    # the rust/npm/go/python composites but missed nvim + tauri; this closes
    # that gap.
    - name: Set up Node.js (gate linters markdownlint/prettier)
      if: env.SKIP_PRECOMMIT_GATE != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: '20'
    - name: Arm the gate toolset (release#437)
      if: env.SKIP_PRECOMMIT_GATE != 'true'
      shell: bash
      run: release-core gate --provision
    - name: Prepare Neovim plugin release
      id: prep
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        PLUGIN_ROOT: ${{ inputs.plugin-root }}
        CHANGELOG: ${{ inputs.changelog-path }}
        VERSION_FILE: ${{ inputs.version-file }}
        PREP_SCRIPT: ${{ inputs.prep-script }}
      run: bash "${{ github.action_path }}/../../../bin-internal/prepare-nvim-release.sh"
