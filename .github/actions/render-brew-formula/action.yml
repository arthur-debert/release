name: 'Render Homebrew formula'
description: 'Render the canonical brew formula template against per-target URLs/SHAs and project metadata'

inputs:
  bin-name:
    description: 'Binary / formula name (e.g. dodot)'
    required: true
  version:
    description: 'Version string (no leading v)'
    required: true
  desc:
    description: 'Project description (will be normalized for brew style: strip article, strip period, ≤79 chars)'
    required: true
  license:
    description: 'License identifier (e.g. MIT)'
    required: true
  homepage:
    description: 'Project homepage URL'
    required: true
  urls-json:
    description: 'JSON object: {"AARCH64_APPLE_DARWIN": "https://...", "X86_64_LINUX_GNU": "...", ...}'
    required: true
  shas-json:
    description: 'JSON object: {"AARCH64_APPLE_DARWIN": "abc...", "X86_64_LINUX_GNU": "...", ...}'
    required: true
  output-path:
    description: 'Where to write the rendered .rb file'
    required: true
  template-path:
    description: 'Path to .rb.tmpl; defaults to canonical template (subdir tarball layout, mac arm64 + linux x86_64/arm64)'
    required: false
    default: ''
  private-repo:
    description: |
      Set to "true" when the source repo is private. Inlines the
      GitHubPrivateRepositoryReleaseDownloadStrategy class into the
      formula and adds `using:` clauses on each url so `brew install`
      can authenticate via HOMEBREW_GITHUB_API_TOKEN. Users still need
      to export that env var pointing at a PAT with read access to the
      private repo. Default false renders the plain public formula.
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Render
      shell: bash
      env:
        BIN_NAME: ${{ inputs.bin-name }}
        VERSION: ${{ inputs.version }}
        DESC: ${{ inputs.desc }}
        LICENSE: ${{ inputs.license }}
        HOMEPAGE: ${{ inputs.homepage }}
        URLS_JSON: ${{ inputs.urls-json }}
        SHAS_JSON: ${{ inputs.shas-json }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        TEMPLATE_PATH: ${{ inputs.template-path }}
        PRIVATE_REPO: ${{ inputs.private-repo }}
      run: |
        set -euo pipefail

        # Derive Ruby class name: PascalCase from bin-name, splitting on - and _
        CLASS_NAME=$(echo "$BIN_NAME" | awk -F'[-_]' '{
          for(i=1;i<=NF;i++) printf "%s", toupper(substr($i,1,1)) tolower(substr($i,2))
        }')

        TMPL="${TEMPLATE_PATH:-${{ github.action_path }}/../../../templates/homebrew-formula.rb.tmpl}"
        [ -f "$TMPL" ] || { echo "::error::Template not found: $TMPL"; exit 1; }

        # Private-repo support: inline the GitHubPrivateRepositoryReleaseDownloadStrategy
        # class above `class Foo < Formula`, and add `, using: ...` after each url so
        # brew uses the authenticated assets API endpoint. Users need to export
        # HOMEBREW_GITHUB_API_TOKEN with read access to the private repo.
        if [ "$PRIVATE_REPO" = "true" ]; then
          PRIVATE_REPO_PREAMBLE=$(cat <<'RUBY'
require "download_strategy"

# Inlined private-release downloader. Reads HOMEBREW_GITHUB_API_TOKEN
# and translates the public release URL into the authenticated assets
# API endpoint. Without this, brew install 404s on private-repo
# releases. Generated by arthur-debert/release; do not edit by hand.
class GitHubPrivateRepositoryReleaseDownloadStrategy < CurlDownloadStrategy
  require "utils/github"

  def initialize(url, name, version, **meta)
    super
    parse_url_pattern
    set_github_token
  end

  def parse_url_pattern
    url_pattern = %r{https://github.com/([^/]+)/([^/]+)/releases/download/([^/]+)/(\S+)}
    raise CurlDownloadStrategyError, "Invalid url pattern for GitHub Release." unless @url =~ url_pattern
    _, @owner, @repo, @tag, @filename = *@url.match(url_pattern).to_a
  end

  def set_github_token
    @github_token = ENV["HOMEBREW_GITHUB_API_TOKEN"]
    raise CurlDownloadStrategyError, "HOMEBREW_GITHUB_API_TOKEN is required for private-repo brew installs." unless @github_token
  end

  def asset_id
    @asset_id ||= begin
      release_url = "https://api.github.com/repos/#{@owner}/#{@repo}/releases/tags/#{@tag}"
      release = GitHub::API.open_rest(release_url)
      asset = release["assets"].find { |a| a["name"] == @filename }
      raise CurlDownloadStrategyError, "Asset #{@filename} not found in release #{@tag}." unless asset
      asset["id"]
    end
  end

  def _fetch(url:, resolved_url:, timeout:)
    api_url = "https://api.github.com/repos/#{@owner}/#{@repo}/releases/assets/#{asset_id}"
    curl_download api_url,
                  "--header", "Accept: application/octet-stream",
                  "--header", "Authorization: token #{@github_token}",
                  to: temporary_path, timeout: timeout
  end
end
RUBY
)
          USING_CLAUSE=", using: GitHubPrivateRepositoryReleaseDownloadStrategy"
        else
          PRIVATE_REPO_PREAMBLE=""
          USING_CLAUSE=""
        fi

        # Build env-var list for the Python renderer. URLS_JSON keys become
        # URL_<KEY>; SHAS_JSON keys become SHA_<KEY>. Renderer ignores any
        # placeholder it can't fill (the post-check fails on leftovers in
        # the rendered output, which is what actually matters).
        env_args=(
          "CLASS_NAME=$CLASS_NAME"
          "BIN_NAME=$BIN_NAME"
          "VERSION=$VERSION"
          "DESC=$DESC"
          "LICENSE=$LICENSE"
          "HOMEPAGE=$HOMEPAGE"
          "PRIVATE_REPO_PREAMBLE=$PRIVATE_REPO_PREAMBLE"
          "USING_CLAUSE=$USING_CLAUSE"
        )
        while IFS=$'\t' read -r key val; do
          env_args+=("URL_$key=$val")
        done < <(echo "$URLS_JSON" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')
        while IFS=$'\t' read -r key val; do
          env_args+=("SHA_$key=$val")
        done < <(echo "$SHAS_JSON" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')

        mkdir -p "$(dirname "$OUTPUT_PATH")"
        env "${env_args[@]}" python3 \
          "${{ github.action_path }}/../../../scripts/render-brew-formula.py" \
          "$TMPL" "$OUTPUT_PATH"

        echo "=== Rendered formula ==="
        cat "$OUTPUT_PATH"

    - name: Ruby syntax check
      shell: bash
      run: ruby -c "${{ inputs.output-path }}"
