name: 'Validate Apple secrets'
description: |
  Check that required Apple signing and notarization secrets are
  present before a Tauri release begins. Surfaces failures in
  seconds, not after a 10-minute build.

runs:
  using: 'composite'
  steps:
    - name: Validate Apple secrets
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/validate-apple-secrets.sh"
