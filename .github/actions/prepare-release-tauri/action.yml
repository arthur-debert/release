name: 'Prepare Tauri release'
description: |
  Validate semver, bump the three Tauri version files (package.json,
  Cargo.toml, tauri.conf.json), roll changelog, run pre-commit gate,
  commit + tag + push. Resume-on-failure: if the tag already exists
  with matching package.json version, skip the bump and emit the
  tag's SHA so downstream jobs can re-run cleanly.

inputs:
  version:
    description: 'Version to release (bare semver, e.g. 0.2.0 or 1.0.0-rc.1). No leading v.'
    required: true
  changelog-path:
    description: 'Path to CHANGELOG.md (Keep-a-Changelog with `## [Unreleased]`).'
    required: false
    default: 'CHANGELOG.md'
  tauri-dir:
    description: 'Path to the Tauri project root (where src-tauri/ lives).'
    required: false
    default: '.'
  prep-script:
    description: 'Optional consumer prep-script path, run before the canonical bump.'
    required: false
    default: ''
  gh-token:
    description: 'Token for authenticating cargo fetches of PRIVATE git dependencies (e.g. a private engine crate the src-tauri/ build pins). No-op when empty.'
    required: false
    default: ''

outputs:
  version:
    description: 'Validated version (no leading v)'
    value: ${{ steps.prep.outputs.version }}
  release-sha:
    description: 'Commit SHA of the tag (for downstream jobs to checkout)'
    value: ${{ steps.prep.outputs.release-sha }}
  prerelease:
    description: '"true" if version contains a pre-release suffix'
    value: ${{ steps.prep.outputs.prerelease }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python for release_core console-scripts
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install release_core console-scripts (changelog, semver)
      shell: bash
      run: bash "${{ github.action_path }}/../../../bin-internal/install-release-core-pkg.sh"

    - name: Install Tauri Linux build dependencies
      shell: bash
      run: bash "${{ github.action_path }}/../../../bin-internal/install-tauri-linux-deps.sh"

    # The prep script below runs the consumer's HARD gate (#412) on the bump
    # commit; a missing linter FAILS the release (it never skips). Arm the
    # toolset first. #437 (P2) armed the rust/npm/go/python composites but
    # missed nvim + tauri; this closes that gap.
    - name: Set up Node.js (gate linters markdownlint/prettier)
      if: env.SKIP_PRECOMMIT_GATE != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: '20'
    # Python is already set up above (for the release_core console-scripts).
    - name: Arm the gate toolset (release#437)
      if: env.SKIP_PRECOMMIT_GATE != 'true'
      shell: bash
      run: bash "${{ github.action_path }}/../../../bin-internal/provision-gate-toolset.sh"

    # The HARD gate (below) fires cargo over src-tauri/. When the project pins a
    # PRIVATE git dependency (a private engine crate), cargo can't clone it
    # without auth — so set up git-CLI fetch auth here, as its own step, so the
    # CARGO_NET_GIT_FETCH_WITH_CLI it writes to $GITHUB_ENV persists into the
    # gate step below. No-op when gh-token is empty.
    - name: Authenticate cargo for private git deps
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: bash "${{ github.action_path }}/../../../bin-internal/setup-cargo-git-auth.sh"

    - name: Prepare Tauri release
      id: prep
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        TAURI_DIR: ${{ inputs.tauri-dir }}
        CHANGELOG: ${{ inputs.changelog-path }}
        PREP_SCRIPT: ${{ inputs.prep-script }}
      run: bash "${{ github.action_path }}/../../../bin-internal/prepare-tauri-release.sh"
