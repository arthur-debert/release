name: 'Prepare Tauri release'
description: |
  Validate semver, assert the release base sha is CI-green (WS2 #811 —
  don't re-gate, the work PR already gated this code), bump the three
  Tauri version files (package.json, Cargo.toml, tauri.conf.json), roll
  changelog, commit + tag + push. Resume-on-failure: if the tag already
  exists with matching package.json version, skip the bump and emit the
  tag's SHA so downstream jobs can re-run cleanly.

inputs:
  version:
    description: 'Version to release (bare semver, e.g. 0.2.0 or 1.0.0-rc.1). No leading v.'
    required: true
  changelog-path:
    description: 'Path to CHANGELOG.md (Keep-a-Changelog with `## [Unreleased]`).'
    required: false
    default: 'CHANGELOG.md'
  tauri-dir:
    description: 'Path to the Tauri project root (where src-tauri/ lives).'
    required: false
    default: '.'
  prep-script:
    description: 'Optional consumer prep-script path, run before the standard bump.'
    required: false
    default: ''
  gh-token:
    description: 'Token for the `gh api` check-runs query that asserts the release base sha is CI-green (and reads private-repo check-runs). Falls back to the workflow token when empty.'
    required: false
    default: ''

outputs:
  version:
    description: 'Validated version (no leading v)'
    value: ${{ steps.prep.outputs.version }}
  release-sha:
    description: 'Commit SHA of the tag (for downstream jobs to checkout)'
    value: ${{ steps.prep.outputs.release-sha }}
  prerelease:
    description: '"true" if version contains a pre-release suffix'
    value: ${{ steps.prep.outputs.prerelease }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python for release_core console-scripts
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install release_core console-scripts (changelog, semver)
      shell: bash
      run: bash "${{ github.action_path }}/../../../bin-internal/install-release-core-pkg.sh"

    # WS2 (#811): prepare no longer installs Tauri Linux deps, sets up Node, arms
    # the gate toolset, or re-runs the HARD pre-commit gate over src-tauri/. The
    # work PR that landed the release base sha already ran the full gate
    # (lint/compile/tests) on exactly this code; prepare ASSERTS that base sha is
    # CI-green (in prepare-tauri-release.sh, via the check-runs API) instead of
    # recompiling. No cargo runs in prepare anymore, so the cargo-git-auth step
    # (which only existed to let the old gate's cargo clone a PRIVATE git dep)
    # is gone too. prepare now does: bump → assert base green → roll changelog →
    # tag → push, in seconds.

    - name: Prepare Tauri release
      id: prep
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        TAURI_DIR: ${{ inputs.tauri-dir }}
        CHANGELOG: ${{ inputs.changelog-path }}
        PREP_SCRIPT: ${{ inputs.prep-script }}
        # Authenticates the `gh api` check-runs query in the base-sha CI-green
        # assertion (and reads private-repo check-runs). Falls back to the
        # workflow token via gh's default when empty.
        GH_TOKEN: ${{ inputs.gh-token }}
      run: bash "${{ github.action_path }}/../../../bin-internal/prepare-tauri-release.sh"
