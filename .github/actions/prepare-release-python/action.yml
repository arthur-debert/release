name: 'Prepare release (python)'
description: |
  Validate a version, bump `[project].version` in pyproject.toml, roll the
  changelog, commit + tag + push. Parallel of `prepare-release` (Cargo) and
  `prepare-release-npm` (package.json). Resume-on-failure: if the tag
  already exists at the given version, skip the bump and emit the tag's
  SHA so downstream jobs can re-run cleanly.

  Version bump is awk-based and scoped to the `[project]` table so the
  composite action has zero toolchain dependencies (no python, no uv).
  pyproject.toml's `[project].version` field is universal under PEP 621.

inputs:
  version:
    description: 'Version to release (e.g. 0.18.0 or 1.0.0-rc.1). No leading v.'
    required: true
  changelog-path:
    description: 'Path to CHANGELOG.md (Keep-a-Changelog format with `## [Unreleased]` section). Empty to skip changelog handling.'
    required: false
    default: 'CHANGELOG.md'
  manifest-path:
    description: 'Path to pyproject.toml. Override only for non-root or monorepo layouts.'
    required: false
    default: 'pyproject.toml'

outputs:
  version:
    description: 'Validated version (no leading v).'
    value: ${{ steps.outputs.outputs.version }}
  release-sha:
    description: 'Commit SHA of the tag (for downstream jobs to checkout).'
    value: ${{ steps.outputs.outputs.sha }}
  prerelease:
    description: '"true" if version contains a pre-release suffix.'
    value: ${{ steps.outputs.outputs.prerelease }}
  notes-path:
    description: 'Path to extracted release notes file.'
    value: 'release-notes.md'

runs:
  using: 'composite'
  steps:
    - name: Validate and detect resume case
      id: detect
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        MANIFEST: ${{ inputs.manifest-path }}
      run: |
        set -euo pipefail

        if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
          echo "::error::version must be MAJOR.MINOR.PATCH[-PRERELEASE] (got: $NEW_VERSION)"
          exit 1
        fi

        IS_PRERELEASE=false
        if [[ "$NEW_VERSION" == *-* ]]; then
          IS_PRERELEASE=true
        fi
        echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

        if [ ! -f "$MANIFEST" ]; then
          echo "::error::manifest not found: $MANIFEST"
          exit 1
        fi

        TAG="v$NEW_VERSION"
        git fetch --tags origin >/dev/null 2>&1 || true

        # Resume case: tag already exists. Validate the pyproject.toml at
        # that commit matches NEW_VERSION (otherwise we'd be re-running
        # against a different release accidentally).
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          # Extract [project].version from the manifest at the tag. Must
          # handle: single OR double-quoted strings (\042 = ", \047 = '),
          # leading indentation, trailing inline comments on both the
          # section header and the key line, and Windows CRLF endings.
          # We restrict to the [project] table only — pyproject also has
          # `version = ` keys under [tool.*] which we must not match.
          TAG_VERSION="$(git show "$TAG:$MANIFEST" 2>/dev/null | awk '
            BEGIN { q = "[\042\047]" }
            {
              sub(/\r$/, "")
              if ($0 ~ /^[[:space:]]*\[/) {
                h = $0
                sub(/#.*/, "", h)
                gsub(/[[:space:]]/, "", h)
                in_project = (h == "[project]")
                next
              }
              if (in_project && $0 ~ ("^[[:space:]]*version[[:space:]]*=[[:space:]]*" q)) {
                v = $0
                sub("^[[:space:]]*version[[:space:]]*=[[:space:]]*" q, "", v)
                sub(q ".*", "", v)
                print v
                exit
              }
            }')"
          if [ "$TAG_VERSION" = "$NEW_VERSION" ]; then
            echo "tag $TAG already exists at $TAG_SHA ($MANIFEST [project].version=$TAG_VERSION) — resuming"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::tag $TAG exists but $MANIFEST at that commit is '$TAG_VERSION', not '$NEW_VERSION'"
          exit 1
        fi

        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Bump pyproject.toml [project].version
      if: steps.detect.outputs.skip != 'true'
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        MANIFEST: ${{ inputs.manifest-path }}
      run: |
        set -euo pipefail
        # Scope strictly to the [project] table — pyproject often has
        # other `version = ` keys (e.g. [tool.poetry], [tool.uv]).
        # Handles: single or double quotes, leading indentation,
        # trailing inline comments on the section header AND on the
        # key line, Windows CRLF endings (stripped on output → file
        # normalizes to LF; intentional). The first match in
        # [project] wins; duplicates (illegal TOML) leave subsequent
        # entries untouched.
        awk -v v="$NEW_VERSION" '
          BEGIN { q = "[\042\047]" }
          {
            sub(/\r$/, "")
            if ($0 ~ /^[[:space:]]*\[/) {
              h = $0
              sub(/#.*/, "", h)
              gsub(/[[:space:]]/, "", h)
              in_project = (h == "[project]")
              print
              next
            }
            if (in_project && !bumped && $0 ~ ("^[[:space:]]*version[[:space:]]*=[[:space:]]*" q)) {
              # Preserve leading indentation + any trailing inline
              # comment so consumers who format pyproject specifically
              # (e.g. taplo with indent + comments) keep their style.
              leading = $0
              sub(/[^[:space:]].*/, "", leading)
              trailing = ""
              if (match($0, /[[:space:]]+#.*$/)) {
                trailing = substr($0, RSTART, RLENGTH)
              }
              print leading "version = \"" v "\"" trailing
              bumped = 1
              next
            }
            print
          }
          END {
            if (!bumped) {
              print "::error::no [project].version field found in pyproject.toml" > "/dev/stderr"
              exit 1
            }
          }
        ' "$MANIFEST" > "$MANIFEST.tmp"
        mv "$MANIFEST.tmp" "$MANIFEST"

    - name: Roll changelog (final release only)
      if: steps.detect.outputs.skip != 'true' && steps.detect.outputs.prerelease != 'true' && inputs.changelog-path != ''
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
        NEW_VERSION: ${{ inputs.version }}
      run: |
        bash "${{ github.action_path }}/../../../scripts/roll-changelog.sh" \
          roll "$CHANGELOG" "$NEW_VERSION" release-notes.md

    - name: Extract changelog notes (prerelease)
      if: steps.detect.outputs.skip != 'true' && steps.detect.outputs.prerelease == 'true' && inputs.changelog-path != ''
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
      run: |
        # Prereleases share Unreleased entries with the final they lead to;
        # extract for release notes but don't roll into a versioned section.
        bash "${{ github.action_path }}/../../../scripts/roll-changelog.sh" \
          extract "$CHANGELOG" release-notes.md

    - name: Default release notes if no changelog
      if: steps.detect.outputs.skip != 'true' && inputs.changelog-path == ''
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
      run: echo "Release v$NEW_VERSION" > release-notes.md

    - name: Commit, tag, push
      id: push
      if: steps.detect.outputs.skip != 'true'
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        CHANGELOG: ${{ inputs.changelog-path }}
        MANIFEST: ${{ inputs.manifest-path }}
        IS_PRERELEASE: ${{ steps.detect.outputs.prerelease }}
      run: |
        set -euo pipefail
        TAG="v$NEW_VERSION"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Stage manifest + uv lockfile if present + changelog (when
        # rolled). uv.lock pins the project's own version, so it
        # rolls with the bump. setup.py and poetry.lock stay untouched
        # by an awk pyproject edit; add them only when modified by
        # convention hooks (consumer side).
        git add "$MANIFEST"
        manifest_dir="$(dirname "$MANIFEST")"
        for lock in uv.lock poetry.lock; do
          [ -f "$lock" ] && git add -- "$lock" 2>/dev/null || true
          if [ "$manifest_dir" != "." ] && [ -f "$manifest_dir/$lock" ]; then
            git add -- "$manifest_dir/$lock" 2>/dev/null || true
          fi
        done
        if [ "$IS_PRERELEASE" != "true" ] && [ -n "$CHANGELOG" ] && [ -f "$CHANGELOG" ]; then
          git add "$CHANGELOG"
        fi

        if git diff --cached --quiet; then
          echo "::error::No changes staged after version bump — was $MANIFEST already at $NEW_VERSION? (Did cascade-handler pre-bump without also re-pushing a tag?)"
          exit 1
        fi

        # Pre-commit gate — hold the bot commit to the consumer's own
        # gate. Equivalent to .github/actions/run-precommit-gate@v1
        # (canonical reference); inlined because this step is a single
        # `run:` block. Set SKIP_PRECOMMIT_GATE=true to bypass.
        if [ "${SKIP_PRECOMMIT_GATE:-false}" != "true" ]; then
          mapfile -t staged_arr < <(git diff --cached --name-only)
          if [ "${#staged_arr[@]}" -gt 0 ]; then
            if [ -f lefthook.yml ] || [ -f .lefthook.yml ] || [ -f lefthook.yaml ]; then
              echo "Pre-commit gate: lefthook"
              lefthook_file_args=()
              for f in "${staged_arr[@]}"; do
                lefthook_file_args+=(--file "$f")
              done
              if [ -f pnpm-lock.yaml ]; then
                corepack enable >/dev/null 2>&1 || true
                pnpm install --frozen-lockfile --ignore-scripts
                pnpm exec lefthook run pre-commit "${lefthook_file_args[@]}"
              elif [ -f package-lock.json ]; then
                npm ci --ignore-scripts
                npx --no-install lefthook run pre-commit "${lefthook_file_args[@]}"
              elif [ -f yarn.lock ]; then
                corepack enable >/dev/null 2>&1 || true
                yarn install --frozen-lockfile --ignore-scripts
                yarn exec lefthook run pre-commit "${lefthook_file_args[@]}"
              elif command -v lefthook >/dev/null 2>&1; then
                lefthook run pre-commit "${lefthook_file_args[@]}"
              else
                npx --yes lefthook run pre-commit "${lefthook_file_args[@]}"
              fi
            elif [ -f .pre-commit-config.yaml ] || [ -f .pre-commit-config.yml ]; then
              echo "Pre-commit gate: pre-commit framework"
              if command -v pipx >/dev/null 2>&1; then
                pipx run pre-commit run --files "${staged_arr[@]}"
              else
                python3 -m pip install --user --quiet pre-commit
                "$(python3 -m site --user-base)/bin/pre-commit" run --files "${staged_arr[@]}"
              fi
            elif [ -d .husky ] && [ -f .husky/pre-commit ]; then
              echo "Pre-commit gate: husky"
              bash .husky/pre-commit
            fi
            if ! git diff --quiet; then
              echo "Pre-commit gate produced auto-fixes — re-staging."
              git add -u
            fi
          fi
        fi

        git commit -m "chore: Release $TAG"
        git tag -a "$TAG" -m "Release $TAG"
        git push origin HEAD
        git push origin "$TAG"

        SHA=$(git rev-parse HEAD)
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Extract notes for resume case
      if: steps.detect.outputs.skip == 'true'
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
        NEW_VERSION: ${{ inputs.version }}
        IS_PRERELEASE: ${{ steps.detect.outputs.prerelease }}
      run: |
        set -euo pipefail
        if [ -z "$CHANGELOG" ] || [ ! -f "$CHANGELOG" ]; then
          echo "Release v$NEW_VERSION" > release-notes.md
        elif [ "$IS_PRERELEASE" = "true" ]; then
          bash "${{ github.action_path }}/../../../scripts/roll-changelog.sh" \
            extract "$CHANGELOG" release-notes.md
        else
          awk -v v="$NEW_VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$CHANGELOG" > release-notes.md
          if ! grep -qE '\S' release-notes.md; then
            echo "Release v$NEW_VERSION" > release-notes.md
          fi
        fi

    - name: Emit outputs
      id: outputs
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        IS_PRERELEASE: ${{ steps.detect.outputs.prerelease }}
        RESUME_SHA: ${{ steps.detect.outputs.sha }}
        PUSH_SHA: ${{ steps.push.outputs.sha }}
      run: |
        SHA="${PUSH_SHA:-$RESUME_SHA}"
        if [ -z "$SHA" ]; then
          echo "::error::Internal: neither push.sha nor detect.sha is set"
          exit 1
        fi
        echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

    - name: Upload release notes for downstream jobs
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: release-notes.md
        if-no-files-found: error
        retention-days: 7
