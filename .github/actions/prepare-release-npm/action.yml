name: 'Prepare release (npm)'
description: |
  Validate a version, bump package.json, roll the changelog, commit + tag
  + push. Parallel of `prepare-release` for projects rooted in
  package.json instead of Cargo.toml (electron-app, vscode-ext,
  tree-sitter, etc.). Resume-on-failure: if the tag already exists at the
  given version, skip the bump and emit the tag's SHA so downstream jobs
  can re-run cleanly.

inputs:
  version:
    description: 'Version to release (e.g. 0.18.0 or 1.0.0-rc.1). No leading v.'
    required: true
  changelog-path:
    description: 'Path to CHANGELOG.md (Keep-a-Changelog format with `## [Unreleased]` section).'
    required: false
    default: 'CHANGELOG.md'
  manifest-path:
    description: 'Path to package.json. Override only for non-root or monorepo layouts.'
    required: false
    default: 'package.json'

outputs:
  version:
    description: 'Validated version (no leading v).'
    value: ${{ steps.outputs.outputs.version }}
  release-sha:
    description: 'Commit SHA of the tag (for downstream jobs to checkout).'
    value: ${{ steps.outputs.outputs.sha }}
  prerelease:
    description: '"true" if version contains a pre-release suffix.'
    value: ${{ steps.outputs.outputs.prerelease }}
  notes-path:
    description: 'Path to extracted release notes file.'
    value: 'release-notes.md'

runs:
  using: 'composite'
  steps:
    - name: Set up Python for release_core console-scripts
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install release_core console-scripts (changelog, semver)
      shell: bash
      run: bash "${{ github.action_path }}/../../../bin-internal/install-release-core-pkg.sh"

    - name: Check changelog fragments
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
      run: bash "${{ github.action_path }}/../../../bin-internal/check-changelog-fragments.sh"

    - name: Validate and detect resume case
      id: detect
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        MANIFEST: ${{ inputs.manifest-path }}
        SEMVER: semver
      run: |
        set -euo pipefail

        if [[ "$NEW_VERSION" =~ ^[vV] ]] \
            || [[ "$("$SEMVER" validate "$NEW_VERSION")" != "valid" ]] \
            || [[ -n "$("$SEMVER" get build "$NEW_VERSION")" ]]; then
          echo "::error::version must be MAJOR.MINOR.PATCH[-PRERELEASE] (got: $NEW_VERSION)"
          exit 1
        fi

        IS_PRERELEASE=false
        if [[ -n "$("$SEMVER" get prerel "$NEW_VERSION")" ]]; then
          IS_PRERELEASE=true
        fi
        echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

        # Reserved verification suffix (release#663): a `-release-rc` prerelease
        # is a throwaway live-fire cut — builds + tags + publishes a GitHub
        # pre-release like any RC, but the bump commit is NOT pushed to the
        # branch (the tag alone carries it), so the consumer's version line and
        # main history stay clean. The live-fire harness deletes the tag + GH
        # release on teardown. Normal RCs (`-rc.1`) keep real-RC behavior.
        VERIFY_MODE=false
        case "$NEW_VERSION" in
          *-release-rc|*-release-rc.*) VERIFY_MODE=true ;;
        esac
        echo "verify_mode=$VERIFY_MODE" >> "$GITHUB_OUTPUT"

        if [ ! -f "$MANIFEST" ]; then
          echo "::error::manifest not found: $MANIFEST"
          exit 1
        fi

        TAG="v$NEW_VERSION"
        git fetch --tags origin >/dev/null 2>&1 || true

        # Resume case: tag already exists. Validate the package.json at
        # that commit matches NEW_VERSION (otherwise we'd be re-running
        # against a different release accidentally).
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          TAG_VERSION="$(git show "$TAG:$MANIFEST" 2>/dev/null | jq -r '.version // empty')"
          if [ "$TAG_VERSION" = "$NEW_VERSION" ]; then
            echo "tag $TAG already exists at $TAG_SHA ($MANIFEST.version=$TAG_VERSION) — resuming"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::tag $TAG exists but $MANIFEST at that commit is '$TAG_VERSION', not '$NEW_VERSION'"
          exit 1
        fi

        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Bump package.json
      if: steps.detect.outputs.skip != 'true'
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        MANIFEST: ${{ inputs.manifest-path }}
      run: |
        set -euo pipefail
        # --no-git-tag-version: we drive the commit + tag ourselves below.
        # --allow-same-version: cascade-handler may pre-bump package.json
        # before calling this workflow; `npm version` errors out without
        # this flag when the manifest already matches.
        manifest_dir="$(dirname "$MANIFEST")"
        (
          cd "$manifest_dir"
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
        )

    - name: Roll changelog (final release only)
      if: steps.detect.outputs.skip != 'true' && steps.detect.outputs.prerelease != 'true' && inputs.changelog-path != ''
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
        NEW_VERSION: ${{ inputs.version }}
      run: |
        bash "${{ github.action_path }}/../../../bin-internal/roll-changelog.sh" \
          roll "$CHANGELOG" "$NEW_VERSION" release-notes.md

    - name: Extract changelog notes (prerelease)
      if: steps.detect.outputs.skip != 'true' && steps.detect.outputs.prerelease == 'true' && inputs.changelog-path != ''
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
      run: |
        # Prereleases share Unreleased entries with the final they lead to;
        # extract for release notes but don't roll into a versioned section.
        bash "${{ github.action_path }}/../../../bin-internal/roll-changelog.sh" \
          extract "$CHANGELOG" release-notes.md

    - name: Default release notes if no changelog
      if: steps.detect.outputs.skip != 'true' && inputs.changelog-path == ''
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
      run: echo "Release v$NEW_VERSION" > release-notes.md

    - name: Set up Node (gate linters lefthook/prettier/markdownlint)
      if: steps.detect.outputs.skip != 'true' && env.SKIP_PRECOMMIT_GATE != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: '20'
    - name: Arm the gate toolset (release#426 P2)
      if: steps.detect.outputs.skip != 'true' && env.SKIP_PRECOMMIT_GATE != 'true'
      shell: bash
      # The Commit step below runs the consumer's HARD gate (#412) on the bump
      # commit; a missing linter FAILS the release. Arm the toolset first — Node +
      # Python here (not every release Kind provides them), then the single
      # provisioning definition installs the rest (the arm-gate script). Skipped
      # when the gate is bypassed (SKIP_PRECOMMIT_GATE) — nothing to arm then.
      run: release-core gate --provision
    - name: Commit, tag, push
      id: push
      if: steps.detect.outputs.skip != 'true'
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        CHANGELOG: ${{ inputs.changelog-path }}
        MANIFEST: ${{ inputs.manifest-path }}
        IS_PRERELEASE: ${{ steps.detect.outputs.prerelease }}
        IS_VERIFY: ${{ steps.detect.outputs.verify_mode }}
      run: |
        set -euo pipefail
        TAG="v$NEW_VERSION"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Stage manifest + lockfile + changelog (when rolled). package-
        # lock.json may have been touched by `npm version` updating the
        # "version" field inside it. yarn.lock and pnpm-lock.yaml don't
        # carry the project's own version, so they stay unchanged — only
        # add them if `git status` reports a modification.
        #
        # In monorepo / non-root layouts, `npm version` updated the
        # lockfile inside the manifest's directory; check both the repo
        # root AND that directory so we don't lose the per-package lock.
        git add "$MANIFEST"
        manifest_dir="$(dirname "$MANIFEST")"
        for lock in package-lock.json yarn.lock pnpm-lock.yaml; do
          [ -f "$lock" ] && git add -- "$lock" 2>/dev/null || true
          if [ "$manifest_dir" != "." ] && [ -f "$manifest_dir/$lock" ]; then
            git add -- "$manifest_dir/$lock" 2>/dev/null || true
          fi
        done
        if [ "$IS_PRERELEASE" != "true" ] && [ -n "$CHANGELOG" ] && [ -f "$CHANGELOG" ]; then
          git add "$CHANGELOG"
          # Fragment-dir convention (#201): roll-changelog.sh routes
          # through the `changelog` console-script when CHANGELOG/ exists.
          # That creates
          # CHANGELOG/<version>.md and deletes the unreleased-*.md
          # fragments — stage both. Resolve sibling-of-changelog so
          # this works even when CHANGELOG.md lives in a subdir.
          CHANGELOG_DIR="$(dirname "$CHANGELOG")/CHANGELOG"
          if [ -d "$CHANGELOG_DIR" ]; then
            git add "$CHANGELOG_DIR/"
          fi
        fi

        if git diff --cached --quiet; then
          echo "::error::No changes staged after version bump — was $MANIFEST already at $NEW_VERSION? (Did cascade-handler pre-bump without also re-pushing a tag?)"
          exit 1
        fi

        # Pre-commit gate — hold the bot commit to the consumer's own gate.
        # ONE definition, INVOKED — bin-internal/run-precommit-gate.sh (it collects
        # the staged set, detects the gate, prefers the managed .release/ config,
        # INSTALLS it via release-core when absent (release#531 F1), and
        # re-stages auto-fixes). The previous inlined copy of that script had
        # drifted: it missed the WS3 LEFTHOOK_CONFIG routing, so on a post-WS3
        # consumer (no root lefthook.yml) it silently SKIPPED the gate.
        # Set SKIP_PRECOMMIT_GATE=true to bypass.
        bash "${{ github.action_path }}/../../../bin-internal/run-precommit-gate.sh"

        git commit -m "chore: Release $TAG"
        # Annotate the tag with the rolled release notes when available
        # (per #201's "tag + GH release notes from the fragment" addendum).
        # Falls back to a plain "Release vX.Y.Z" message for prereleases
        # or when release-notes.md is missing/empty.
        if [ -s release-notes.md ]; then
          git tag -a "$TAG" -F release-notes.md
        else
          git tag -a "$TAG" -m "Release $TAG"
        fi
        # Verification rc (release#663): tag-only — the tag carries the bump
        # commit to the remote, but the branch ref is NOT advanced, so the
        # consumer's main stays clean. Downstream jobs check out the tag/sha.
        if [ "$IS_VERIFY" = "true" ]; then
          echo "verification rc ($TAG): tag-only — not advancing the branch (release#663)."
        else
          git push origin HEAD
        fi
        git push origin "$TAG"

        SHA=$(git rev-parse HEAD)
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Extract notes for resume case
      if: steps.detect.outputs.skip == 'true'
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog-path }}
        NEW_VERSION: ${{ inputs.version }}
        IS_PRERELEASE: ${{ steps.detect.outputs.prerelease }}
      run: |
        set -euo pipefail
        # On resume, the tag's commit already has the rolled changelog.
        # For prereleases, [Unreleased] is still populated; extract it.
        # For final releases, the rolled section is `## [<version>]`.
        if [ -z "$CHANGELOG" ] || [ ! -f "$CHANGELOG" ]; then
          echo "Release v$NEW_VERSION" > release-notes.md
        elif [ "$IS_PRERELEASE" = "true" ]; then
          bash "${{ github.action_path }}/../../../bin-internal/roll-changelog.sh" \
            extract "$CHANGELOG" release-notes.md
        else
          awk -v v="$NEW_VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$CHANGELOG" > release-notes.md
          if ! grep -qE '\S' release-notes.md; then
            echo "Release v$NEW_VERSION" > release-notes.md
          fi
        fi

    - name: Emit outputs
      id: outputs
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version }}
        IS_PRERELEASE: ${{ steps.detect.outputs.prerelease }}
        RESUME_SHA: ${{ steps.detect.outputs.sha }}
        PUSH_SHA: ${{ steps.push.outputs.sha }}
      run: |
        SHA="${PUSH_SHA:-$RESUME_SHA}"
        if [ -z "$SHA" ]; then
          echo "::error::Internal: neither push.sha nor detect.sha is set"
          exit 1
        fi
        echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

    - name: Upload release notes for downstream jobs
      uses: actions/upload-artifact@v6
      with:
        name: release-notes
        path: release-notes.md
        if-no-files-found: error
        retention-days: 7
