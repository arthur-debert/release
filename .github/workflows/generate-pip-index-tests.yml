name: generate-pip-index tests

# BATS contract suite for bin-internal/generate-pip-index.sh — the PEP 503 pip
# index generator (epic #757 WS2 / release#759). Fully offline: a stub `gh` on
# PATH applies the script's own --jq filter to a fixture releases JSON with the
# real jq binary, so the suite exercises the exact prerelease/draft predicate
# the script ships (the RC-pollution guard, #689-class).

on:
  push:
    branches: ["**"]
    paths:
      - "bin-internal/generate-pip-index.sh"
      - "tests/generate-pip-index/**"
      - ".github/workflows/generate-pip-index-tests.yml"
  pull_request:
    paths:
      - "bin-internal/generate-pip-index.sh"
      - "tests/generate-pip-index/**"
      - ".github/workflows/generate-pip-index-tests.yml"

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Run BATS suite
        run: bats tests/generate-pip-index/
