name: release-sync + fleet tests

# BATS suites for the sync/drift tooling and the fleet manifest accessor:
#   tests/release-sync — provenance marker (ADR-0002) + drift detection,
#     syncing a synthetic consumer from this checkout (RELEASE_REF=HEAD).
#   tests/fleet        — `release-core admin repos list` zero-logic path
#     resolution against a fixture manifest, and `release-core admin inbox`
#     clustering over a stub-gh inbox (offline; no gh/network). The flat
#     managed-repos / release-inbox names were retired in the CLI cutover (#468).
#   tests/detect-kind  — the shell→Python migration canary: the detect-kind
#     shim's CLI contract (kind strings + exit codes) over inline fixtures.
# Regressions surface here before riding out to consumers.

on:
  push:
    branches: ['**']
    paths:
      - 'bin/release-sync'
      - 'bin/release-drift-check'
      - 'bin/detect-kind'
      - 'bin/release-core'
      - 'managed-repos.yaml'
      - 'templates/**'
      - 'tests/release-sync/**'
      - 'tests/fleet/**'
      - 'tests/detect-kind/**'
      - '.github/workflows/release-sync-tests.yml'
  pull_request:
    paths:
      - 'bin/release-sync'
      - 'bin/release-drift-check'
      - 'bin/detect-kind'
      - 'bin/release-core'
      - 'managed-repos.yaml'
      - 'templates/**'
      - 'tests/release-sync/**'
      - 'tests/fleet/**'
      - 'tests/detect-kind/**'
      - '.github/workflows/release-sync-tests.yml'

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release-sync reads templates from the git ref
      - name: Install bats + shellcheck
        # shellcheck: the unified-gate dogfood (gate-unified.bats) lints the
        # synced distributed tools with templates/commons/bin/check-shell.
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Install yq (mikefarah v4 — pinned)
        # Pin an explicit v4 release, NOT releases/latest: the determinism
        # of the marker round-trip depends on the yq major that composes
        # lefthook.yml. A jump to v5 as "latest" could change serialization
        # and turn this into spurious churn instead of a real regression.
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Run BATS suites
        run: bats tests/release-sync/ tests/fleet/ tests/detect-kind/
