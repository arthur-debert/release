name: release-sync + fleet tests

# BATS suites for the managed-tree compose engine and the fleet manifest accessor:
#   tests/release-sync — the `release-core init` compose engine (provenance
#     marker ADR-0002, symlink/skill mirroring, the self-ignoring ephemeral
#     .release/ of WS4 #521), composing a synthetic consumer from this checkout
#     (RELEASE_REF=HEAD). The standalone release-sync/release-drift-check verbs
#     were retired in WS4; the suite drives the same engine via `release-core init`.
#   tests/fleet        — `release-core admin repos list` zero-logic path
#     resolution against a fixture manifest, and `release-core admin inbox`
#     clustering over a stub-gh inbox (offline; no gh/network). The flat
#     managed-repos / release-inbox names were retired in the CLI cutover (#468).
# Regressions surface here before riding out to consumers.
# (detect_kind classification is covered by test_core_manifest.py; the old
# bin/detect-kind shim + its bats canary were retired once the shell->Python
# migration completed.)

on:
  push:
    branches: ['**']
    paths:
      - 'bin/release-core'
      - 'managed-repos.yaml'
      - 'templates/**'
      - 'tests/release-sync/**'
      - 'tests/fleet/**'
      - '.github/workflows/release-sync-tests.yml'
  pull_request:
    paths:
      - 'bin/release-core'
      - 'managed-repos.yaml'
      - 'templates/**'
      - 'tests/release-sync/**'
      - 'tests/fleet/**'
      - '.github/workflows/release-sync-tests.yml'

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the compose engine reads templates from the git ref
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install release_core's runtime dep (click)
        # The suites drive the in-checkout `bin/release-core` shim (`release-core
        # init`), which imports release_core's CLI — click is its one third-party
        # dep. Install JUST it (no wheel build) so the bare-python shim resolves;
        # read from pyproject so the list is never a second definition.
        run: pip install click
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Provision the gate toolset (pinned shellcheck)
        # The unified-gate dogfood (gate-unified.bats) lints the synced
        # distributed tools with templates/commons/bin/check-shell, which runs
        # shellcheck. ONE provisioner at the gate-tool-versions.sh pins — the
        # old apt shellcheck was 0.9.0, a different tool than the pinned 0.11
        # every other environment runs (release#531 F3).
        run: bash bin-internal/provision-gate-toolset.sh
      - name: Install yq (mikefarah v4 — pinned)
        # Pin an explicit v4 release, NOT releases/latest: the determinism
        # of the marker round-trip depends on the yq major that composes
        # lefthook.yml. A jump to v5 as "latest" could change serialization
        # and turn this into spurious churn instead of a real regression.
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Run BATS suites
        run: bats tests/release-sync/ tests/fleet/
