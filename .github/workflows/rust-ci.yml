name: Rust CI

# Reusable PR-time check workflow for rust-cli / rust-lib consumers.
#
# Closes the "CI workflow reusability gap" called out in README.md.
# Where `rust-cli.yml` covers the release path, this workflow covers
# every push / pull_request: run the canonical `bin/check` umbrella,
# optionally build a release binary, optionally run bats e2e against
# that binary.
#
# Design choices worth knowing:
#
#  * **`bin/check` is the canonical call.** Consumers that have adopted
#    the take-iii Component model already ship `bin/check` (synced by
#    release-sync from the rust-quality Capability + the commons lint gate).
#    Fix-once-propagate works because the script lives in the consumer
#    tree and is the same shape across the fleet.
#
#  * **Minimal permissions, declared at both levels.** Top-level
#    `permissions: contents: read` is the union; per-job blocks repeat
#    `contents: read` for explicitness — GitHub validates
#    reusable-workflow permission compatibility at workflow-load time
#    against every job in the callee, even ones gated by `if:` (see
#    feedback_reusable_workflow_permissions_upfront). The caller can
#    mirror with a single `contents: read` at workflow level.
#
#  * **`Swatinem/rust-cache@v2` via the shared `setup-rust` composite.**
#    Caching is mandatory per CLAUDE.md ("without it a 2-minute Rust
#    job balloons to 10").
#
#  * **`binary-name` + `bats` are tied by convention.** When
#    `binary-name` is set, the check job uploads
#    `<binary-name>-linux`. When `bats: true` and `binary-name` is set,
#    the e2e job downloads that artifact and exports
#    `<BINARY_NAME_UPPER>_BIN` (e.g. `DODOT_BIN`) pointing at the
#    workspace-relative binary. This matches dodot's hand-rolled
#    pattern verbatim so the migration is a no-op behaviorally.
#
#  * **Sparse checkout for e2e.** Only `tests/e2e` and `bin` are
#    needed once the binary is downloaded — keeps the e2e job fast.
#
# Caller shape (paste-ready):
#
#   name: CI
#   on:
#     push:
#       branches: ['**']
#     pull_request:
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: arthur-debert/release/.github/workflows/rust-ci.yml@v1
#       with:
#         binary-name: my-cli   # optional
#         bats: true            # optional
#         # extra-targets: 'wasm32-wasip2'   # for zed-lex-style projects
#         # pre-test: scripts/prep-fixtures  # if you need a build hook
#
# Run `release-core how-to rust-cli` for the build/test reference.

on:
  workflow_call:
    inputs:
      extra-targets:
        description: |
          Space-separated additional rustup targets to install. Passed
          through to the shared `setup-rust` composite, which forwards
          to dtolnay/rust-toolchain `targets:` AND re-runs
          `rustup target add <value>` — the latter is strictly
          space-separated, so commas will fail there. Example:
          `wasm32-wasip2` for the zed-lex extension. Most consumers
          only need a single target. Empty (default) skips.
        type: string
        required: false
        default: ''

      pre-test:
        description: |
          Optional path to a script the consumer runs before `bin/check`
          (e.g. grammar download, fixture prep, codegen). Empty (default)
          skips the pre-step.
        type: string
        required: false
        default: ''

      bats:
        description: |
          Opt into a second `e2e` job that installs bats-core and calls
          the consumer's `bin/check-e2e` (canonical bats runner from the
          `bats` Component). When true, the e2e job runs after `check`.
        type: boolean
        required: false
        default: false

      binary-name:
        description: |
          When set, the check job runs `cargo build --release -p
          <binary-name>` (cargo `-p` = workspace PACKAGE, not bin
          target). Convention across the fleet: the package name and
          the produced binary file name are the same string (dodot,
          padz, lex, supage all line up this way; matches what
          rust-cli.yml's release workflow assumes via `bin-name`).
          The compiled binary is uploaded as `<binary-name>-linux`.
          The e2e job (if `bats: true`) downloads that artifact and
          exposes it via `<BINARY_NAME_UPPER>_BIN` (e.g. `DODOT_BIN`).
          If your package name and binary name diverge, this input
          isn't the right shape for you — file an issue.
          Empty (default) skips the build + upload.
        type: string
        required: false
        default: ''

      runner:
        description: 'GitHub runner label for both jobs.'
        type: string
        required: false
        default: 'ubuntu-latest'

      timeout:
        description: 'Per-job timeout in minutes.'
        type: number
        required: false
        default: 30

      fetch-depth:
        description: |
          Forwarded to `actions/checkout`'s `fetch-depth`. Default `1`
          (shallow, matches checkout's own default). Set `0` (full
          history) when the consumer's checks need git history —
          e.g. a "diff since N commits ago" test (rustloc#57 surfaced
          this) or any rustdoc / changelog tooling that walks tags.
          Only affects the `check` job's checkout. The `e2e` job
          always uses the default shallow depth.
        type: number
        required: false
        default: 1

      submodules:
        description: |
          Forwarded to `actions/checkout`'s `submodules`. Default
          `false`. Set `true` for "first-level submodules" or
          `'recursive'` for nested submodules. lex-fmt/lex needs
          `recursive`; most consumers don't have submodules.
        type: string
        required: false
        default: 'false'

      wasm-packages:
        description: |
          Multiline list of workspace members with wasm-bindgen crates
          to VALIDATE on PR CI (one member per line; blank + `#`-comment
          lines ignored). Empty (default) skips all wasm work, so
          existing callers are unaffected — this is an opt-in companion.

          When non-empty, three extra `if`-gated jobs run, mirroring the
          RELEASE-path wasm matrix in `rust-cli.yml` (target
          `wasm32-unknown-unknown`, `Swatinem/rust-cache`):

            * `wasm-setup` — parse this multiline list into a JSON matrix
              consumed by the two jobs below (same recipe as
              `rust-cli.yml`'s `wasm-setup`).
            * `wasm-check` — `cargo clippy --target wasm32-unknown-unknown
              -p <pkg> -- -D warnings` for each listed package. Catches
              wasm-only lint failures host clippy doesn't see.
            * `wasm-build` — `wasm-pack build` for each listed package
              (build-only validation; NO publish on PR — npm publish is
              the release path's job, not CI's).

          This closes the PR-time gap phos-core's hand-rolled `wasm.yml`
          filled: `rust-cli.yml` owns wasm on the release path but not on
          PR. Use the SAME member list here as in your release.yml's
          `wasm-packages:`.

          Example:
            wasm-packages: |
              phos-color-wasm
              phos-editor-wasm
              phos-viewer-wasm
        type: string
        required: false
        default: ''

      wasm-pack-target:
        description: |
          `wasm-pack build --target` value: bundler|web|nodejs|no-modules.
          Only consulted when `wasm-packages` is non-empty. Default
          `bundler` matches `rust-cli.yml`'s release-path default.
        type: string
        required: false
        default: 'bundler'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          submodules: ${{ inputs.submodules }}

      - name: Setup Rust (toolchain + cache)
        uses: arthur-debert/release/.github/actions/setup-rust@v2
        with:
          components: clippy, rustfmt
          targets: ${{ inputs.extra-targets }}

      - name: Install cargo-nextest
        # Canonical test runner used by bin/check-tests across the fleet.
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run pre-test
        if: inputs.pre-test != ''
        run: bash "${{ inputs.pre-test }}"

      - name: Set up Node (gate linters lefthook/prettier/markdownlint)
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Set up Python (gate linters ruff/yamllint)
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Arm the gate toolset
        # ONE definition of CI gate-arming: the arm-gate composite (→ the
        # bin-internal/provision-gate-toolset.sh script). Replaces the inline
        # block #417/#419 had to copy into every reusable workflow (release#416).
        # Node + Python are set up by the steps above; the composite installs the
        # lint/format toolset the hardened gate needs.
        uses: arthur-debert/release/.github/actions/arm-gate@v2

      - name: Run canonical checks (bin/check)
        run: bin/check

      - name: Build release binary
        if: inputs.binary-name != ''
        run: cargo build --release -p ${{ inputs.binary-name }}

      - name: Upload binary
        if: inputs.binary-name != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.binary-name }}-linux
          path: target/release/${{ inputs.binary-name }}
          # Fail loudly when the binary is missing — silent success
          # masks misconfiguration (wrong binary-name, build skipped).
          if-no-files-found: error

  e2e:
    if: inputs.bats
    needs: check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # FULL checkout, not sparse: post-WS4/WS7 (release#521/#528)
          # `.release/` is gitignored and `bin/check-e2e` / `lib/` are
          # untracked ephemeral mirrors, so a sparse checkout of those
          # paths yields nothing — the managed tree must be MATERIALIZED
          # (arm-gate below), and `release-core init` needs the full repo
          # to detect the Kind. (The binary still comes in via
          # download-artifact, not from source.)
          # Submodules forwarded here too — some e2e suites need them
          # (e.g. lex's bats tests reference comms submodule fixtures).
          submodules: ${{ inputs.submodules }}

      - name: Set up Node (arm-gate toolset)
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Set up Python (arm-gate toolset)
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Arm the gate toolset
        # Same ONE composite the `check` job uses — its materialize step
        # installs the pinned release_core wheel and composes `.release/`
        # + the bin/lib mirrors, so `bin/check-e2e` exists on this fresh
        # runner (it is an untracked mirror post-WS7, never in the
        # checkout itself).
        uses: arthur-debert/release/.github/actions/arm-gate@v2

      - name: Download binary
        if: inputs.binary-name != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.binary-name }}-linux

      - name: Install bats-core
        # Canonical install via the bats-core marketplace action — same
        # one used by bats-e2e.yml. Matches the `bats` Component docs.
        uses: bats-core/bats-action@4.0.0

      - name: Run E2E tests
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$BINARY_NAME" ]; then
            # Convention: when binary-name is set, expose it as
            # <BINARY_NAME_UPPER>_BIN for the bats suite to consume.
            # dodot's suite reads DODOT_BIN; lex would read LEX_BIN; etc.
            chmod +x "$BINARY_NAME"
            VAR_NAME="$(echo "$BINARY_NAME" | tr '[:lower:]-' '[:upper:]_')_BIN"
            export "$VAR_NAME=${GITHUB_WORKSPACE}/${BINARY_NAME}"
            echo "Exposed ${VAR_NAME}=${GITHUB_WORKSPACE}/${BINARY_NAME}"
          fi
          bin/check-e2e

  # -------------------------------------------------------------------
  # WASM companion (opt-in via `wasm-packages`). PR-time mirror of the
  # release-path wasm matrix in rust-cli.yml: `rust-cli.yml` validates
  # wasm on the RELEASE path (build-wasm/publish-npm) but NOT on PR — a
  # conspicuous asymmetry phos-core hand-rolled a `wasm.yml` to fill
  # (release#630). These jobs close that gap on the SHARED spine.
  #
  # Build-only: no tarball, no GH release attach, no npm publish — those
  # are the release path's job. This is pure PR validation.
  # -------------------------------------------------------------------
  wasm-setup:
    # Parse `wasm-packages` (multiline) into a JSON array consumed by the
    # wasm-check + wasm-build matrices. Same parsing recipe as
    # rust-cli.yml's wasm-setup (strip blank + `#`-comment lines). Skips
    # everything downstream when the input is empty (the default).
    if: inputs.wasm-packages != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Build wasm packages list
        id: list
        shell: bash
        env:
          PACKAGES: ${{ inputs.wasm-packages }}
        run: |
          set -euo pipefail
          # `jq` is preinstalled on GitHub-hosted runners, but `runner` is
          # caller-overridable (a self-hosted runner may lack it) — fail with
          # a clear, actionable error rather than a bare `jq: command not found`.
          command -v jq >/dev/null 2>&1 || { echo "::error::jq is required for the wasm jobs but was not found on this runner"; exit 1; }
          # Trim trailing whitespace, drop blank + `#`-comment lines, emit
          # a JSON array. `grep -v` returns 1 when it filters EVERY line
          # (whitespace-only input) — `|| true` keeps pipefail from
          # aborting; the `length == 0` check below catches that with a
          # clearer error. POSIX `[[:space:]]` (GNU grep BRE has no `\s`).
          json=$(printf '%s\n' "${PACKAGES}" \
            | sed 's/[[:space:]]*$//' \
            | { grep -vE '^[[:space:]]*(#|$)' || true; } \
            | jq -R . | jq -s -c .)
          if [ "$(jq 'length' <<<"${json}")" -eq 0 ]; then
            echo "::error::wasm-packages parsed to empty list — check input formatting"
            exit 1
          fi
          echo "Effective wasm-packages list: ${json}"
          echo "packages=${json}" >> "$GITHUB_OUTPUT"

  wasm-check:
    # clippy on the wasm32 target for each listed member — catches
    # wasm-only lint failures host clippy doesn't see. Matrix over the
    # wasm-packages list (fail-fast: false so one member's failure
    # doesn't mask its siblings).
    if: inputs.wasm-packages != ''
    needs: wasm-setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.wasm-setup.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}

      - name: Setup Rust (wasm32 toolchain + cache)
        # Shared setup-rust composite installs the wasm32 target +
        # Swatinem/rust-cache (caching mandatory per CLAUDE.md). clippy
        # component for the lint below.
        uses: arthur-debert/release/.github/actions/setup-rust@v2
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: clippy (wasm32)
        # Pin bash: `runner` is caller-overridable (a Windows self-hosted
        # runner defaults `run:` to pwsh), and this step relies on bash
        # `"$PKG"` expansion. Deterministic shell across all runners.
        shell: bash
        env:
          PKG: ${{ matrix.pkg }}
        run: cargo clippy --target wasm32-unknown-unknown -p "$PKG" -- -D warnings

  wasm-build:
    # wasm-pack build for each listed member — build-only PR validation
    # (keeps the WASM distribution path warm). No publish: that's the
    # release path's job. Matches rust-cli.yml's build-wasm crate-path
    # resolution via cargo metadata so the consumer needn't encode
    # `crates/<name>/` in the input.
    if: inputs.wasm-packages != ''
    needs: wasm-setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.wasm-setup.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}

      - name: Setup Rust (wasm32 toolchain + cache)
        uses: arthur-debert/release/.github/actions/setup-rust@v2
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: wasm-pack build
        env:
          WASM_PACKAGE: ${{ matrix.pkg }}
          WASM_TARGET: ${{ inputs.wasm-pack-target }}
        shell: bash
        run: |
          set -euo pipefail
          # `jq` is preinstalled on GitHub-hosted runners, but `runner` is
          # caller-overridable (a self-hosted runner may lack it) — fail with
          # a clear, actionable error rather than a bare `jq: command not found`.
          command -v jq >/dev/null 2>&1 || { echo "::error::jq is required for the wasm jobs but was not found on this runner"; exit 1; }
          # Resolve the workspace member's dir via cargo metadata so the
          # consumer doesn't encode `crates/<name>/` in the input — same
          # resolution rust-cli.yml's build-wasm uses.
          # Capture the manifest path into a var and dirname it directly —
          # `xargs dirname` splits on whitespace and would mishandle a
          # manifest path containing spaces.
          manifest_path=$(cargo metadata --no-deps --format-version=1 \
            | jq -er --arg n "$WASM_PACKAGE" \
                '.packages[] | select(.name == $n) | .manifest_path')
          crate_path=$(dirname "$manifest_path")
          echo "→ wasm-pack build $WASM_PACKAGE ($crate_path) --target $WASM_TARGET"
          wasm-pack build "$crate_path" --target "$WASM_TARGET" --out-dir pkg
