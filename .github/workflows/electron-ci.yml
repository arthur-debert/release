name: Electron CI

# Reusable PR-time check workflow for electron-app consumers.
#
# Sibling to `rust-ci.yml` / `go-ci.yml`: collapses each consumer's
# hand-rolled "setup-node + npm ci + (build shared) + typecheck + lint
# + test" sequence down to a thin caller. The shared umbrella is
# `bin/check` — shipped by the electron-app Stack template + the
# npm-quality Component.
#
# Design choices worth knowing:
#
#  * **`bin/check` is the standard call.** Consumers that have adopted
#    the Component model already ship `bin/check`. Same
#    fix-once-propagate guarantee as the rust fleet.
#
#  * **E2E job — opt-in.** Pass `e2e: true` to add a separate `e2e`
#    job that runs after `check`. It reuses the same setup chain
#    (checkout + pm detect + Node + install deps), auto-installs
#    Playwright browsers, then runs `<pm> run <e2e-script>` (default
#    `test:e2e`). On failure, `playwright-report/` uploads as a CI
#    artifact. The `playwright: true` input is still available for
#    consumers that need browsers inside the `check` job itself
#    (e.g. integration tests folded into bin/check).
#
#  * **`shared-build-dir` covers the lexed-style monorepo.** lexed has
#    a `shared/` package the renderer + main both consume; without
#    building it first, the typecheck step explodes. The input is a
#    relative path; if set we `cd` into it, `npm ci`, `npm run build`,
#    then `cd -` back.
#
#  * **`pre-test`** is the generic escape hatch — any shell command
#    that needs to run after deps are installed but before `bin/check`
#    fires (fetch sibling binaries, download grammars, codegen).
#
#  * **Minimal permissions, declared at both levels.** Same rationale
#    as rust-ci.yml — GitHub validates reusable-workflow permission
#    compatibility at workflow-load time, so we declare contents:read
#    at workflow level AND per-job for explicitness.
#
# Caller shape (paste-ready):
#
#   name: CI
#   on:
#     push:
#       branches: ['**']
#     pull_request:
#   permissions:
#     contents: read
#   jobs:
#     check:
#       uses: arthur-debert/release/.github/workflows/electron-ci.yml@v3
#       with:
#         node-version: '22'              # default
#         shared-build-dir: shared        # if you have one
#         submodules: 'true'              # if you have submodules
#
# Run `release-core how-to electron-app` for the build/test reference.

on:
  workflow_call:
    inputs:
      node-version:
        description: |
          Node.js version passed to actions/setup-node. Match the
          consumer's `engines.node` pin. Default `22` (the LTS line
          most electron-app consumers are on).
        type: string
        required: false
        default: '22'

      pre-test:
        description: |
          Optional shell command run after `npm ci` (and after the
          optional `shared-build-dir` step) but BEFORE `bin/check`.
          Use for fetching sibling release binaries, downloading
          grammars, codegen, fixture prep. Empty (default) skips.
        type: string
        required: false
        default: ''

      shared-build-dir:
        description: |
          Optional relative path to a sub-package the renderer/main
          depends on (e.g. `shared` in lexed's monorepo). When set,
          this directory's deps are installed and built before
          running `bin/check`. Empty (default) skips.
        type: string
        required: false
        default: ''

      playwright:
        description: |
          When `true`, install Playwright browsers (`npx playwright
          install --with-deps`) in the check job. Useful when
          `bin/check` itself needs browsers available (e.g. some
          consumers run Playwright-based integration tests inside
          check). For real e2e suites, prefer the `e2e: true` input
          below — it adds a dedicated e2e job and auto-installs
          browsers.
        type: boolean
        required: false
        default: false

      e2e:
        description: |
          When `true`, add a separate `e2e` job that runs AFTER
          `check` succeeds. The job re-uses the same setup
          (checkout + detect-pm + setup-node + install deps),
          installs Playwright browsers, then runs `<pm> run
          <e2e-script>` (see input below). On failure, the
          `playwright-report/` directory is uploaded as a CI
          artifact for debugging.

          Consumer requirements (when opting in):
          * `tests/e2e/` (or equivalent) under the repo
          * a `test:e2e` (or other) npm script in package.json
          * `@playwright/test` in devDependencies

          When `false` (default), no e2e job exists. Consumers can
          still keep a bespoke e2e job in their caller, but the
          standard across the fleet is to use this input so the
          gate is consistent.
        type: boolean
        required: false
        default: false

      e2e-script:
        description: |
          npm script name to invoke for the e2e job. Default
          `test:e2e`. Override only when the consumer's
          package.json uses a different name.
        type: string
        required: false
        default: 'test:e2e'

      runner:
        description: 'GitHub runner label for the check job.'
        type: string
        required: false
        default: 'ubuntu-latest'

      timeout:
        description: 'Per-job timeout in minutes.'
        type: number
        required: false
        default: 30

      submodules:
        description: |
          Forwarded to `actions/checkout`'s `submodules`. Default
          `'false'`. Set `'true'` for first-level submodules or
          `'recursive'` for nested submodules.
        type: string
        required: false
        default: 'false'

    secrets:
      gh_token:
        description: |
          Optional `GH_TOKEN` exposed (step-scoped, not job-wide) to
          the `pre-test`, `bin/check`, and `e2e` script steps. Plumb
          this when any of those scripts calls `gh release download`
          / `gh api` against a private sibling repo — `GITHUB_TOKEN`
          from the default job context only has access to the
          calling repo, so fetching artifacts from a separate
          private repo needs a PAT. Falls back to the default
          `GITHUB_TOKEN` when not set. Matches the convention used
          in `tauri-ci.yml` + `copilot-review.yml`.
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}

      - name: Detect package manager
        # Auto-detect from lockfile presence: pnpm-lock.yaml → pnpm,
        # yarn.lock → yarn, default → npm. Avoids requiring a consumer
        # input; the lockfile IS the definitive signal of which manager
        # is in use, and every consumer commits exactly one.
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.pm.outputs.pm == 'pnpm'
        # Must run BEFORE setup-node so `cache: pnpm` on setup-node
        # finds pnpm's store correctly.
        #
        # No explicit `version:` — pnpm/action-setup reads the
        # `packageManager` field from package.json when available
        # (Corepack convention — Node-level, applies to pnpm/yarn/npm
        # alike; e.g. `"packageManager": "pnpm@10.29.3"`). Setting
        # `version:` HERE while the
        # consumer's package.json also pins triggers
        # ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm
        # specified") on the runner. Same fix as tauri-ci.yml (#150)
        # — surfaced first on phos-app via tauri-ci, fixed here
        # pre-emptively before any electron consumer trips it.
        uses: pnpm/action-setup@v4

      - name: Enable corepack (yarn)
        if: steps.pm.outputs.pm == 'yarn'
        # yarn isn't on PATH by default on the GH runner. corepack
        # (bundled with Node ≥16.10) provisions yarn from the project's
        # packageManager field if set, else a default modern release.
        # Must run BEFORE setup-node so `cache: yarn` finds the install.
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Build shared package
        if: inputs.shared-build-dir != ''
        # Shared dirs typically have a lockfile of the same flavor as
        # root (lexed/shared has package-lock.json; pnpm consumers
        # would have pnpm-lock.yaml). Use the detected install command
        # so npm/pnpm/yarn consumers all work without consumer config.
        working-directory: ${{ inputs.shared-build-dir }}
        run: |
          ${{ steps.pm.outputs.install }}
          ${{ steps.pm.outputs.pm }} run build

      - name: Install Playwright browsers
        if: inputs.playwright
        # `npx --no-install` so we use the playwright CLI version
        # pinned in package-lock.json instead of letting npx fetch
        # a potentially newer release. If playwright isn't a
        # consumer dep, the step fails loudly — opting into the
        # `playwright: true` input but not declaring the dep is
        # misconfiguration, not a fallback case.
        run: npx --no-install playwright install --with-deps

      - name: Run pre-test
        if: inputs.pre-test != ''
        shell: bash
        env:
          # Step-scoped (not job-wide) so the PAT — when the caller
          # passes one — is only visible to consumer-controlled
          # commands, not third-party setup actions. Falls back to
          # `github.token` (calling repo only) when no PAT is plumbed.
          # Same convention as tauri-ci.yml.
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
        run: ${{ inputs.pre-test }}

      - name: Set up Python (gate linters ruff/yamllint)
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Arm the gate toolset
        # ONE definition of CI gate-arming: the arm-gate composite (→ the
        # release-core gate --provision verb). Replaces the inline
        # block #417/#419 had to copy into every reusable workflow (release#416).
        # Node + Python are set up by the steps above; the composite installs the
        # lint/format toolset the hardened gate needs.
        uses: arthur-debert/release/.github/actions/arm-gate@canary/d7962c83a6a7

      - name: Run project checks (bin/check)
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
        run: bin/check

  # -------------------------------------------------------------------
  # E2E job — opt-in via `e2e: true`. Runs the consumer's Playwright
  # suite after `check` passes. Auto-installs browsers; uploads the
  # Playwright report on failure for debugging. Setup mirrors the
  # check job; a future refactor could extract the shared chain into
  # a composite action (see #178's done-check work).
  # -------------------------------------------------------------------
  e2e:
    if: inputs.e2e
    needs: check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Enable corepack (yarn)
        if: steps.pm.outputs.pm == 'yarn'
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Build shared package
        if: inputs.shared-build-dir != ''
        working-directory: ${{ inputs.shared-build-dir }}
        run: |
          ${{ steps.pm.outputs.install }}
          ${{ steps.pm.outputs.pm }} run build

      - name: Install Playwright browsers
        # `e2e: true` implies Playwright. If the consumer doesn't
        # declare @playwright/test in devDependencies this fails
        # loudly — misconfiguration, not a fallback case.
        run: npx --no-install playwright install --with-deps

      - name: Run pre-test
        if: inputs.pre-test != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
        run: ${{ inputs.pre-test }}

      - name: Run e2e suite
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
        run: ${{ steps.pm.outputs.pm }} run ${{ inputs.e2e-script }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
