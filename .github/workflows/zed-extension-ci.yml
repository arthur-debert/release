name: Zed Extension CI

# Reusable PR-time check workflow for zed-extension consumers.
#
# Closes part of #107. Where `zed-extension.yml` covers the release
# path (wasm build + canonical bundle tarball + GH release), this
# workflow covers every push / pull_request: install Rust with the
# wasm32-wasip2 target, optionally install Node + bats, run the
# canonical `bin/check` umbrella (or scripts/test-all fallback).
#
# What's distinct
# ---------------
# - `wasm32-wasip2` target installed by default — Zed extensions don't
#   build for the host. clippy must run against the wasm target
#   because the extension links against `zed_extension_api`'s wasm-only
#   ABI (host-target clippy emits link errors that aren't real on
#   wasm). See `templates/zed-extension/lefthook.fragment.yaml` for
#   the same pattern in the pre-commit gate.
# - bats opt-in (most Zed extensions test through bats — same shell-
#   subshell isolation pattern as padz/dodot).
# - Node opt-in for consumers whose `bin/check` invokes JS helpers
#   (e.g. lex-fmt/zed-lex has `scripts/gen-theme.py` and JS-based
#   highlights validators that node tooling drives).
#
# Caller shape (paste-ready):
#
#   name: CI
#   on:
#     push:
#       branches: ['**']
#     pull_request:
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: arthur-debert/release/.github/workflows/zed-extension-ci.yml@v1
#       with:
#         bats: true              # optional
#         node: true              # optional

on:
  workflow_call:
    inputs:
      rust-components:
        description: |
          Comma-separated rustup components beyond stable toolchain.
          Default `clippy,rustfmt` — Zed extensions universally lint
          + format-check via these.
        type: string
        required: false
        default: 'clippy,rustfmt'
      extra-targets:
        description: |
          Space-separated additional rustup targets beyond the default
          `wasm32-wasip2`. Empty unless a consumer needs a second
          target (e.g. a debug build on the host for tests that don't
          link `zed_extension_api`).
        type: string
        required: false
        default: ''
      node:
        description: 'Install Node.js (for consumers whose check uses JS tooling).'
        type: boolean
        required: false
        default: false
      node-version:
        description: 'Node.js version (only used when `node: true`).'
        type: string
        required: false
        default: '20'
      bats:
        description: 'Install bats-core.'
        type: boolean
        required: false
        default: false
      cache-shared-key:
        description: |
          Cache key shared across runs of this workflow. Default
          `zed-extension-wasm`; consumers with a unique cache profile
          can override.
        type: string
        required: false
        default: 'zed-extension-wasm'
      pre-check:
        description: |
          Optional path to a script the consumer runs before
          `bin/check` (e.g. regenerating a theme JSON from a template).
        type: string
        required: false
        default: ''
      check-command:
        description: |
          The canonical umbrella check entry point. Defaults to
          `bin/check`; override (e.g. `scripts/test-all`) for
          consumers still mid-take-iii.
        type: string
        required: false
        default: 'bin/check'
      submodules:
        description: 'Pass `submodules: recursive` on checkout.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules && 'recursive' || '' }}

      - name: Install Rust toolchain (wasm32-wasip2)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: ${{ inputs.rust-components }}

      - name: Install extra rustup targets
        if: inputs.extra-targets != ''
        shell: bash
        run: |
          for t in ${{ inputs.extra-targets }}; do
            rustup target add "$t"
          done

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ inputs.cache-shared-key }}

      - name: Install Node.js
        if: inputs.node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install bats
        if: inputs.bats
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Pre-check hook
        if: inputs.pre-check != ''
        shell: bash
        env:
          # Make `gh` usable inside the consumer's pre-check script
          # (e.g. `gh release download` for fetching pinned deps).
          GH_TOKEN: ${{ github.token }}
        run: bash "${{ inputs.pre-check }}"

      - name: Set up Python (gate linters ruff/yamllint)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Arm the gate toolset (full lint set)
        # The gate (lefthook.yml) is HARD — a missing tool FAILS bin/check, it
        # does not skip (release#412). CI must therefore arm the FULL toolset,
        # not just lefthook, or the hardened gate fails on the first missing
        # linter (markdownlint). Mirrors release's own ci.yml. Kept inline
        # (rather than calling the consumer's bin/setup-dev-env.sh) so it is
        # robust to consumer bootstrap-version skew — the toolset-arming block
        # only exists in the re-synced bootstrap, which lands in the same
        # propagate PR as the hardened gate. This is the interim arming step
        # that `release-core init` (epic #416) will replace fleet-wide with
        # `pip install -U release_core && release-core init`.
        run: |
          npm install -g lefthook prettier markdownlint-cli
          pip install "ruff==0.15.12" yamllint
          # The shellcheck binary is ambient on ubuntu runners but ABSENT
          # on macOS (inputs.runner can be macos-*). The gate's shell-lint step
          # (bin/check-shell) is HARD, so install it when missing rather than
          # let the gate die on a non-ubuntu runner. brew on macOS; apt fallback.
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          fi

      - name: Run umbrella check
        shell: bash
        run: ${{ inputs.check-command }}
