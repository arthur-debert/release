name: tree-sitter release

# Reusable release workflow for tree-sitter grammar repos. Consumers
# call this from their .github/workflows/release.yml as a thin caller
# pinned at @v1. See README §Stack matrix row "tree-sitter" and
# tracking issue #47.
#
# What this stack ships
# ---------------------
# - A `tree-sitter.tar.gz` artifact attached to the GH release,
#   containing the standard bundle layout downstream consumers
#   (editors, syntax-highlighter libraries) extract from:
#     <name>.wasm
#     grammar.js
#     package.json
#     tree-sitter.json
#     src/parser.c
#     src/scanner.{c,cc}            (gated by existence)
#     src/tree_sitter/parser.h
#     src/tree_sitter/*.h           (alloc.h, array.h if generated)
#     queries/*.scm
#
#   The shape of this bundle IS a contract with downstream callers
#   that extract specific files from it (e.g. lex-fmt/vscode's
#   pre-vsce-package.sh pulls `<name>.wasm` and `queries/`). Changes
#   to the bundle layout are a MAJOR for this stack.
#
# - Optional npm publish — most tree-sitter parsers ship via the GH
#   release tarball; npm publish is opt-in for repos that also want
#   to be a `tree-sitter-<lang>` npm package.
#
# What's out of scope (deliberately)
# ----------------------------------
# - crates.io publish for tree-sitter bindings. Few parsers ship Rust
#   bindings; add a future slice when first consumer needs it.
# - Downstream `repository_dispatch upstream-released` notifications.
#   Lives separately in cascade-handler.yml (Wave 1.3). Consumers
#   that need cascade fan-out chain their thin caller's `release`
#   job with a follow-up notify step (see lex-fmt/tree-sitter-lex
#   release.yml for the reference pattern).
#
# Convention hooks
# ----------------
# - `app-bin/bundle-extras.sh` — runs AFTER the standard bundle is
#   assembled in `dist/`, BEFORE the tarball is created. Use to add
#   consumer-specific
#   files (e.g. `shared/embedded-grammars.json`). Working dir at hook
#   time is the repo root; the bundle is at `${GITHUB_WORKSPACE}/dist/`.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release (bare semver, e.g. 0.11.0 or 1.0.0-rc.1). No leading v.'
        type: string
        required: true
      changelog-path:
        description: 'Path to CHANGELOG.md (Keep-a-Changelog with `## [Unreleased]`).'
        type: string
        required: false
        default: 'CHANGELOG.md'
      parser-name:
        description: 'Bare parser name (used for the .wasm output filename, e.g. `lex` → `tree-sitter-lex.wasm`). Defaults to the value of `name` in package.json with the `tree-sitter-` prefix stripped.'
        type: string
        required: false
        default: ''
      publish-npm:
        description: 'Publish the package to npm. Default false — most parsers ship via GH release tarball only.'
        type: boolean
        required: false
        default: false
      run-corpus-tests:
        description: 'Run `tree-sitter test` as a pre-tag gate. Default true. Set false if the PR-time test workflow is authoritative and you trust main to be green.'
        type: boolean
        required: false
        default: true
      node-version:
        description: 'Node.js version for the build env.'
        type: string
        required: false
        default: '20'
      submodules:
        description: 'Pass `submodules: recursive` on checkout.'
        type: boolean
        required: false
        default: false

    secrets:
      RELEASE_TOKEN:
        description: 'PAT with repo scope for default-branch push (bypasses ruleset). Falls back to GITHUB_TOKEN.'
        required: false
      NPM_TOKEN:
        description: 'npm publish token. Required when publish-npm=true.'
        required: false

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------
  # 0. Pre-flight: validate NPM_TOKEN if publish-npm=true.
  # -------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    env:
      NPM_PRESENT: ${{ secrets.NPM_TOKEN != '' && 'yes' || 'no' }}
      PUBLISH_NPM: ${{ inputs.publish-npm }}
    steps:
      - name: Validate publish secrets
        run: |
          set -euo pipefail
          if [ "${PUBLISH_NPM}" = "true" ] && [ "${NPM_PRESENT}" = "no" ]; then
            echo "::error::publish-npm=true but NPM_TOKEN secret is missing"
            exit 1
          fi

  # -------------------------------------------------------------------
  # 0.5. Corpus tests as a pre-tag gate. Runs BEFORE prepare so a
  #      test failure doesn't leave a dangling pushed tag (prepare-
  #      release-npm tags+pushes atomically; once that happens the
  #      tag is on origin even if downstream jobs fail).
  # -------------------------------------------------------------------
  corpus-test:
    needs: preflight
    if: inputs.run-corpus-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules && 'recursive' || '' }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          # Conditionally enable the npm cache only when a
          # npm-flavored lockfile is present. setup-node@v6 with
          # `cache: 'npm'` hard-fails when no matching lockfile is
          # found — but many tree-sitter grammar repos use
          # `npm install` rather than `npm ci` and ship no
          # lockfile. yarn.lock is intentionally NOT in this
          # hashFiles list: setup-node with cache=npm doesn't read
          # yarn lockfiles, so including it would re-trigger the
          # same hard-fail in yarn-only repos.
          cache: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') != '' && 'npm' || '' }}

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate parser
        run: npx tree-sitter generate

      - name: Run corpus tests
        run: npx tree-sitter test

  # -------------------------------------------------------------------
  # 1. Prepare: bump package.json, roll changelog, tag + push.
  #    Gated on corpus-test (success-or-skipped — skipped means
  #    run-corpus-tests was false, an explicit caller opt-out).
  # -------------------------------------------------------------------
  prepare:
    needs: [preflight, corpus-test]
    if: |
      always()
      && needs.preflight.result == 'success'
      && (needs.corpus-test.result == 'success' || needs.corpus-test.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
      release-sha: ${{ steps.prep.outputs.release-sha }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
      parser-name: ${{ steps.meta.outputs.parser-name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: ${{ inputs.submodules && 'recursive' || '' }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: arthur-debert/release/.github/actions/prepare-release-npm@v3
        id: prep
        with:
          version: ${{ inputs.version }}
          changelog-path: ${{ inputs.changelog-path }}

      - name: Resolve parser name
        id: meta
        shell: bash
        env:
          INPUT_PARSER: ${{ inputs.parser-name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PARSER}" ]; then
            echo "parser-name=${INPUT_PARSER}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Derive from package.json — convention: package name is
          # `tree-sitter-<lang>`, parser name is `<lang>`. Refuse to
          # derive from a non-conforming name (e.g. `my-grammar`)
          # because `tree-sitter build --wasm` produces
          # `tree-sitter-<parser>.wasm` and a wrong parser name
          # makes the bundle look empty.
          pkg_name="$(jq -r '.name // empty' package.json)"
          if [ -z "${pkg_name}" ]; then
            echo "::error::parser-name input is empty and package.json .name is missing"
            exit 1
          fi
          if [[ "${pkg_name}" != tree-sitter-* ]]; then
            echo "::error::cannot derive parser-name from package.json name '${pkg_name}' — it doesn't start with 'tree-sitter-'. Pass parser-name explicitly via the workflow input."
            exit 1
          fi
          parser="${pkg_name#tree-sitter-}"
          echo "parser-name=${parser}" >> "${GITHUB_OUTPUT}"

  # -------------------------------------------------------------------
  # 2. Build the standard tree-sitter bundle: regen parser, run
  #    corpus tests, build WASM, assemble dist/, tar it up.
  # -------------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          submodules: ${{ inputs.submodules && 'recursive' || '' }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          # Conditionally enable the npm cache only when a
          # npm-flavored lockfile is present. setup-node@v6 with
          # `cache: 'npm'` hard-fails when no matching lockfile is
          # found — but many tree-sitter grammar repos use
          # `npm install` rather than `npm ci` and ship no
          # lockfile. yarn.lock is intentionally NOT in this
          # hashFiles list: setup-node with cache=npm doesn't read
          # yarn lockfiles, so including it would re-trigger the
          # same hard-fail in yarn-only repos.
          cache: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') != '' && 'npm' || '' }}

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate parser
        run: npx tree-sitter generate

      # Note: corpus tests run in the dedicated corpus-test job
      # BEFORE prepare to avoid a dangling-tag-on-test-failure
      # outcome. By the time build executes, tests are green
      # (or run-corpus-tests was explicitly opted out at the
      # caller).

      - name: Build WASM
        run: npx tree-sitter build --wasm

      - name: Assemble standard bundle
        shell: bash
        env:
          PARSER: ${{ needs.prepare.outputs.parser-name }}
        run: |
          set -euo pipefail
          dist="${GITHUB_WORKSPACE}/dist"
          rm -rf "${dist}"
          mkdir -p "${dist}/src/tree_sitter" "${dist}/queries"

          # Core grammar metadata
          cp grammar.js "${dist}/"
          cp package.json "${dist}/"
          [ -f tree-sitter.json ] && cp tree-sitter.json "${dist}/"

          # Generated parser sources
          cp src/parser.c "${dist}/src/"
          for f in src/scanner.c src/scanner.cc; do
            [ -f "${f}" ] && cp "${f}" "${dist}/src/"
          done
          # tree-sitter headers (parser.h is always present; alloc.h /
          # array.h are emitted only by newer tree-sitter CLI versions)
          for h in src/tree_sitter/parser.h src/tree_sitter/alloc.h src/tree_sitter/array.h; do
            [ -f "${h}" ] && cp "${h}" "${dist}/src/tree_sitter/"
          done

          # Highlight + indent + locals + injections queries.
          # Queries are part of the bundle contract — if queries/
          # exists but contains no .scm files, something's wrong;
          # fail loudly. (queries/ entirely absent is OK — some
          # parsers ship without them.)
          if [ -d queries ]; then
            shopt -s nullglob
            scms=(queries/*.scm)
            shopt -u nullglob
            if [ "${#scms[@]}" -eq 0 ]; then
              echo "::error::queries/ exists but contains no .scm files — bundle contract requires queries/*.scm when the directory is present"
              exit 1
            fi
            cp "${scms[@]}" "${dist}/queries/"
          fi

          # WASM artifact at the bundle root. Hard error if missing
          # — downstream consumers (editors) extract this file by
          # name from the bundle; silently shipping a tarball
          # without it would break them at install time, not at
          # release time, which is the worst possible failure mode.
          wasm="tree-sitter-${PARSER}.wasm"
          if [ ! -f "${wasm}" ]; then
            echo "::error::expected ${wasm} not produced by tree-sitter build --wasm"
            exit 1
          fi
          cp "${wasm}" "${dist}/"

      # Optional consumer extras. Hook runs at repo root; bundle is
      # at ${GITHUB_WORKSPACE}/dist. Use to add files the standard
      # layout doesn't carry (e.g. shared/embedded-grammars.json).
      - name: Bundle-extras hook (consumer)
        if: hashFiles('app-bin/bundle-extras.sh') != ''
        shell: bash
        env:
          BUNDLE_DIR: ${{ github.workspace }}/dist
          PARSER: ${{ needs.prepare.outputs.parser-name }}
        run: bash app-bin/bundle-extras.sh

      - name: Tar the bundle
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/dist"
          # tar from inside dist/ with the glob `* .[^.]*` (visible +
          # hidden files at top level, excluding `.` and `..`) so
          # entries have no `./` or `dist/` prefix. Downstream
          # extractors that match exact paths (`tree-sitter-<parser>.wasm`,
          # `queries/<name>.scm`) get the literal path with no surprises.
          shopt -s nullglob dotglob
          entries=(*)
          shopt -u nullglob dotglob
          tar -czf "${GITHUB_WORKSPACE}/tree-sitter.tar.gz" "${entries[@]}"
          ls -la "${GITHUB_WORKSPACE}/tree-sitter.tar.gz"
          echo "Bundle contents:"
          tar -tzf "${GITHUB_WORKSPACE}/tree-sitter.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tree-sitter-bundle
          path: tree-sitter.tar.gz
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # 3. Publish to npm. Opt-in.
  # -------------------------------------------------------------------
  publish-npm:
    needs: [prepare, build]
    # A `-release-rc` cut is a throwaway live-fire verification (release#663):
    # build + tag + GH release, but NEVER publish to npm.
    if: inputs.publish-npm && !(endsWith(needs.prepare.outputs.version, '-release-rc') || contains(needs.prepare.outputs.version, '-release-rc.'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::publish-npm=true but NPM_TOKEN is empty at publish time"
            exit 1
          fi

          pkg_name="$(jq -r '.name' package.json)"
          pkg_version="$(jq -r '.version' package.json)"

          # Idempotency pre-check: ask the registry if this exact
          # version is already published. If so, skip — avoids the
          # fragile "grep the human-readable error string" pattern
          # (npm error wording has shifted across versions).
          # `npm view ... version` exits non-zero if not found; we
          # accept that and proceed to publish.
          existing="$(npm view "${pkg_name}@${pkg_version}" version 2>/dev/null || true)"
          if [ "${existing}" = "${pkg_version}" ]; then
            echo "${pkg_name}@${pkg_version} already published — skipping"
            exit 0
          fi

          # No --access flag: let package.json's publishConfig.access
          # (if any) drive. Scoped packages without publishConfig
          # default to restricted, which is the npm default — if a
          # consumer wants public, they should set
          # `"publishConfig": {"access": "public"}` in package.json.
          npm publish

  # -------------------------------------------------------------------
  # 4. GH release. Gated on build + (if enabled) publish-npm. Same
  #    partial-release-prevention pattern as vscode-ext / python-pkg.
  # -------------------------------------------------------------------
  release:
    needs: [prepare, build, publish-npm]
    if: |
      always()
      && needs.prepare.result == 'success'
      && needs.build.result == 'success'
      && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: .

      - name: Download bundle
        uses: actions/download-artifact@v7
        with:
          name: tree-sitter-bundle
          path: .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [ "${PRERELEASE}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — updating notes + re-uploading bundle"
            gh release edit "${TAG}" --notes-file release-notes.md
            gh release upload "${TAG}" tree-sitter.tar.gz --clobber
          else
            gh release create "${TAG}" \
              ${prerelease_flag} \
              --title "${TAG}" \
              --notes-file release-notes.md \
              tree-sitter.tar.gz
          fi
