name: sign + notarize macOS

# Reusable, CONSUMER-AGNOSTIC post-hoc macOS signer (WS4, epic #811).
#
# Takes an UNSIGNED build artifact that carries the inner `.app` (packaged
# as `<name>.unsigned-app.tar.gz`), codesigns the `.app` with a Developer ID
# cert under the hardened runtime, reseals the `.dmg` from the SIGNED `.app`
# with `hdiutil` (NOT a re-bundle — that strips the signature, per the WS0
# spike), codesigns the `.dmg`, notarizes + staples, and re-uploads the
# SIGNED artifact under `<artifact-name>-signed`.
#
# It makes no Tauri (or Electron) assumptions — it operates on a `.app` +
# `.dmg` pair. The bundler that produced the unsigned artifact is the only
# tauri-specific part, and lives in the caller (tauri-app.yml).
#
# Credentials — two notarization auth styles, pick whichever cred set is
# non-empty (ASC API key wins when both present):
#   - App Store Connect API key: ASC_KEY_BASE64 / ASC_KEY_ID / ASC_ISSUER_ID
#   - Apple-ID:                   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
# Signing always uses the Developer ID .p12 cert (APPLE_CERTIFICATE).

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Name of the unsigned build artifact to download (must carry a *.unsigned-app.tar.gz).'
        type: string
        required: true
      notarize:
        description: 'Submit the signed bundle for Apple notarization + staple. Default true.'
        type: boolean
        required: false
        default: true
      runs-on:
        description: 'macOS runner label.'
        type: string
        required: false
        default: 'macos-latest'
      retention-days:
        description: 'Artifact retention for the signed output.'
        type: number
        required: false
        default: 7

    secrets:
      APPLE_CERTIFICATE:
        description: 'Base64-encoded Developer ID Application .p12 certificate.'
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        description: 'Password for the .p12 certificate (optional — passwordless .p12s are valid).'
        required: false
      ASC_KEY_BASE64:
        description: 'Base64-encoded App Store Connect API key (.p8). One of the two notary cred sets.'
        required: false
      ASC_KEY_ID:
        description: 'App Store Connect API key ID.'
        required: false
      ASC_ISSUER_ID:
        description: 'App Store Connect API issuer UUID.'
        required: false
      APPLE_ID:
        description: 'Apple ID email (Apple-ID notary auth). Used when no ASC key is supplied.'
        required: false
      APPLE_PASSWORD:
        description: 'App-specific password for the Apple ID.'
        required: false
      APPLE_TEAM_ID:
        description: 'Apple Developer Team ID.'
        required: false

    outputs:
      signed-artifact:
        description: 'Name of the uploaded signed artifact.'
        value: ${{ jobs.sign.outputs.signed-artifact }}

# The composite actions below are REMOTE `@v3` refs, not local `./` refs. A
# reusable workflow does not auto-checkout its own repo, and a `./` action path
# resolves against $GITHUB_WORKSPACE — the CONSUMER's checkout (e.g. phos),
# which does not carry release's composites — so a local ref would fail
# "action.yml not found" at runtime. The remote `@v3` ref makes GitHub fetch the
# action (with its sibling bin-internal/ scripts) independently of the
# workspace, and satisfies the workflow-action-major @v3 guard.
#
# The CALLER (tauri-app.yml's `sign` job) ALSO reaches this workflow with a full
# `@v3` ref, NOT a local `./` one. A `./` reusable-workflow path resolves against
# the TOP-LEVEL caller's repo (the CONSUMER, e.g. phos-editor/app), not
# arthur-debert/release — across repos GitHub can't find it and the whole
# workflow graph fails to compile at startup (a startup_failure with 0 jobs).
# (An earlier revision used a local self-ref on the wrong premise that it
# auto-tracks the release repo; the phos RC proved it tracks the consumer repo
# instead — release#823 follow-up.)
jobs:
  sign:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      signed-artifact: ${{ steps.names.outputs.signed }}
    steps:
      - name: Resolve artifact names
        id: names
        shell: bash
        env:
          ARTIFACT: ${{ inputs.artifact-name }}
        run: echo "signed=${ARTIFACT}-signed" >> "$GITHUB_OUTPUT"

      - name: Download unsigned artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: unsigned

      - name: Unpack unsigned app
        id: unpack
        uses: arthur-debert/release/.github/actions/unpack-unsigned-app@canary/169ba88068aa
        with:
          artifact-dir: unsigned

      # 1. Enumerate nested signable Mach-O (extra executables, dylibs, helper
      #    bundles) so they're signed too — a flat `codesign App.app` signs only
      #    the bundle's MAIN executable, leaving nested code unsigned/unhardened
      #    → notary rejection (release#823 phos RC: Contents/MacOS/gen_fixtures).
      - name: Enumerate nested Mach-O
        id: macho
        uses: arthur-debert/release/.github/actions/enumerate-macho@canary/169ba88068aa
        with:
          app-path: ${{ steps.unpack.outputs.app }}

      # 2. Codesign inner-first then the .app LAST (hardened runtime + secure
      #    timestamp on every Mach-O). sign-mac signs the newline-separated
      #    paths in order, outer last — so nested code precedes the .app.
      - name: Sign .app (nested-aware)
        uses: arthur-debert/release/.github/actions/sign-mac@canary/169ba88068aa
        with:
          cert-p12-base64: ${{ secrets.APPLE_CERTIFICATE }}
          cert-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          paths: |
            ${{ steps.macho.outputs.paths }}
            ${{ steps.unpack.outputs.app }}

      # 3. Reseal the .dmg from the SIGNED .app via hdiutil (never re-bundle).
      - name: Reseal dmg
        id: reseal
        uses: arthur-debert/release/.github/actions/reseal-mac-dmg@canary/169ba88068aa
        with:
          app-path: ${{ steps.unpack.outputs.app }}
          dmg-out: ${{ runner.temp }}/signed.dmg

      # 4. Codesign the resealed .dmg.
      - name: Sign .dmg
        uses: arthur-debert/release/.github/actions/sign-mac@canary/169ba88068aa
        with:
          cert-p12-base64: ${{ secrets.APPLE_CERTIFICATE }}
          cert-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          paths: ${{ runner.temp }}/signed.dmg

      # 5. Notarize + staple the signed .dmg (skipped when notarize=false).
      - name: Notarize + staple
        if: ${{ inputs.notarize }}
        uses: arthur-debert/release/.github/actions/notarize-mac@canary/169ba88068aa
        with:
          artifact-path: ${{ runner.temp }}/signed.dmg
          asc-key-base64: ${{ secrets.ASC_KEY_BASE64 }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          staple: 'true'

      # 6. Stage the signed .dmg under the original dmg's filename, then
      #    upload the SIGNED artifact. The unsigned .app payload is dropped
      #    (it was only the reseal input).
      - name: Stage signed dmg
        id: stage
        shell: bash
        env:
          SIGNED_DMG: ${{ runner.temp }}/signed.dmg
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/signed-out"
          mkdir -p "$out"
          # Carry the consumer's original .dmg name if the unsigned artifact
          # shipped one; otherwise fall back to the .app basename. This workflow
          # is documented single-.app + single-.dmg, so >1 .dmg is an error: a
          # head -1 pick would sign one nondeterministically and silently drop
          # the rest. Mirror the zero/multi-.app guard in unpack-unsigned-app.sh.
          # (while-read, not mapfile — the macOS runner is bash 3.2.)
          dmgs=()
          while IFS= read -r d; do
            dmgs+=("$d")
          done < <(find unsigned -maxdepth 2 -type f -name '*.dmg')
          if [ "${#dmgs[@]}" -gt 1 ]; then
            echo "::error::expected at most one .dmg in the unsigned artifact, found ${#dmgs[@]}: ${dmgs[*]}"
            exit 1
          fi
          if [ "${#dmgs[@]}" -eq 1 ]; then
            name=$(basename "${dmgs[0]}")
          else
            app="${{ steps.unpack.outputs.app }}"
            name="$(basename "$app" .app).dmg"
          fi
          cp "$SIGNED_DMG" "$out/$name"
          echo "staged signed dmg as $name"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.names.outputs.signed }}
          path: ${{ steps.stage.outputs.dir }}/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
