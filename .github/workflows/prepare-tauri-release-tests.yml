name: prepare-tauri-release tests

# Integration BATS suite for bin-internal/prepare-tauri-release.sh. Hermetic: a
# temp git repo + stubbed semver/changelog/gh, asserting the fresh-release bump
# commit contains the three version files AND the rolled CHANGELOG.md + the
# CHANGELOG/unreleased-*.md fragment removals (the WS2 #811 regression guard).

on:
  push:
    branches: ["**"]
    paths:
      - "bin-internal/prepare-tauri-release.sh"
      - "bin-internal/roll-changelog.sh"
      - "bin-internal/assert-base-sha-green.sh"
      - "tests/prepare-tauri-release/**"
      - ".github/workflows/prepare-tauri-release-tests.yml"
  pull_request:
    paths:
      - "bin-internal/prepare-tauri-release.sh"
      - "bin-internal/roll-changelog.sh"
      - "bin-internal/assert-base-sha-green.sh"
      - "tests/prepare-tauri-release/**"
      - ".github/workflows/prepare-tauri-release-tests.yml"

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats + jq
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Run BATS suite
        run: bats tests/prepare-tauri-release/
