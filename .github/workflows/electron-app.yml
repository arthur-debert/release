name: Electron app release

# Reusable release workflow for Electron apps (electron-builder).
# Consumers call this from their own .github/workflows/release.yml as a
# thin caller pinned to @v1. See README §Stack matrix row "electron-app"
# and the per-stack tracking issue #43 for the column-by-column scope.
#
# Slice 1 of the electron-app rollout: darwin-arm64 + linux x86_64 build,
# sign + notarize on darwin, GitHub release with .dmg + .AppImage
# artifacts. Windows + auto-updater feed + e2e-in-CI ship in follow-on
# slices.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release (e.g. 0.18.0 or 1.0.0-rc.1). No leading v.'
        type: string
        required: true
      app-name:
        description: 'electron-builder productName. Used for artifact naming when not derivable from package.json.'
        type: string
        required: false
        default: ''
      bundle-id:
        description: 'macOS bundle identifier (e.g. com.lex-fmt.lexed). Required when signing is enabled (i.e. APPLE_CERTIFICATE_P12_BASE64 secret is set).'
        type: string
        required: false
        default: ''
      darwin-archs:
        description: 'Comma-separated macOS archs. Default arm64 only (Intel deprecated portfolio-wide). Set "" to skip macOS.'
        type: string
        required: false
        default: 'arm64'
      linux-archs:
        description: 'Comma-separated linux archs to package as AppImage. Set "" to skip linux.'
        type: string
        required: false
        default: 'x64'
      windows-archs:
        description: 'Comma-separated windows archs (default empty; opt-in — Windows code-signing not yet integrated).'
        type: string
        required: false
        default: ''
      submodules:
        description: 'Pass `submodules: recursive` on checkout (lexed needs this for comms; most projects do not).'
        type: boolean
        required: false
        default: false
      changelog-path:
        description: 'Path to CHANGELOG.md (Keep-a-Changelog format with `## [Unreleased]` section).'
        type: string
        required: false
        default: 'CHANGELOG.md'
      node-version:
        description: 'Node.js version (consumed by setup-node).'
        type: string
        required: false
        default: '22'
      entitlements:
        description: 'Path to macOS entitlements .plist. Optional; electron-builder usually generates one. Override only when overriding electron-builder defaults.'
        type: string
        required: false
        default: ''
      output-dir:
        description: 'electron-builder `directories.output` (the dir produced artifacts land in). Default matches electron-builder''s default; lexed sets `release`.'
        type: string
        required: false
        default: 'dist'
      notarize:
        description: |
          Control macOS notarization. Notarization is handled by this
          workflow via `xcrun notarytool submit` → poll → `stapler
          staple` (NOT by electron-builder — `build.mac.notarize`
          should be `false` in package.json).

          Values:
            - `true`  → notarize (requires APPLE_CERTIFICATE_P12_BASE64,
                        APPLE_CERTIFICATE_PASSWORD, ASC_API_KEY_BASE64,
                        ASC_API_KEY_ID, ASC_API_ISSUER_ID secrets;
                        fails fast if missing).
            - `false` → skip notarization (DMG is still signed if the
                        APPLE_CERTIFICATE_* secrets are configured).
            - ``      → auto: notarize iff signing cert AND ASC key are
                        both configured; otherwise skip.
        type: string
        required: false
        default: ''

    secrets:
      RELEASE_TOKEN:
        description: 'PAT with repo scope for default-branch push (bypasses ruleset). Falls back to GITHUB_TOKEN if absent.'
        required: false
      APPLE_CERTIFICATE_P12_BASE64:
        description: 'Base64 .p12 (Developer ID Application cert). Empty → signing skipped.'
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: 'Password for the .p12.'
        required: false
      ASC_API_KEY_BASE64:
        description: 'Base64 App Store Connect API key (.p8). Empty → notarization skipped.'
        required: false
      ASC_API_KEY_ID:
        description: 'App Store Connect API key ID.'
        required: false
      ASC_API_ISSUER_ID:
        description: 'App Store Connect API issuer UUID.'
        required: false

permissions:
  contents: write

# Note on customizing the build for sign-invalidating work (e.g. signing
# helper bundles like .appex extensions that electron-builder doesn't
# recurse into): do NOT do this in a post-build step in this workflow —
# electron-builder signs inside the build step, and any subsequent file
# modification on the .app would invalidate that signature. Instead, use
# electron-builder's own `afterPack` lifecycle hook (a JS function
# declared in package.json `build.afterPack`), which runs BETWEEN pack
# and sign. That's the canonical entry point for re-signing nested
# bundles. (Notarization runs AFTER the build but only modifies the
# .dmg by appending a stapled ticket — that's fine and doesn't
# invalidate the signature on the .app inside.)

jobs:
  # -------------------------------------------------------------------
  # 1. Prepare: validate version, bump package.json, roll changelog,
  #    commit + tag + push. Resume-safe if the tag already exists.
  # -------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
      release-sha: ${{ steps.prep.outputs.release-sha }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
      darwin-archs-json: ${{ steps.matrices.outputs.darwin }}
      linux-archs-json: ${{ steps.matrices.outputs.linux }}
      windows-archs-json: ${{ steps.matrices.outputs.windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: ${{ inputs.submodules && 'recursive' || '' }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Prepare release (npm)
        id: prep
        uses: arthur-debert/release/.github/actions/prepare-release-npm@v2
        with:
          version: ${{ inputs.version }}
          changelog-path: ${{ inputs.changelog-path }}

      - name: Parse arch matrices
        id: matrices
        env:
          DARWIN_ARCHS: ${{ inputs.darwin-archs }}
          LINUX_ARCHS: ${{ inputs.linux-archs }}
          WINDOWS_ARCHS: ${{ inputs.windows-archs }}
        run: |
          # GH Actions expressions don't have a string-split function;
          # do the comma→JSON-array conversion here and emit outputs the
          # build jobs' `matrix:` reads via fromJSON.
          to_json() {
            if [ -z "$1" ]; then
              echo '[]'
            else
              echo "$1" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; ""))'
            fi
          }
          {
            echo "darwin=$(to_json "${DARWIN_ARCHS}")"
            echo "linux=$(to_json "${LINUX_ARCHS}")"
            echo "windows=$(to_json "${WINDOWS_ARCHS}")"
          } >> "${GITHUB_OUTPUT}"

  # -------------------------------------------------------------------
  # 2. Build matrices — one job per OS. Each job auto-detects the
  #    consumer's package manager (pnpm-lock.yaml → pnpm, yarn.lock →
  #    yarn, default → npm), sets up Node + the matching pm, runs
  #    `<pm> install` and `<pm> run build`, and uploads the dist/
  #    artifacts.
  # -------------------------------------------------------------------
  build-mac:
    needs: prepare
    if: needs.prepare.outputs.darwin-archs-json != '[]'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.darwin-archs-json) }}
    steps:
      - name: Checkout at release SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          submodules: ${{ inputs.submodules && 'recursive' || '' }}

      - name: Detect package manager
        # Lockfile IS the canonical signal; consumers commit exactly
        # one of pnpm-lock.yaml / yarn.lock / package-lock.json.
        # Same pattern as electron-ci.yml + tauri-ci.yml.
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.pm.outputs.pm == 'pnpm'
        # Must run BEFORE setup-node so `cache: pnpm` finds the store.
        # No explicit `version:` — pnpm/action-setup reads
        # `packageManager` from package.json (Corepack convention);
        # specifying version: here while the consumer pins one triggers
        # ERR_PNPM_BAD_PM_VERSION. Same workaround as electron-ci.yml.
        uses: pnpm/action-setup@v4

      - name: Enable corepack (yarn)
        if: steps.pm.outputs.pm == 'yarn'
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}

      - name: Install deps
        run: ${{ steps.pm.outputs.install }}

      # SIGNING + NOTARIZATION strategy
      # --------------------------------
      # We split this into two passes for visibility:
      #   1. electron-builder signs the .app and packages the .dmg
      #      (using CSC_LINK + CSC_KEY_PASSWORD).
      #   2. We submit the .dmg to Apple via `xcrun notarytool submit`,
      #      poll for the verdict, then `xcrun stapler staple`.
      #
      # Why not electron-builder's native single-pass `notarize: true`?
      # It blocks the whole build step with no visibility into Apple's
      # queue — if the queue stalls, the runner just sits and eventually
      # times out at 6h with no useful log. The submit/poll/staple split
      # is the pattern documented in skills/macos-signing-notarization
      # and proven on simple-gal-ui v0.10.1 (shipped clean 2026-05-17);
      # electron-app.yml's native single-pass has never produced a
      # successful release in this org.
      #
      # Consumer-side prerequisite: `build.mac.notarize` MUST be false
      # (or unset) in package.json. We FORCE it to false at the CLI
      # via `-c.mac.notarize=false` so a consumer that left it true
      # doesn't double-notarize (electron-builder + this workflow).
      - name: Validate notarize input and resolve effective flag
        id: notarize-flag
        shell: bash
        env:
          NOTARIZE_INPUT: ${{ inputs.notarize }}
          CSC_B64_PRESENT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && 'yes' || 'no' }}
          CSC_PASS_PRESENT: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' && 'yes' || 'no' }}
          ASC_KEY_B64_PRESENT: ${{ secrets.ASC_API_KEY_BASE64 != '' && 'yes' || 'no' }}
          ASC_KEY_ID_PRESENT: ${{ secrets.ASC_API_KEY_ID != '' && 'yes' || 'no' }}
          ASC_ISSUER_PRESENT: ${{ secrets.ASC_API_ISSUER_ID != '' && 'yes' || 'no' }}
        run: |
          # Whitelist: true | false | empty. Anything else is a
          # caller-side typo — fail early.
          case "${NOTARIZE_INPUT}" in
            ''|true|false) ;;
            *)
              echo "::error::inputs.notarize must be 'true', 'false', or empty (got: '${NOTARIZE_INPUT}')"
              exit 1
              ;;
          esac

          # "All required" = every secret the submit/poll/staple flow
          # actually consumes. Missing any one of these causes a late
          # failure during signing or `xcrun notarytool submit`, so
          # check them all up front.
          all_present=yes
          missing=""
          for var in CSC_B64_PRESENT CSC_PASS_PRESENT ASC_KEY_B64_PRESENT ASC_KEY_ID_PRESENT ASC_ISSUER_PRESENT; do
            if [ "$(eval echo "\$$var")" = "no" ]; then
              all_present=no
              missing="${missing} ${var%_PRESENT}"
            fi
          done

          # Fail fast when notarize is forced on but any required
          # secret is missing — otherwise the build runs and either
          # signing or `notarytool submit` fails confusingly.
          if [ "${NOTARIZE_INPUT}" = "true" ] && [ "${all_present}" = "no" ]; then
            echo "::error::inputs.notarize=true but required secrets are missing:${missing}. Need all of: APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD, ASC_API_KEY_BASE64, ASC_API_KEY_ID, ASC_API_ISSUER_ID. Either configure them or set notarize='' (auto) / 'false'."
            exit 1
          fi

          # Effective behaviour:
          #   notarize='true'  → notarize (validated above)
          #   notarize='false' → skip
          #   notarize=''      → auto: notarize iff ALL required
          #                            secrets are configured.
          case "${NOTARIZE_INPUT}" in
            true)  effective=true ;;
            false) effective=false ;;
            *)
              if [ "${all_present}" = "yes" ]; then
                effective=true
              else
                effective=false
              fi
              ;;
          esac
          echo "effective=${effective}" >> "${GITHUB_OUTPUT}"
          echo "Effective notarize=${effective} (all_present=${all_present}, missing:${missing:-none})"

      - name: Provision fetch-deps on PATH
        # The consumer's build script calls `fetch-deps` by name, but it
        # isn't on PATH in CI (it lives in arthur-debert/release/bin).
        # Fetch the canonical copy from release@main and prepend it to
        # PATH. (main, not a pinned ref: matches consumers' existing
        # bootstrap, and the CI `guards` job keeps main's bin/fetch-deps a
        # real file so this raw fetch returns the script, not a symlink
        # target string — release#317.)
        shell: bash
        run: |
          dir="$RUNNER_TEMP/release-bin"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/fetch-deps" \
            "https://raw.githubusercontent.com/arthur-debert/release/main/bin/fetch-deps"
          chmod +x "$dir/fetch-deps"
          # Windows: npm/pnpm run scripts under cmd.exe, which can't exec a
          # shebang script by bare name — add a .cmd shim. It must invoke
          # `python` directly: fetch-deps is a Python script, and routing it
          # through bash (Git-bash) ignores the shebang, parses the Python as
          # shell, and dies on the first `class …(…):` (release #507 RC-cutover,
          # lex-fmt/lexed win32-x64). Harmless/unused on linux + mac.
          printf '@python "%%~dp0fetch-deps" %%*\r\n' > "$dir/fetch-deps.cmd"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Build (electron-builder, mac --${{ matrix.arch }})
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          # electron-builder reads CSC_LINK as either a path OR a base64
          # string. Passing the base64 directly avoids writing the .p12
          # to disk on the runner.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Force-disable electron-builder's native notarization. We
          # handle notarization in dedicated submit/poll/staple steps
          # below for queue visibility.
          args=(--mac "--${ARCH}" --publish never -c.mac.notarize=false)
          # Prefer canonical bin/build (release-sync managed via the
          # electron-app stack). Falls back to direct `<pm> run build`
          # for consumers that haven't adopted release-sync yet.
          if [ -x "${GITHUB_WORKSPACE}/bin/build" ]; then
            "${GITHUB_WORKSPACE}/bin/build" -- "${args[@]}"
          else
            ${{ steps.pm.outputs.pm }} run build "${args[@]}"
          fi

      # ---- Notarization: submit / poll / staple --------------------
      # Per skills/macos-signing-notarization. Each step is separately
      # logged so Apple's queue position and timing is visible in CI.
      - name: Write App Store Connect API key
        id: write-asc-key
        if: steps.notarize-flag.outputs.effective == 'true'
        shell: bash
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_BASE64}" ]; then
            echo "::error::ASC_API_KEY_BASE64 secret is empty but notarize is enabled."
            exit 1
          fi
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "${ASC_API_KEY_BASE64}" | base64 --decode > "${key_path}"
          chmod 600 "${key_path}"
          echo "key-path=${key_path}" >> "${GITHUB_OUTPUT}"

      - name: Submit DMG for notarization
        id: notarize-submit
        if: steps.notarize-flag.outputs.effective == 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
          ASC_KEY_PATH: ${{ steps.write-asc-key.outputs.key-path }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG=$(find "${OUTPUT_DIR}" -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "${DMG}" ]; then
            echo "::error::No DMG found under ${OUTPUT_DIR}/ — electron-builder produced no artifact."
            exit 1
          fi
          echo "Submitting ${DMG} to notarytool..."
          RESULT=$(xcrun notarytool submit "${DMG}" \
            --key "${ASC_KEY_PATH}" \
            --key-id "${ASC_KEY_ID}" \
            --issuer "${ASC_ISSUER}" \
            --output-format json \
            --no-wait)
          echo "${RESULT}"
          # Parse defensively: missing/renamed 'id' field shouldn't
          # produce a Python KeyError traceback — emit a clear error
          # annotation with the raw response so an Apple API change
          # is debuggable from the CI log.
          ID=$(printf '%s' "${RESULT}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -z "${ID}" ]; then
            echo "::error::Could not extract submission id from notarytool output. Raw response: ${RESULT}"
            exit 1
          fi
          echo "submission-id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "dmg-path=${DMG}" >> "${GITHUB_OUTPUT}"
          echo "Submission ID: ${ID}"

      - name: Wait for notarization
        if: steps.notarize-submit.outcome == 'success'
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.notarize-submit.outputs.submission-id }}
          ASC_KEY_PATH: ${{ steps.write-asc-key.outputs.key-path }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -uo pipefail
          echo "Polling notarization status for ${SUBMISSION_ID}..."
          for i in $(seq 1 60); do
            RESULT=$(xcrun notarytool info "${SUBMISSION_ID}" \
              --key "${ASC_KEY_PATH}" \
              --key-id "${ASC_KEY_ID}" \
              --issuer "${ASC_ISSUER}" \
              --output-format json 2>&1) || true
            STATUS=$(printf '%s' "${RESULT}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','Unknown'))" 2>/dev/null || echo "Unknown")
            echo "  [${i}/60] status=${STATUS} ($(date -u +%H:%M:%S))"
            if [ "${STATUS}" = "Accepted" ]; then
              echo "Notarization accepted."
              exit 0
            fi
            if [ "${STATUS}" = "Invalid" ] || [ "${STATUS}" = "Rejected" ]; then
              echo "::error::Notarization failed with status: ${STATUS}"
              xcrun notarytool log "${SUBMISSION_ID}" \
                --key "${ASC_KEY_PATH}" \
                --key-id "${ASC_KEY_ID}" \
                --issuer "${ASC_ISSUER}" 2>&1 || true
              exit 1
            fi
            sleep 30
          done
          echo "::warning::Timed out waiting for notarization after 30 minutes. The DMG is signed but not notarized — staple manually once Apple finishes processing (submission ID: ${SUBMISSION_ID})."

      - name: Staple notarization ticket
        if: steps.notarize-submit.outcome == 'success'
        shell: bash
        env:
          DMG_PATH: ${{ steps.notarize-submit.outputs.dmg-path }}
        run: |
          set -uo pipefail
          echo "Stapling ${DMG_PATH}..."
          xcrun stapler staple "${DMG_PATH}" \
            || echo "::warning::Staple failed — notarization may not be complete yet. DMG is still signed."
          xcrun stapler validate "${DMG_PATH}" || true

      # Smoke test (convention): app-bin/smoke-hook.sh. Catches catastrophic
      # build issues (wrong binary path, dylib missing, Windows path
      # quirks, etc.) — the only way to know the packaged build doesn't
      # crash on launch is to launch it. PLATFORM/ARCH/PACKAGE_DIR env
      # vars are exposed; consumer's script handles xvfb-run on linux,
      # binary-path resolution per arch, etc.
      #
      # Smoke runs AFTER signing+notarization. Any modification to the
      # artifact in this step would invalidate notarization — keep it
      # read-only (launch the binary, check exit / output; don't
      # rewrite files).
      - name: Derive app name
        id: app-name
        shell: bash
        run: echo "name=$(jq -r '.build.productName // .name' package.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke test (mac)
        if: hashFiles('app-bin/smoke-hook.sh') != ''
        shell: bash
        env:
          PLATFORM: mac
          ARCH: ${{ matrix.arch }}
          PACKAGE_DIR: ${{ inputs.output-dir }}
          APP_NAME: ${{ steps.app-name.outputs.name }}
        run: bash app-bin/smoke-hook.sh

      # Upload runs `if: always() && !cancelled()` so a notarization
      # timeout (warning, not failure) still publishes the signed DMG.
      - name: Upload mac artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-mac-${{ matrix.arch }}
          path: |
            ${{ inputs.output-dir }}/*.dmg
            ${{ inputs.output-dir }}/*.dmg.blockmap
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.linux-archs-json != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.linux-archs-json) }}
    steps:
      - name: Checkout at release SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          submodules: ${{ inputs.submodules && 'recursive' || '' }}

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Enable corepack (yarn)
        if: steps.pm.outputs.pm == 'yarn'
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}

      - name: Install deps
        run: ${{ steps.pm.outputs.install }}

      - name: Provision fetch-deps on PATH
        # See build-mac for rationale. fetch-deps isn't on PATH in CI;
        # fetch the canonical real-file copy at this workflow's commit.
        shell: bash
        run: |
          dir="$RUNNER_TEMP/release-bin"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/fetch-deps" \
            "https://raw.githubusercontent.com/arthur-debert/release/main/bin/fetch-deps"
          chmod +x "$dir/fetch-deps"
          printf '@python "%%~dp0fetch-deps" %%*\r\n' > "$dir/fetch-deps.cmd"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Build (electron-builder, linux --${{ matrix.arch }})
        run: |
          # Prefer canonical bin/build (release-sync managed); fall
          # back to direct `<pm> run build` for consumers pre-adoption.
          if [ -x "${GITHUB_WORKSPACE}/bin/build" ]; then
            "${GITHUB_WORKSPACE}/bin/build" -- --linux --${{ matrix.arch }} --publish never
          else
            ${{ steps.pm.outputs.pm }} run build --linux --${{ matrix.arch }} --publish never
          fi

      - name: Derive app name
        id: app-name
        shell: bash
        run: echo "name=$(jq -r '.build.productName // .name' package.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke test (linux)
        if: hashFiles('app-bin/smoke-hook.sh') != ''
        shell: bash
        env:
          PLATFORM: linux
          ARCH: ${{ matrix.arch }}
          PACKAGE_DIR: ${{ inputs.output-dir }}
          APP_NAME: ${{ steps.app-name.outputs.name }}
        run: bash app-bin/smoke-hook.sh

      # AppImage is the canonical linux artifact for electron-app and
      # required for the release to be useful; .deb is optional (only
      # produced if the consumer's electron-builder config has the
      # `deb` target enabled). Split into two uploads so a missing
      # AppImage fails the build instead of warn-and-continue (Copilot
      # review on #65: warn would let the release job collect a
      # half-built linux artifact set).
      - name: Upload linux .AppImage (required)
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-linux-${{ matrix.arch }}-appimage
          path: ${{ inputs.output-dir }}/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload linux .deb (optional)
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-linux-${{ matrix.arch }}-deb
          path: ${{ inputs.output-dir }}/*.deb
          if-no-files-found: ignore
          retention-days: 7

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.windows-archs-json != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.windows-archs-json) }}
    steps:
      - name: Checkout at release SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          submodules: ${{ inputs.submodules && 'recursive' || '' }}

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Enable corepack (yarn)
        if: steps.pm.outputs.pm == 'yarn'
        shell: bash
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}

      - name: Install deps
        shell: bash
        run: ${{ steps.pm.outputs.install }}

      - name: Provision fetch-deps on PATH
        # See build-mac for rationale. The .cmd shim is what actually makes
        # the bare `fetch-deps` in the consumer's npm build script resolve
        # under Windows cmd.exe.
        shell: bash
        run: |
          dir="$RUNNER_TEMP/release-bin"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/fetch-deps" \
            "https://raw.githubusercontent.com/arthur-debert/release/main/bin/fetch-deps"
          chmod +x "$dir/fetch-deps"
          printf '@python "%%~dp0fetch-deps" %%*\r\n' > "$dir/fetch-deps.cmd"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Build (electron-builder, win --${{ matrix.arch }})
        # Windows code-signing not yet integrated in this workflow. The
        # produced binary is unsigned — flag this in release notes for
        # any consumer enabling windows-archs.
        run: |
          # Prefer canonical bin/build (release-sync managed); fall
          # back to direct `<pm> run build` for consumers pre-adoption.
          if [ -x "${GITHUB_WORKSPACE}/bin/build" ]; then
            "${GITHUB_WORKSPACE}/bin/build" -- --win --${{ matrix.arch }} --publish never
          else
            ${{ steps.pm.outputs.pm }} run build --win --${{ matrix.arch }} --publish never
          fi
        shell: bash

      - name: Derive app name
        id: app-name
        shell: bash
        run: echo "name=$(jq -r '.build.productName // .name' package.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke test (windows)
        if: hashFiles('app-bin/smoke-hook.sh') != ''
        shell: bash
        env:
          PLATFORM: windows
          ARCH: ${{ matrix.arch }}
          PACKAGE_DIR: ${{ inputs.output-dir }}
          APP_NAME: ${{ steps.app-name.outputs.name }}
        run: bash app-bin/smoke-hook.sh

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-win-${{ matrix.arch }}
          path: |
            ${{ inputs.output-dir }}/*.exe
            ${{ inputs.output-dir }}/*.exe.blockmap
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # 3. Release: collect every build's artifacts, create the GH release.
  # -------------------------------------------------------------------
  release:
    needs: [prepare, build-mac, build-linux, build-windows]
    if: |
      always()
      && needs.prepare.result == 'success'
      && (needs.build-mac.result == 'success' || needs.build-mac.result == 'skipped')
      && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped')
      && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at release SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected
          # actions/download-artifact@v4 with `pattern` collects matching
          # artifact names into subdirs under `path`. We flatten in the
          # release step below.
          pattern: electron-app-*
          merge-multiple: true

      - name: List collected artifacts
        run: |
          echo "=== collected artifacts ==="
          ls -la collected/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          # Resume-on-existing-release: if the release already exists for
          # this tag, edit it (uploads new assets); else create it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading additional assets."
            gh release upload "$TAG" collected/* --clobber
          else
            gh release create "$TAG" \
              $prerelease_flag \
              --title "$TAG" \
              --notes-file release-notes.md \
              collected/*
          fi

  # -------------------------------------------------------------------
  # 4. Notify downstreams. Fires repository_dispatch upstream-released
  #    so any cascade-handler consumers react.
  # -------------------------------------------------------------------
  notify-downstreams:
    needs: [prepare, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: No-op placeholder
        # Per-consumer downstream lists are repo-specific (each consumer
        # has its own `notify-downstreams` step in its release.yml that
        # knows its direct consumers). The reusable workflow does NOT
        # emit dispatches — that step lives in the caller, AFTER it calls
        # this reusable workflow. Keeping this job as a future placeholder
        # for a centralized notify mechanism if/when we add one.
        run: echo "Release ${{ needs.prepare.outputs.version }} complete. Caller's own release.yml fires its notify-downstreams step (if any) after this workflow returns."
