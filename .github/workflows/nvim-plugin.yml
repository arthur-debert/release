name: Neovim plugin release

# Reusable release workflow for Neovim plugins. Consumers call this
# from their own .github/workflows/release.yml as a thin caller pinned
# to @v1. See README §Stack matrix row "nvim-plugin" and tracking
# issue #46.
#
# What's distinct about this stack
# --------------------------------
# - No package index. Plugin managers (lazy.nvim, vim-plug, packer,
#   rocks.nvim, …) consume the plugin **directly from git tags**.
#   The tag IS the release.
# - No manifest version. Neovim plugins typically don't carry a
#   version field anywhere — the source tree at a tag is the unit
#   of distribution. (rockspec-based plugins exist but they're the
#   minority; a future slice can add optional rockspec publish.)
# - No build step. Plugins ship as Lua / Vimscript source.
#
# What it does
# ------------
# 1. prepare — validate semver, sanity-check this is a Neovim plugin
#    (looks for `lua/` or `plugin/` directory at the configured
#    root), roll Keep-a-Changelog `[Unreleased]` → `[X.Y.Z]` if
#    present, commit + tag + push.
# 2. release — create GH release with notes; prerelease flag when
#    semver carries a suffix.
#
# Smoke testing
# -------------
# Test infrastructure (busted, vusted, luacheck, stylua) lives in
# the separate `nvim-plugin-test.yml` workflow that gates PRs. We
# deliberately do NOT run tests in the release path: provisioning
# the lua toolchain on every release would be wasteful, and the
# PR-gate has already caught any regressions before main lands.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release (bare semver, e.g. 0.11.0 or 1.0.0-rc.1). No leading v.'
        type: string
        required: true
      changelog-path:
        description: 'Path to CHANGELOG.md (Keep-a-Changelog format with `## [Unreleased]` section). Empty to skip changelog handling.'
        type: string
        required: false
        default: 'CHANGELOG.md'
      plugin-root:
        description: 'Path to the plugin root directory (where `lua/` and/or `plugin/` live). Use for monorepo layouts that nest the plugin under a subdir. Defaults to repo root.'
        type: string
        required: false
        default: '.'
      submodules:
        description: 'Pass `submodules: recursive` on checkout.'
        type: boolean
        required: false
        default: false
      version-file:
        description: |
          Optional path to a Lua file containing a
          `M.version = "X.Y.Z"` (or single-quoted) declaration the
          workflow should bump in sync with the tag. Common
          convention: `lua/<name>/init.lua`. Empty (default) =
          skip the bump — for plugins without a version constant.
          Pattern matched: `M\.version\s*=\s*["'][^"']+["']`.
          Consumers with a non-`M.version` convention should use
          `prep-script` instead.
        type: string
        required: false
        default: ''
      prep-script:
        description: |
          Optional path (relative to repo root) to a consumer-
          supplied prep script. Runs in the prepare job BEFORE
          the version-file bump, with NEW_VERSION + PLUGIN_ROOT
          in env. The script handles its own `git add`. Use for
          consumer-specific work the workflow doesn't cover:
          multiple version sources, submodule refreshes,
          upstream-dep pin syncs, code generation. arami-app +
          tauri-app stack support the same input — kept
          consistent across stacks.
        type: string
        required: false
        default: ''

    secrets:
      RELEASE_TOKEN:
        description: 'PAT with repo scope for default-branch push (bypasses ruleset). Falls back to GITHUB_TOKEN.'
        required: false

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------
  # 1. Prepare: validate, sanity-check plugin layout, roll changelog,
  #    tag + push.
  # -------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
      release-sha: ${{ steps.prep.outputs.release-sha }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: ${{ inputs.submodules && 'recursive' || '' }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Validate + detect resume
        id: prep
        shell: bash
        env:
          NEW_VERSION: ${{ inputs.version }}
          PLUGIN_ROOT: ${{ inputs.plugin-root }}
          CHANGELOG: ${{ inputs.changelog-path }}
          VERSION_FILE: ${{ inputs.version-file }}
          PREP_SCRIPT: ${{ inputs.prep-script }}
        run: |
          set -euo pipefail

          if ! [[ "${NEW_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH[-PRERELEASE] (got: ${NEW_VERSION})"
            exit 1
          fi

          IS_PRERELEASE=false
          if [[ "${NEW_VERSION}" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          # Sanity check — refuse to release a repo that doesn't look
          # like a Neovim plugin. The Neovim runtime path convention
          # is that EITHER `lua/<name>/init.lua` OR `plugin/*.vim`
          # (or `plugin/*.lua`) lives at the plugin root. Most modern
          # plugins have both, some have just one. We accept either.
          if [ ! -d "${PLUGIN_ROOT}/lua" ] && [ ! -d "${PLUGIN_ROOT}/plugin" ]; then
            echo "::error::plugin root ${PLUGIN_ROOT} has no lua/ or plugin/ directory. Is this a Neovim plugin?"
            exit 1
          fi

          TAG="v${NEW_VERSION}"
          git fetch --tags origin >/dev/null 2>&1 || true

          # Resume case: tag exists. No manifest to cross-check
          # against (nvim plugins don't carry a version field).
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "${TAG}")
            echo "tag ${TAG} already exists at ${TAG_SHA} — resuming"

            # Reconstruct release notes for the resume case. Branches:
            #  - fragment-dir + final release: CHANGELOG/<v>.md exists
            #    (cut happened on the tagged commit) → read it.
            #  - fragment-dir + prerelease: cut did NOT happen
            #    (prereleases concat live fragments) → re-concat now.
            #  - legacy single-file: extract from the file as before.
            if [ -z "${CHANGELOG:-}" ]; then
              echo "Release ${TAG}" > release-notes.md
            else
              CHANGELOG_DIR="$(dirname "${CHANGELOG}")/CHANGELOG"
              if [ -d "${CHANGELOG_DIR}" ]; then
                if [ -f "${CHANGELOG_DIR}/${NEW_VERSION}.md" ]; then
                  awk 'NR==1 && /^## / { next } NR==2 && /^$/ { next } { print }' \
                    "${CHANGELOG_DIR}/${NEW_VERSION}.md" > release-notes.md
                else
                  # Prerelease resume: fragments still live at unreleased-*.md.
                  mapfile -t fragments < <(LC_ALL=C ls "${CHANGELOG_DIR}"/unreleased-*.md 2>/dev/null || true)
                  if [ "${#fragments[@]}" -gt 0 ]; then
                    cat "${fragments[@]}" > release-notes.md
                  fi
                fi
              elif [ -f "${CHANGELOG}" ]; then
                if [ "${IS_PRERELEASE}" = "true" ]; then
                  awk '/^## \[Unreleased\]/{c=1;next} c&&/^## \[/{exit} c&&/\S/{print}' \
                    "${CHANGELOG}" > release-notes.md
                else
                  awk -v v="${NEW_VERSION}" '$0 ~ "^## \\[" v "\\]"{c=1;next} c&&/^## \[/{exit} c{print}' \
                    "${CHANGELOG}" > release-notes.md
                fi
              fi
              [ -s release-notes.md ] || echo "Release ${TAG}" > release-notes.md
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Optional consumer prep-script. Runs BEFORE the
            # version-file bump + CHANGELOG roll. Receives
            # NEW_VERSION + PLUGIN_ROOT via env (already exported
            # above). Script handles its own `git add`; the final
            # `git diff --cached --quiet` check below fails loudly
            # if nothing got staged across prep + version-file +
            # changelog combined.
            if [ -n "${PREP_SCRIPT:-}" ]; then
              if [ ! -f "${PREP_SCRIPT}" ]; then
                echo "::error::prep-script not found: ${PREP_SCRIPT}"
                exit 1
              fi
              echo "→ running consumer prep-script: ${PREP_SCRIPT}"
              bash "${PREP_SCRIPT}" "${NEW_VERSION}"
              # Defend against prep-scripts that mutate files but
              # forget to `git add` them. Unstaged mutations would
              # otherwise be silently dropped: the commit step only
              # sees staged content, so HEAD gets tagged without
              # the prep-script's changes. Fail loud here instead.
              if ! git diff --quiet; then
                echo "::error::prep-script mutated files but didn't \`git add\` them. Stage the modifications in the script (use \`git add\` after each mutation), or \`git stash\` them if intentionally out-of-release-scope."
                git diff --stat
                exit 1
              fi
            fi

            # Optional `M.version` bump. Most modern Lua nvim
            # plugins expose a version constant at
            # `lua/<name>/init.lua`:
            #     M.version = "X.Y.Z"
            # Match either quote style. Refuse to silently
            # no-op — if the input is set, the pattern MUST be
            # present (otherwise the consumer probably passed
            # the wrong path).
            if [ -n "${VERSION_FILE:-}" ]; then
              if [ ! -f "${VERSION_FILE}" ]; then
                echo "::error::version-file not found: ${VERSION_FILE}"
                exit 1
              fi
              # Both quote styles via \042 = " and \047 = ' in the
              # perl regex. `perl -0777 -ne` slurps the file as a
              # single record (not line-by-line) so the regex sees
              # the whole file. Line-by-line `perl -ne` would exit
              # on the first non-matching line — the pre-1.7.2
              # bug. `perl -s` passes $v=… as a perl-level
              # variable, sidestepping the shell-quoting puzzle of
              # embedding ${NEW_VERSION} inside a substitution
              # string.
              if ! perl -0777 -ne 'exit 0 if /M\.version\s*=\s*[\042\047][^\042\047]+[\042\047]/; exit 1' "${VERSION_FILE}"; then
                echo "::error::version-file ${VERSION_FILE} has no M.version declaration to bump"
                exit 1
              fi
              perl -s -i -pe 's/(M\.version\s*=\s*[\042\047])[^\042\047]+([\042\047])/${1}${v}${2}/' -- -v="${NEW_VERSION}" "${VERSION_FILE}"
              if ! perl -0777 -s -ne 'exit 0 if /M\.version\s*=\s*[\042\047]\Q${v}\E[\042\047]/; exit 1' -- -v="${NEW_VERSION}" "${VERSION_FILE}"; then
                echo "::error::M.version bump in ${VERSION_FILE} did not produce expected value"
                exit 1
              fi
              git add "${VERSION_FILE}"
            fi

            # Roll changelog + extract notes. Four branches (mirrors
            # gh-action.yml; kept inline because this workflow predates
            # the prepare-release-* composites and the nvim-plugin
            # stack has no manifest to bump alongside the changelog).
            #   1. CHANGELOG input empty → user opted out; write stub.
            #   2. Fragment-dir (per #201): CHANGELOG/ sibling dir exists
            #      → delegate to bin/changelog (cut + render). Fails
            #      loud if bin/changelog is missing.
            #   3. Single-file Keep-a-Changelog: extract from
            #      `## [Unreleased]` and roll into a versioned section.
            #   4. CHANGELOG specified but file missing → stub.
            if [ -z "${CHANGELOG:-}" ]; then
              echo "Release ${TAG}" > release-notes.md
            else
              CHANGELOG_DIR="$(dirname "${CHANGELOG}")/CHANGELOG"
              if [ -d "${CHANGELOG_DIR}" ]; then
                if [ ! -x bin/changelog ]; then
                  echo "::error::${CHANGELOG_DIR} exists (fragment-dir mode) but bin/changelog is missing or not executable."
                  echo "::error::Run 'release-sync' to pull bin/changelog* and vendor/semver-tool/ into this repo."
                  exit 1
                fi
                if [ "${IS_PRERELEASE}" != "true" ]; then
                  # bin/changelog walks up cwd for CHANGELOG/, so cd
                  # next to the changelog file first — otherwise on
                  # monorepos with multiple changelogs (root +
                  # per-package) the wrong CHANGELOG/ gets cut. Same
                  # pattern as scripts/roll-changelog.sh.
                  (
                    cd "$(dirname "${CHANGELOG}")"
                    bin/changelog new-version "${NEW_VERSION}"
                  )
                  awk 'NR==1 && /^## / { next } NR==2 && /^$/ { next } { print }' \
                    "${CHANGELOG_DIR}/${NEW_VERSION}.md" > release-notes.md
                  git add "${CHANGELOG}" "${CHANGELOG_DIR}/"
                else
                  # Prereleases don't cut — concat fragments. LC_ALL=C
                  # keeps order deterministic across BSD + GNU.
                  mapfile -t fragments < <(LC_ALL=C ls "${CHANGELOG_DIR}"/unreleased-*.md 2>/dev/null || true)
                  if [ "${#fragments[@]}" -gt 0 ]; then
                    cat "${fragments[@]}" > release-notes.md
                  else
                    echo "Release ${TAG}" > release-notes.md
                  fi
                fi
              elif [ -f "${CHANGELOG}" ]; then
                # Legacy single-file Keep-a-Changelog.
                awk '/^## \[Unreleased\]/{c=1;next} c&&/^## \[/{exit} c&&/\S/{print}' \
                  "${CHANGELOG}" > release-notes.md
                if [ "${IS_PRERELEASE}" != "true" ]; then
                  today=$(date -u +%F)
                  replacement="## [Unreleased]"$'\n\n'"## [${NEW_VERSION}] - ${today}"
                  awk -v repl="${replacement}" '
                    /^## \[Unreleased\]/ { print repl; next } { print }
                  ' "${CHANGELOG}" > "${CHANGELOG}.tmp"
                  mv "${CHANGELOG}.tmp" "${CHANGELOG}"
                  git add "${CHANGELOG}"
                fi
              else
                echo "Release ${TAG}" > release-notes.md
              fi
            fi
            [ -s release-notes.md ] || echo "Release ${TAG}" > release-notes.md

            # Commit any staged changes (rolled changelog +
            # version-file bump + prep-script mutations), then tag
            # HEAD. If NOTHING is staged the commit step is
            # skipped — bare-tag cuts (no version-file, no
            # changelog, no prep) are still supported for plugins
            # without a version constant.
            # Pre-commit gate — hold the bot commit to the consumer's
            # own gate. Equivalent to
            # .github/actions/run-precommit-gate@v1 (canonical
            # reference); inlined because this step is a single `run:`
            # block. Set SKIP_PRECOMMIT_GATE=true to bypass.
            if [ "${SKIP_PRECOMMIT_GATE:-false}" != "true" ]; then
              mapfile -t staged_arr < <(git diff --cached --name-only)
              if [ "${#staged_arr[@]}" -gt 0 ]; then
                if [ -f lefthook.yml ] || [ -f .lefthook.yml ] || [ -f lefthook.yaml ]; then
                  echo "Pre-commit gate: lefthook"
                  lefthook_file_args=()
                  for f in "${staged_arr[@]}"; do
                    lefthook_file_args+=(--file "$f")
                  done
                  if [ -f pnpm-lock.yaml ]; then
                    corepack enable >/dev/null 2>&1 || true
                    pnpm install --frozen-lockfile --ignore-scripts
                    pnpm exec lefthook run pre-commit "${lefthook_file_args[@]}"
                  elif [ -f package-lock.json ]; then
                    npm ci --ignore-scripts
                    npx --no-install lefthook run pre-commit "${lefthook_file_args[@]}"
                  elif [ -f yarn.lock ]; then
                    corepack enable >/dev/null 2>&1 || true
                    yarn install --frozen-lockfile --ignore-scripts
                    yarn exec lefthook run pre-commit "${lefthook_file_args[@]}"
                  elif command -v lefthook >/dev/null 2>&1; then
                    lefthook run pre-commit "${lefthook_file_args[@]}"
                  else
                    npx --yes lefthook run pre-commit "${lefthook_file_args[@]}"
                  fi
                elif [ -f .pre-commit-config.yaml ] || [ -f .pre-commit-config.yml ]; then
                  echo "Pre-commit gate: pre-commit framework"
                  if command -v pipx >/dev/null 2>&1; then
                    pipx run pre-commit run --files "${staged_arr[@]}"
                  else
                    python3 -m pip install --user --quiet pre-commit
                    "$(python3 -m site --user-base)/bin/pre-commit" run --files "${staged_arr[@]}"
                  fi
                elif [ -d .husky ] && [ -f .husky/pre-commit ]; then
                  echo "Pre-commit gate: husky"
                  bash .husky/pre-commit
                fi
                if ! git diff --quiet; then
                  echo "Pre-commit gate produced auto-fixes — re-staging."
                  git add -u
                fi
              fi
            fi

            if ! git diff --cached --quiet; then
              git commit -m "chore: Release ${TAG}"
            fi
            # Annotate the tag with the rolled release notes when
            # available (#201 addendum). Falls back to a plain
            # "Release vX.Y.Z" if release-notes.md is empty.
            if [ -s release-notes.md ]; then
              git tag -a "${TAG}" -F release-notes.md
            else
              git tag -a "${TAG}" -m "Release ${TAG}"
            fi
            git push origin HEAD
            git push origin "${TAG}"
            TAG_SHA=$(git rev-parse HEAD)
          fi

          {
            echo "version=${NEW_VERSION}"
            echo "prerelease=${IS_PRERELEASE}"
            echo "release-sha=${TAG_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # 2. Create the GitHub release. Prerelease flag is set when semver
  #    carries a suffix.
  # -------------------------------------------------------------------
  release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [ "${PRERELEASE}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — updating notes."
            gh release edit "${TAG}" --notes-file release-notes.md
          else
            gh release create "${TAG}" \
              ${prerelease_flag} \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi
