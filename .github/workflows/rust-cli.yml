name: Rust CLI release

# Reusable release workflow for rust-cli projects. Consumers call this from
# their own .github/workflows/release.yml with workflow_dispatch + version
# input. See docs/per-category/rust-cli.md for the full input shape and
# examples/rust-cli-minimal.yml for a paste-ready consumer workflow.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release (e.g. 0.18.0 or 1.0.0-rc.1)'
        type: string
        required: true

      crates:
        description: 'Comma-separated crate names in publish (topological dep) order. Last entry is the primary CLI crate by convention.'
        type: string
        required: true

      bin-name:
        description: 'Primary binary / brew formula name. Built from `cargo build -p <bin-name>`.'
        type: string
        required: true

      extra-binaries:
        description: 'Comma-separated additional binaries to build, sign, and ship as separate tarballs (NOT brew-formulated). E.g. "lexd-lsp" for lex.'
        type: string
        required: false
        default: ''

      darwin-archs:
        description: 'Comma-separated macOS archs (arm64 only by canonical; intel-mac dropped). Set "" to skip macOS.'
        type: string
        required: false
        default: 'arm64'

      linux-archs:
        description: 'Comma-separated gnu-linux archs.'
        type: string
        required: false
        default: 'x86_64,aarch64'

      linux-musl-archs:
        description: 'Comma-separated musl-linux archs (default empty; opt-in).'
        type: string
        required: false
        default: ''

      windows-archs:
        description: 'Comma-separated windows archs (default empty; opt-in).'
        type: string
        required: false
        default: ''

      brew:
        description: 'Render and push Homebrew formula to tap.'
        type: boolean
        required: false
        default: true

      apt:
        description: 'Build .deb packages for linux targets via cargo-deb.'
        type: boolean
        required: false
        default: true

      brew-tap:
        description: 'Tap repo to push the formula to (owner/repo).'
        type: string
        required: false
        default: 'arthur-debert/homebrew-tools'

      submodules:
        description: 'Pass --recurse-submodules on checkout (lex needs this; most projects do not).'
        type: boolean
        required: false
        default: false

      changelog-path:
        description: 'Path to CHANGELOG.md (Keep-a-Changelog format).'
        type: string
        required: false
        default: 'CHANGELOG.md'

      wasm-package:
        description: 'Workspace member with a wasm-bindgen crate to build via wasm-pack and publish to npm. Empty = no WASM build (default).'
        type: string
        required: false
        default: ''

      wasm-pack-target:
        description: 'wasm-pack --target value: bundler|web|nodejs|no-modules. Only consulted when wasm-package is set.'
        type: string
        required: false
        default: 'bundler'

      wasm-npm-scope:
        description: 'npm org scope (publishes as @<scope>/<wasm-package>). Empty = unscoped publish. Only consulted when wasm-package is set.'
        type: string
        required: false
        default: ''

    secrets:
      RELEASE_TOKEN:
        description: 'PAT with repo scope for default-branch push (bypasses ruleset).'
        required: false
      APPLE_CERTIFICATE_P12_BASE64:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      ASC_API_KEY_BASE64:
        required: false
      ASC_API_KEY_ID:
        required: false
      ASC_API_ISSUER_ID:
        required: false
      CRATES_IO_KEY:
        required: false
      HOMEBREW_TAP_TOKEN:
        required: false
      NPM_TOKEN:
        description: 'npm publish token. Only required when wasm-package is set.'
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build matrix from arch inputs
        id: build
        env:
          DARWIN_ARCHS: ${{ inputs.darwin-archs }}
          LINUX_ARCHS: ${{ inputs.linux-archs }}
          LINUX_MUSL_ARCHS: ${{ inputs.linux-musl-archs }}
          WINDOWS_ARCHS: ${{ inputs.windows-archs }}
        run: |
          set -euo pipefail
          entries='[]'

          add() {
            local target=$1 os=$2 sign=$3 deb_arch=$4 ext_archive=$5 ext_bin=$6 linux_aarch64=$7 musl=$8
            entries=$(echo "$entries" | jq \
              --arg t "$target" --arg o "$os" \
              --argjson s "$sign" --arg d "$deb_arch" \
              --arg ea "$ext_archive" --arg eb "$ext_bin" \
              --argjson la "$linux_aarch64" --argjson m "$musl" \
              '. + [{
                target: $t, os: $o, sign: $s, deb_arch: $d,
                ext_archive: $ea, ext_bin: $eb,
                linux_aarch64_gnu: $la, musl: $m
              }]')
          }

          for arch in $(echo "${DARWIN_ARCHS}" | tr ',' ' '); do
            case "$arch" in
              arm64|aarch64) add "aarch64-apple-darwin" "macos-14" true ""    "tar.gz" "" false false ;;
              x86_64)        add "x86_64-apple-darwin"  "macos-13" true ""    "tar.gz" "" false false ;;
              "") ;;
              *) echo "::error::unknown darwin arch: $arch"; exit 1 ;;
            esac
          done

          for arch in $(echo "${LINUX_ARCHS}" | tr ',' ' '); do
            case "$arch" in
              x86_64)  add "x86_64-unknown-linux-gnu"  "ubuntu-latest" false "amd64" "tar.gz" "" false false ;;
              aarch64) add "aarch64-unknown-linux-gnu" "ubuntu-latest" false "arm64" "tar.gz" "" true  false ;;
              "") ;;
              *) echo "::error::unknown linux arch: $arch"; exit 1 ;;
            esac
          done

          for arch in $(echo "${LINUX_MUSL_ARCHS}" | tr ',' ' '); do
            case "$arch" in
              x86_64)  add "x86_64-unknown-linux-musl"  "ubuntu-latest" false "" "tar.gz" "" false true ;;
              aarch64) add "aarch64-unknown-linux-musl" "ubuntu-latest" false "" "tar.gz" "" false true ;;
              "") ;;
              *) echo "::error::unknown musl arch: $arch"; exit 1 ;;
            esac
          done

          for arch in $(echo "${WINDOWS_ARCHS}" | tr ',' ' '); do
            case "$arch" in
              x86_64) add "x86_64-pc-windows-msvc" "windows-latest" false "" "zip" ".exe" false false ;;
              "") ;;
              *) echo "::error::unknown windows arch: $arch"; exit 1 ;;
            esac
          done

          # GITHUB_OUTPUT requires single-line key=value (or heredoc); compact
          # the JSON so jq's pretty-print doesn't break the output writer.
          compact=$(echo "$entries" | jq -c .)
          echo "matrix=$compact" >> "$GITHUB_OUTPUT"
          echo "Computed matrix:"
          echo "$entries" | jq .

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
      release-sha: ${{ steps.prep.outputs.release-sha }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: ${{ inputs.submodules }}
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: arthur-debert/release/.github/actions/setup-rust@v1

      - uses: arthur-debert/release/.github/actions/prepare-release@v1
        id: prep
        with:
          version: ${{ inputs.version }}
          changelog-path: ${{ inputs.changelog-path }}

  create-release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Download release notes from prepare job
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    needs: [prepare, create-release, setup-matrix]
    if: always() && !failure() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          submodules: ${{ inputs.submodules }}

      - name: Set up linux aarch64 cross compiler (apt)
        if: matrix.linux_aarch64_gnu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Set up musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: arthur-debert/release/.github/actions/setup-rust@v1
        with:
          targets: ${{ matrix.target }}

      - name: Build binaries
        shell: bash
        env:
          BIN_NAME: ${{ inputs.bin-name }}
          EXTRA: ${{ inputs.extra-binaries }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BINS="$BIN_NAME"
          if [ -n "$EXTRA" ]; then
            BINS="$BINS,$EXTRA"
          fi
          IFS=',' read -ra LIST <<< "$BINS"
          for bin in "${LIST[@]}"; do
            bin=$(echo "$bin" | xargs)
            echo "→ building $bin for $TARGET"
            cargo build --release --target "$TARGET" -p "$bin"
          done

      - name: Sign macOS binaries
        id: sign
        if: matrix.sign
        uses: arthur-debert/release/.github/actions/sign-mac@v1
        with:
          cert-p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          cert-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          paths: |
            ${{ format('target/{0}/release/{1}', matrix.target, inputs.bin-name) }}

      - name: Sign extra macOS binaries
        if: matrix.sign && inputs.extra-binaries != '' && steps.sign.outputs.signed == 'true'
        shell: bash
        env:
          EXTRA: ${{ inputs.extra-binaries }}
          TARGET: ${{ matrix.target }}
          IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          set -euo pipefail
          IFS=',' read -ra LIST <<< "$EXTRA"
          for bin in "${LIST[@]}"; do
            bin=$(echo "$bin" | xargs)
            path="target/$TARGET/release/$bin"
            echo "→ signing $path"
            codesign --force --sign "$IDENTITY" --options runtime --timestamp "$path"
            codesign --verify --strict "$path"
          done

      - name: Notarize signed binaries
        if: matrix.sign && steps.sign.outputs.signed == 'true'
        shell: bash
        env:
          BIN_NAME: ${{ inputs.bin-name }}
          EXTRA: ${{ inputs.extra-binaries }}
          TARGET: ${{ matrix.target }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_BASE64" ]; then
            echo "::warning::No ASC API key — skipping notarization."
            exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_BASE64" | base64 --decode > "$KEY"

          BINS="$BIN_NAME"
          [ -n "$EXTRA" ] && BINS="$BINS,$EXTRA"

          IFS=',' read -ra LIST <<< "$BINS"
          for bin in "${LIST[@]}"; do
            bin=$(echo "$bin" | xargs)
            cd "target/$TARGET/release"
            zip "$bin-notarize.zip" "$bin"
            echo "→ submitting $bin for notarization"
            R=$(xcrun notarytool submit "$bin-notarize.zip" \
              --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
              --output-format json --no-wait)
            ID=$(echo "$R" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            echo "  submission $ID; polling..."
            for i in $(seq 1 120); do
              S=$(xcrun notarytool info "$ID" \
                --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
                --output-format json 2>&1 | python3 -c \
                "import sys,json; print(json.load(sys.stdin).get('status','Unknown'))" 2>/dev/null \
                || echo Unknown)
              echo "  [$i/120] $S"
              [ "$S" = "Accepted" ] && break
              if [ "$S" = "Invalid" ] || [ "$S" = "Rejected" ]; then
                xcrun notarytool log "$ID" --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" 2>&1 || true
                exit 1
              fi
              sleep 30
            done
            rm "$bin-notarize.zip"
            cd - >/dev/null
          done
          rm -f "$KEY"

      - name: Package binaries (canonical subdir layout)
        shell: bash
        env:
          BIN_NAME: ${{ inputs.bin-name }}
          EXTRA: ${{ inputs.extra-binaries }}
          TARGET: ${{ matrix.target }}
          EXT_ARCHIVE: ${{ matrix.ext_archive }}
          EXT_BIN: ${{ matrix.ext_bin }}
        run: |
          set -euo pipefail
          BINS="$BIN_NAME"
          [ -n "$EXTRA" ] && BINS="$BINS,$EXTRA"
          mkdir -p dist
          IFS=',' read -ra LIST <<< "$BINS"
          for bin in "${LIST[@]}"; do
            bin=$(echo "$bin" | xargs)
            artifact="${bin}-${TARGET}"
            mkdir -p "dist/$artifact"
            cp "target/$TARGET/release/${bin}${EXT_BIN}" "dist/$artifact/"
            for doc in README.md CHANGELOG.md LICENSE; do
              [ -f "$doc" ] && cp "$doc" "dist/$artifact/" || true
            done
            cd dist
            if [ "$EXT_ARCHIVE" = "zip" ]; then
              if command -v 7z >/dev/null 2>&1; then
                7z a "../${artifact}.${EXT_ARCHIVE}" "$artifact" >/dev/null
              else
                zip -r "../${artifact}.${EXT_ARCHIVE}" "$artifact" >/dev/null
              fi
            else
              tar -czf "../${artifact}.${EXT_ARCHIVE}" "$artifact"
            fi
            cd - >/dev/null
            echo "✓ packaged ${artifact}.${EXT_ARCHIVE}"
          done

      - name: Upload binaries to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIN_NAME: ${{ inputs.bin-name }}
          EXTRA: ${{ inputs.extra-binaries }}
          TARGET: ${{ matrix.target }}
          EXT_ARCHIVE: ${{ matrix.ext_archive }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          BINS="$BIN_NAME"
          [ -n "$EXTRA" ] && BINS="$BINS,$EXTRA"
          IFS=',' read -ra LIST <<< "$BINS"
          for bin in "${LIST[@]}"; do
            bin=$(echo "$bin" | xargs)
            artifact="${bin}-${TARGET}.${EXT_ARCHIVE}"
            gh release upload "v$VERSION" "$artifact" --clobber
          done

      - name: Upload binaries as workflow artifacts (for brew job)
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build .deb
        if: matrix.deb_arch != '' && inputs.apt
        id: deb
        uses: arthur-debert/release/.github/actions/build-deb@v1
        with:
          package: ${{ inputs.bin-name }}
          target: ${{ matrix.target }}

      - name: Upload .deb
        if: matrix.deb_arch != '' && inputs.apt && steps.deb.outputs.deb-path != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DEB: ${{ steps.deb.outputs.deb-path }}
        run: gh release upload "v$VERSION" "$DEB" --clobber

  publish-crates:
    needs: [prepare, create-release]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          submodules: ${{ inputs.submodules }}

      - uses: arthur-debert/release/.github/actions/setup-rust@v1

      - uses: arthur-debert/release/.github/actions/publish-crate@v1
        with:
          crates: ${{ inputs.crates }}
          token: ${{ secrets.CRATES_IO_KEY }}

  homebrew-formula:
    needs: [prepare, build-binaries]
    if: always() && !failure() && !cancelled() && inputs.brew
    runs-on: ubuntu-latest
    steps:
      - name: Check tap token
        id: guard
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not configured — skipping formula push."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          submodules: ${{ inputs.submodules }}

      - uses: arthur-debert/release/.github/actions/setup-rust@v1
        if: steps.guard.outputs.skip != 'true'

      - name: Download tarballs
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          merge-multiple: true

      - name: Compute URLs, SHAs, project metadata
        if: steps.guard.outputs.skip != 'true'
        id: values
        env:
          BIN_NAME: ${{ inputs.bin-name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # cargo metadata for DESC/LICENSE/HOMEPAGE — use the brew-formula
          # subject crate (== bin-name by convention).
          PKG=$(cargo metadata --no-deps --format-version=1 \
            | jq -cer --arg n "$BIN_NAME" '.packages[] | select(.name == $n)')
          DESC=$(echo     "$PKG" | jq -r '.description // ""')
          LICENSE=$(echo  "$PKG" | jq -r '.license // ""')
          HOMEPAGE=$(echo "$PKG" | jq -r '.homepage // .repository // ""')
          for k in DESC LICENSE HOMEPAGE; do
            v=$(eval echo "\$$k")
            [ -n "$v" ] || { echo "::error::Missing $k for crate $BIN_NAME — set it in Cargo.toml"; exit 1; }
          done
          echo "desc<<EOF" >> "$GITHUB_OUTPUT"; echo "$DESC" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          echo "license=$LICENSE" >> "$GITHUB_OUTPUT"
          echo "homepage=$HOMEPAGE" >> "$GITHUB_OUTPUT"

          # URLs and SHAs for every tarball matching <bin>-<target>.<ext>.
          # Brew template only uses the canonical 4 (mac arm64 + linux gnu),
          # but we emit all present for forward compatibility.
          URL_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${BIN_NAME}"
          urls='{}'
          shas='{}'
          for f in "${BIN_NAME}"-*.tar.gz "${BIN_NAME}"-*.zip; do
            [ -f "$f" ] || continue
            base="${f#"${BIN_NAME}"-}"
            # Determine extension by suffix match — `${f##*.}` returns only
            # the last segment ("gz" for "foo.tar.gz"), which would put
            # `.gz` in the rendered URL.
            if [[ "$base" == *.tar.gz ]]; then
              triple="${base%.tar.gz}"
              ext="tar.gz"
            elif [[ "$base" == *.zip ]]; then
              triple="${base%.zip}"
              ext="zip"
            else
              continue
            fi
            key=$(echo "$triple" | tr 'a-z-' 'A-Z_')
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            urls=$(echo "$urls" | jq --arg k "$key" --arg v "${URL_BASE}-${triple}.${ext}" '. + {($k): $v}')
            shas=$(echo "$shas" | jq --arg k "$key" --arg v "$sha" '. + {($k): $v}')
          done
          echo "urls<<EOF" >> "$GITHUB_OUTPUT"; echo "$urls" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          echo "shas<<EOF" >> "$GITHUB_OUTPUT"; echo "$shas" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: arthur-debert/release/.github/actions/render-brew-formula@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          bin-name: ${{ inputs.bin-name }}
          version: ${{ needs.prepare.outputs.version }}
          desc: ${{ steps.values.outputs.desc }}
          license: ${{ steps.values.outputs.license }}
          homepage: ${{ steps.values.outputs.homepage }}
          urls-json: ${{ steps.values.outputs.urls }}
          shas-json: ${{ steps.values.outputs.shas }}
          output-path: out/${{ inputs.bin-name }}.rb

      - uses: arthur-debert/release/.github/actions/push-brew-tap@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          tap-repo: ${{ inputs.brew-tap }}
          tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          formula-name: ${{ inputs.bin-name }}
          formula-path: out/${{ inputs.bin-name }}.rb
          version: ${{ needs.prepare.outputs.version }}

  build-wasm:
    # Build a wasm-bindgen workspace member via wasm-pack and attach the
    # tarball to the GH release alongside native binaries. Downstream
    # publish-npm pulls the same artifact instead of rebuilding.
    needs: [prepare, create-release]
    if: always() && !failure() && !cancelled() && inputs.wasm-package != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          submodules: ${{ inputs.submodules }}

      - uses: arthur-debert/release/.github/actions/setup-rust@v1
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build wasm package
        id: build
        shell: bash
        env:
          WASM_PACKAGE: ${{ inputs.wasm-package }}
          WASM_TARGET: ${{ inputs.wasm-pack-target }}
          WASM_SCOPE: ${{ inputs.wasm-npm-scope }}
          TAG_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # Locate the workspace member's directory via cargo metadata so the
          # consumer doesn't have to encode `crates/<name>/` in the input.
          crate_path=$(cargo metadata --no-deps --format-version=1 \
            | jq -er --arg n "$WASM_PACKAGE" \
                '.packages[] | select(.name == $n) | .manifest_path' \
            | xargs dirname)
          echo "crate-path=$crate_path" >> "$GITHUB_OUTPUT"

          # Scope is optional. wasm-pack rewrites package.json's name to
          # @<scope>/<name> when --scope is passed; when unset, npm publishes
          # the bare crate name.
          scope_flag=()
          [ -n "$WASM_SCOPE" ] && scope_flag=(--scope "$WASM_SCOPE")

          wasm-pack build "$crate_path" \
            --target "$WASM_TARGET" \
            --out-dir pkg \
            "${scope_flag[@]}"

          # Paranoia guard: prepare just bumped Cargo.toml to TAG_VERSION,
          # wasm-pack reads that, so package.json should match. If it
          # doesn't, something upstream is wrong — fail loudly now rather
          # than push a mismatched npm version.
          pkg_version=$(jq -r .version "$crate_path/pkg/package.json")
          if [ "$TAG_VERSION" != "$pkg_version" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match wasm-pack package.json version ($pkg_version)"
            exit 1
          fi

          # Tar the pkg/ dir as the GH release asset. Name mirrors native
          # binary naming (no version in filename — version is in the tag).
          tar -czf "${WASM_PACKAGE}-wasm.tar.gz" -C "$crate_path" pkg

      - name: Upload wasm tarball to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          WASM_PACKAGE: ${{ inputs.wasm-package }}
        run: |
          gh release upload "v$VERSION" "${WASM_PACKAGE}-wasm.tar.gz" --clobber

      - name: Upload wasm pkg as workflow artifact (consumed by publish-npm)
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: ${{ steps.build.outputs.crate-path }}/pkg/
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    # Publish the wasm-pack output to npm. Pulls the prebuilt pkg/ from
    # the build-wasm artifact rather than reinstalling Rust + recompiling.
    needs: [prepare, build-wasm]
    if: always() && !failure() && !cancelled() && inputs.wasm-package != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check npm token
        id: guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN not configured — skipping npm publish. The wasm tarball is still attached to the GH release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download wasm pkg
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg

      - name: Publish to npm
        if: steps.guard.outputs.skip != 'true'
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
