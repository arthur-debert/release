name: pip-bootstrap smoke

# End-to-end smoke proof for the pip-install bootstrap PoC (ADR-0003).
# Proves the WHOLE chain inside
# release's own repo, no consumer:
#
#   build wheel -> pip install into a fresh venv -> console-scripts on PATH ->
#   `release-core init` (DEFAULT full materialize + auto-commit, AND the
#   `--config-only` escape hatch) in a throwaway fixture repo -> re-run is
#   idempotent.
#
# A green run here IS the PoC's definition of done. This workflow is a normal PR
# check; it is deliberately NOT in the branch-protection ruleset (a path-/event-
# scoped check that doesn't always run would deadlock merges — see release#418).

# PR-time only (+ manual): the smoke is a per-PR proof. Triggering on push too
# would double-run it on in-repo PR branches for no added coverage.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PKG_DIR: templates/commons/lib/release_core
    steps:
      - name: Checkout (full clone — the OVERRIDE path composes from this checkout)
        uses: actions/checkout@v6
        with:
          # The default `release-core init` path needs NO checkout (it composes
          # from the wheel-bundled templates). But the OVERRIDE-path step below
          # ($RELEASE_HOME=this checkout) drives the release-sync engine, which
          # reads git objects (git ls-tree / cat-file / show) at $RELEASE_REF —
          # so it needs real history, not a shallow clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install yq (mikefarah v4 — pinned)
        # release_core.yamlio shells out to `yq` to compose the lefthook.yml
        # fragment merge; it is not bundled on ubuntu-latest. Pin an explicit v4
        # release (NOT releases/latest) — same pin as release-sync-tests.yml — so
        # a future v5 "latest" can't change serialization and turn this into
        # spurious churn.
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Build the release_core wheel
        # `build` is CI-only tooling — release_core's runtime deps stay empty
        # (stdlib-only). This is the same build invocation PR-D's publish job
        # uses (python -m build --wheel <pkg>).
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --wheel "${PKG_DIR}"
          # nullglob: an unmatched glob must expand to NOTHING (empty array), not
          # to the literal pattern — otherwise a zero-wheel build would yield a
          # length-1 array and slip past the count check below.
          shopt -s nullglob
          wheels=("${PKG_DIR}"/dist/release_core-*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly 1 wheel, found ${#wheels[@]}: ${wheels[*]:-<none>}" >&2
            exit 1
          fi
          echo "WHEEL=${wheels[0]}" >> "$GITHUB_ENV"
          # Print the built wheel size so we can watch bundle bloat over time
          # (#476 part 1 grows the wheel from the config subset to the full tree
          # + the distributed skills).
          echo "wheel size: $(wc -c < "${wheels[0]}") bytes ($(du -h "${wheels[0]}" | cut -f1))"

      - name: Assert the wheel BUNDLES the config templates (self-contained)
        # The self-contained wheel ships the config templates under
        # release_core/_bundled_templates/ so `release-core init` composes the
        # gate offline (no release clone). Prove the build hook (hatch_build.py)
        # actually staged them INTO the wheel — without this, init silently falls
        # back to the $RELEASE_HOME path and the "self-contained" claim is a lie.
        # Assert the whole documented commons config subset + at least one kind
        # manifest + the base/commons lefthook fragments are present.
        run: |
          set -euo pipefail
          names="$(python - "$WHEEL" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              print("\n".join(z.namelist()))
          PY
          )"
          require() {
            if ! printf '%s\n' "$names" | grep -qxF "release_core/_bundled_templates/templates/$1"; then
              echo "ERROR: wheel is missing bundled template: $1" >&2
              exit 1
            fi
            echo "ok bundled: $1"
          }
          for f in .markdownlint.json .markdownlintignore .yamllint .shellcheckrc \
                   .editorconfig .prettierignore lefthook.fragment.yaml; do
            require "commons/$f"
          done
          require "components/_lefthook-base.yaml"
          require "go-cli/manifest.yaml"

      - name: Assert the wheel BUNDLES the FULL tree + the distributed skills (#476)
        # Part 1 of #476: the wheel must carry the WHOLE managed tree (not just
        # the config subset) plus the distributed skill catalog, so a later
        # `init` can do a full OFFLINE materialize. These assertions are positive
        # (full-tree content present) AND negative (release-only skills + the
        # self-referential package subtree are NOT shipped — recursion/bloat
        # guard). Inspect via zipfile so we read the wheel exactly as installed.
        run: |
          set -euo pipefail
          names="$(python - "$WHEEL" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              print("\n".join(z.namelist()))
          PY
          )"
          B='release_core/_bundled_templates'
          present() {
            if ! printf '%s\n' "$names" | grep -qxF "$B/$1"; then
              echo "ERROR: wheel is MISSING bundled path: $1" >&2
              exit 1
            fi
            echo "ok present: $1"
          }
          absent() {
            # prefix match: any entry under the path is a failure
            if printf '%s\n' "$names" | grep -qE "^$(printf '%s' "$B/$1" | sed 's/[.[\*^$]/\\&/g')(/|$)"; then
              echo "ERROR: wheel UNEXPECTEDLY contains: $1" >&2
              printf '%s\n' "$names" | grep -E "^$B/$1" >&2
              exit 1
            fi
            echo "ok absent: $1"
          }
          # commons/ carries MORE than configs: bin/ content (ORIENTATION.md was
          # retired in WS2 #523 — orientation is `release-core how-to`).
          present "templates/commons/bin/install-release-core"
          # at least one per-kind dir with more than the fragment/manifest:
          # rust-cli ships its bin/ build tooling + .github content.
          present "templates/rust-cli/bin/build"
          present "templates/rust-cli/.github/workflows/copilot-review.yml"
          # distributed skills: WS2 (#523) trimmed PUSH_ALL to the two the harness
          # needs a file on disk for — the bundle ships exactly those.
          present "skills/gh-pr-review-loop/SKILL.md"
          present "skills/release-issue-relay/SKILL.md"
          # NEGATIVE: release-only skills must NOT ship to consumers.
          absent "skills/release-fleet-ops"
          # NEGATIVE: dev-cycle skills dropped in WS2 are no longer bundled.
          absent "skills/tdd"
          # NEGATIVE: render-side material (Homebrew formula template, consumed
          # at release-cut, not a managed Kind) must NOT ship.
          absent "templates/render"
          # NEGATIVE: the package subtree must NOT be copied into itself
          # (recursion/bloat guard). commons/lib/release_core IS this package.
          absent "templates/commons/lib/release_core"

      - name: pip install the wheel into a FRESH venv
        # A clean venv proves the tools arrive purely from the install, not from
        # the workspace sys.path. The venv's bin/ is prepended to PATH for the
        # remaining steps so the console-scripts resolve by bare name.
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --upgrade pip >/dev/null
          "${RUNNER_TEMP}/venv/bin/pip" install "${WHEEL}"
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"

      - name: Assert console-scripts are on PATH and respond to --help
        # The §1 invariant: the verbs ship as console-scripts. Assert exit 0 +
        # non-empty output for the per-verb scripts and the top-level CLI.
        run: |
          set -euo pipefail
          # The surviving consumer-facing console-scripts + the top-level CLI.
          # The maintainer/fleet flat names were retired in the CLI cutover
          # (#468) — they are reachable only via `release-core <group> <cmd>`,
          # smoke-tested as a subcommand below. release-sync / release-drift-check
          # were removed in WS4 (#521): `.release/` is composed by `release-core
          # init`, so the drift/sync subsystem is gone.
          for cmd in changelog detect-kind release-core; do
            path="$(command -v "$cmd")"
            case "$path" in
              "${RUNNER_TEMP}/venv/bin/"*) : ;;
              *) echo "ERROR: $cmd resolved to '$path', not the fresh venv" >&2; exit 1 ;;
            esac
            # Capture stdout AND stderr: the verbs follow their bin/ shims, some
            # of which print --help usage to stderr. The §4 bar is exit 0 +
            # non-empty help, regardless of stream.
            if ! out="$("$cmd" --help 2>&1)"; then
              echo "ERROR: '$cmd --help' exited non-zero" >&2
              printf '%s\n' "$out" >&2
              exit 1
            fi
            if [ -z "$out" ]; then
              echo "ERROR: '$cmd --help' produced no output" >&2
              exit 1
            fi
            echo "ok: $cmd --help -> $(printf '%s' "$out" | head -n1)"
          done
          # A retired flat name is now a CLI subcommand: assert the cut verb is
          # reachable as `release-core cut --help` (its usage prints to stderr
          # with a non-zero verb-convention exit, so capture both streams and
          # only require non-empty output).
          cut_help="$(release-core cut --help 2>&1 || true)"
          if [ -z "$cut_help" ]; then
            echo "ERROR: 'release-core cut --help' produced no output" >&2
            exit 1
          fi
          echo "ok: release-core cut --help -> $(printf '%s' "$cut_help" | head -n1)"

      - name: Create a Kind-detectable throwaway fixture repo
        # `release-core init` detects the target repo's Kind (manifest.detect_kind)
        # and refuses an undetectable repo. A lone go.mod is the minimal signal
        # for the go-cli Kind — no toolchain needed, just the marker file.
        run: |
          set -euo pipefail
          fixture="${RUNNER_TEMP}/fixture"
          rm -rf "$fixture"
          mkdir -p "$fixture"
          git -C "$fixture" init -q
          git -C "$fixture" config user.email smoke@example.com
          git -C "$fixture" config user.name 'pip-bootstrap smoke'
          printf 'module example.com/smoke\n\ngo 1.22\n' > "$fixture/go.mod"
          git -C "$fixture" add -A
          git -C "$fixture" commit -qm 'fixture: go-cli marker'
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          echo "detected kind:"
          ( cd "$fixture" && detect-kind )

      - name: Read the documented CONFIG_FILES set from verbs/init.py
        # Source of truth for what `init` must materialize is the CONFIG_FILES
        # tuple in verbs/init.py — read it programmatically so this smoke can
        # never assert a divergent hardcoded list. The wheel is already
        # installed, so import it straight from the venv.
        run: |
          set -euo pipefail
          python - <<'PY' > "${RUNNER_TEMP}/config_files.txt"
          from release_core.verbs.init import CONFIG_FILES
          print("\n".join(CONFIG_FILES))
          PY
          echo "documented CONFIG_FILES:"
          cat "${RUNNER_TEMP}/config_files.txt"

      - name: release-core init --config-only OFFLINE — compose from the wheel
        # The config-subset escape hatch (post-#476): `init --config-only`
        # composes ONLY the gate + lint configs from the templates BUNDLED in the
        # wheel — NO release clone, NO network. RELEASE_HOME is explicitly unset
        # so a leaked env can't mask a broken bundle by silently falling back to
        # the git engine. (The DEFAULT full materialize is smoke-tested in its own
        # step below.)
        run: |
          set -euo pipefail
          unset RELEASE_HOME RELEASE_REF
          off="${RUNNER_TEMP}/fixture-offline"
          rm -rf "$off"; mkdir -p "$off"
          git -C "$off" init -q
          git -C "$off" config user.email smoke@example.com
          git -C "$off" config user.name 'pip-bootstrap smoke'
          printf 'module example.com/offline\n\ngo 1.22\n' > "$off/go.mod"
          git -C "$off" add -A
          git -C "$off" commit -qm 'fixture: go-cli marker'
          cd "$off"
          release-core init --config-only
          # Every documented config file must be materialized OFFLINE.
          missing=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then
              echo "ERROR: offline init did not materialize '$f'" >&2
              missing=1
            else
              echo "ok: $f"
            fi
          done < "${RUNNER_TEMP}/config_files.txt"
          [ "$missing" -eq 0 ] || exit 1
          # PROVE the BUNDLE path was taken (not a silent git-engine fallback):
          # the offline composer stamps a distinct provenance header.
          if ! head -1 lefthook.yml | grep -qF 'bundled templates'; then
            echo "ERROR: lefthook.yml was not composed from the bundle — header was:" >&2
            head -1 lefthook.yml >&2
            exit 1
          fi
          echo "ok: gate composed offline from the bundled templates"
          # No stray files beyond the documented set + the fixture's go.mod.
          git add -A
          extra="$(git -C "$off" diff --cached --name-only \
            | grep -vxF -f "${RUNNER_TEMP}/config_files.txt" \
            | grep -vxF 'go.mod' || true)"
          if [ -n "$extra" ]; then
            echo "ERROR: offline init --config-only wrote files outside the documented set:" >&2
            echo "$extra" >&2
            exit 1
          fi
          git commit -qm 'offline init --config-only'
          # Idempotent: a second offline run is a clean no-op — assert via
          # `git status --porcelain` (empty == clean) so a stray UNTRACKED managed
          # file is caught too (git diff alone misses untracked).
          release-core init --config-only
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: second offline 'release-core init --config-only' was not a no-op:" >&2
            git status --porcelain >&2
            exit 1
          fi
          echo "ok: offline release-core init --config-only is idempotent"

      - name: release-core init OFFLINE (DEFAULT full) — self-sync the whole tree
        # The #476 cutover contract: a BARE `release-core init` (what SessionStart
        # runs) materializes the WHOLE managed tree from the wheel bundle and
        # auto-commits managed changes — NO release clone, NO network. This is the
        # pull-model self-sync that retires propagate in steady state.
        run: |
          set -euo pipefail
          unset RELEASE_HOME RELEASE_REF
          full="${RUNNER_TEMP}/fixture-full"
          rm -rf "$full"; mkdir -p "$full"
          git -C "$full" init -q
          git -C "$full" config user.email smoke@example.com
          git -C "$full" config user.name 'pip-bootstrap smoke'
          printf 'module example.com/full\n\ngo 1.22\n' > "$full/go.mod"
          git -C "$full" add -A
          git -C "$full" commit -qm 'fixture: go-cli marker'
          cd "$full"
          release-core init
          # The FULL managed tree must be materialized on disk: the .release/ build
          # dir, working-tree symlink mirrors, and the CLAUDE.md stub block.
          test -d .release || { echo "ERROR: no .release/ build dir materialized" >&2; exit 1; }
          # WS2 (#523): the CLAUDE.md block is a stub pointing at `release-core
          # how-to` — no synced ORIENTATION.md anymore.
          grep -qF 'release-core how-to' CLAUDE.md \
            || { echo "ERROR: CLAUDE.md stub block not injected" >&2; exit 1; }
          if [ -e .release/ORIENTATION.md ]; then
            echo "ERROR: .release/ORIENTATION.md should be retired (WS2)" >&2; exit 1
          fi
          # WS4 (#521): the ephemeral .release/ build dir is gitignored + never
          # committed — the self-ignoring .release/.gitignore (`*`) keeps it out.
          if git ls-files --error-unmatch .release >/dev/null 2>&1; then
            echo "ERROR: .release/ is git-tracked — it must be ephemeral (gitignored)" >&2
            git ls-files .release >&2; exit 1
          fi
          # The committed MIRRORS (symlinks + workflow copies + CLAUDE.md block) are
          # still a non-trivial managed surface — FAR more than a stray file or two.
          n="$(git ls-files | wc -l | tr -d ' ')"
          [ "$n" -gt 20 ] || { echo "ERROR: only $n files tracked — not a full mirror set" >&2; exit 1; }
          # AUTO-COMMIT ON CHANGE: the managed change must be committed (the boot
          # passes no flags; auto-commit is the default in full mode).
          subject="$(git log -1 --pretty=format:%s)"
          case "$subject" in
            "chore(release): sync managed tree from"*) echo "ok: auto-committed: $subject" ;;
            *) echo "ERROR: managed tree was not auto-committed (HEAD: $subject)" >&2; exit 1 ;;
          esac
          # Fully clean after the auto-commit — `git status --porcelain` empty
          # catches staged/unstaged AND untracked managed leftovers.
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: full init left an uncommitted/untracked managed diff:" >&2
            git status --porcelain >&2
            exit 1
          fi
          echo "ok: default full init materialized + auto-committed the whole tree"
          # Idempotent: a second bare run is a clean no-op (no new commit).
          head1="$(git rev-parse HEAD)"
          release-core init
          if [ "$(git rev-parse HEAD)" != "$head1" ]; then
            echo "ERROR: second default 'release-core init' made a commit (not a no-op)" >&2
            git log -1 --pretty=format:%s >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: second default 'release-core init' was not a clean no-op:" >&2
            git status --porcelain >&2
            exit 1
          fi
          echo "ok: default full release-core init is idempotent (no-op second run)"

      - name: release-core init --config-only OVERRIDE — first run materializes the set
        # release-dev's path: an explicit $RELEASE_HOME git clone OVERRIDES the
        # bundle, composing from LIVE templates via the full release-sync engine.
        # Exercised here through --config-only so the documented-CONFIG_FILES
        # contract assertion holds; the DEFAULT full materialize is covered by the
        # offline full step above. $RELEASE_REF pins composition to the exact PR
        # commit, so it does not depend on any remote branch existing.
        env:
          RELEASE_HOME: ${{ github.workspace }}
          RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "${FIXTURE}"
          release-core init --config-only
          echo "--- materialized (untracked) ---"
          missing=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then
              echo "ERROR: init did not materialize '$f'" >&2
              missing=1
            else
              echo "ok: $f"
            fi
          done < "${RUNNER_TEMP}/config_files.txt"
          [ "$missing" -eq 0 ] || exit 1
          # Nothing OUTSIDE the documented set (beyond the fixture's own go.mod)
          # should appear — init must not write stray files.
          git add -A
          extra="$(git -C "${FIXTURE}" diff --cached --name-only \
            | grep -vxF -f "${RUNNER_TEMP}/config_files.txt" \
            | grep -vxF 'go.mod' || true)"
          if [ -n "$extra" ]; then
            echo "ERROR: init wrote files outside the documented CONFIG_FILES set:" >&2
            echo "$extra" >&2
            exit 1
          fi
          git commit -qm 'init --config-only: first run'

      - name: release-core init --config-only OVERRIDE — second run is an idempotent no-op
        env:
          RELEASE_HOME: ${{ github.workspace }}
          RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "${FIXTURE}"
          release-core init --config-only
          # Idempotent: the second run must leave the already-materialized files
          # byte-identical — a fully clean tree. `git status --porcelain` empty
          # catches untracked leftovers too (git diff alone would miss them).
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: second 'release-core init --config-only' was not a no-op:" >&2
            git status --porcelain >&2
            git --no-pager diff >&2
            exit 1
          fi
          echo "ok: release-core init --config-only is idempotent (second run = clean no-op)"
