name: Cascade handler (reusable)

# Reusable workflow for cross-repo release cascades. Consumers wire a
# 6-line `on-upstream-released.yml` in their repo:
#
#   on:
#     repository_dispatch:
#       types: [upstream-released]
#   jobs:
#     cascade:
#       uses: arthur-debert/release/.github/workflows/cascade-handler.yml@v1
#       secrets:
#         RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
#
# The contract: the consumer ships the managed `bin/release` tool (the
# Kind-aware `release-cut` shim, re-synced from arthur-debert/release via
# `release-sync`) that DISPATCHES `.github/workflows/release.yml`, which
# does the bump + CHANGELOG roll + commit + tag + build + GitHub Release in
# CI. The should-release decision is computed GENERICALLY here via plain
# git (commits since the last final release tag) — it no longer depends on a
# per-repo `bin/diff-since-release`, which was absent for the manifest-less
# Kinds (docs-site / tree-sitter / nvim-plugin). The per-repo
# `scripts/release/*` primitives were retired — this handler now just
# decides + dispatches; CI owns every mutation. See
# arthur-debert/release `docs/lex-release-cascade.md`.

on:
  workflow_call:
    inputs:
      bump-kind:
        description: 'How to bump the version (patch | minor | major). Cascade default is patch.'
        type: string
        default: patch
        required: false
      git-author-name:
        description: Git commit author name for the release commit.
        type: string
        default: release-bot
        required: false
      git-author-email:
        description: Git commit author email for the release commit.
        type: string
        default: release-bot@users.noreply.github.com
        required: false
    secrets:
      RELEASE_TOKEN:
        description: |
          PAT with admin scope on the calling repo. Required because:
          1. The default GITHUB_TOKEN cannot fire cross-repo
             `repository_dispatch` events (silent 403); downstream
             handlers fan via this PAT.
          2. `bin/release` dispatches the repo's `release.yml`, whose
             CI does the bump + tag + push; that push needs a token
             with write/admin scope (the default GITHUB_TOKEN's pushes
             do not re-trigger workflows and may be blocked by rulesets).
        required: true

# Avoid concurrent handler runs racing on the same release dispatch.
# Set inside the reusable workflow so callers don't have to remember.
concurrency:
  group: layer2-handler
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      # Shell-injection guard: never interpolate `client_payload.*`
      # directly into a `run:` body — a compromised upstream could
      # smuggle command substitutions. Always route through env.
      # Gotcha #2 in docs/lex-release-cascade.md.
      - name: Announce trigger
        env:
          SOURCE: ${{ github.event.client_payload.source }}
          UP_VER: ${{ github.event.client_payload.version }}
          RUN_URL: ${{ github.event.client_payload.run_url }}
        run: |
          echo "Triggered by upstream release: ${SOURCE}@${UP_VER}"
          echo "Source run: ${RUN_URL}"

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          # RELEASE_TOKEN so the release.yml dispatch (and the bump/tag
          # push it performs in CI) has write + admin scope.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git identity
        env:
          GIT_NAME: ${{ inputs.git-author-name }}
          GIT_EMAIL: ${{ inputs.git-author-email }}
        run: |
          git config user.email "${GIT_EMAIL}"
          git config user.name  "${GIT_NAME}"

      # Every gh-using step gets GH_TOKEN env explicitly — without it
      # `gh` / `bin/release`'s `gh workflow run` fail auth and the
      # handler bails. Documented gotcha #1 in docs/lex-release-cascade.md.
      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # should-release decision, computed GENERICALLY via plain git
          # (no per-repo bin/diff-since-release — it was absent for the
          # manifest-less Kinds). Are there commits since the last FINAL
          # (non-prerelease) release tag reachable from HEAD?
          #
          #   - `git tag --list 'v*' --sort=-version:refname --merged HEAD`
          #     enumerates version tags, highest first. A nonzero exit is a
          #     genuine git failure (corrupt repo / unborn HEAD) — surface it
          #     and FAIL the step loudly; NEVER treat it as "no release", or
          #     the cascade silently stalls.
          #   - Drop prerelease tags (anything with `-`, e.g. v1.0.0-rc.1):
          #     they share the `## [Unreleased]` scope with the final they
          #     lead up to; the relevant diff is against the last *final*.
          #   - No final tag -> "nothing to release" (a first release is a
          #     human-driven `bin/release X.Y.Z`).
          #   - `git log --oneline <tag>..HEAD` non-empty -> release. A nonzero
          #     exit there is likewise a genuine git failure -> FAIL loudly.
          set +e
          err="$(mktemp)"
          all_tags="$(git tag --list 'v*' --sort=-version:refname --merged HEAD 2>"$err")"
          rc=$?
          set -e
          if [ "$rc" != 0 ]; then
            echo "::error::git tag listing failed (exit ${rc}); cascade aborting"
            cat "$err" >&2
            rm -f "$err"
            exit "$rc"
          fi
          # Last FINAL (non-prerelease) tag: first line without a `-`.
          latest_tag=""
          if [ -n "$all_tags" ]; then
            latest_tag="$(printf '%s\n' "$all_tags" | grep -v -- '-' | head -n1 || true)"
          fi
          if [ -z "$latest_tag" ]; then
            rm -f "$err"
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "No release needed (no final release tags yet; first release is human-driven)."
            exit 0
          fi
          set +e
          log="$(git --no-pager log --oneline "${latest_tag}..HEAD" 2>"$err")"
          rc=$?
          set -e
          if [ "$rc" != 0 ]; then
            echo "::error::git log ${latest_tag}..HEAD failed (exit ${rc}); cascade aborting"
            cat "$err" >&2
            rm -f "$err"
            exit "$rc"
          fi
          rm -f "$err"
          body="$(printf '%s\n' "$log" | sed '/^[[:space:]]*$/d')"
          if [ -n "$body" ]; then
            n="$(printf '%s\n' "$body" | grep -c .)"
            echo "release=yes" >> "$GITHUB_OUTPUT"
            echo "Releasable: ${n} commit(s) since ${latest_tag}."
          else
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "No release needed (no commits since ${latest_tag})."
          fi

      - name: Skip if not needed
        if: steps.decide.outputs.release == 'no'
        run: echo "No release needed; nothing to do."

      # `bin/release <bump>` is the Kind-aware release-cut shim. It reads
      # the current version from this repo's canonical manifest, computes
      # the new version from the bump-kind, and dispatches
      # `.github/workflows/release.yml`. CI does the bump + CHANGELOG roll
      # + commit + tag + build + GitHub Release. No local branch / commit
      # / PR / admin-merge — the mutation lives entirely in CI now.
      - name: Cut release (dispatch release.yml)
        if: steps.decide.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BUMP: ${{ inputs.bump-kind }}
        run: |
          set -e
          ./bin/release "$BUMP"
          echo "Dispatched release.yml (${BUMP} bump); CI will bump + tag + build + release."
