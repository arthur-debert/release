name: Cascade handler (reusable)

# Reusable workflow for cross-repo release cascades. Consumers wire a
# 6-line `on-upstream-released.yml` in their repo:
#
#   on:
#     repository_dispatch:
#       types: [upstream-released]
#   jobs:
#     cascade:
#       uses: arthur-debert/release/.github/workflows/cascade-handler.yml@v3
#       secrets:
#         RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
#
# The contract: the consumer ships a `.github/workflows/release.yml` thin
# caller of the right per-Kind reusable workflow. This handler decides whether
# a release is due, then DISPATCHES that `release.yml`, which does the bump +
# CHANGELOG roll + commit + tag + build + GitHub Release in CI. (The handler
# used to go through the consumer's `bin/release` shim, retired in #476 in
# favor of the `release-core cut` console-script; with an explicit version it
# dispatches release.yml directly.) The should-release decision is computed
# GENERICALLY here via plain
# git (commits since the last final release tag) — it no longer depends on a
# per-repo `bin/diff-since-release`, which was absent for the manifest-less
# Kinds (docs-site / tree-sitter / nvim-plugin). The per-repo
# `scripts/release/*` primitives were retired — this handler now just
# decides + dispatches; CI owns every mutation. See
# arthur-debert/release `docs/lex-release-cascade.md`.
#
# TAG-AUTHORITATIVE version: because the decision is computed off the latest
# FINAL git tag, this handler also DERIVES the next version from that same tag
# (apply the bump-kind to the tag) and dispatches it EXPLICITLY as the
# `version` input to release.yml — it does NOT let release-cut recompute from
# the per-consumer manifest. That manifest can drift from the tag (vscode's
# package.json froze at 0.4.1-rc.1 ~25 releases ago while the real version is
# the tag v0.10.8, so a manifest-driven patch bump yields 0.4.2 instead of
# 0.10.9). Deriving from the tag makes the cascade robust to manifest drift
# fleet-wide. Same pattern as dropping the per-repo diff-since-release.

on:
  workflow_call:
    inputs:
      bump-kind:
        description: "How to bump the version (patch | minor | major, or an explicit X.Y.Z that passes through unchanged). Cascade default is patch."
        type: string
        default: patch
        required: false
      git-author-name:
        description: Git commit author name for the release commit.
        type: string
        default: release-bot
        required: false
      git-author-email:
        description: Git commit author email for the release commit.
        type: string
        default: release-bot@users.noreply.github.com
        required: false
    secrets:
      RELEASE_TOKEN:
        description: |
          PAT with admin scope on the calling repo. Required because:
          1. The default GITHUB_TOKEN cannot fire cross-repo
             `repository_dispatch` events (silent 403); downstream
             handlers fan via this PAT.
          2. This handler dispatches the repo's `release.yml`, whose
             CI does the bump + tag + push; that push needs a token
             with write/admin scope (the default GITHUB_TOKEN's pushes
             do not re-trigger workflows and may be blocked by rulesets).
        required: true

# Avoid concurrent handler runs racing on the same release dispatch.
# Set inside the reusable workflow so callers don't have to remember.
concurrency:
  group: layer2-handler
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      # Shell-injection guard: never interpolate `client_payload.*`
      # directly into a `run:` body — a compromised upstream could
      # smuggle command substitutions. Always route through env.
      # Gotcha #2 in docs/lex-release-cascade.md.
      - name: Announce trigger
        env:
          SOURCE: ${{ github.event.client_payload.source }}
          UP_VER: ${{ github.event.client_payload.version }}
          RUN_URL: ${{ github.event.client_payload.run_url }}
        run: |
          echo "Triggered by upstream release: ${SOURCE}@${UP_VER}"
          echo "Source run: ${RUN_URL}"

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          # RELEASE_TOKEN so the release.yml dispatch (and the bump/tag
          # push it performs in CI) has write + admin scope.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git identity
        env:
          GIT_NAME: ${{ inputs.git-author-name }}
          GIT_EMAIL: ${{ inputs.git-author-email }}
        run: |
          git config user.email "${GIT_EMAIL}"
          git config user.name  "${GIT_NAME}"

      # Every gh-using step gets GH_TOKEN env explicitly — without it the
      # `gh workflow run` dispatch fails auth and the handler bails.
      # Documented gotcha #1 in docs/lex-release-cascade.md.
      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BUMP: ${{ inputs.bump-kind }}
        run: |
          # should-release decision, computed GENERICALLY via plain git
          # (no per-repo bin/diff-since-release — it was absent for the
          # manifest-less Kinds). Are there commits since the last FINAL
          # (non-prerelease) release tag reachable from HEAD?
          #
          #   - `git tag --list 'v*' --sort=-version:refname --merged HEAD`
          #     enumerates version tags, highest first. A nonzero exit is a
          #     genuine git failure (corrupt repo / unborn HEAD) — surface it
          #     and FAIL the step loudly; NEVER treat it as "no release", or
          #     the cascade silently stalls.
          #   - Drop prerelease tags (anything with `-`, e.g. v1.0.0-rc.1):
          #     they share the `## [Unreleased]` scope with the final they
          #     lead up to; the relevant diff is against the last *final*.
          #   - No final tag -> "nothing to release" (a first release is a
          #     human-driven `release-core cut X.Y.Z`).
          #   - `git log --oneline <tag>..HEAD` non-empty -> release. A nonzero
          #     exit there is likewise a genuine git failure -> FAIL loudly.
          set +e
          err="$(mktemp)"
          all_tags="$(git tag --list 'v*' --sort=-version:refname --merged HEAD 2>"$err")"
          rc=$?
          set -e
          if [ "$rc" != 0 ]; then
            echo "::error::git tag listing failed (exit ${rc}); cascade aborting"
            cat "$err" >&2
            rm -f "$err"
            exit "$rc"
          fi
          # Last FINAL (non-prerelease) tag: first line without a `-`.
          latest_tag=""
          if [ -n "$all_tags" ]; then
            latest_tag="$(printf '%s\n' "$all_tags" | grep -v -- '-' | head -n1 || true)"
          fi
          if [ -z "$latest_tag" ]; then
            rm -f "$err"
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "No release needed (no final release tags yet; first release is human-driven)."
            exit 0
          fi
          set +e
          log="$(git --no-pager log --oneline "${latest_tag}..HEAD" 2>"$err")"
          rc=$?
          set -e
          if [ "$rc" != 0 ]; then
            echo "::error::git log ${latest_tag}..HEAD failed (exit ${rc}); cascade aborting"
            cat "$err" >&2
            rm -f "$err"
            exit "$rc"
          fi
          rm -f "$err"
          body="$(printf '%s\n' "$log" | sed '/^[[:space:]]*$/d')"
          if [ -z "$body" ]; then
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "No release needed (no commits since ${latest_tag})."
            exit 0
          fi
          n="$(printf '%s\n' "$body" | grep -c .)"
          # TAG-AUTHORITATIVE next version: apply the bump-kind to the latest
          # FINAL tag (NOT the per-consumer manifest, which can drift). Parse
          # vMAJOR.MINOR.PATCH (strip leading 'v' + any '-prerelease'/'+build'),
          # then increment per semver: major zeroes minor+patch, minor zeroes
          # patch. We dispatch this EXPLICIT X.Y.Z so a stale manifest can't
          # drive the version (the vscode 0.4.2-vs-0.10.9 bug).
          core="${latest_tag#v}"      # strip leading v
          core="${core%%-*}"          # strip -prerelease
          core="${core%%+*}"          # strip +build
          major="${core%%.*}"
          rest="${core#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          if ! printf '%s' "${major}.${minor}.${patch}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::could not parse a semver core from tag '${latest_tag}'; cascade aborting"
            exit 1
          fi
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            patch) next="${major}.${minor}.$((patch + 1))" ;;
            *)
              # An explicit X.Y.Z bump-kind passes through unchanged (no tag math).
              if printf '%s' "$BUMP" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                next="$BUMP"
              else
                echo "::error::bad bump-kind '${BUMP}' (want patch|minor|major|X.Y.Z); cascade aborting"
                exit 1
              fi
              ;;
          esac
          echo "release=yes" >> "$GITHUB_OUTPUT"
          echo "next-version=${next}" >> "$GITHUB_OUTPUT"
          echo "Releasable: ${n} commit(s) since ${latest_tag}; next version ${next} (from ${latest_tag} + ${BUMP})."

      - name: Skip if not needed
        if: steps.decide.outputs.release == 'no'
        run: echo "No release needed; nothing to do."

      # We pass the EXPLICIT version the decide step derived from the latest
      # final tag (NOT the bump-kind) as release.yml's `version` input, so it
      # releases that exact version regardless of what this repo's manifest
      # says — robust to manifest drift (the vscode
      # 0.4.2-vs-0.10.9 bug). release-cut dispatches
      # `.github/workflows/release.yml`; CI does the bump + CHANGELOG roll +
      # commit + tag + build + GitHub Release. No local branch / commit / PR /
      # admin-merge — the mutation lives entirely in CI now.
      - name: Cut release (dispatch release.yml)
        if: steps.decide.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEXT_VERSION: ${{ steps.decide.outputs.next-version }}
        run: |
          set -e
          # Dispatch release.yml directly with the EXPLICIT version the decide
          # step derived from the latest final tag. The Kind-aware `release-core
          # cut` (formerly reached via the now-retired `bin/release` shim, #476)
          # would only `gh workflow run release.yml` here anyway — no Kind-aware
          # compute is needed when we already pass an explicit X.Y.Z — and
          # release-core is NOT provisioned on this runner. (release#426 P1: the
          # cascade used to die at exit 127 on the `./bin/release` line, leaving
          # the editor cascade two releases behind; dispatching directly removes
          # that failure mode entirely.)
          gh workflow run release.yml -f version="$NEXT_VERSION"
          echo "Dispatched release.yml (version ${NEXT_VERSION}); CI will bump + tag + build + release."
