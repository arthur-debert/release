name: release-cut tests

# BATS suite for `release-core cut` (via bin/release-core) +
# templates/commons/bin/release. The flat `release-cut` name was retired in the
# CLI cutover (#468); the shim gets sweep-synced to consumer repos via
# release-sync; `release-core cut` runs locally on developer machines and from
# CI in this repo. Regressions need to surface here before they ride out.

on:
  push:
    branches: ['**']
    paths:
      - 'bin/release-core'
      - 'templates/commons/bin/release'
      - 'templates/commons/lib/release_core/**'
      - 'tests/release-cut/**'
      - '.github/workflows/release-cut-tests.yml'
  pull_request:
    paths:
      - 'bin/release-core'
      - 'templates/commons/bin/release'
      - 'templates/commons/lib/release_core/**'
      - 'tests/release-cut/**'
      - '.github/workflows/release-cut-tests.yml'

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run BATS suite
        run: bats tests/release-cut/
