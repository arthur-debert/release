name: provision-gate-toolset tests

# BATS contract suite for bin-internal/provision-gate-toolset.sh — the gate-
# toolset provisioning unit the arm-gate composite calls. Fully offline: stub
# package managers (npm/pip/brew/apt-get), a transparent sudo, a controllable
# uname (OS branch), and a logging curl let it assert the install behavior
# (batched, OS-branched, idempotent, pinned) without network or real installs.

on:
  push:
    branches: ["**"]
    paths:
      - "bin-internal/provision-gate-toolset.sh"
      - "templates/commons/bin/gate-tool-versions.sh"
      - "templates/commons/bin/setup-dev-env.sh"
      - "tests/provision-gate-toolset/**"
      - "tests/gate-tool-versions/**"
      - ".github/workflows/provision-gate-toolset-tests.yml"
  pull_request:
    paths:
      - "bin-internal/provision-gate-toolset.sh"
      - "templates/commons/bin/gate-tool-versions.sh"
      - "templates/commons/bin/setup-dev-env.sh"
      - "tests/provision-gate-toolset/**"
      - "tests/gate-tool-versions/**"
      - ".github/workflows/provision-gate-toolset-tests.yml"

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run BATS suite
        run: bats tests/provision-gate-toolset/ tests/gate-tool-versions/
