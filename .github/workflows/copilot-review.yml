name: Copilot Review (reusable)

# Reusable workflow that requests a Copilot review on a PR. Per-repo
# callers trigger on pull_request events and pass the PR number.
#
# Body uses `gh pr edit --add-reviewer @copilot` (GraphQL under the hood).
# The default GITHUB_TOKEN cannot request a Copilot review — it
# authenticates as github-actions[bot], which silently no-ops the
# attach. Caller must pass a user PAT (the existing RELEASE_TOKEN
# works) via the `gh_token` secret. Same-owner consumers can use
# `secrets: inherit`; cross-org consumers (e.g. lex-fmt/*) must list
# `gh_token: ${{ secrets.RELEASE_TOKEN }}` explicitly.

on:
  workflow_call:
    inputs:
      pr_number:
        description: PR number to request a Copilot review on
        required: true
        type: number
    secrets:
      gh_token:
        description: User PAT with pull-requests:write (e.g. RELEASE_TOKEN). Required — GITHUB_TOKEN silently fails to attach Copilot.
        required: true

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
        run: |
          gh pr edit ${{ inputs.pr_number }} \
            --repo ${{ github.repository }} \
            --add-reviewer @copilot
