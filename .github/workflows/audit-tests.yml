name: audit tests

# BATS contract suite for the audit verbs via the CLI (`release-core audit`,
# `release-core admin repos audit`, `release-core admin smoke-test`; the flat
# audit-* names were retired in the CLI cutover #468). The pure
# parsing/aggregation logic is covered by pytest (release_core tests, run by the
# CI `py-lint` job); this suite locks the CLI contract: help/usage, flag arity,
# exit codes, and the --json output shape. Fully offline — a stub `gh` answers
# the API calls, so no network/auth is needed.

on:
  push:
    branches: ["**"]
    paths:
      - "bin/release-core"
      - "templates/commons/lib/release_core/**"
      - "tests/audit/**"
      - ".github/workflows/audit-tests.yml"
  pull_request:
    paths:
      - "bin/release-core"
      - "templates/commons/lib/release_core/**"
      - "tests/audit/**"
      - ".github/workflows/audit-tests.yml"

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats + jq
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Run BATS suite
        run: bats tests/audit/
