name: GH Action CI

# Reusable PR-time check workflow for gh-action consumers.
#
# Closes part of #107. Where `gh-action.yml` covers the release path
# (tag + advance-major-branch + GH release), this workflow covers
# every push / pull_request: actionlint over `.github/workflows/` +
# `.github/actions/`, shellcheck over `bin/` + any composite-action
# `run:` shell blocks (via actionlint's bundled shellcheck), and the
# consumer's umbrella check if it has one.
#
# What's distinct
# ---------------
# - Pure-YAML stack — no language toolchain to set up. The whole job
#   is lint.
# - actionlint is the centerpiece. It validates workflow syntax,
#   expression syntax, and (when shellcheck is on PATH) the shell
#   inside `run:` blocks. Catches the kind of bugs that, before they
#   shipped, manifested as `startup_failure` with zero log lines
#   (see memory `feedback_workflow_call_description_expressions`).
# - Composite-action-only consumers (no root `action.yml`, e.g.
#   release/ itself with many `.github/actions/<name>/action.yml`)
#   are valid — `actionlint` recurses both `.github/workflows/` and
#   `.github/actions/`.
#
# Caller shape (paste-ready):
#
#   name: CI
#   on:
#     push:
#       branches: ['**']
#     pull_request:
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: arthur-debert/release/.github/workflows/gh-action-ci.yml@v3

on:
  workflow_call:
    inputs:
      shellcheck-paths:
        description: |
          Space-separated paths to additionally shellcheck (beyond
          what actionlint's bundled shellcheck covers inside workflow
          `run:` blocks). Default `bin scripts` — checks any shell
          scripts in those dirs. Pass `""` to skip standalone
          shellcheck and rely on actionlint only.
        type: string
        required: false
        default: 'bin scripts'
      pre-check:
        description: |
          Optional path to a script the consumer runs before lint.
        type: string
        required: false
        default: ''
      check-command:
        description: |
          Optional umbrella check entry point. Default empty — the
          gh-action stack often has no `bin/check` (the workflow IS
          the deliverable; there's no source to lint beyond YAML +
          shell). Consumers that DO have a `bin/check` can set this
          to `bin/check` and it'll run after actionlint.
        type: string
        required: false
        default: ''
      submodules:
        description: 'Pass `submodules: recursive` on checkout.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules && 'recursive' || '' }}

      - name: Provision the gate toolset (pinned actionlint + shellcheck)
        shell: bash
        # ONE provisioner, invoked — not a re-listed install (release#531 F3).
        # WS8 (#765): the shell provisioner was removed; the gate toolset is now
        # armed by `release-core gate --provision` (the wheel-carried
        # release_core.toolset, the single source of pins). Install release_core
        # from THIS checkout (release's own repo) --from-source --no-init so the
        # verb is reachable, then provision. Pinned actionlint + shellcheck at the
        # same pins every other environment runs.
        run: |
          set -euo pipefail
          bash bin/install-release-core --no-init --from-source .
          export PATH="${XDG_BIN_HOME:-$HOME/.local/bin}:$PATH"
          release-core gate --provision

      - name: Run actionlint
        shell: bash
        # Severity gate goes via SHELLCHECK_OPTS env so actionlint's
        # bundled shellcheck only flags warning + error findings —
        # style + info (SC2129 "consider grouped redirects", SC2015
        # "A && B || C") don't fail CI. Without this, the first repo
        # to adopt gh-action-ci.yml@v1 floods on style nits in
        # pre-existing workflows that haven't been audited
        # (release/'s own dogfood adoption surfaced 40+ such
        # findings on its first PR with no real bugs).
        #
        # Don't be tempted to use `-shellcheck '-S warning'` —
        # actionlint's `-shellcheck` flag takes a binary path, not
        # a command line, so that form silently disables the
        # integration. See PR #202.
        env:
          SHELLCHECK_OPTS: '-S warning'
        run: actionlint -color

      - name: Run shellcheck (standalone)
        if: inputs.shellcheck-paths != ''
        shell: bash
        run: |
          set -euo pipefail
          found_any=false
          for dir in ${{ inputs.shellcheck-paths }}; do
            [ -d "$dir" ] || continue
            # Find executable scripts (or files with a shebang) and
            # lint them. The find here is conservative: only files
            # Git considers executable AND in a configured path get
            # checked.
            while IFS= read -r -d '' f; do
              # Skip non-shell scripts (e.g. Python tools that happen
              # to be marked executable). Shellcheck reports SC1071 on
              # those, which is correct but turns mixed-language tool
              # dirs into a false-positive failure. Gate on either a
              # `.sh`/`.bash` extension or a shell shebang.
              case "$f" in
                *.sh|*.bash) ;;
                *)
                  # POSIX ERE has no `\b`; explicit `/`-or-space
                  # separators match identically under GNU and BSD
                  # grep (relevant for consumers running this
                  # workflow's pattern locally on macOS).
                  head -1 "$f" | grep -qE '^#!.*[ /](bash|sh|dash|ksh)( |$)' || continue
                  ;;
              esac
              found_any=true
              echo "shellcheck $f"
              # Match the severity gate used by actionlint's bundled
              # check above (only error + warning fail; style + info
              # findings are advisory). Otherwise this standalone pass
              # is stricter than the inline pass, which is confusing.
              shellcheck --severity=warning "$f"
            done < <(find "$dir" -maxdepth 3 -type f \( -perm -u+x -o -name '*.sh' -o -name '*.bash' \) -print0)
          done
          if [ "$found_any" = false ]; then
            echo "(no shell scripts under: ${{ inputs.shellcheck-paths }})"
          fi

      - name: Pre-check hook
        if: inputs.pre-check != ''
        shell: bash
        env:
          # Make `gh` usable inside the consumer's pre-check script
          # (e.g. `gh release download` for fetching pinned deps).
          GH_TOKEN: ${{ github.token }}
        run: bash "${{ inputs.pre-check }}"

      - name: Run umbrella check
        if: inputs.check-command != ''
        shell: bash
        run: ${{ inputs.check-command }}
