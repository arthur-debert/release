name: pip-index (build + deploy)

# Publish a PEP 503 "simple" pip index for the release_core wheels to GitHub
# Pages. Entries point at the EXISTING GitHub release-asset wheel URLs (the
# repo is PUBLIC → no auth), so this index is a thin static link directory —
# it carries no wheels of its own. Once deployed, consumers/CI can resolve a
# wheel by version constraint instead of scraping the releases API:
#
#   pip install --extra-index-url https://arthur-debert.github.io/release/simple/ \
#               'release-core>=3,<4'
#
# PyPI stays the PRIMARY index (--extra-index-url, NOT --index-url), so
# release_core's own deps (click) still resolve from PyPI.
#
# This is RELEASE-SPECIFIC plumbing (only arthur-debert/release publishes the
# release_core wheel), so it lives in a DEDICATED workflow here — NOT a step in
# the shared `gh-action.yml`, which every consumer calls. Keeping it separate
# means zero consumer impact: the index serves ALONGSIDE the existing
# release-asset boot path as a pure, not-yet-consumed fallback (Phase 0 of the
# boot-simplification epic #757).
#
# --- Two de-risk must-haves, both honored here -------------------------------
#
# 1. RC-pollution guard. The generator filters to NON-prerelease releases,
#    mirroring the boot resolver's `select(.draft == false and .prerelease ==
#    false)` predicate (templates/commons/bin/install-release-core). A
#    `*-release-rc` verify/RC cut must never appear in the public index
#    (release#689-class). The filter lives in the generator script — one
#    definition, not a second hand-rolled copy.
#
# 2. Sole Pages deployer. This is the ONLY GitHub Pages deploy in release's
#    own repo. `mdbook.yml` / `mkdocs.yml` are REUSABLE *consumer* workflows
#    (`workflow_call`) that release never invokes for itself (no book.toml /
#    mkdocs.yml caller here), so there is no other `deploy-pages` run in this
#    repo and nothing to collide with today.
#
#    Two forward-looking choices, neither of which is a cross-workflow
#    collision guard:
#      - a fixed concurrency group (`pip-index`) that serializes THIS
#        workflow's own runs with each other (e.g. two releases cut close
#        together), `cancel-in-progress: false` so an in-flight index deploy
#        finishes rather than being cancelled. Concurrency groups only
#        serialize runs WITHIN the same group, so this does NOT (and is not
#        meant to) coordinate with any other workflow, and
#      - a DISTINCT site subpath (`/simple/`) so the index lives in its own
#        corner of the Pages tree.
#
#    Honest forward note: `actions/deploy-pages` publishes a FULL site
#    artifact that REPLACES the entire Pages site, so two independent Pages
#    workflows clobber each other regardless of concurrency group. If a docs
#    Pages deploy is ever added to THIS repo, the two cannot simply coexist as
#    separate `deploy-pages` runs — they would need to publish into ONE
#    combined artifact (a single unified Pages workflow, or a branch-based
#    partial deploy with keep_files). A future-coordination constraint, not
#    something to build now.

on:
  # Fires once a release is fully published (the wheel asset is already
  # attached by gh-action.yml's publish step). `released` excludes prereleases
  # at the trigger level; the generator's prerelease filter is the real guard
  # (a re-published older release, an edited RC, etc.).
  release:
    types: [released]
  # Manual re-deploy (e.g. after backfilling an old release, or first stand-up).
  workflow_dispatch:

# A fixed group name (not per-ref) because release events don't carry a
# meaningful branch ref and we only ever want one index deploy in flight.
# `cancel-in-progress: false` lets an in-flight index deploy finish rather than
# being cancelled by the next one. This serializes pip-index's OWN runs only —
# a concurrency group never coordinates across different groups/workflows (see
# the sole-Pages-deployer note in the header).
concurrency:
  group: pip-index
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Generate PEP 503 pip index
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUTPUT_DIR: pip-index
        # Thin step: all logic lives in the testable bin-internal script.
        run: bash bin-internal/generate-pip-index.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pip-index

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
