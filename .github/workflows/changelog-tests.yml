name: changelog tests

# BATS suite for bin/changelog* — runs against this repo's own bin/
# on every push and PR. The scripts themselves get sweep-synced to
# consumer repos via release-sync; we want regressions to surface
# here before they ride out.

on:
  push:
    branches: ['**']
    paths:
      - 'bin/changelog*'
      - 'tests/changelog/**'
      - 'vendor/semver-tool/**'
      - '.github/workflows/changelog-tests.yml'
  pull_request:
    paths:
      - 'bin/changelog*'
      - 'tests/changelog/**'
      - 'vendor/semver-tool/**'
      - '.github/workflows/changelog-tests.yml'

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run BATS suite
        run: bats tests/changelog/
