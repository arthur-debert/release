name: Tauri CI

# Reusable PR-time check workflow for tauri-app consumers.
#
# Sibling to `rust-ci.yml` / `electron-ci.yml`: collapses each
# consumer's hand-rolled "setup-node + setup-rust + npm ci + cargo
# fmt/clippy/test + frontend lint/typecheck/test" sequence down to a
# thin caller. The canonical umbrella is `bin/check` — shipped by the
# tauri-app Stack template + the npm-quality Component, both synced
# via release-sync.
#
# Design choices worth knowing:
#
#  * **`bin/check` is the canonical call.** It runs BOTH halves of a
#    Tauri repo: frontend (prettier + eslint + typecheck + unit
#    tests) and rust (cargo fmt --check + cargo clippy + cargo
#    test, scoped to src-tauri/). Same fix-once-propagate guarantee
#    as the rust / electron fleets.
#
#  * **Auto-detect package manager from lockfile.** pnpm-lock.yaml →
#    pnpm, yarn.lock → yarn, default → npm. Same logic as
#    electron-ci.yml (Tauri apps follow the same npm-stack
#    convention; phos-app uses pnpm).
#
#  * **`Swatinem/rust-cache@v2` scoped to src-tauri/.** Caching is
#    mandatory per CLAUDE.md. The `workspaces: src-tauri` input
#    tells rust-cache to walk the right Cargo.lock — without it
#    the action looks for Cargo.toml at root and either skips
#    caching entirely or warns.
#
#  * **E2E job — opt-in.** Pass `e2e: true` to add a separate `e2e`
#    job that runs after `check`. It reuses the JS portion of the
#    setup (no Rust toolchain, no Tauri Linux build deps), auto-
#    installs Playwright browsers, then runs `<pm> run <e2e-script>`
#    (default `test:e2e`). On failure, `playwright-report/` uploads
#    as a CI artifact. If the e2e suite needs the native binary,
#    build it via the `pre-test` input.
#
#  * **Optional `tauri-build` smoke gate.** When true, runs
#    `pnpm tauri build` (or the lockfile-detected equivalent) after
#    `bin/check`. Off by default — full tauri builds are slow and
#    happen at release time via `tauri-app.yml`. Opt in when you
#    want to gate every PR on "the bundle still produces" (rare —
#    most teams accept that release-time is the right place).
#
#  * **`pre-test`** is the generic escape hatch — any shell command
#    that needs to run after deps are installed but before
#    `bin/check` fires (fetch sibling binaries, download upstream
#    WASM, codegen). phos-app uses this for `pnpm fetch:wasm`.
#
#  * **Minimal permissions, declared at both levels.** Same rationale
#    as rust-ci.yml — GitHub validates reusable-workflow permission
#    compatibility at workflow-load time, so we declare contents:read
#    at workflow level AND per-job for explicitness.
#
# Caller shape (paste-ready):
#
#   name: CI
#   on:
#     push:
#       branches: ['**']
#     pull_request:
#   permissions:
#     contents: read
#   jobs:
#     check:
#       uses: arthur-debert/release/.github/workflows/tauri-ci.yml@v1
#       with:
#         node-version: '22'              # default
#         # rust-toolchain: 'stable'      # default
#         # tauri-build: true             # opt-in smoke gate
#         # pre-test: 'pnpm fetch:wasm'   # if you need a build hook
#
# See docs/per-stack/tauri-ci.md for the full input reference.

on:
  workflow_call:
    inputs:
      node-version:
        description: |
          Node.js version passed to actions/setup-node. Match the
          consumer's `engines.node` pin. Default `22` (the LTS line
          most Tauri-app consumers are on).
        type: string
        required: false
        default: '22'

      rust-toolchain:
        description: |
          Rust toolchain channel. If empty (default), the workflow
          honors `rust-toolchain.toml` at repo root when present
          (phos-app pins this way) and falls back to `stable`
          otherwise. Set explicitly (e.g. `'1.85.0'`, `'nightly'`,
          `'stable'`) to override the file. Default empty.
        type: string
        required: false
        default: ''

      tauri-build:
        description: |
          When true, runs `<pm> tauri build` after `bin/check` as a
          smoke gate. False by default — full Tauri builds are slow
          and happen at release time via `tauri-app.yml`. Opt in
          only when you want every PR to gate on "the bundle still
          produces". Note: Linux Tauri system libs
          (libwebkit2gtk, libgtk-3, etc.) are installed
          unconditionally on Linux runners — `cargo clippy` /
          `cargo test` (in bin/check) need them to compile the
          Tauri crate, regardless of this flag.
        type: boolean
        required: false
        default: false

      pre-test:
        description: |
          Optional shell command run after deps are installed but
          BEFORE `bin/check`. Use for upstream WASM fetches, fixture
          prep, codegen. Empty (default) skips. phos-app's value is
          `pnpm fetch:wasm` (its frontend tests import from a WASM
          package that's not in the lockfile).
        type: string
        required: false
        default: ''

      playwright:
        description: |
          When `true`, install Playwright browsers (`npx playwright
          install --with-deps`) in the check job. Useful when
          `bin/check` itself needs browsers. For real e2e suites,
          prefer the `e2e: true` input below — it adds a dedicated
          e2e job and auto-installs browsers.
        type: boolean
        required: false
        default: false

      e2e:
        description: |
          When `true`, add a separate `e2e` job that runs AFTER
          `check` succeeds. The job re-uses the same setup
          (checkout + detect-pm + setup-node + install deps),
          installs Playwright browsers, then runs `<pm> run
          <e2e-script>` (see input below). On failure,
          `playwright-report/` is uploaded as a CI artifact.

          Tauri-specific notes: the e2e job does NOT set up the
          Rust toolchain or install Tauri Linux system deps (a
          Playwright suite against the running renderer doesn't
          need them). If the consumer's `test:e2e` script needs to
          build the native binary first, run that via `pre-test` —
          it shares the same setup with check.

          Consumer requirements (when opting in):
          * `tests/e2e/` (or equivalent) under the repo
          * a `test:e2e` (or other) npm script in package.json
          * `@playwright/test` in devDependencies
        type: boolean
        required: false
        default: false

      e2e-script:
        description: |
          npm script name to invoke for the e2e job. Default
          `test:e2e`. Override only when the consumer's
          package.json uses a different name.
        type: string
        required: false
        default: 'test:e2e'

      runner:
        description: 'GitHub runner label for the check job.'
        type: string
        required: false
        default: 'ubuntu-latest'

      timeout:
        description: 'Per-job timeout in minutes.'
        type: number
        required: false
        default: 30

      submodules:
        description: |
          Forwarded to `actions/checkout`'s `submodules`. Default
          `'false'`. Set `'true'` for first-level submodules or
          `'recursive'` for nested submodules.
        type: string
        required: false
        default: 'false'

    secrets:
      gh_token:
        description: |
          Optional `GH_TOKEN` exposed (step-scoped, not job-wide) to
          the `pre-test`, `bin/check`, and `tauri-build` smoke steps.
          Plumb this when the pre-test (or any check script) calls
          `gh release download` / `gh api` against a
          private sibling repo — `GITHUB_TOKEN` from the default
          job context only has access to the calling repo, so
          fetching artifacts from a separate private repo (e.g.
          phos-app pulling WASM from a private `phos-core`)
          needs a PAT. phos-app passes `secrets.RELEASE_TOKEN`
          here. Falls back to the default `GITHUB_TOKEN` when not
          set. Name matches the convention used in
          `copilot-review.yml`.
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}

      - name: Detect package manager
        # Auto-detect from lockfile presence: pnpm-lock.yaml → pnpm,
        # yarn.lock → yarn, default → npm. Avoids requiring a consumer
        # input; the lockfile IS the canonical signal of which manager
        # is in use, and every consumer commits exactly one.
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable corepack (pnpm/yarn)
        if: steps.pm.outputs.pm == 'pnpm' || steps.pm.outputs.pm == 'yarn'
        # pnpm/yarn aren't on PATH by default on the GH runner. corepack
        # (bundled with Node ≥16.10) provisions the right one from the
        # project's `packageManager` field if set (Corepack convention —
        # e.g. `"packageManager": "pnpm@10.29.3"`), else a default modern
        # release. Must run BEFORE setup-node so `cache: pnpm|yarn` on
        # setup-node finds the package manager's store.
        #
        # NOT `pnpm/action-setup`: the phos-editor org enterprise Actions
        # policy allows only GitHub-authored + verified-Marketplace actions,
        # and pnpm/action-setup is unverified → it startup-fails the whole
        # workflow. corepack is the policy-clean equivalent and honors the
        # same `packageManager` pin (setting an explicit version while the
        # consumer's package.json also pins triggers ERR_PNPM_BAD_PM_VERSION).
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}

      - name: Resolve Rust toolchain channel
        # Tauri's Cargo workspace lives at src-tauri/, not at repo
        # root. Consumers that pin their toolchain put
        # rust-toolchain.toml at the REPO ROOT (phos-app does this).
        # When the `rust-toolchain` input is empty, honor the file;
        # otherwise the input wins. Mirrors the resolution logic in
        # the shared `setup-rust` composite — but kept inline here
        # because we also need a different rust-cache config
        # (workspaces: src-tauri) than the composite ships.
        id: rust-channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.rust-toolchain }}
        run: |
          if [ -n "${INPUT_CHANNEL}" ]; then
            CHANNEL="${INPUT_CHANNEL}"
          elif [ -f rust-toolchain.toml ]; then
            CHANNEL=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
          else
            CHANNEL=stable
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy, rustfmt

      - name: Cache Rust (src-tauri)
        # Swatinem/rust-cache@v2's `workspaces:` input lets us point
        # at a non-root Cargo workspace. Without this the action
        # looks for Cargo.toml at the repo root, doesn't find one,
        # and either warns or silently skips caching. Caching is
        # mandatory per CLAUDE.md — without it a 2-minute Rust job
        # balloons to 10.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-nextest
        # Canonical test runner used by bin/check-tests when nextest
        # is present. Matches rust-ci.yml.
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install Linux Tauri system deps
        # Tauri's Linux build links against libwebkit2gtk, libgtk-3,
        # libsoup, libayatana-appindicator, librsvg2. These are
        # required to COMPILE the Tauri crate — not just to bundle.
        # `cargo clippy` and `cargo test` (run by bin/check) walk
        # the dep graph and trigger compilation of glib-sys /
        # webkit2gtk-sys, which fail at pkg-config lookup without
        # the system libs. phos-app surfaced this on first
        # adoption (glib-2.0 not found in pkg-config search path).
        #
        # Always install on Linux; skipped on macOS/Windows runners
        # where Tauri's deps come from the platform SDKs.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Install Playwright browsers
        if: inputs.playwright
        # `npx --no-install` so we use the playwright CLI version
        # pinned in the consumer's lockfile instead of letting npx
        # fetch a potentially newer release. If playwright isn't a
        # consumer dep, the step fails loudly — opting into the
        # `playwright: true` input but not declaring the dep is
        # misconfiguration, not a fallback case.
        run: npx --no-install playwright install --with-deps

      - name: Run pre-test
        if: inputs.pre-test != ''
        shell: bash
        env:
          # Scoped here (not job-wide) so the PAT — when a caller
          # passes one — is only visible to consumer-controlled
          # commands, not third-party setup actions. phos-app's
          # `pnpm fetch:wasm` shells to `gh release download` against
          # private `phos-core`; `GITHUB_TOKEN` only sees the calling
          # repo. Falls back to `github.token` when no PAT is plumbed.
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
        run: ${{ inputs.pre-test }}

      - name: Set up Python (gate linters ruff/yamllint)
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Arm the gate toolset
        # ONE definition of CI gate-arming: the arm-gate composite (→ the
        # bin-internal/provision-gate-toolset.sh script). Replaces the inline
        # block #417/#419 had to copy into every reusable workflow (release#416).
        # Node + Python are set up by the steps above; the composite installs the
        # lint/format toolset the hardened gate needs.
        uses: arthur-debert/release/.github/actions/arm-gate@v2

      - name: Run canonical checks (bin/check)
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
        run: bin/check

      - name: Tauri build (smoke)
        if: inputs.tauri-build
        # Off by default — release-time only. When opted in, this
        # uses the auto-detected package manager. Each manager
        # invokes the local tauri CLI differently:
        #   * pnpm / yarn — `pnpm tauri build` / `yarn tauri build`
        #     resolve `tauri` from node_modules/.bin transparently.
        #   * npm — `npm tauri build` is NOT a valid invocation
        #     (npm has no "run a node_modules binary by name"
        #     subcommand). Use `npx --no-install tauri build`,
        #     which picks up the locally installed CLI without
        #     fetching from the registry.
        shell: bash
        env:
          PM: ${{ steps.pm.outputs.pm }}
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
        run: |
          if [ "${PM}" = "npm" ]; then
            npx --no-install tauri build
          else
            "${PM}" tauri build
          fi

  # -------------------------------------------------------------------
  # E2E job — opt-in via `e2e: true`. Runs the consumer's Playwright
  # suite after `check` passes. Auto-installs browsers + uploads the
  # Playwright report on failure. Setup mirrors the JS portion of the
  # check job — no Rust toolchain, no Tauri Linux build deps; if the
  # e2e suite needs the native binary, run a `pre-test` step that
  # produces it.
  # -------------------------------------------------------------------
  e2e:
    if: inputs.e2e
    needs: check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable corepack (pnpm/yarn)
        if: steps.pm.outputs.pm == 'pnpm' || steps.pm.outputs.pm == 'yarn'
        # corepack, not pnpm/action-setup — the org Actions policy blocks the
        # unverified action (see the check job's note above). Honors the
        # consumer's packageManager pin; must precede setup-node's cache step.
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Install Playwright browsers
        # `e2e: true` implies Playwright. If the consumer doesn't
        # declare @playwright/test in devDependencies this fails
        # loudly — misconfiguration, not a fallback case.
        run: npx --no-install playwright install --with-deps

      - name: Run pre-test
        if: inputs.pre-test != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
        run: ${{ inputs.pre-test }}

      - name: Run e2e suite
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
        run: ${{ steps.pm.outputs.pm }} run ${{ inputs.e2e-script }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
