name: CI

# Self-host of gh-action-ci.yml@v1. This repo IS the canonical
# arthur-debert/release, so calling its own CI canonical from itself
# is the dogfood loop: a regression in gh-action-ci.yml's actionlint
# step fails its own PR.

on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read

jobs:
  ci:
    # Product dogfood: release validates the reusable CI workflow it SHIPS to
    # consumers (gh-action-ci.yml). This is a test of the product, NOT release's
    # own lint gate — that is the `gate` job below.
    uses: arthur-debert/release/.github/workflows/gh-action-ci.yml@v1

  gate:
    # THE gate. CI invokes the SAME lefthook gate defined in lefthook.yml, over
    # the whole tree — it does NOT re-list the checks. That dual-definition
    # (checks in lefthook.yml AND hand-copied as bespoke CI jobs) is exactly
    # what let non-conforming content reach main: the two drifted and "CI is the
    # source of truth" rationalized the gap. There is ONE definition (the WHAT,
    # lefthook.yml); CI is just another place it runs (the WHERE).
    #
    # To add or change a check: edit lefthook.yml ONLY. Never add a lint step
    # here. If you find yourself writing the check-list a second time, stop.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Arm the gate toolset
        # ONE definition of CI gate-arming (the arm-gate composite), invoked here
        # rather than re-listing the tool set inline — the same consolidation that
        # replaces the #417/#419 inline blocks fleet-wide. Local path ref since
        # this is release's own repo. (release#416)
        uses: ./.github/actions/arm-gate
      - name: Run the gate (lefthook run pre-commit --all-files)
        run: lefthook run pre-commit --all-files

  tests:
    # pytest is a DIFFERENT WHAT than the lint gate (it verifies behavior, not
    # format/lint), so it stays its own job. The stdlib-only packages
    # (release_gh, release_core) import via pytest's pythonpath — no build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: pip install pytest
      - name: pytest
        run: pytest

  guards:
    # Structural invariants that have bitten us before.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bin/fetch-deps must be a real file, not a symlink
        # Consumers + electron-app.yml fetch it via raw.githubusercontent.com,
        # which serves a symlink blob as its target string rather than the
        # script — that broke five consumers when it was symlinked (release#317).
        run: |
          if [ -L bin/fetch-deps ]; then
            echo "::error file=bin/fetch-deps::bin/fetch-deps is a symlink — it MUST be a real file (raw-URL consumers depend on it). See release#317."
            exit 1
          fi
          test -s bin/fetch-deps

      - name: Build/package artifacts must never be committed
        # ADR-0004's "the package/build dir is never in git = violation" invariant,
        # enforced here in the source repo (the dogfood). These dirs are gitignored
        # build output (the wheel's staged template bundle, python dist/build); a
        # build hook stages _bundled_templates/ transiently — a stray `git add` of
        # it would ship build artifacts as if they were source. Fail loudly if any
        # tracked path falls under them. (release#416 step 11, safe prep slice.)
        run: |
          set -euo pipefail
          # Patterns are anchored to path segments so we match the dirs, not
          # incidental substrings. git ls-files lists only TRACKED files.
          violations="$(git ls-files \
            | grep -E '(^|/)_bundled_templates/|(^|/)dist/|(^|/)build/' \
            | grep -v '^tests/' || true)"
          if [ -n "$violations" ]; then
            echo "::error::Build/package artifacts are committed (must be gitignored — ADR-0004):" >&2
            printf '%s\n' "$violations" >&2
            exit 1
          fi
          echo "ok: no build/package artifacts tracked in git"
