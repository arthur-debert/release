name: CI

# Self-host of gh-action-ci.yml@v1. This repo IS the canonical
# arthur-debert/release, so calling its own CI canonical from itself
# is the dogfood loop: a regression in gh-action-ci.yml's actionlint
# step fails its own PR.

on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read

jobs:
  ci:
    uses: arthur-debert/release/.github/workflows/gh-action-ci.yml@v1
    # No bin/check on release/ itself (it's a meta-repo of reusable
    # workflows + composite actions; no umbrella verb). actionlint +
    # shellcheck — the canonical's default surface — is what we want.

  skill-lint:
    # Hold OUR OWN skills/ docs to the markdownlint standard. Vendored
    # skills (those with an .upstream provenance marker) are skipped by
    # the script — not ours to clean (release#321). Mirrors this repo's
    # lefthook `lint-skills` pre-commit hook.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Lint self-authored skills
        run: bin-internal/lint-skills.sh

  py-lint:
    # Lint + test the stdlib-only PR state engine (lib/release_gh).
    # Mirrors this repo's lefthook `ruff` pre-commit hook. Deliberately
    # light: release_gh has ZERO runtime deps and its tests import it via
    # pytest `pythonpath`, so no build/install and no orchestrator SDK is
    # needed — just ruff + pytest. Config is the workspace-root pyproject.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff + pytest
        # Pin ruff so CI and the local lefthook hook never disagree on
        # findings; bump deliberately.
        run: pip install ruff==0.15.12 pytest
      - name: ruff check
        run: ruff check lib/release_gh tests/python
      - name: ruff format --check
        run: ruff format --check lib/release_gh tests/python
      - name: pytest
        run: pytest

  guards:
    # Structural invariants that have bitten us before.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bin/fetch-deps must be a real file, not a symlink
        # Consumers + electron-app.yml fetch it via raw.githubusercontent.com,
        # which serves a symlink blob as its target string rather than the
        # script — that broke five consumers when it was symlinked (release#317).
        run: |
          if [ -L bin/fetch-deps ]; then
            echo "::error file=bin/fetch-deps::bin/fetch-deps is a symlink — it MUST be a real file (raw-URL consumers depend on it). See release#317."
            exit 1
          fi
          test -s bin/fetch-deps
