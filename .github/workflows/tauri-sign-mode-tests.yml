name: tauri sign-mode tests

# Unit BATS suite for the WS3+WS4 post-hoc signing shell logic (#815):
# build-tauri.sh phase dispatch, bundle-tauri.sh unsigned bundling + mac
# .app packaging, reseal-mac-dmg.sh hdiutil reseal, unpack-unsigned-app.sh
# extraction. Hermetic — stubs npx / hdiutil on PATH.

on:
  push:
    branches: ["**"]
    paths:
      - "bin-internal/build-tauri.sh"
      - "bin-internal/bundle-tauri.sh"
      - "bin-internal/reseal-mac-dmg.sh"
      - "bin-internal/unpack-unsigned-app.sh"
      - "tests/tauri-sign-mode/**"
      - ".github/workflows/tauri-sign-mode-tests.yml"
  pull_request:
    paths:
      - "bin-internal/build-tauri.sh"
      - "bin-internal/bundle-tauri.sh"
      - "bin-internal/reseal-mac-dmg.sh"
      - "bin-internal/unpack-unsigned-app.sh"
      - "tests/tauri-sign-mode/**"
      - ".github/workflows/tauri-sign-mode-tests.yml"

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run BATS suite
        run: bats tests/tauri-sign-mode/
