name: GH action release

# Reusable release workflow for reusable GitHub Actions (composite
# actions + reusable workflows housed in the same repo). Consumers
# call this from their .github/workflows/release.yml as a thin caller
# pinned at @v1. See README §Stack matrix row "gh-action" and
# tracking issue #50.
#
# What's distinct about this stack
# --------------------------------
# 1. No package index. GitHub Marketplace lists the action straight
#    from the repo's release tags (toggled once via a repo-settings
#    checkbox at first release; nothing for CI to do).
# 2. The dist channel IS the **floating-major branch** (`v1`, `v2`).
#    Consumers pin `uses: <repo>@v1`; advancing `v1` to point at the
#    latest non-breaking tag is how fixes propagate to all callers.
#    This workflow handles that advance for non-prerelease releases.
# 3. arthur-debert/release is itself a consumer. (We can't
#    use `@v1` to cut `@v1` — chicken/egg; first tag cut manually.
#    Subsequent tags can call this workflow once it ships.)
#
# What it does
# ------------
# 1. prepare — validate semver, ensure action.yml exists (proves
#    this IS a GH Action repo), roll changelog if present, commit
#    + tag + push.
# 2. release — create GH release with notes. Pre-release flag set
#    when the semver carries a suffix.
# 3. advance-major — for non-prerelease releases only, force-move
#    `v<MAJOR>` branch to the new tag. Skipped for prereleases so
#    `1.0.0-rc.1` doesn't yank `v1` forward.
#
# Out of scope (deliberately)
# ---------------------------
# - JS action `dist/` build. Pure-composite actions have no build.
#   When the first JS-action consumer surfaces, add a slice 2 with
#   a `app-bin/build-action.sh` convention hook + an artifact-
#   reupload step.
# - package.json version bump. Composite actions have no manifest;
#   the tag IS the version. JS-action support will add this.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release (bare semver, e.g. 1.3.4 or 2.0.0-rc.1). No leading v.'
        type: string
        required: true
      changelog-path:
        description: 'Path to CHANGELOG.md (Keep-a-Changelog format with `## [Unreleased]` section).'
        type: string
        required: false
        default: 'CHANGELOG.md'
      action-manifest:
        description: 'Path to action.yml / action.yaml at the action root. Verified to exist as a sanity check. Pass an empty string to skip the check — useful for multi-action repos (e.g. arthur-debert/release itself, which ships many composite actions under .github/actions/<name>/action.yml plus reusable workflows under .github/workflows/, but has no single action.yml at the root).'
        type: string
        required: false
        default: 'action.yml'
      advance-major:
        description: 'Move the `v<MAJOR>` floating branch to point at the new tag. Skipped automatically for prereleases.'
        type: boolean
        required: false
        default: true
      submodules:
        description: 'Pass `submodules: recursive` on checkout.'
        type: boolean
        required: false
        default: false

    secrets:
      RELEASE_TOKEN:
        description: 'PAT with repo scope for default-branch push AND force-push to the floating-major branch (bypasses ruleset). Falls back to GITHUB_TOKEN.'
        required: false

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------
  # 1. Prepare: validate, sanity-check, roll changelog, tag + push.
  # -------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
      major: ${{ steps.prep.outputs.major }}
      release-sha: ${{ steps.prep.outputs.release-sha }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: ${{ inputs.submodules && 'recursive' || '' }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # Pull the release_core console-scripts (semver, changelog) onto PATH
      # via the consumer's synced pull-model bootstrap. The bin/semver /
      # bin/changelog shims were retired (release#476); the prepare job now
      # uses the pip-installed console-scripts. --no-init: we only need the
      # package + its scripts here, not a `.release/` re-install. --major v3
      # pins the floating major the index serves — it MUST track the floating
      # major: since WS8 (#765) dropped install-release-core's GH-asset fallback,
      # a stale `--major vN` resolves `release-core>=N,<N+1` against the pip index
      # (v3+ only) and FATALs the cut. Bump this at the next major.
      - name: Set up Python for release_core console-scripts
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install release_core console-scripts (semver, changelog)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        # No shell-scripting here: the resolver installs release_core into its
        # isolated venv, symlinks the console-scripts onto PATH, and (detecting
        # $GITHUB_PATH) persists that dir for later steps. CI just invokes it —
        # same script, same behavior as a local session; the only CI-specific
        # setup is the Python above. --major v3 pins the floating major; --no-init
        # because the release run needs the scripts, not a `.release/` install.
        run: bash bin/install-release-core --major v3 --no-init

      - name: Install the .release/ temp dir
        # The bot gate below runs the gate from .release/ — which is gitignored
        # + ephemeral (WS4) and so absent on a fresh CI checkout. Install it
        # with the release-core installed ABOVE (pinned to the v2 line): `init`
        # writes from the wheel's OFFLINE bundle, no extra install. Deliberately
        # NOT arm-gate's install input — that path re-runs install-release-core
        # at its default `releases/latest`, which would override the v2 pin (and
        # pull a v3 wheel into this v2 workflow once v3 exists). --no-commit: CI
        # never auto-commits the managed paths.
        #
        # Skipped when a root lefthook.yml exists: then the gate definition is
        # LOCAL (release's own repo — hand-authored root gate, no detectable
        # Kind, `init` exits 1 there — or a pre-migration consumer whose synced
        # tree is still tracked) and `release-core gate --hook` falls back to
        # lefthook's default discovery, needing nothing from .release/. Same
        # opt-out arm-gate documents for release's ci.yml, decided here from
        # the checkout itself instead of a caller knob. Caught by the v2.14.0
        # cut: the first release.yml run to resolve gh-action.yml@v2 past
        # release#540 failed on `init: could not detect kind` (release#544).
        shell: bash
        run: |
          # Same root-config trio run-precommit-gate.sh detects.
          if [ -f lefthook.yml ] || [ -f .lefthook.yml ] || [ -f lefthook.yaml ]; then
            echo "Root lefthook config present — gate definition is local; skipping .release/ install."
          else
            release-core init --no-commit
          fi
      - name: Arm the gate toolset
        # ONE definition of CI gate-arming (pinned toolset), same as
        # rust-cli.yml — but provision-only (the install opt-out; see the step
        # above for why). The input is `install_tree` (arm-gate@v3 renamed it from
        # the old `materialize`); opting out skips the `.release/` install (release
        # itself has a real root lefthook.yml + no detectable Kind) while the
        # toolset step still arms the pinned tools via `release-core gate
        # --provision` (release-core is already on PATH from the prior step).
        uses: arthur-debert/release/.github/actions/arm-gate@v3
        with:
          install_tree: 'false'

      - name: Validate + detect resume
        id: prep
        shell: bash
        env:
          NEW_VERSION: ${{ inputs.version }}
          MANIFEST: ${{ inputs.action-manifest }}
          CHANGELOG: ${{ inputs.changelog-path }}
        run: |
          set -euo pipefail

          SEMVER="semver"

          if [[ "${NEW_VERSION}" =~ ^[vV] ]] \
              || [[ "$("$SEMVER" validate "${NEW_VERSION}")" != "valid" ]] \
              || [[ -n "$("$SEMVER" get build "${NEW_VERSION}")" ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH[-PRERELEASE] (got: ${NEW_VERSION})"
            exit 1
          fi

          MAJOR="$("$SEMVER" get major "${NEW_VERSION}")"
          IS_PRERELEASE=false
          if [[ -n "$("$SEMVER" get prerel "${NEW_VERSION}")" ]]; then
            IS_PRERELEASE=true
          fi

          # Sanity check — refuse to release a repo with no action.yml,
          # so a caller that accidentally points `gh-action.yml@v1` at
          # the wrong callee fails loud and early. Allow `.yaml` as a
          # fallback (GH accepts both). Empty MANIFEST disables the
          # check entirely (for multi-action repos that ship a bundle
          # of composite actions + reusable workflows but have no
          # single action.yml at the root).
          if [ -n "${MANIFEST}" ] && [ ! -f "${MANIFEST}" ]; then
            alt="${MANIFEST%.yml}.yaml"
            if [ "${MANIFEST}" != "${alt}" ] && [ -f "${alt}" ]; then
              MANIFEST="${alt}"
            else
              echo "::error::action manifest not found: ${MANIFEST} (or ${alt}). Is this a GH Actions repo? Pass action-manifest: '' to skip this check for multi-action repos."
              exit 1
            fi
          fi

          TAG="v${NEW_VERSION}"
          git fetch --tags origin >/dev/null 2>&1 || true

          # Resume case: tag exists. Trust it — no manifest version to
          # cross-check against (composite actions don't carry one).
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "${TAG}")
            echo "tag ${TAG} already exists at ${TAG_SHA} — resuming"

            # Reconstruct release notes from the existing changelog
            # entry so the release job has something to upload.
            if [ -n "${CHANGELOG}" ] && [ -f "${CHANGELOG}" ]; then
              if [ "${IS_PRERELEASE}" = "true" ]; then
                awk '/^## \[Unreleased\]/{c=1;next} c&&/^## \[/{exit} c&&/\S/{print}' \
                  "${CHANGELOG}" > release-notes.md
              else
                awk -v v="${NEW_VERSION}" '$0 ~ "^## \\[" v "\\]"{c=1;next} c&&/^## \[/{exit} c{print}' \
                  "${CHANGELOG}" > release-notes.md
              fi
              [ -s release-notes.md ] || echo "Release ${TAG}" > release-notes.md
            else
              echo "Release ${TAG}" > release-notes.md
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Roll changelog + extract notes. Three branches:
            #   1. CHANGELOG input empty → user opted out; write stub.
            #   2. Fragment-dir (per #201): CHANGELOG/ sibling dir exists
            #      → delegate to the `changelog` console-script (cut +
            #      render).
            #   3. CHANGELOG specified but no CHANGELOG/ dir → stub.
            #      (The legacy single-file `## [Unreleased]` detection
            #      branch was removed in #569 — every consumer is on the
            #      fragment-dir model.)
            if [ -z "${CHANGELOG:-}" ]; then
              echo "Release ${TAG}" > release-notes.md
            else
              CHANGELOG_DIR="$(dirname "${CHANGELOG}")/CHANGELOG"
              if [ -d "${CHANGELOG_DIR}" ]; then
                # Fragment-dir branch. The `changelog` console-script is on
                # PATH (installed via the bootstrap step above).
                if [ "${IS_PRERELEASE}" != "true" ]; then
                  # changelog walks up cwd for CHANGELOG/, so cd
                  # next to the changelog file first — otherwise on
                  # monorepos with multiple changelogs the wrong
                  # CHANGELOG/ gets cut. Mirrors bin-internal/roll-changelog.sh.
                  (
                    cd "$(dirname "${CHANGELOG}")"
                    changelog new-version "${NEW_VERSION}"
                  )
                  awk 'NR==1 && /^## / { next } NR==2 && /^$/ { next } { print }' \
                    "${CHANGELOG_DIR}/${NEW_VERSION}.md" > release-notes.md
                  git add "${CHANGELOG}" "${CHANGELOG_DIR}/"
                else
                  # Prereleases don't cut — concat existing fragments.
                  # LC_ALL=C keeps order deterministic across BSD + GNU.
                  mapfile -t fragments < <(LC_ALL=C ls "${CHANGELOG_DIR}"/unreleased-*.md 2>/dev/null || true)
                  if [ "${#fragments[@]}" -gt 0 ]; then
                    cat "${fragments[@]}" > release-notes.md
                  else
                    echo "Release ${TAG}" > release-notes.md
                  fi
                fi
              else
                # CHANGELOG specified but no CHANGELOG/ fragment dir on
                # disk — write a stub. (Legacy single-file detection
                # removed in #569; the fragment-dir model is the only path.)
                echo "Release ${TAG}" > release-notes.md
              fi
            fi
            [ -s release-notes.md ] || echo "Release ${TAG}" > release-notes.md

            # No manifest to bump. Composite actions are identified by
            # the tag itself. Commit the rolled changelog (when any)
            # + tag current HEAD.
            # Pre-commit gate — hold the bot commit to the consumer's own
            # gate, through the binary (release#531 F1). arm-gate above
            # installed .release/ + provisioned the pinned toolset;
            # `release-core gate --hook` points lefthook at
            # .release/lefthook.yml (falling back to discovery for a
            # pre-migration root config). Replaces the drifted inline copy
            # that only detected ROOT configs — on a post-WS3 consumer it
            # silently SKIPPED the gate. SKIP_PRECOMMIT_GATE=true bypasses.
            if [ "${SKIP_PRECOMMIT_GATE:-false}" != "true" ]; then
              # --diff-filter=d excludes ONLY Deleted (lowercase = exclude
              # that status), keeping every path that still exists. The
              # changelog roll deletes unreleased-*.md fragments; a deleted
              # path can't be linted (lefthook's stage_fixed would
              # `git add --force` a vanished file → exit 128). The deletion
              # still commits via the staged index.
              mapfile -t staged_arr < <(git diff --cached --name-only --diff-filter=d)
              if [ "${#staged_arr[@]}" -gt 0 ]; then
                lefthook_file_args=()
                for f in "${staged_arr[@]}"; do
                  lefthook_file_args+=(--file "$f")
                done
                release-core gate --hook "${lefthook_file_args[@]}"
                if ! git diff --quiet; then
                  echo "Pre-commit gate produced auto-fixes — re-staging."
                  git add -u
                fi
              fi
            fi

            if ! git diff --cached --quiet; then
              git commit -m "chore: Release ${TAG}"
            fi
            # Annotate the tag with the rolled release notes when
            # available (#201 addendum). Falls back to a plain
            # "Release vX.Y.Z" if release-notes.md is empty.
            if [ -s release-notes.md ]; then
              git tag -a "${TAG}" -F release-notes.md
            else
              git tag -a "${TAG}" -m "Release ${TAG}"
            fi
            git push origin HEAD
            git push origin "${TAG}"
            TAG_SHA=$(git rev-parse HEAD)
          fi

          {
            echo "version=${NEW_VERSION}"
            echo "major=${MAJOR}"
            echo "prerelease=${IS_PRERELEASE}"
            echo "release-sha=${TAG_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload release notes
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # 2. Create the GitHub release. Marks the release as prerelease
  #    when semver carries a suffix.
  # -------------------------------------------------------------------
  release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Re-assert prerelease on BOTH paths: `gh release edit` leaves it
          # UNCHANGED unless --prerelease is passed, so the resume/exists path
          # would otherwise drop the flag for a `-rc`/`-release-rc` version
          # (release#726). Explicit boolean form makes it idempotent.
          prerelease_bool=false
          if [ "${PRERELEASE}" = "true" ]; then
            prerelease_bool=true
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — updating notes."
            gh release edit "${TAG}" --notes-file release-notes.md --prerelease="${prerelease_bool}"
          else
            gh release create "${TAG}" \
              --prerelease="${prerelease_bool}" \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi

      # release_core wheel publish (pip-bootstrap transport, ADR-0003).
      # Only this repo (arthur-debert/release, the gh-action stack's own
      # consumer) ships the release_core package; the step is
      # guarded so any other gh-action consumer without the package is a
      # clean no-op. When the package IS present the build/upload is a HARD
      # gate — a failed build or upload fails the release (set -euo pipefail,
      # no `|| true`). The asset name (default `python -m build` output,
      # `release_core-<ver>-py3-none-any.whl`) satisfies the boot resolver
      # regex `^release_core-.*\.whl$`.
      - name: Set up Python for wheel build
        if: hashFiles('templates/commons/lib/release_core/pyproject.toml') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build + upload release_core wheel
        if: hashFiles('templates/commons/lib/release_core/pyproject.toml') != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          # TAG is LOAD-BEARING for the build, not just the upload (release#758):
          # pyproject's `[tool.hatch.version] source = "code"` reads $TAG from this
          # env during `python -m build`, strips the leading `v`, and stamps it as
          # the wheel version (without it the build falls back to 0.0.0+dev). Do
          # not remove it from this step's env.
          TAG: v${{ needs.prepare.outputs.version }}
          PKG_DIR: templates/commons/lib/release_core
        run: |
          set -euo pipefail
          # `build` is CI-only tooling — it never becomes a runtime dep of
          # the package (pyproject `dependencies` stays empty by design).
          python -m pip install --upgrade build
          rm -rf "${PKG_DIR}/dist"
          # $TAG is exported above; the hatch code-version source reads it to
          # stamp the wheel version from the release tag.
          python -m build --wheel "${PKG_DIR}"
          # Exactly one wheel is expected. Collect matches into an array and
          # assert the count so a zero-match (build produced nothing) or a
          # multi-match (stale dist not cleaned) fails loudly with a clear
          # message instead of feeding gh a newline-joined / empty path.
          shopt -s nullglob
          wheels=("${PKG_DIR}"/dist/release_core-*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly 1 release_core wheel, found ${#wheels[@]}: ${wheels[*]:-<none>}" >&2
            exit 1
          fi
          echo "Uploading wheel: ${wheels[0]}"
          gh release upload "${TAG}" "${wheels[0]}" --clobber

  # -------------------------------------------------------------------
  # 3. Advance the floating-major branch (v1, v2, …) to point at the
  #    new tag. Skipped on prereleases — `1.0.0-rc.1` must not yank
  #    `v1` forward before the final ships. This is the dist channel
  #    for GH Actions: consumers pin `@v1` and rely on this advance.
  # -------------------------------------------------------------------
  advance-major:
    needs: [prepare, release]
    if: inputs.advance-major && needs.prepare.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Move v${{ needs.prepare.outputs.major }} → v${{ needs.prepare.outputs.version }}
        env:
          MAJOR: ${{ needs.prepare.outputs.major }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="v${MAJOR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force-push the floating-major branch to the new tag's
          # commit. --force-with-lease guards against racing pushes
          # (which would indicate the branch moved since checkout —
          # very rare for a release-time advance, but cheap insurance).
          git branch -f "${BRANCH}" "${TAG}"
          git push origin "${BRANCH}" --force-with-lease
          echo "Advanced ${BRANCH} → ${TAG}"
