name: GH action release

# Reusable release workflow for reusable GitHub Actions (composite
# actions + reusable workflows housed in the same repo). Consumers
# call this from their .github/workflows/release.yml as a thin caller
# pinned at @v1. See README §Stack matrix row "gh-action" and
# tracking issue #50.
#
# What's distinct about this stack
# --------------------------------
# 1. No package index. GitHub Marketplace lists the action straight
#    from the repo's release tags (toggled once via a repo-settings
#    checkbox at first release; nothing for CI to do).
# 2. The dist channel IS the **floating-major branch** (`v1`, `v2`).
#    Consumers pin `uses: <repo>@v1`; advancing `v1` to point at the
#    latest non-breaking tag is how fixes propagate to all callers.
#    This workflow handles that advance for non-prerelease releases.
# 3. arthur-debert/release is itself a canonical consumer. (We can't
#    use `@v1` to cut `@v1` — chicken/egg; first tag cut manually.
#    Subsequent tags can call this workflow once it ships.)
#
# What it does
# ------------
# 1. prepare — validate semver, ensure action.yml exists (proves
#    this IS a GH Action repo), roll changelog if present, commit
#    + tag + push.
# 2. release — create GH release with notes. Pre-release flag set
#    when the semver carries a suffix.
# 3. advance-major — for non-prerelease releases only, force-move
#    `v<MAJOR>` branch to the new tag. Skipped for prereleases so
#    `1.0.0-rc.1` doesn't yank `v1` forward.
#
# Out of scope (deliberately)
# ---------------------------
# - JS action `dist/` build. Pure-composite actions have no build.
#   When the first JS-action consumer surfaces, add a slice 2 with
#   a `app-bin/build-action.sh` convention hook + an artifact-
#   reupload step.
# - package.json version bump. Composite actions have no manifest;
#   the tag IS the version. JS-action support will add this.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release (bare semver, e.g. 1.3.4 or 2.0.0-rc.1). No leading v.'
        type: string
        required: true
      changelog-path:
        description: 'Path to CHANGELOG.md (Keep-a-Changelog format with `## [Unreleased]` section).'
        type: string
        required: false
        default: 'CHANGELOG.md'
      action-manifest:
        description: 'Path to action.yml / action.yaml at the action root. Verified to exist as a sanity check. Pass an empty string to skip the check — useful for multi-action repos (e.g. arthur-debert/release itself, which ships many composite actions under .github/actions/<name>/action.yml plus reusable workflows under .github/workflows/, but has no single action.yml at the root).'
        type: string
        required: false
        default: 'action.yml'
      advance-major:
        description: 'Move the `v<MAJOR>` floating branch to point at the new tag. Skipped automatically for prereleases.'
        type: boolean
        required: false
        default: true
      submodules:
        description: 'Pass `submodules: recursive` on checkout.'
        type: boolean
        required: false
        default: false

    secrets:
      RELEASE_TOKEN:
        description: 'PAT with repo scope for default-branch push AND force-push to the floating-major branch (bypasses ruleset). Falls back to GITHUB_TOKEN.'
        required: false

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------
  # 1. Prepare: validate, sanity-check, roll changelog, tag + push.
  # -------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
      major: ${{ steps.prep.outputs.major }}
      release-sha: ${{ steps.prep.outputs.release-sha }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: ${{ inputs.submodules && 'recursive' || '' }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Validate + detect resume
        id: prep
        shell: bash
        env:
          NEW_VERSION: ${{ inputs.version }}
          MANIFEST: ${{ inputs.action-manifest }}
          CHANGELOG: ${{ inputs.changelog-path }}
        run: |
          set -euo pipefail

          SEMVER="bin/share/semver-tool/semver"
          if [ ! -x "$SEMVER" ]; then
            echo "::error::semver-tool not found at $SEMVER — run release-sync to pull bin/share/semver-tool/ into this repo"
            exit 1
          fi

          if [[ "${NEW_VERSION}" =~ ^[vV] ]] \
              || [[ "$("$SEMVER" validate "${NEW_VERSION}")" != "valid" ]] \
              || [[ -n "$("$SEMVER" get build "${NEW_VERSION}")" ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH[-PRERELEASE] (got: ${NEW_VERSION})"
            exit 1
          fi

          MAJOR="$("$SEMVER" get major "${NEW_VERSION}")"
          IS_PRERELEASE=false
          if [[ -n "$("$SEMVER" get prerel "${NEW_VERSION}")" ]]; then
            IS_PRERELEASE=true
          fi

          # Sanity check — refuse to release a repo with no action.yml,
          # so a caller that accidentally points `gh-action.yml@v1` at
          # the wrong callee fails loud and early. Allow `.yaml` as a
          # fallback (GH accepts both). Empty MANIFEST disables the
          # check entirely (for multi-action repos that ship a bundle
          # of composite actions + reusable workflows but have no
          # single action.yml at the root).
          if [ -n "${MANIFEST}" ] && [ ! -f "${MANIFEST}" ]; then
            alt="${MANIFEST%.yml}.yaml"
            if [ "${MANIFEST}" != "${alt}" ] && [ -f "${alt}" ]; then
              MANIFEST="${alt}"
            else
              echo "::error::action manifest not found: ${MANIFEST} (or ${alt}). Is this a GH Actions repo? Pass action-manifest: '' to skip this check for multi-action repos."
              exit 1
            fi
          fi

          TAG="v${NEW_VERSION}"
          git fetch --tags origin >/dev/null 2>&1 || true

          # Resume case: tag exists. Trust it — no manifest version to
          # cross-check against (composite actions don't carry one).
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "${TAG}")
            echo "tag ${TAG} already exists at ${TAG_SHA} — resuming"

            # Reconstruct release notes from the existing changelog
            # entry so the release job has something to upload.
            if [ -n "${CHANGELOG}" ] && [ -f "${CHANGELOG}" ]; then
              if [ "${IS_PRERELEASE}" = "true" ]; then
                awk '/^## \[Unreleased\]/{c=1;next} c&&/^## \[/{exit} c&&/\S/{print}' \
                  "${CHANGELOG}" > release-notes.md
              else
                awk -v v="${NEW_VERSION}" '$0 ~ "^## \\[" v "\\]"{c=1;next} c&&/^## \[/{exit} c{print}' \
                  "${CHANGELOG}" > release-notes.md
              fi
              [ -s release-notes.md ] || echo "Release ${TAG}" > release-notes.md
            else
              echo "Release ${TAG}" > release-notes.md
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Roll changelog + extract notes. Four branches:
            #   1. CHANGELOG input empty → user opted out; write stub.
            #   2. Fragment-dir (per #201): CHANGELOG/ sibling dir exists
            #      → delegate to bin/changelog (cut + render). Fails
            #      loud if bin/changelog is missing — repo declared
            #      fragment-dir intent but didn't release-sync the tools.
            #   3. Single-file Keep-a-Changelog: extract from
            #      `## [Unreleased]` and roll into a versioned section.
            #   4. CHANGELOG specified but file missing → stub.
            if [ -z "${CHANGELOG:-}" ]; then
              echo "Release ${TAG}" > release-notes.md
            else
              CHANGELOG_DIR="$(dirname "${CHANGELOG}")/CHANGELOG"
              if [ -d "${CHANGELOG_DIR}" ]; then
                # Fragment-dir branch. Fail loud if the tooling isn't here.
                if [ ! -x bin/changelog ]; then
                  echo "::error::${CHANGELOG_DIR} exists (fragment-dir mode) but bin/changelog is missing or not executable."
                  echo "::error::Run 'release-sync' to pull bin/changelog* (with bin/share/semver-tool/) into this repo."
                  exit 1
                fi
                if [ "${IS_PRERELEASE}" != "true" ]; then
                  # bin/changelog walks up cwd for CHANGELOG/, so cd
                  # next to the changelog file first — otherwise on
                  # monorepos with multiple changelogs the wrong
                  # CHANGELOG/ gets cut. Mirrors bin-internal/roll-changelog.sh.
                  (
                    cd "$(dirname "${CHANGELOG}")"
                    bin/changelog new-version "${NEW_VERSION}"
                  )
                  awk 'NR==1 && /^## / { next } NR==2 && /^$/ { next } { print }' \
                    "${CHANGELOG_DIR}/${NEW_VERSION}.md" > release-notes.md
                  git add "${CHANGELOG}" "${CHANGELOG_DIR}/"
                else
                  # Prereleases don't cut — concat existing fragments.
                  # LC_ALL=C keeps order deterministic across BSD + GNU.
                  mapfile -t fragments < <(LC_ALL=C ls "${CHANGELOG_DIR}"/unreleased-*.md 2>/dev/null || true)
                  if [ "${#fragments[@]}" -gt 0 ]; then
                    cat "${fragments[@]}" > release-notes.md
                  else
                    echo "Release ${TAG}" > release-notes.md
                  fi
                fi
              elif [ -f "${CHANGELOG}" ]; then
                # Single-file Keep-a-Changelog branch.
                awk '/^## \[Unreleased\]/{c=1;next} c&&/^## \[/{exit} c&&/\S/{print}' \
                  "${CHANGELOG}" > release-notes.md
                if [ "${IS_PRERELEASE}" != "true" ]; then
                  # Bump the [Unreleased] header in-place. printf '\n'
                  # (not sed's \n) keeps the substitution portable
                  # across GNU + BSD sed.
                  today=$(date -u +%F)
                  replacement="## [Unreleased]"$'\n\n'"## [${NEW_VERSION}] - ${today}"
                  awk -v repl="${replacement}" '
                    /^## \[Unreleased\]/ { print repl; next } { print }
                  ' "${CHANGELOG}" > "${CHANGELOG}.tmp"
                  mv "${CHANGELOG}.tmp" "${CHANGELOG}"
                  git add "${CHANGELOG}"
                fi
              else
                # CHANGELOG specified but neither file nor dir on disk.
                echo "Release ${TAG}" > release-notes.md
              fi
            fi
            [ -s release-notes.md ] || echo "Release ${TAG}" > release-notes.md

            # No manifest to bump. Composite actions are identified by
            # the tag itself. Commit the rolled changelog (when any)
            # + tag current HEAD.
            # Pre-commit gate — hold the bot commit to the consumer's
            # own gate. Equivalent to
            # .github/actions/run-precommit-gate@v1 (canonical
            # reference); inlined because this step is a single `run:`
            # block. Set SKIP_PRECOMMIT_GATE=true to bypass.
            if [ "${SKIP_PRECOMMIT_GATE:-false}" != "true" ]; then
              mapfile -t staged_arr < <(git diff --cached --name-only)
              if [ "${#staged_arr[@]}" -gt 0 ]; then
                if [ -f lefthook.yml ] || [ -f .lefthook.yml ] || [ -f lefthook.yaml ]; then
                  echo "Pre-commit gate: lefthook"
                  lefthook_file_args=()
                  for f in "${staged_arr[@]}"; do
                    lefthook_file_args+=(--file "$f")
                  done
                  if [ -f pnpm-lock.yaml ]; then
                    corepack enable >/dev/null 2>&1 || true
                    pnpm install --frozen-lockfile --ignore-scripts
                    pnpm exec lefthook run pre-commit "${lefthook_file_args[@]}"
                  elif [ -f package-lock.json ]; then
                    npm ci --ignore-scripts
                    npx --yes lefthook run pre-commit "${lefthook_file_args[@]}"
                  elif [ -f yarn.lock ]; then
                    corepack enable >/dev/null 2>&1 || true
                    yarn install --frozen-lockfile --ignore-scripts
                    yarn exec lefthook run pre-commit "${lefthook_file_args[@]}"
                  elif command -v lefthook >/dev/null 2>&1; then
                    lefthook run pre-commit "${lefthook_file_args[@]}"
                  else
                    npx --yes lefthook run pre-commit "${lefthook_file_args[@]}"
                  fi
                elif [ -f .pre-commit-config.yaml ] || [ -f .pre-commit-config.yml ]; then
                  echo "Pre-commit gate: pre-commit framework"
                  if command -v pipx >/dev/null 2>&1; then
                    pipx run pre-commit run --files "${staged_arr[@]}"
                  else
                    python3 -m pip install --user --quiet pre-commit
                    "$(python3 -m site --user-base)/bin/pre-commit" run --files "${staged_arr[@]}"
                  fi
                elif [ -d .husky ] && [ -f .husky/pre-commit ]; then
                  echo "Pre-commit gate: husky"
                  bash .husky/pre-commit
                fi
                if ! git diff --quiet; then
                  echo "Pre-commit gate produced auto-fixes — re-staging."
                  git add -u
                fi
              fi
            fi

            if ! git diff --cached --quiet; then
              git commit -m "chore: Release ${TAG}"
            fi
            # Annotate the tag with the rolled release notes when
            # available (#201 addendum). Falls back to a plain
            # "Release vX.Y.Z" if release-notes.md is empty.
            if [ -s release-notes.md ]; then
              git tag -a "${TAG}" -F release-notes.md
            else
              git tag -a "${TAG}" -m "Release ${TAG}"
            fi
            git push origin HEAD
            git push origin "${TAG}"
            TAG_SHA=$(git rev-parse HEAD)
          fi

          {
            echo "version=${NEW_VERSION}"
            echo "major=${MAJOR}"
            echo "prerelease=${IS_PRERELEASE}"
            echo "release-sha=${TAG_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # 2. Create the GitHub release. Marks the release as prerelease
  #    when semver carries a suffix.
  # -------------------------------------------------------------------
  release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [ "${PRERELEASE}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — updating notes."
            gh release edit "${TAG}" --notes-file release-notes.md
          else
            gh release create "${TAG}" \
              ${prerelease_flag} \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi

  # -------------------------------------------------------------------
  # 3. Advance the floating-major branch (v1, v2, …) to point at the
  #    new tag. Skipped on prereleases — `1.0.0-rc.1` must not yank
  #    `v1` forward before the final ships. This is the dist channel
  #    for GH Actions: consumers pin `@v1` and rely on this advance.
  # -------------------------------------------------------------------
  advance-major:
    needs: [prepare, release]
    if: inputs.advance-major && needs.prepare.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Move v${{ needs.prepare.outputs.major }} → v${{ needs.prepare.outputs.version }}
        env:
          MAJOR: ${{ needs.prepare.outputs.major }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="v${MAJOR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force-push the floating-major branch to the new tag's
          # commit. --force-with-lease guards against racing pushes
          # (which would indicate the branch moved since checkout —
          # very rare for a release-time advance, but cheap insurance).
          git branch -f "${BRANCH}" "${TAG}"
          git push origin "${BRANCH}" --force-with-lease
          echo "Advanced ${BRANCH} → ${TAG}"
