name: Release

# Thin caller of this repo's own gh-action.yml@main.
#
# This repo cuts ITS OWN release tags via the shared gh-action.yml stack
# workflow, pinned to @main (NOT a frozen @vN tag) ON PURPOSE: release must
# self-cut with its OWN CURRENT cut machinery, else a fix to gh-action.yml's
# cut-critical logic can never ship — the chicken-and-egg that bit the v3.4.0
# cut, when gh-action.yml@v3 (frozen at v3.3.0) carried a stale `--major v2`
# that WS8's (#765) asset-fallback removal turned into a hard index miss. @main
# always runs the fix in the same commit. (The floating-major dogfood argument
# is for CONSUMER-facing reusable workflows; this is release's private self-cut.)
# Chicken-and-egg note: the first tag that included gh-action.yml had to be cut
# manually (v1.4.0); every subsequent cut goes through here.
#
# What `gh-action.yml@main` gives us here:
# - validate semver + ensure release-time invariants
# - tag + push HEAD
# - GH release with notes rolled from the CHANGELOG/ fragment dir at
#   cut (changelog-path: CHANGELOG.md → fragment-directory model; see
#   the with: block).
# - publish the `release_core` wheel as a release asset (pip-bootstrap
#   transport, ADR-0003)
# - advance the floating-major branch (derived from the released
#   version, e.g. v2) → new tag (the standard distribution mechanism)
#
# Manual fall-back: if this workflow ever can't run (org outage,
# permissions change), the entire flow is still doable by hand:
#   git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z
#   git branch -f vX vX.Y.Z && git push origin vX --force-with-lease   # vX = the released major
#   gh release create vX.Y.Z --notes "..."
# See CHANGELOG/ fragments for the format of release-note
# bodies we usually attach.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (bare semver, e.g. 1.4.2 or 2.0.0-rc.1). No leading v.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: arthur-debert/release/.github/workflows/gh-action.yml@canary/d7962c83a6a7
    with:
      version: ${{ inputs.version }}
      # Multi-action repo: many composite actions under
      # .github/actions/<name>/action.yml + reusable workflows.
      # No single root action.yml — skip the manifest check.
      action-manifest: ''
      # Roll the changelog at cut via the FRAGMENT-DIRECTORY model (#201):
      # gh-action.yml sees the `CHANGELOG/` sibling dir and runs
      # `changelog new-version <version>` (cut the unreleased-*.md fragments
      # into `CHANGELOG/<version>.md`, render `CHANGELOG.md`), commits both,
      # and uses the version body as the GH release notes. The admin
      # RELEASE_TOKEN bypasses the main ruleset for that commit. (This is NOT
      # the legacy single-file Keep-a-Changelog path.) Previously this was
      # `''` (opted out), so fragments piled up unconsumed — that was the bug.
      changelog-path: CHANGELOG.md
      advance-major: true
    secrets:
      # RELEASE_TOKEN unblocks the v1 force-push (the default branch
      # is ruleset-protected; GITHUB_TOKEN can't bypass; RELEASE_TOKEN
      # does). Without it the advance-major step's final push fails.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
