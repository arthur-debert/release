name: tauri-app release

# Reusable release workflow for Tauri 2.x desktop apps. Consumers
# call this from their .github/workflows/release.yml as a thin
# caller pinned at @v1. See README §Stack matrix row "tauri-app"
# and tracking issue #72.
#
# Shape & scope (slice 1)
# -----------------------
# - Bump package.json + src-tauri/Cargo.toml + src-tauri/tauri.conf.json
#   together (Tauri's three version files; all three need to stay in
#   sync or `tauri build` warns/breaks).
# - Build matrix: macos-latest, ubuntu-latest, windows-latest.
#   Single target per platform; universal macOS binary deferred to
#   slice 2.
# - macOS code-signing via the Apple Developer p12 cert and
#   identity (Tauri's standard APPLE_* env vars — different names
#   from electron-builder's CSC_LINK).
# - Optional notarization (input + secret-presence gated).
# - GH release with per-platform bundle assets attached.
#
# Out of scope (deferred slices)
# ------------------------------
# - Updater signing keys (TAURI_SIGNING_PRIVATE_KEY) → slice 2.
# - Universal macOS binary (--target universal-apple-darwin) → slice 2.
# - Auto-updater server config (latest.json on a release host) → slice 3.
# - Linux .deb / .rpm / .AppImage signing → slice 3.
#
# Compared to the sibling electron-app stack
# ------------------------------------------
# Shares the per-platform-matrix shape, the preflight secret
# validation, and the partial-release-prevention gating on the
# release job. Differs on:
# - `tauri build` (not electron-builder) — produces native Rust
#   binaries via cargo + bundles via Tauri's bundler.
# - Signing env-var names (APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY,
#   not CSC_LINK / CSC_KEY_PASSWORD). Same underlying Apple
#   toolchain; different bindings.
# - Three version files (npm + Cargo + tauri.conf), not just one.
#
# Build entry (resolved by bin-internal/build-tauri.sh, in order)
# ----------------------------------------------------------------
#   1. `app-bin/build-tauri.sh` — legacy consumer-authored hook
#      (tracked by the consumer, so it survives a plain checkout).
#   2. `npx tauri build` — the standard entry.
#
# (A "prefer the managed bin/build" branch used to sit first; post-WS7
# bin/build is an untracked ephemeral mirror, absent on a plain
# checkout, so that branch was dead code — removed per release#588.)
#
# Any pre-fetch / pre-build steps (upstream WASM, codegen) belong in
# tauri.conf.json's `beforeBuildCommand` — that's tauri's own
# pre-build hook, runs uniformly regardless of which build entry
# fires. phos-app uses this pattern for `pnpm fetch:wasm`.
#
# Optional `prep-script` input
# ----------------------------
# Consumers with extra version-bearing files beyond the standard
# three (package.json + Cargo.toml + tauri.conf.json) can provide a
# `prep-script` input. The workflow execs it BEFORE the standard
# three-file bump, in the prepare job, with `NEW_VERSION` in env.
# The script is responsible for `git add`-ing its own mutations.
# Use for: WASM-upstream pins, codegen output, additional config
# files, submodule pointers. phos-app uses this for its
# `deps.json` (WASM upstream pin).
#
# CHANGELOG format contract
# -------------------------
# This workflow expects strict Keep-a-Changelog format:
#
#   ## [Unreleased]
#   ## [X.Y.Z] - YYYY-MM-DD
#
# Same contract as `prepare-release-npm` / `prepare-release-python`
# and what's used across python-pkg, vscode-ext, mkdocs-lex,
# tree-sitter-lex. The `## [Unreleased]` → `## [<version>] - <date>`
# rename happens automatically. If a consumer also has a Layer 0
# `update-release` primitive (lex-fmt cascade pattern), that script
# MUST match this format — competing renames (e.g. `## v<v> (<date>)`
# vs `## [<v>] - <date>`) cause whichever runs second to silently
# no-op or hard-fail on the missing `## [Unreleased]`.
#
# Dual-mode operation
# -------------------
# Mode A — Standalone. The workflow handles version bump + tag +
#          push + build + release. Trigger: `gh workflow run
#          release.yml -f version=X.Y.Z`. Used by consumers without
#          their own release-orchestration scripts.
#
# Mode B — Layer 0 + workflow (lex-fmt cascade pattern). A Layer 0
#          primitive (e.g. `scripts/release/update-release`) bumps
#          consumer-specific files + tags + pushes LOCALLY. The
#          workflow runs in CI, hits the resume path (tag already
#          exists, package.json matches NEW_VERSION), skips the
#          bump entirely, and just does build + release.
#          Used by phos-app + lex-fmt cascade consumers.
#
# The resume path is not a "re-run on failure" fallback — it's the
# explicit integration point with Layer 0 release primitives. In
# Mode B, the workflow's prep-script + standard bumps are dead
# code; only the resume branch executes.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release (bare semver, e.g. 0.2.0 or 1.0.0-rc.1). No leading v.'
        type: string
        required: true
      changelog-path:
        description: 'Path to CHANGELOG.md (Keep-a-Changelog with `## [Unreleased]`).'
        type: string
        required: false
        default: 'CHANGELOG.md'
      tauri-dir:
        description: 'Path to the Tauri project root (where src-tauri/ lives). Override for monorepo layouts.'
        type: string
        required: false
        default: '.'
      wasm-cache-path:
        description: |
          Optional path(s) to the consumer's prebuilt WASM output dir(s),
          cached under the WS-B per-OS key, keyed on the `tauri-dir`-relative
          `<tauri-dir>/src-tauri/Cargo.lock` (see the "Cache WASM bundle"
          step). For `tauri-dir: '.'` (phos) that resolves to the same file
          and hash as WS-B's `src-tauri/Cargo.lock`, so the shared `wasm-v1-`
          blob with tauri-ci is preserved. The WASM bundle is a pure
          function of the Cargo.lock-pinned phos-core sha, so a cache hit
          skips the `wasm-pack build` that tauri's `beforeBuildCommand`
          (e.g. phos-app's `pnpm fetch:wasm`) would otherwise run. Empty =
          no WASM cache (the step is skipped). Newline-separated if
          multiple dirs (e.g. one per wasm crate) — actions/cache treats
          only newline-separated `path:` entries as multiple paths.
        type: string
        required: false
        default: ''
      bundle-targets-mac:
        description: 'Tauri bundle targets for macOS (passed to `tauri build --bundles`). Empty = use tauri.conf.json setting.'
        type: string
        required: false
        default: ''
      bundle-targets-linux:
        description: 'Tauri bundle targets for Linux. Empty = use tauri.conf.json setting.'
        type: string
        required: false
        default: ''
      bundle-targets-windows:
        description: 'Tauri bundle targets for Windows. Empty = use tauri.conf.json setting.'
        type: string
        required: false
        default: ''
      build-mac:
        description: 'Build the macOS bundle. Default true.'
        type: boolean
        required: false
        default: true
      build-linux:
        description: 'Build the Linux bundle. Default true.'
        type: boolean
        required: false
        default: true
      build-windows:
        description: 'Build the Windows bundle. Default true.'
        type: boolean
        required: false
        default: true
      notarize:
        description: 'Submit the macOS bundle for Apple notarization. Default true when build-mac is true. Set to false for fast unsigned-dev builds.'
        type: boolean
        required: false
        default: true
      sign-mode:
        description: |
          How the macOS bundle gets signed + notarized (epic #811).
            inline   — (default) tauri signs + notarizes inside the bundle
                       job from the APPLE_* env. Byte-identical to the
                       historical behavior; a caller that omits this sees no
                       change.
            post-hoc — the bundle job builds UNSIGNED (compile + bundle as
                       separate steps, no APPLE_* env), uploads the unsigned
                       .app, and a dedicated `sign` job codesigns + reseals
                       the .dmg with hdiutil + notarizes via the reusable
                       sign-notarize-mac workflow. Use to decouple signing
                       from the build, or to put signing on its own runner.
          Linux / Windows are unaffected by this input.
        type: string
        required: false
        default: 'inline'
      node-version:
        description: 'Node.js version for the frontend build env.'
        type: string
        required: false
        default: '20'
      rust-toolchain:
        description: 'Rust toolchain channel.'
        type: string
        required: false
        default: 'stable'
      submodules:
        description: 'Pass `submodules: recursive` on checkout.'
        type: boolean
        required: false
        default: false
      prep-script:
        description: |
          Optional path (relative to repo root) to a consumer-supplied
          prep script. Runs in the prepare job BEFORE the standard
          three-file version bump, with NEW_VERSION + TAURI_DIR in
          env. The script is responsible for `git add`-ing its own
          mutations. Use for consumer-specific bumps beyond the
          standard three files: upstream pins (e.g. phos-app's
          deps.json), codegen output, submodule pointers.
          Not invoked in the resume path (when the tag already
          exists).
        type: string
        required: false
        default: ''

    secrets:
      RELEASE_TOKEN:
        description: 'PAT with repo scope for default-branch push. Falls back to GITHUB_TOKEN.'
        required: false
      APPLE_CERTIFICATE:
        description: 'Base64-encoded Apple Developer ID Application .p12 certificate. Required when build-mac is true.'
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: 'Password for the .p12 certificate. Optional — leave empty for passwordless .p12s (valid per PKCS12 spec; macOS `security import` handles them).'
        required: false
      APPLE_SIGNING_IDENTITY:
        description: 'Apple signing identity, e.g. "Developer ID Application: Your Name (TEAMID)". Required when build-mac is true.'
        required: false
      APPLE_ID:
        description: 'Apple ID email for notarization. Required when notarize is true.'
        required: false
      APPLE_PASSWORD:
        description: 'App-specific password for the Apple ID. Required when notarize is true.'
        required: false
      APPLE_TEAM_ID:
        description: 'Apple Developer Team ID. Required when notarize is true.'
        required: false
      sccache_gcs_key:
        description: |
          base64 GCS service-account key (the `SCCACHE_GCS_KEY` fleet
          secret) enabling the shared GCS-backed sccache compiler cache
          alongside the src-tauri release Swatinem cache. Optional: when
          unset the build uses Swatinem caching only.
        required: false

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------
  # 0. Preflight: fail fast before prepare bumps + tags. Cheapest
  #    checks first — an empty changelog (nothing to release) fails in
  #    seconds, needing only a bare checkout (no toolchain / deps /
  #    release_core install), before the prepare job's full setup.
  #    Apple-secrets validation runs only when signing is requested.
  # -------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    env:
      BUILD_MAC: ${{ inputs.build-mac }}
      NOTARIZE: ${{ inputs.notarize }}
      APPLE_CERT_PRESENT: ${{ secrets.APPLE_CERTIFICATE != '' && 'yes' || 'no' }}
      APPLE_ID_PRESENT: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && 'yes' || 'no' }}
      NOTARY_ID_PRESENT: ${{ secrets.APPLE_ID != '' && 'yes' || 'no' }}
      NOTARY_PASS_PRESENT: ${{ secrets.APPLE_PASSWORD != '' && 'yes' || 'no' }}
      NOTARY_TEAM_PRESENT: ${{ secrets.APPLE_TEAM_ID != '' && 'yes' || 'no' }}
    steps:
      # Fail fast on a bad sign-mode (e.g. a `posthoc` typo): otherwise BOTH
      # build paths' `if:` are false, the build produces nothing, and the run
      # dies deep in `collect-tauri-bundles.sh` with a confusing "bundle root
      # not found". No checkout needed — pure input validation.
      - name: Validate sign-mode
        shell: bash
        env:
          SIGN_MODE: ${{ inputs.sign-mode }}
        run: |
          case "$SIGN_MODE" in
            inline|post-hoc) ;;
            *)
              echo "::error::invalid sign-mode: '$SIGN_MODE' (expected 'inline' or 'post-hoc')"
              exit 1
              ;;
          esac

      # Pin `ref: main` (matching the prepare job's checkout) so preflight
      # validates the exact changelog prepare will bump + tag, even when the
      # reusable workflow runs from a non-main ref (e.g. a harness branch).
      # Shallow: preflight only reads the changelog, no tag/push history.
      - uses: actions/checkout@v6
        with:
          ref: main
          submodules: ${{ inputs.submodules && 'recursive' || '' }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/checkout@v6
        with:
          repository: arthur-debert/release
          ref: v3
          path: .release
          sparse-checkout: bin-internal

      # Cheapest possible gate: no toolchain, no release_core install.
      - name: Check unreleased changelog content
        shell: bash
        env:
          CHANGELOG: ${{ inputs.changelog-path }}
        run: bash .release/bin-internal/check-changelog-unreleased.sh

      # INLINE mode only. Gate on Apple secrets when signing is requested
      # (build-mac AND notarization or an explicit signing identity). A
      # no-sign mac build (notarize=false, no identity) must not fail for
      # absent Apple secrets. The inline path passes APPLE_SIGNING_IDENTITY
      # into `tauri build`, so the existing action (which requires it) is
      # correct here.
      - name: Validate Apple secrets (inline)
        if: ${{ inputs.sign-mode == 'inline' && inputs.build-mac && (inputs.notarize || env.APPLE_ID_PRESENT == 'yes') }}
        uses: arthur-debert/release/.github/actions/validate-apple-secrets@v3

      # POST-HOC mode. The `sign` job's sign-mac composite derives the
      # identity from the imported cert via `security find-identity`, so
      # APPLE_SIGNING_IDENTITY is NOT needed — only the cert (always) and the
      # notary trio (when notarize). Validate exactly those here so missing
      # creds fail fast in preflight instead of deep in the sign job (or
      # silently skipping notarization).
      - name: Validate Apple secrets (post-hoc)
        if: ${{ inputs.sign-mode == 'post-hoc' && inputs.build-mac }}
        shell: bash
        run: |
          fail=0
          if [ "${APPLE_CERT_PRESENT}" != "yes" ]; then
            echo "::error::sign-mode=post-hoc with build-mac=true requires APPLE_CERTIFICATE (the Developer ID .p12)"
            fail=1
          fi
          if [ "${NOTARIZE}" = "true" ]; then
            [ "${NOTARY_ID_PRESENT}" = "yes" ]   || { echo "::error::notarize=true requires APPLE_ID"; fail=1; }
            [ "${NOTARY_PASS_PRESENT}" = "yes" ] || { echo "::error::notarize=true requires APPLE_PASSWORD"; fail=1; }
            [ "${NOTARY_TEAM_PRESENT}" = "yes" ] || { echo "::error::notarize=true requires APPLE_TEAM_ID"; fail=1; }
          fi
          exit "${fail}"

  # -------------------------------------------------------------------
  # 1. Prepare: bump all three version files (package.json,
  #    src-tauri/Cargo.toml, src-tauri/tauri.conf.json), roll
  #    CHANGELOG, commit + tag + push.
  # -------------------------------------------------------------------
  prepare:
    needs: preflight
    runs-on: ubuntu-latest
    # contents: write for the bump commit + tag push.
    #
    # NO `checks: read` here, deliberately: a reusable workflow's job permissions
    # are CAPPED by the CALLER's grant, and once a caller sets ANY explicit
    # permission (consumers set `contents: write`), every other scope defaults to
    # `none`. A job requesting `checks: read` the caller only allows as `none` is
    # a HARD validation error → startup_failure on EVERY consumer run (#825).
    # The base-sha CI-green assertion (WS2 #811) instead reaches the Checks API
    # via gh-token = the RELEASE_TOKEN PAT (repo scope ⊇ checks:read), which
    # bypasses workflow `permissions:` entirely. A consumer with only the default
    # github.token (no PAT) must grant `checks: read` at THEIR caller — the
    # reusable job can't self-grant it; without it the assertion surfaces an
    # explicit "needs checks: read" error rather than a fleet-wide startup_failure.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prep.outputs.version }}
      release-sha: ${{ steps.prep.outputs.release-sha }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: ${{ inputs.submodules && 'recursive' || '' }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: arthur-debert/release/.github/actions/prepare-release-tauri@v3
        id: prep
        with:
          version: ${{ inputs.version }}
          changelog-path: ${{ inputs.changelog-path }}
          tauri-dir: ${{ inputs.tauri-dir }}
          prep-script: ${{ inputs.prep-script }}
          # Authenticates the base-sha CI-green assertion's `gh api` check-runs
          # query (WS2 #811). Reads private-repo check-runs too.
          gh-token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Upload release notes
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # 2. Build matrix — one bundle per platform. We compute the matrix
  #    dynamically from the build-{mac,linux,windows} inputs so a
  #    consumer can opt-out per-platform without unused matrix
  #    entries cluttering the run.
  # -------------------------------------------------------------------
  build-matrix:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: arthur-debert/release/.github/actions/compute-tauri-matrix@v3
        id: matrix
        with:
          build-mac: ${{ inputs.build-mac }}
          build-linux: ${{ inputs.build-linux }}
          build-windows: ${{ inputs.build-windows }}
          bundle-targets-mac: ${{ inputs.bundle-targets-mac }}
          bundle-targets-linux: ${{ inputs.bundle-targets-linux }}
          bundle-targets-windows: ${{ inputs.bundle-targets-windows }}

  build:
    needs: [prepare, build-matrix]
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.build-matrix.outputs.targets) }}
    runs-on: ${{ matrix.t.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          submodules: ${{ inputs.submodules && 'recursive' || '' }}

      - uses: actions/checkout@v6
        with:
          repository: arthur-debert/release
          ref: v3
          path: .release
          sparse-checkout: bin-internal

      # corepack MUST run before setup-node, because setup-node@v6 with
      # `cache: 'pnpm'` invokes `pnpm store path` at setup time to compute
      # the cache key. Without pnpm on PATH, that call hard-fails before any
      # later step runs.
      #
      # NOT `pnpm/action-setup`: the phos-editor org enterprise Actions policy
      # allows only GitHub-authored + verified-Marketplace actions, and
      # pnpm/action-setup is unverified → it startup-fails the workflow.
      # corepack (bundled with Node) provisions pnpm from the consumer's
      # `packageManager` pin and is policy-clean.
      - name: Enable corepack (when pnpm/yarn lockfile present)
        # Cover yarn too: setup-node below selects `cache: yarn` when yarn.lock
        # is present, and that cache step calls the package manager at setup —
        # so yarn must be on PATH (via corepack) first, same as pnpm.
        if: hashFiles('pnpm-lock.yaml') != '' || hashFiles('yarn.lock') != ''
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') != '' && 'npm' || (hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || (hashFiles('yarn.lock') != '' && 'yarn' || '')) }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      # Warm-cache reuse of compiled RELEASE-PROFILE dependencies, reused
      # release-to-release on `main` — the dominant cost on the Linux leg.
      #   - Distinct `tauri-release` key (NOT shared with CI's debug-profile
      #     `tauri-core`), so release and debug compiled objects never mix.
      #   - Swatinem prunes the workspace's own crates from the saved
      #     `target/`, so OUR first-party code is always recompiled from
      #     source — no stale first-party object can enter a signed artifact;
      #     only the pinned dependencies are reused.
      #   - Safe to reuse those compiled deps because: deps are lockfile-pinned,
      #     the cache key includes the rustc version + OS, and our only build
      #     script is the stock `tauri_build::build()` (the app version comes
      #     from the tracked `tauri.conf.json`, not an undeclared `build.rs`
      #     input).
      #   - `save-if: github.ref == refs/heads/main` makes main releases the
      #     sole WRITER; PR / dispatch releases are pure READERS. The warm
      #     benefit therefore appears only once this lands on `main` (branch
      #     caches don't propagate up — GitHub cache security scoping).
      # mac/windows legs are unaffected: no main release has populated their
      # cache yet, so they find no warm entry and build cold as before.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.tauri-dir }}/src-tauri
          shared-key: tauri-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Enable sccache (GCS, shared across branches)
        uses: arthur-debert/release/.github/actions/setup-sccache@v3
        with:
          gcs-key: ${{ secrets.sccache_gcs_key }}

      - name: Install Linux Tauri deps
        if: matrix.t.platform == 'linux'
        run: bash .release/bin-internal/install-tauri-linux-deps.sh

      - name: Install macOS fast linker (lld) if selected
        # This build job uses dtolnay/rust-toolchain directly, not the
        # setup-rust composite, so it installs its own mac linker. Detection-
        # based + idempotent: only when the repo's .cargo/config.toml selects
        # `-fuse-ld=lld` and lld isn't already present. The Linux side gets mold
        # from install-tauri-linux-deps.sh above. (Robustness for a committed
        # linker config, not speed — phos-editor/app#318.)
        if: matrix.t.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          # Detect in TRACKED .cargo/config.toml only (git ls-files), never the
          # restored target/ tree, so this stays cheap.
          sel_lld=""
          while IFS= read -r f; do
            grep -q 'fuse-ld=lld' "$f" 2>/dev/null && { sel_lld=1; break; }
          done < <(git ls-files 2>/dev/null | grep -E '(^|/)\.cargo/config\.toml$')
          if [ -n "$sel_lld" ] && ! command -v ld64.lld >/dev/null 2>&1; then
            brew install lld
          fi

      - name: Install JS deps
        shell: bash
        env:
          TAURI_DIR: ${{ inputs.tauri-dir }}
        run: bash .release/bin-internal/install-js-deps.sh

      # WASM bundle cache (WS-B convention). `runner.os` scopes the key per
      # leg, so each OS reads only its own writer. The bundle is a pure
      # function of the Cargo.lock-pinned phos-core sha, so a hit lets
      # tauri's `beforeBuildCommand` skip `wasm-pack build`. Gated on the
      # `wasm-cache-path` input — no path, no cache step.
      #
      # The Cargo.lock is resolved under `tauri-dir`: `hashFiles('src-tauri/
      # Cargo.lock')` would return empty for a monorepo (`tauri-dir != '.'`),
      # collapsing every monorepo caller onto the bare `wasm-v1-<os>-` key.
      # For phos (`tauri-dir: '.'`) `format('{0}/src-tauri/Cargo.lock', '.')`
      # → `./src-tauri/Cargo.lock`, the SAME file (and hash) as WS-B's
      # `src-tauri/Cargo.lock`, so the shared `wasm-v1-` blob with tauri-ci
      # is preserved.
      - name: Cache WASM bundle
        if: inputs.wasm-cache-path != '' && hashFiles(format('{0}/src-tauri/Cargo.lock', inputs.tauri-dir)) != ''
        uses: actions/cache@v5
        with:
          path: ${{ inputs.wasm-cache-path }}
          key: wasm-v1-${{ runner.os }}-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', inputs.tauri-dir)) }}

      # Apple signing env is set ONLY in inline mode — in post-hoc mode the
      # bundle must be produced UNSIGNED (no APPLE_* in the build env), and the
      # dedicated `sign` job signs it afterwards.
      - name: Set Apple signing env (macOS, signing only)
        if: matrix.t.platform == 'mac' && inputs.sign-mode == 'inline' && !inputs.notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SIGNING_ONLY: 'true'
        run: bash .release/bin-internal/setup-tauri-signing-env.sh

      - name: Set Apple signing + notarization env (macOS)
        if: matrix.t.platform == 'mac' && inputs.sign-mode == 'inline' && inputs.notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .release/bin-internal/setup-tauri-signing-env.sh

      # `tauri build` compiles src-tauri/. When the project pins a PRIVATE git
      # dependency, cargo can't clone it without auth — set up git-CLI fetch
      # auth (own step: the CARGO_NET_GIT_FETCH_WITH_CLI it writes to
      # $GITHUB_ENV persists into the Build step). No-op without a token.
      - name: Authenticate cargo for private git deps
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: bash .release/bin-internal/setup-cargo-git-auth.sh

      # --- inline mode: compile + bundle + sign in one tauri invocation ---
      # Byte-identical to the historical single Build step; the APPLE_* env set
      # above makes tauri sign + notarize internally.
      - name: Build
        if: inputs.sign-mode == 'inline'
        shell: bash
        env:
          BUNDLES: ${{ matrix.t.bundles }}
          TAURI_DIR: ${{ inputs.tauri-dir }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: bash .release/bin-internal/build-tauri.sh

      # --- post-hoc mode: compile and bundle as SEPARATE named steps, for
      # per-phase visibility (a reader attributes time to deps / compile /
      # bundle). No APPLE_* env → the bundle is UNSIGNED; the `sign` job signs
      # it afterwards. Same two steps on every platform (only mac is signed
      # post-hoc, but compile/bundle split is uniform).
      - name: Compile (no bundle)
        if: inputs.sign-mode == 'post-hoc'
        shell: bash
        env:
          BUILD_PHASE: compile
          TAURI_DIR: ${{ inputs.tauri-dir }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: bash .release/bin-internal/build-tauri.sh

      - name: Bundle (unsigned)
        if: inputs.sign-mode == 'post-hoc'
        shell: bash
        env:
          BUNDLES: ${{ matrix.t.bundles }}
          TAURI_DIR: ${{ inputs.tauri-dir }}
          PLATFORM: ${{ matrix.t.platform }}
        run: bash .release/bin-internal/bundle-tauri.sh

      - name: Collect bundles
        id: bundles
        shell: bash
        env:
          TAURI_DIR: ${{ inputs.tauri-dir }}
          PLATFORM: ${{ matrix.t.platform }}
        run: bash .release/bin-internal/collect-tauri-bundles.sh

      # NOTE: the packaged-binary smoke step (app-bin/smoke-hook.sh) was
      # removed as dead code: post-WS7 the hook is an untracked ephemeral
      # mirror, absent on a plain checkout, so its existence guard never
      # fired (release#588). Restoring packaged smoke testing (install
      # bin/check first) vs retiring the hook templates is tracked in release#590.

      - name: Upload platform bundle
        uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.t.platform }}
          path: ${{ steps.bundles.outputs.dir }}/*
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # 2b. Post-hoc macOS signer (sign-mode: post-hoc only). Downloads the
  #     UNSIGNED bundle-mac artifact, codesigns + reseals + notarizes via
  #     the consumer-agnostic reusable workflow, uploads bundle-mac-signed.
  #     Skipped entirely in inline mode and when mac isn't built.
  #
  #     FULL `@v3` ref, NOT a local `./` ref. A nested reusable-workflow's
  #     local `./` path resolves against the TOP-LEVEL caller's repo
  #     (the consumer, e.g. phos-editor/app) — NOT arthur-debert/release —
  #     so GitHub can't find it and the whole workflow graph fails to
  #     compile at startup (startup_failure, 0 jobs). Local reusable-workflow
  #     refs only work when caller and callee live in the SAME repo; a
  #     cross-repo consumer needs the full `owner/repo/.github/workflows/
  #     <file>@<ref>` form. `@v3` is production-correct (v3 carries this
  #     workflow) and matches the composite `@v3` refs inside it.
  #     (actionlint + the workflow-action-major guard both PASSED the local
  #     ref — only a live cross-repo dispatch surfaced it; release RC #823.)
  # -------------------------------------------------------------------
  sign:
    needs: build
    if: ${{ inputs.sign-mode == 'post-hoc' && inputs.build-mac }}
    uses: arthur-debert/release/.github/workflows/sign-notarize-mac.yml@v3
    with:
      artifact-name: bundle-mac
      notarize: ${{ inputs.notarize }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # phos passes Apple-ID notary auth (no ASC .p8 key); the signer picks
      # whichever cred set is non-empty.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # -------------------------------------------------------------------
  # 3. GH release — sign-mode-agnostic (WS5, #816). Attaches the SIGNED mac
  #    bundle + linux/win in either mode.
  #
  #    Dependency + partial-release prevention: needs [prepare, build, sign].
  #    `sign` is SKIPPED in inline mode, so the `if:` below must accept a
  #    skipped sign while still BLOCKING on a failed one — any failed
  #    build/sign blocks the release (no partial ship). The default
  #    skipped-dependency rule (a skipped need skips the dependent) is the
  #    reason a plain `needs: [...,sign]` would wrongly skip release in
  #    inline mode; the explicit result gate fixes that.
  #
  #    Asset selection (stage-release-assets.sh): artifacts are downloaded
  #    each into their OWN subdir (no merge-multiple) so the signed and
  #    unsigned mac `.dmg` — same filename — never collide. The script then
  #    ships `bundle-mac-signed` in post-hoc mode (dropping the unsigned
  #    `bundle-mac` + its `.unsigned-app.tar.gz` reseal payload) or
  #    `bundle-mac` in inline mode, plus linux/win.
  # -------------------------------------------------------------------
  release:
    needs: [prepare, build, sign]
    # Run when prepare + build succeeded and sign either succeeded (post-hoc)
    # or was skipped (inline). A FAILED sign blocks the release. `!cancelled()`
    # (not `always()`) so a cancelled run never publishes; the explicit result
    # checks override the default "a skipped need skips the dependent" so the
    # inline path (sign skipped) still releases.
    if: >-
      ${{ !cancelled()
          && needs.prepare.result == 'success'
          && needs.build.result == 'success'
          && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: arthur-debert/release
          ref: v3
          path: .release
          sparse-checkout: bin-internal

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: .

      # Per-artifact subdirs (NO merge-multiple): keeps the unsigned
      # `bundle-mac/<app>.dmg` and the signed `bundle-mac-signed/<app>.dmg`
      # (same filename) from colliding. The signed mac artifact only exists
      # in post-hoc mode; the pattern matches both `bundle-*` and
      # `bundle-*-signed`.
      - name: Download bundles
        uses: actions/download-artifact@v7
        with:
          path: downloads
          pattern: bundle-*

      - name: Stage release assets (sign-mode-agnostic)
        env:
          DOWNLOAD_DIR: downloads
          ASSETS_DIR: bundles
          SIGN_MODE: ${{ inputs.sign-mode }}
          BUILD_MAC: ${{ inputs.build-mac }}
        run: bash .release/bin-internal/stage-release-assets.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          ASSETS_DIR: bundles
        run: bash .release/bin-internal/create-github-release.sh
