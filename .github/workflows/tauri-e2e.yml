name: Tauri Native E2E (reusable)

# Reusable workflow: run a Tauri app's NATIVE E2E suite — the real WebKitGTK
# webview driven over WebDriver (tauri-driver + WebKitWebDriver, under xvfb +
# dbus) — inside the shared pinned tauri-driver Docker image. This is the
# managed home for the native lane (release#445): the consumer's thin caller
# owns the triggers (PR + nightly cron + workflow_dispatch) and passes its config
# via `with:`; ALL the suite logic stays in the consumer's `runner-script`, which
# runs the SAME way on a dev's machine (CI == local).
#
# Why a dedicated workflow and not a job on tauri-ci.yml: the native lane has its
# OWN triggers (notably the nightly cron) that a tauri-ci job — invoked from the
# consumer's ci.yml on push/PR — could not carry.
#
# Policy-clean for enterprise-Actions-restricted orgs (e.g. phos-editor): no
# third-party Marketplace actions — pnpm lives inside the consumer's script, and
# path-gating is plain `git diff` (not dorny/paths-filter).
#
# Private native deps (e.g. phos-core) resolve as a GIT DEP from the consumer's
# own manifest (src-tauri/Cargo.toml) — the pin lives ONLY there, single-sourced
# with the unit lane (release#506). The job forwards GH_TOKEN so the
# runner-script can configure in-container git/cargo PAT auth (git-fetch-with-cli
# + token insteadOf) and let cargo clone the private repo during the build —
# there is no sibling checkout and no second pin to keep in sync.
#
# CONTRACT — the job sets these env vars for `runner-script`:
#   NATIVE_E2E_IN_CONTAINER=1        marker: already inside the pinned image
#   NATIVE_E2E_SCOPE=thin|full       path-gated scope (see full-scope-paths)
#   GH_TOKEN=<gh-token|GITHUB_TOKEN> auth for the private native git dep + the
#                                    private wasm release (the runner-script wires
#                                    cargo's git-CLI auth from it)

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label for both jobs.'
        type: string
        default: 'ubuntu-22.04'
      container-image:
        description: 'Pinned tauri-driver image (tag@sha256). Ships tauri-driver + WebKitWebDriver + Rust + Node + Tauri v2 deps.'
        type: string
        default: 'ivangabriele/tauri:debian-bookworm-22@sha256:242996c7744e3dfac7a58cf06f1c6338cd700d84aae9e92a66e884ad29a602c9'
      runner-script:
        description: 'Consumer script that builds + runs the native suite in its in-container role. Receives the NATIVE_E2E_* env above.'
        type: string
        default: 'app-bin/native-e2e.sh'
      full-scope-paths:
        description: 'ERE regex: a changed non-doc file matching it ⇒ full scope (else thin). Doc-only PRs (*.md/*.lex) are always thin; non-PR events are always full.'
        type: string
        required: true
      cache-paths:
        description: >-
          DEPRECATED / IGNORED. The hand-rolled cargo+target cache was replaced
          by Swatinem/rust-cache (its own pruning bounds target/ growth, so the
          weekly cold-rebuild is gone). Kept declared so existing thin callers
          don't break (removing an input is a MAJOR); no longer read.
        type: string
        default: ''
      cache-key-file:
        description: >-
          DEPRECATED / IGNORED. Swatinem keys on the workspace Cargo.lock itself;
          this input is no longer read. Kept declared (removal = MAJOR).
        type: string
        default: ''
      cache-key-prefix:
        description: >-
          Namespace for this lane's cache, passed through as Swatinem's `key:`.
          A consumer running the suite more than once with DIFFERENT cargo
          features (e.g. a second non-gating `--features X` lane) MUST give each
          lane its own prefix, or they collide on one cache and the heavier lane
          poisons the lean gate's `target/` (release#491). Distinct prefixes
          never cross-match.
        type: string
        default: 'tauri-e2e-cargo'
      wasm-cache-path:
        description: >-
          Path to the built phos-core wasm packages, cached across runs so the
          wasm crates are not rebuilt from source each run. Shares WS-B's blob:
          the key is wasm-v1-<runner.os>-<hashFiles(Cargo.lock)> (runner.os is
          the in-container Linux), so a hit populated by tauri-ci restores here
          too. The output is a pure function of the phos-core git sha
          (single-sourced via src-tauri/Cargo.lock), so the lock hash is the
          correct key.
        type: string
        default: 'src-tauri/pkg'
      share-debug-binary:
        description: >-
          Build the Tauri debug binary ONCE in a dedicated `build-debug` job and
          share it with native-e2e (instead of each lane compiling its own).
          Default false → fully INERT: build-debug does not run, native-e2e does
          not depend on or download anything, behaviour is byte-identical to a
          single-job compile. The runner-script must implement both roles (the
          NATIVE_E2E_BUILD_ONLY / NATIVE_E2E_PREBUILT_BINARY contract below)
          before this is flipped on (WS-E, release#795).
        type: boolean
        default: false
      prebuilt-binary-artifact-name:
        description: >-
          Artifact name for the shared debug binary when `share-debug-binary` is
          true. The `build-debug` job uploads under this name; native-e2e
          downloads it. Defaults to a Cargo.lock-hash-stamped name so a stale
          lock never restores a stale binary.
        type: string
        default: ''
      failure-artifact-path:
        description: 'Path uploaded as a debugging bundle on failure (absent on green runs is fine).'
        type: string
        default: 'test-results/native-e2e/'
    secrets:
      gh-token:
        description: 'PAT able to read the private native git dep (e.g. phos-core) + the private wasm release. REQUIRED when either is a private repo OTHER than the caller: the GITHUB_TOKEN fallback only reads the calling repo, so it will NOT fetch a private cross-repo sibling. Falls back to GITHUB_TOKEN only for public/same-repo deps.'
        required: false

permissions:
  contents: read

jobs:
  # Decide thin|full from what the PR touches (plain git diff — no third-party
  # action). Non-PR events (cron / dispatch) always go full.
  scope:
    runs-on: ${{ inputs.runner }}
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - name: Checkout consumer (full history for base..head diff)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch the managed scope script
        uses: actions/checkout@v6
        with:
          repository: arthur-debert/release
          ref: v3
          path: _managed
          sparse-checkout: bin-internal

      - name: Decide native scope
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_SCOPE_PATHS: ${{ inputs.full-scope-paths }}
        run: bash _managed/bin-internal/native-e2e-scope.sh

  # Build-once debug-binary SCAFFOLD (release#792, WS-C). Gated entirely by
  # `share-debug-binary` — default false ⇒ the `if` is false ⇒ this job never
  # runs and native-e2e depends on nothing. When flipped on (WS-E, release#795,
  # once the runner-script learns its two roles), it compiles the Tauri debug
  # binary ONCE here and native-e2e + the embedded-trial caller consume the
  # artifact instead of each recompiling (the binary is built 3× across lanes
  # today).
  #
  # CONTRACT — the env this job sets in its BUILD-ONLY role (WS-E implements):
  #   NATIVE_E2E_BUILD_ONLY=1          build the debug binary, then STOP — do NOT
  #                                    launch the suite. (Absent/empty ⇒ the
  #                                    runner-script's normal build+run role.)
  #   NATIVE_E2E_BINARY_OUTPUT_DIR     directory the runner-script writes the
  #                                    built binary (+ any sidecars) into; this
  #                                    exact dir is what gets uploaded.
  #   NATIVE_E2E_IN_CONTAINER=1        marker: already inside the pinned image.
  #   GH_TOKEN                         private-dep auth (same as native-e2e).
  build-debug:
    needs: scope
    if: ${{ inputs.share-debug-binary }}
    runs-on: ${{ inputs.runner }}
    # SAME pinned image as native-e2e — the binary must be ABI-compatible with
    # the WebKitGTK/glibc the suite runs against, so it is built in-container.
    container:
      image: ${{ inputs.container-image }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v6

      - name: Cache Rust (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ inputs.cache-key-prefix }}

      - name: Cache built wasm packages
        uses: actions/cache@v5
        with:
          path: ${{ inputs.wasm-cache-path }}
          key: wasm-v1-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build native debug binary (build-only)
        env:
          NATIVE_E2E_IN_CONTAINER: '1'
          NATIVE_E2E_BUILD_ONLY: '1'
          NATIVE_E2E_BINARY_OUTPUT_DIR: '${{ runner.temp }}/tauri-debug-binary'
          GH_TOKEN: ${{ secrets.gh-token || github.token }}
        run: bash ${{ inputs.runner-script }}

      - name: Upload shared debug binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.prebuilt-binary-artifact-name != '' && inputs.prebuilt-binary-artifact-name || format('tauri-debug-binary-{0}', hashFiles('src-tauri/Cargo.lock')) }}
          path: ${{ runner.temp }}/tauri-debug-binary
          if-no-files-found: error
          retention-days: 7

  native-e2e:
    # `needs` always lists build-debug, but build-debug is skipped when the
    # switch is off; the `always() && !failure(scope)` guard lets native-e2e
    # proceed past a SKIPPED build-debug while still gating on scope.
    needs: [scope, build-debug]
    if: ${{ always() && needs.scope.result == 'success' && (needs.build-debug.result == 'success' || needs.build-debug.result == 'skipped') }}
    runs-on: ${{ inputs.runner }}
    # The pinned image a dev uses locally too — CI == local, byte-for-byte.
    container:
      image: ${{ inputs.container-image }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v6

      # Swatinem caches + PRUNES the cargo registry + src-tauri/target. Its
      # pruning bounds target/ growth, so the deliberate weekly cold-rebuild
      # (the old ISO-week stamp, release#491) is gone — incremental every run.
      # CARGO_HOME is /usr/local/cargo in the pinned ivangabriele image, so
      # Swatinem caches the right registry inside the container.
      - name: Cache Rust (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ inputs.cache-key-prefix }}

      # Shares WS-B's wasm blob via the identical key — a hit populated by
      # tauri-ci restores the built phos-core wasm packages here, so the wasm
      # crates aren't rebuilt from source.
      - name: Cache built wasm packages
        uses: actions/cache@v5
        with:
          path: ${{ inputs.wasm-cache-path }}
          key: wasm-v1-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Pull the build-once debug binary when sharing is on. Inert otherwise
      # (the step is skipped and NATIVE_E2E_PREBUILT_BINARY stays empty, so the
      # runner-script compiles as it does today).
      - name: Download shared debug binary
        if: ${{ inputs.share-debug-binary }}
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.prebuilt-binary-artifact-name != '' && inputs.prebuilt-binary-artifact-name || format('tauri-debug-binary-{0}', hashFiles('src-tauri/Cargo.lock')) }}
          path: ${{ runner.temp }}/tauri-debug-binary

      - name: Run native-transport E2E
        env:
          NATIVE_E2E_IN_CONTAINER: '1'
          NATIVE_E2E_SCOPE: ${{ needs.scope.outputs.full == 'true' && 'full' || 'thin' }}
          # CONTRACT (WS-E implements the consume role): when sharing is on, this
          # points the runner-script at the downloaded prebuilt binary so it
          # runs the suite WITHOUT recompiling. Empty ⇒ normal build+run role.
          NATIVE_E2E_PREBUILT_BINARY: ${{ inputs.share-debug-binary && format('{0}/tauri-debug-binary', runner.temp) || '' }}
          # Auth for the private native git dep + the private wasm release. The
          # runner-script wires cargo's git-CLI token rewrite from this (the
          # build clones the private repo as a normal git dep — no checkout step).
          GH_TOKEN: ${{ secrets.gh-token || github.token }}
        run: bash ${{ inputs.runner-script }}

      # On failure the runner writes a bundle (event trail, state snapshot,
      # screenshot) so investigation starts from the report, not a re-run.
      - name: Upload native-e2e failure bundle
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: native-e2e-failure-bundle
          path: ${{ inputs.failure-artifact-path }}
          if-no-files-found: ignore
          retention-days: 14
