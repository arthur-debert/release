name: Tauri Native E2E (reusable)

# Reusable workflow: run a Tauri app's NATIVE E2E suite — the real WebKitGTK
# webview driven over WebDriver (tauri-driver + WebKitWebDriver, under xvfb +
# dbus) — inside the canonical pinned tauri-driver Docker image. This is the
# managed home for the native lane (release#445): the consumer's thin caller
# owns the triggers (PR + nightly cron + workflow_dispatch) and passes its config
# via `with:`; ALL the suite logic stays in the consumer's `runner-script`, which
# runs the SAME way on a dev's machine (CI == local).
#
# Why a dedicated workflow and not a job on tauri-ci.yml: the native lane has its
# OWN triggers (notably the nightly cron) that a tauri-ci job — invoked from the
# consumer's ci.yml on push/PR — could not carry.
#
# Policy-clean for enterprise-Actions-restricted orgs (e.g. phos-editor): no
# third-party Marketplace actions — pnpm lives inside the consumer's script, and
# path-gating is plain `git diff` (not dorny/paths-filter).
#
# Private native deps (e.g. phos-core) resolve as a GIT DEP from the consumer's
# own manifest (src-tauri/Cargo.toml) — the pin lives ONLY there, single-sourced
# with the unit lane (release#506). The job forwards GH_TOKEN so the
# runner-script can configure in-container git/cargo PAT auth (git-fetch-with-cli
# + token insteadOf) and let cargo clone the private repo during the build —
# there is no sibling checkout and no second pin to keep in sync.
#
# CONTRACT — the job sets these env vars for `runner-script`:
#   NATIVE_E2E_IN_CONTAINER=1        marker: already inside the pinned image
#   NATIVE_E2E_SCOPE=thin|full       path-gated scope (see full-scope-paths)
#   GH_TOKEN=<gh-token|GITHUB_TOKEN> auth for the private native git dep + the
#                                    private wasm release (the runner-script wires
#                                    cargo's git-CLI auth from it)

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label for both jobs.'
        type: string
        default: 'ubuntu-22.04'
      container-image:
        description: 'Pinned tauri-driver image (tag@sha256). Ships tauri-driver + WebKitWebDriver + Rust + Node + Tauri v2 deps.'
        type: string
        default: 'ivangabriele/tauri:debian-bookworm-22@sha256:242996c7744e3dfac7a58cf06f1c6338cd700d84aae9e92a66e884ad29a602c9'
      runner-script:
        description: 'Consumer script that builds + runs the native suite in its in-container role. Receives the NATIVE_E2E_* env above.'
        type: string
        default: 'app-bin/native-e2e.sh'
      full-scope-paths:
        description: 'ERE regex: a changed non-doc file matching it ⇒ full scope (else thin). Doc-only PRs (*.md/*.lex) are always thin; non-PR events are always full.'
        type: string
        required: true
      cache-paths:
        description: 'Newline-separated paths to cache across runs (cargo registry + tauri target).'
        type: string
        default: |
          /usr/local/cargo/registry
          src-tauri/target
      cache-key-file:
        description: 'File whose hash keys the incremental cache.'
        type: string
        default: 'src-tauri/Cargo.lock'
      cache-key-prefix:
        description: >-
          Namespace for this lane's cache. A consumer running the suite more
          than once with DIFFERENT cargo features (e.g. a second non-gating
          `--features X` lane) MUST give each lane its own prefix, or they
          collide on one key+restore-keys and the heavier lane poisons the lean
          gate's `target/` (release#491). Both `key` and `restore-keys` are
          scoped to this prefix, so distinct prefixes never cross-match.
        type: string
        default: 'tauri-e2e-cargo'
      failure-artifact-path:
        description: 'Path uploaded as a debugging bundle on failure (absent on green runs is fine).'
        type: string
        default: 'test-results/native-e2e/'
    secrets:
      gh-token:
        description: 'PAT able to read the private native git dep (e.g. phos-core) + the private wasm release. Falls back to GITHUB_TOKEN.'
        required: false

permissions:
  contents: read

jobs:
  # Decide thin|full from what the PR touches (plain git diff — no third-party
  # action). Non-PR events (cron / dispatch) always go full.
  scope:
    runs-on: ${{ inputs.runner }}
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - name: Checkout consumer (full history for base..head diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the managed scope script
        uses: actions/checkout@v4
        with:
          repository: arthur-debert/release
          ref: v2
          path: _managed
          sparse-checkout: bin-internal

      - name: Decide native scope
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_SCOPE_PATHS: ${{ inputs.full-scope-paths }}
        run: bash _managed/bin-internal/native-e2e-scope.sh

  native-e2e:
    needs: scope
    runs-on: ${{ inputs.runner }}
    # The pinned image a dev uses locally too — CI == local, byte-for-byte.
    container:
      image: ${{ inputs.container-image }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v4

      # Weekly cache rotation bounds growth (release#491). Raw `actions/cache`
      # of `target/` has no pruning: each new Cargo.lock hash restores the prior
      # (ever-larger) target via restore-keys, builds on top, and saves a bigger
      # entry — monotonic creep until `No space left on device`. Swatinem's
      # pruning isn't an option here (phos bans third-party Marketplace actions).
      # Instead the key/restore-keys carry an ISO-week stamp scoped to the lane
      # prefix: incremental WITHIN a week, then a clean cold rebuild at the week
      # boundary as the bloated prior-week caches age out via GitHub's eviction.
      - name: Compute weekly cache-rotation stamp
        id: cache_stamp
        run: echo "week=$(date -u +%G%V)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry + Tauri target
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ inputs.cache-key-prefix }}-${{ steps.cache_stamp.outputs.week }}-${{ hashFiles(inputs.cache-key-file) }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-${{ steps.cache_stamp.outputs.week }}-

      - name: Run native-transport E2E
        env:
          NATIVE_E2E_IN_CONTAINER: '1'
          NATIVE_E2E_SCOPE: ${{ needs.scope.outputs.full == 'true' && 'full' || 'thin' }}
          # Auth for the private native git dep + the private wasm release. The
          # runner-script wires cargo's git-CLI token rewrite from this (the
          # build clones the private repo as a normal git dep — no checkout step).
          GH_TOKEN: ${{ secrets.gh-token || github.token }}
        run: bash ${{ inputs.runner-script }}

      # On failure the runner writes a bundle (event trail, state snapshot,
      # screenshot) so investigation starts from the report, not a re-run.
      - name: Upload native-e2e failure bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-failure-bundle
          path: ${{ inputs.failure-artifact-path }}
          if-no-files-found: ignore
          retention-days: 14
