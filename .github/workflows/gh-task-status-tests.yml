name: gh-task-status tests

# BATS contract suite for the gh-task-status shim: arg handling, exit codes,
# usage text — the offline command surface. The lifecycle logic itself is
# covered by pytest (the `py-lint` job in ci.yml) over recorded fixtures; the
# end-to-end live path is exercised by the live-verification phase (#337).

on:
  push:
    branches: ['**']
    paths:
      - 'bin/gh-task-status'
      - 'lib/release_gh/**'
      - 'tests/gh-task-status/**'
      - '.github/workflows/gh-task-status-tests.yml'
  pull_request:
    paths:
      - 'bin/gh-task-status'
      - 'lib/release_gh/**'
      - 'tests/gh-task-status/**'
      - '.github/workflows/gh-task-status-tests.yml'

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run BATS contract suite
        run: bats tests/gh-task-status/
