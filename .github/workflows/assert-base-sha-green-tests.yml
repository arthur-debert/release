name: assert-base-sha-green tests

# BATS contract suite for bin-internal/assert-base-sha-green.sh — the WS2 (#811)
# base-sha CI-green assertion that replaced the in-prepare re-gate. Fully
# offline: a stub `gh` on PATH replays a canned check-runs response so the suite
# asserts the pass / fail / absent-CI verdicts without hitting the API.

on:
  push:
    branches: ["**"]
    paths:
      - "bin-internal/assert-base-sha-green.sh"
      - "tests/assert-base-sha-green/**"
      - ".github/workflows/assert-base-sha-green-tests.yml"
  pull_request:
    paths:
      - "bin-internal/assert-base-sha-green.sh"
      - "tests/assert-base-sha-green/**"
      - ".github/workflows/assert-base-sha-green-tests.yml"

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run BATS suite
        run: bats tests/assert-base-sha-green/
