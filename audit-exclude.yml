# Repos that audit-portfolio skips. Each entry needs a reason —
# these decisions decay if undocumented, and "why is X excluded?"
# becomes a tax over time.
#
# An excluded repo can still have the main-branch-protection ruleset
# (so install-release-token, sweep-github-policy etc. continue to
# touch it). The exclusion is just about the audit/smoke-test loop:
# this repo's standard PR-driven flow either doesn't apply or isn't
# worth gating on.

excluded:
  - repo: arthur-debert/homebrew-tools
    reason: |
      Shared homebrew tap. Formula updates land via release workflows
      pushing commits from consumer repos (rust-cli's homebrew-formula
      job), not via PRs. The PR-driven Copilot/CI loop doesn't apply.

  - repo: arthur-debert/treex
    reason: |
      Inactive — no current development. Re-include if work resumes.

  - repo: arthur-debert/simple-gal-action
    reason: |
      GitHub action repo, minimal active development, different lifecycle
      from the application repos. Re-evaluate if it gets steady use.
