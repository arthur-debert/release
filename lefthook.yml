# THE gate. ONE definition, run identically everywhere code passes through:
#   - session start — the bootstrap installs lefthook + every tool below and
#     runs `lefthook install`, so the gate is ARMED before any work begins
#   - local pre-commit — the wired hook, on every commit
#   - CI — the same `lefthook run pre-commit --all-files`, as a required check
#
# This is a HARD gate, not "fast feedback deferring to CI." That earlier stance
# is exactly why non-conforming content reached main: the local hook called
# itself advisory and CI never ran this gate, so no layer was authoritative.
#
# A missing tool is a BOOTSTRAP failure, never a reason to pass: every command
# below exits NON-ZERO when its tool is absent (no `exit 0` skips). If a tool is
# missing, re-run `release-core gate --provision` (or release-core init) — do NOT
# bypass. `--no-verify` is defeated by CI running this same gate on a clean
# runner where the tools are guaranteed present.

pre-commit:
  parallel: true
  commands:
    shellcheck:
      # Covers local bin/ + bin-internal/ AND the distributed templates/**/bin
      # tools (previously a separate CI job — folded in here so the gate is the
      # single definition). File selection is by shebang content below, so
      # non-shell files in these dirs fall out.
      glob:
        - "bin/*"
        - "bin-internal/*.sh"
        - "bin-internal/*.bash"
        - "templates/**/bin/*"
      run: |
        if ! command -v shellcheck >/dev/null 2>&1; then
          echo "ERROR: shellcheck not installed — the gate does not skip. Re-run `release-core gate --provision` (or release-core init)." >&2
          exit 1
        fi
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          case "$f" in
            *.sh|*.bash) ;;
            *)
              # POSIX ERE has no `\b`; use explicit `/`-or-space
              # separators so BSD grep on macOS matches identically to
              # GNU grep on Linux.
              head -1 "$f" | grep -qE '^#!.*[ /](bash|sh|dash|ksh)( |$)' || continue
              ;;
          esac
          echo "shellcheck $f"
          shellcheck --severity=info "$f" || fail=1
        done
        exit $fail

    prettier:
      # Scoped to the distributed templates/ tree (what consumers receive).
      # Extending prettier to format prose under docs/ is a separate policy
      # change — mass `prettier --write` mangles prose (+ sequences → bullets,
      # org/* globs → emphasis), so it needs per-file prose hardening first.
      # Tracked as a follow-up; not bundled into the gate-hardening change.
      glob:
        # `dir/*.ext` not `dir/**/*.ext`: mid-path `**/` requires ≥1 segment
        # so it missed files directly under the dir; `*` crosses `/` and
        # covers direct + any depth (release#531 F4).
        - "templates/*.{json,md,yml,yaml}"
      run: |
        if ! command -v prettier >/dev/null 2>&1; then
          echo "ERROR: prettier not installed — the gate does not skip. Re-run `release-core gate --provision` (or release-core init)." >&2
          exit 1
        fi
        prettier --check -- {staged_files}

    actionlint:
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - ".github/actions/*.yml"
        - ".github/actions/*.yaml"
      run: |
        if ! command -v actionlint >/dev/null 2>&1; then
          echo "ERROR: actionlint not installed — the gate does not skip. Re-run `release-core gate --provision` (or release-core init)." >&2
          exit 1
        fi
        # Run actionlint over the whole tree (it needs cross-file
        # context for reusable-workflow calls anyway). Severity gate
        # for shellcheck integration goes via SHELLCHECK_OPTS env —
        # actionlint's own `-shellcheck` flag takes a binary path,
        # not a command line, so passing `-shellcheck '-S warning'`
        # silently disables integration entirely.
        SHELLCHECK_OPTS='-S warning' actionlint -color

    workflow-action-major:
      # Every internal reference to release's OWN reusable workflows / composite
      # actions / boot resolver must track the floating major (@v3 / --major v3),
      # never a frozen older major. A `rust-cli.yml@v3` whose internal `uses:`
      # still says `prepare-release@v2` silently runs stale v2 action code for
      # every consumer "on v3" — exactly the drift that shipped the -release-rc
      # main-pollution + crates.io publish incident (the @v2 pins were never
      # advanced at the v3.0.0 cut). The same class re-bit the v3.4.0 cut through
      # TWO refs this guard didn't yet inspect: workflow self-refs
      # (`gh-action.yml@v2`) and `install-release-core --major v2` hardcodes
      # (release#786). All three are checked below. Bump the @v3 / v3 literals at
      # the next major.
      #
      # Comments: action/workflow ref examples in comment blocks are the
      # consumer copy-paste templates, so they ARE enforced (a stale example
      # mis-pins a consumer). `--major vN` mentions in comments are explanatory
      # prose about internals (e.g. release.yml's history of the v2 bug), so the
      # --major check strips comments first — only LIVE invocations are enforced.
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - ".github/actions/*/action.yml"
      run: |
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          # (a) internal composite-action refs
          bad=$(grep -noE 'arthur-debert/release/\.github/actions/[a-z0-9-]+@v[0-9][0-9.]*' "$f" | grep -vE '@v3$') || true
          if [ -n "$bad" ]; then
            echo "ERROR: $f pins an internal release ACTION off the floating major (@v3):" >&2
            echo "$bad" >&2
            fail=1
          fi
          # (b) internal reusable-workflow self-refs (use @v3, or a local ./ ref
          # for release's own dogfood callers — a local ref carries no @vN and is
          # not matched here).
          bad=$(grep -noE 'arthur-debert/release/\.github/workflows/[a-z0-9._-]+@v[0-9][0-9.]*' "$f" | grep -vE '@v3$') || true
          if [ -n "$bad" ]; then
            echo "ERROR: $f pins an internal release WORKFLOW off the floating major (@v3) — use @v3 or a local ./ ref:" >&2
            echo "$bad" >&2
            fail=1
          fi
          # (c) install-release-core boot pins (strip comments: only live calls).
          bad=$(sed 's/#.*//' "$f" | grep -noE '\-\-major v[0-9]+' | grep -vE 'v3$') || true
          if [ -n "$bad" ]; then
            echo "ERROR: $f hardcodes a release boot --major off the floating major (v3):" >&2
            echo "$bad" >&2
            fail=1
          fi
        done
        exit $fail

    gh-slurp-jq-combo:
      # `gh api --slurp` CANNOT be combined with `--jq` or `--template` — gh
      # rejects it ("the --slurp option is not supported with --jq or
      # --template"). The base-sha CI-green guard (assert-base-sha-green.sh) hit
      # exactly this and FAILED at `prepare` — but only on REAL cuts (RCs are
      # IS_VERIFY and skip the guard), so every RC passed and the first real
      # release was the first to fail. The fix is always: drop the flag and pipe
      # the slurped pages to EXTERNAL jq (`gh api … --slurp | jq -r '<expr>'`).
      # A stub test can't reproduce gh's rejection; this static guard can't be
      # fooled, so it's the real defense for this regression class.
      #
      # Scans tracked shell tooling + the embedded `run:` shell in workflow /
      # action YAML. Line-continuations are joined first so a `gh api` whose
      # `--slurp` and `--jq` sit on different continued lines is still caught;
      # comments are stripped so prose mentioning the combo (e.g. this guard's
      # own rationale) never false-positives.
      glob:
        - "bin/*"
        - "bin-internal/*.sh"
        - "bin-internal/*.bash"
        - "templates/**/bin/*"
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - ".github/actions/*/action.yml"
      run: |
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          # Strip `#` comments, then join `\`-continued lines into one logical
          # line so multi-line `gh api` invocations are inspected as a unit
          # (awk, not sed, for identical BSD/GNU behavior). A logical line is
          # flagged when it has `gh`, `api`, `--slurp`, AND (`--jq` or
          # `--template`) — the unsupported combination.
          bad=$(sed 's/#.*//' "$f" \
            | awk '{ if (sub(/\\$/,"")) { printf "%s", $0 } else { print } }' \
            | grep -nE 'gh[[:space:]].*api.*--slurp' \
            | grep -E -- '--jq|--template') || true
          if [ -n "$bad" ]; then
            echo "ERROR: $f combines \`gh api --slurp\` with --jq/--template (unsupported by gh)." >&2
            echo "Fix: drop the flag and pipe the slurped pages to external jq, e.g.:" >&2
            echo "  gh api … --paginate --slurp | jq -r '<expr>'" >&2
            echo "$bad" >&2
            fail=1
          fi
        done
        exit $fail

    ruff:
      # Lint + format-check the Python workspace (release_core + orchestrator)
      # PLUS the extensionless Python shims under bin/ and templates/commons/bin/
      # (changelog, release-*, …) which carry no .py extension.
      # Config lives at the workspace-root pyproject.toml [tool.ruff]. Mirrors
      # the CI `py-lint` job.
      #
      # The bin/ + app-bin/ globs deliberately match NON-python files too (the
      # bash shims `install-release-core`, `fetch-artifact`). We can't hand a
      # bash file to ruff — it errors as invalid Python — so file selection is
      # done by CONTENT, not glob, exactly like
      # bin/check-shell: keep only `*.py` plus shebang-detected python shims,
      # drop everything else. This mirrors the repo's unified content-based gate
      # (release#348) and stays mode-invariant
      # across staged vs --all-files.
      glob:
        - "templates/commons/lib/*.py"
        - "orchestrator/*.py"
        - "bin/**"
        - "app-bin/**"
        - "templates/commons/bin/**"
        - "templates/commons/app-bin/**"
      run: |
        if ! command -v ruff >/dev/null 2>&1; then
          echo "ERROR: ruff not installed — the gate does not skip. Re-run `release-core gate --provision` (or release-core init)." >&2
          exit 1
        fi
        # POSIX sh — lefthook runs hooks under `sh` (dash on Linux), not bash,
        # so no arrays. Accumulate matched files in the positional params via
        # `set --` (the portable list).
        set --
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          case "$f" in
            *.py)
              set -- "$@" "$f"
              continue
              ;;
          esac
          # No .py extension: route by shebang, like bin/check-shell. A python
          # shebang (python / python3 / `env python…`) ⇒ lint; anything else
          # (bash/sh shims sharing bin/) is skipped.
          first=""
          read -r first < "$f" 2>/dev/null || true
          case "$first" in
            '#!'*python*) set -- "$@" "$f" ;;
          esac
        done
        [ "$#" -eq 0 ] && exit 0
        ruff check "$@"
        ruff format --check "$@"

    consumer-contract-check:
      # Freshness of the GENERATED consumer-contract manifest (#584, epic #583):
      # docs/references/consumer-contract.yaml is a checked-in view of
      # release_core/sync.py applied to templates/ — a contract-changing PR must
      # regenerate it in the SAME PR (`release-core admin contract dump`).
      # The wrapper runs the WORKING-TREE release_core via PYTHONPATH, never the
      # installed wheel (the PATH `release-core` is the latest release, which
      # would regenerate from the OLD classification code).
      glob:
        - "templates/**"
        - "skills/**"
        - "docs/references/consumer-contract.yaml"
      run: |
        if ! command -v python3 >/dev/null 2>&1; then
          echo "ERROR: python3 not installed — the gate does not skip. Re-run `release-core gate --provision` (or release-core init)." >&2
          exit 1
        fi
        bin-internal/check-consumer-contract.sh

    consumer-contract-lint:
      # The assumption lint (#584): every CI surface (.github/workflows,
      # .github/actions, templates/ workflow copies) — any JOB referencing a
      # managed path (per the manifest) without a prior install step in the
      # same job (arm-gate / release-core init) fails. The mechanical "who still
      # assumes the old shape" sweep that would have caught release#579.
      # The shrink-only baseline was drained to zero and its file deleted
      # (release#588) — the glob entry below stays so re-introducing one
      # re-triggers the lint, but re-creating it is never the fix.
      glob:
        - ".github/workflows/*"
        - ".github/actions/**"
        - "templates/**"
        - "docs/references/consumer-contract.yaml"
        - "docs/references/consumer-contract-lint-baseline.yaml"
      run: |
        if ! command -v python3 >/dev/null 2>&1; then
          echo "ERROR: python3 not installed — the gate does not skip. Re-run `release-core gate --provision` (or release-core init)." >&2
          exit 1
        fi
        bin-internal/lint-consumer-contract.sh

    captured-fixtures-lint:
      # The external-surface fixture provenance lint (#623): every fixture under
      # a registered seam (prstate gh-API payloads + the classify/apply_ruleset
      # inline-constant test files) must carry a `captured-from:` provenance
      # marker. A NEW unmarked fixture fails; a shrink-only baseline grandfathers
      # today's synthetic offenders; a now-marked fixture's stale baseline entry
      # also fails. Kills the green-suite/wrong-world defect class (#619/#620/#612)
      # for covered seams. Runs the WORKING-TREE release_core (never the wheel).
      # See docs/dev/captured-fixture-provenance.md.
      glob:
        - "templates/commons/lib/release_core/release_core/captured_fixtures.py"
        - "templates/commons/lib/release_core/release_core/verbs/captured_fixtures.py"
        - "templates/commons/lib/release_core/tests/prstate_fixtures/**"
        - "templates/commons/lib/release_core/tests/test_core_classify.py"
        - "templates/commons/lib/release_core/tests/test_core_apply_ruleset.py"
        - "templates/commons/lib/release_core/tests/captured-fixture-lint-baseline.yaml"
      run: |
        if ! command -v python3 >/dev/null 2>&1; then
          echo "ERROR: python3 not installed — the gate does not skip. Re-run `release-core gate --provision` (or release-core init)." >&2
          exit 1
        fi
        bin-internal/lint-captured-fixtures.sh

    lint-skills:
      # Markdownlint our OWN skill docs. Vendored skills (those carrying
      # an .upstream provenance marker) are skipped by the script — we
      # don't own them, so cleaning their markdown churns upstream
      # (release#321). Globs on any skill .md so the gate fires whenever
      # a skill doc is touched; the script always lints the full
      # self-authored set (it's fast).
      glob:
        - "skills/*.md"
      run: |
        if ! command -v markdownlint >/dev/null 2>&1; then
          echo "ERROR: markdownlint not installed — the gate does not skip. Re-run `release-core gate --provision` (or release-core init)." >&2
          exit 1
        fi
        bin-internal/lint-skills.sh
