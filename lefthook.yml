# Lefthook pre-commit checks. Mirrors what CI runs in
# .github/workflows/gh-action-ci.yml so failures surface before push.
#
# Bootstrap: `lefthook install` (one-time per clone).
#
# Logs a one-liner and exits 0 if a tool is missing — the canonical
# CI run is still the source of truth; lefthook is fast local
# feedback, not a hard gate.

pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob:
        - "bin/*"
        - "bin-internal/*.sh"
        - "bin-internal/*.bash"
      run: |
        if ! command -v shellcheck >/dev/null 2>&1; then
          echo "shellcheck not installed; skipping (install: apt-get install shellcheck)"
          exit 0
        fi
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          case "$f" in
            *.sh|*.bash) ;;
            *)
              # POSIX ERE has no `\b`; use explicit `/`-or-space
              # separators so BSD grep on macOS matches identically to
              # GNU grep on Linux.
              head -1 "$f" | grep -qE '^#!.*[ /](bash|sh|dash|ksh)( |$)' || continue
              ;;
          esac
          echo "shellcheck $f"
          shellcheck --severity=info "$f" || fail=1
        done
        exit $fail

    prettier:
      glob:
        - "templates/**/*.{json,md,yml,yaml}"
      run: |
        if ! command -v prettier >/dev/null 2>&1; then
          echo "prettier not installed; skipping (install: brew install prettier)"
          exit 0
        fi
        prettier --check -- {staged_files}

    actionlint:
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - ".github/actions/**/*.yml"
        - ".github/actions/**/*.yaml"
      run: |
        if ! command -v actionlint >/dev/null 2>&1; then
          echo "actionlint not installed; skipping (install: https://github.com/rhysd/actionlint)"
          exit 0
        fi
        # Run actionlint over the whole tree (it needs cross-file
        # context for reusable-workflow calls anyway). Severity gate
        # for shellcheck integration goes via SHELLCHECK_OPTS env —
        # actionlint's own `-shellcheck` flag takes a binary path,
        # not a command line, so passing `-shellcheck '-S warning'`
        # silently disables integration entirely.
        SHELLCHECK_OPTS='-S warning' actionlint -color

    ruff:
      # Lint + format-check the Python workspace (release_gh + orchestrator)
      # PLUS the extensionless Python shims under bin/ and templates/commons/bin/
      # (changelog, gh-task-status, release-*, …) which carry no .py extension.
      # Config lives at the workspace-root pyproject.toml [tool.ruff]. Mirrors
      # the CI `py-lint` job.
      #
      # The bin/ + app-bin/ globs deliberately match NON-python files too (the
      # bash shims `release`, `check-shell`, `setup-dev-env.sh`, the vendored
      # share/ tools). We can't hand a bash file to ruff — it errors as invalid
      # Python — so file selection is done by CONTENT, not glob, exactly like
      # bin/check-shell: keep only `*.py` plus shebang-detected python shims,
      # drop everything else. This mirrors the repo's unified content-based gate
      # (release#348 / docs/proposals/unified-gate.lex) and stays mode-invariant
      # across staged vs --all-files.
      glob:
        - "templates/commons/lib/**/*.py"
        - "orchestrator/**/*.py"
        - "tests/python/**/*.py"
        - "bin/**"
        - "app-bin/**"
        - "templates/commons/bin/**"
        - "templates/commons/app-bin/**"
      run: |
        if ! command -v ruff >/dev/null 2>&1; then
          echo "ruff not installed; skipping (install: brew install ruff)"
          exit 0
        fi
        py_files=()
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          case "$f" in
            */share/*) continue ;; # vendored (own provenance) — exempt
            *.py) py_files+=("$f"); continue ;;
          esac
          # No .py extension: route by shebang, like bin/check-shell. A python
          # shebang (python / python3 / `env python…`) ⇒ lint; anything else
          # (bash/sh shims sharing bin/) is skipped.
          first=""
          read -r first < "$f" 2>/dev/null || true
          case "$first" in
            '#!'*python*) py_files+=("$f") ;;
          esac
        done
        [ ${#py_files[@]} -eq 0 ] && exit 0
        ruff check "${py_files[@]}"
        ruff format --check "${py_files[@]}"

    lint-skills:
      # Markdownlint our OWN skill docs. Vendored skills (those carrying
      # an .upstream provenance marker) are skipped by the script — we
      # don't own them, so cleaning their markdown churns upstream
      # (release#321). Globs on any skill .md so the gate fires whenever
      # a skill doc is touched; the script always lints the full
      # self-authored set (it's fast).
      glob:
        - "skills/**/*.md"
      run: |
        if ! command -v markdownlint >/dev/null 2>&1; then
          echo "markdownlint not installed; skipping skill lint (install: brew install markdownlint-cli)"
          exit 0
        fi
        bin-internal/lint-skills.sh
