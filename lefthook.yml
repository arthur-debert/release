# THE gate. ONE definition, run identically everywhere code passes through:
#   - session start — the bootstrap installs lefthook + every tool below and
#     runs `lefthook install`, so the gate is ARMED before any work begins
#   - local pre-commit — the wired hook, on every commit
#   - CI — the same `lefthook run pre-commit --all-files`, as a required check
#
# This is a HARD gate, not "fast feedback deferring to CI." That earlier stance
# is exactly why non-conforming content reached main: the local hook called
# itself advisory and CI never ran this gate, so no layer was authoritative.
#
# A missing tool is a BOOTSTRAP failure, never a reason to pass: every command
# below exits NON-ZERO when its tool is absent (no `exit 0` skips). If a tool is
# missing, re-run the bootstrap (setup-dev-env.sh / release-core init) — do NOT
# bypass. `--no-verify` is defeated by CI running this same gate on a clean
# runner where the tools are guaranteed present.

pre-commit:
  parallel: true
  commands:
    shellcheck:
      # Covers local bin/ + bin-internal/ AND the distributed templates/**/bin
      # tools (previously a separate CI job — folded in here so the gate is the
      # single definition). File selection is by shebang content below, so
      # non-shell files in these dirs fall out.
      glob:
        - "bin/*"
        - "bin-internal/*.sh"
        - "bin-internal/*.bash"
        - "templates/**/bin/*"
      run: |
        if ! command -v shellcheck >/dev/null 2>&1; then
          echo "ERROR: shellcheck not installed — the gate does not skip. Re-run the bootstrap (setup-dev-env.sh / release-core init)." >&2
          exit 1
        fi
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          case "$f" in
            *.sh|*.bash) ;;
            *)
              # POSIX ERE has no `\b`; use explicit `/`-or-space
              # separators so BSD grep on macOS matches identically to
              # GNU grep on Linux.
              head -1 "$f" | grep -qE '^#!.*[ /](bash|sh|dash|ksh)( |$)' || continue
              ;;
          esac
          echo "shellcheck $f"
          shellcheck --severity=info "$f" || fail=1
        done
        exit $fail

    prettier:
      # Scoped to the distributed templates/ tree (what consumers receive).
      # Extending prettier to format prose under docs/ is a separate policy
      # change — mass `prettier --write` mangles prose (+ sequences → bullets,
      # org/* globs → emphasis), so it needs per-file prose hardening first.
      # Tracked as a follow-up; not bundled into the gate-hardening change.
      glob:
        # `dir/*.ext` not `dir/**/*.ext`: mid-path `**/` requires ≥1 segment
        # so it missed files directly under the dir; `*` crosses `/` and
        # covers direct + any depth (release#531 F4).
        - "templates/*.{json,md,yml,yaml}"
      run: |
        if ! command -v prettier >/dev/null 2>&1; then
          echo "ERROR: prettier not installed — the gate does not skip. Re-run the bootstrap (setup-dev-env.sh / release-core init)." >&2
          exit 1
        fi
        prettier --check -- {staged_files}

    actionlint:
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - ".github/actions/*.yml"
        - ".github/actions/*.yaml"
      run: |
        if ! command -v actionlint >/dev/null 2>&1; then
          echo "ERROR: actionlint not installed — the gate does not skip. Re-run the bootstrap (setup-dev-env.sh / release-core init)." >&2
          exit 1
        fi
        # Run actionlint over the whole tree (it needs cross-file
        # context for reusable-workflow calls anyway). Severity gate
        # for shellcheck integration goes via SHELLCHECK_OPTS env —
        # actionlint's own `-shellcheck` flag takes a binary path,
        # not a command line, so passing `-shellcheck '-S warning'`
        # silently disables integration entirely.
        SHELLCHECK_OPTS='-S warning' actionlint -color

    ruff:
      # Lint + format-check the Python workspace (release_core + orchestrator)
      # PLUS the extensionless Python shims under bin/ and templates/commons/bin/
      # (changelog, release-*, …) which carry no .py extension.
      # Config lives at the workspace-root pyproject.toml [tool.ruff]. Mirrors
      # the CI `py-lint` job.
      #
      # The bin/ + app-bin/ globs deliberately match NON-python files too (the
      # bash shims `release`, `check-shell`, `setup-dev-env.sh`). We can't hand a
      # bash file to ruff — it errors as invalid Python — so file selection is
      # done by CONTENT, not glob, exactly like
      # bin/check-shell: keep only `*.py` plus shebang-detected python shims,
      # drop everything else. This mirrors the repo's unified content-based gate
      # (release#348) and stays mode-invariant
      # across staged vs --all-files.
      glob:
        - "templates/commons/lib/*.py"
        - "orchestrator/*.py"
        - "bin/**"
        - "app-bin/**"
        - "templates/commons/bin/**"
        - "templates/commons/app-bin/**"
      run: |
        if ! command -v ruff >/dev/null 2>&1; then
          echo "ERROR: ruff not installed — the gate does not skip. Re-run the bootstrap (setup-dev-env.sh / release-core init)." >&2
          exit 1
        fi
        # POSIX sh — lefthook runs hooks under `sh` (dash on Linux), not bash,
        # so no arrays. Accumulate matched files in the positional params via
        # `set --` (the portable list).
        set --
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          case "$f" in
            *.py)
              set -- "$@" "$f"
              continue
              ;;
          esac
          # No .py extension: route by shebang, like bin/check-shell. A python
          # shebang (python / python3 / `env python…`) ⇒ lint; anything else
          # (bash/sh shims sharing bin/) is skipped.
          first=""
          read -r first < "$f" 2>/dev/null || true
          case "$first" in
            '#!'*python*) set -- "$@" "$f" ;;
          esac
        done
        [ "$#" -eq 0 ] && exit 0
        ruff check "$@"
        ruff format --check "$@"

    consumer-contract-check:
      # Freshness of the GENERATED consumer-contract manifest (#584, epic #583):
      # docs/references/consumer-contract.yaml is a checked-in view of
      # release_core/sync.py applied to templates/ — a contract-changing PR must
      # regenerate it in the SAME PR (`release-core admin contract dump`).
      # The wrapper runs the WORKING-TREE release_core via PYTHONPATH, never the
      # installed wheel (the PATH `release-core` is the latest release, which
      # would regenerate from the OLD classification code).
      glob:
        - "templates/**"
        - "skills/**"
        - "docs/references/consumer-contract.yaml"
      run: |
        if ! command -v python3 >/dev/null 2>&1; then
          echo "ERROR: python3 not installed — the gate does not skip. Re-run the bootstrap (setup-dev-env.sh / release-core init)." >&2
          exit 1
        fi
        bin-internal/check-consumer-contract.sh

    consumer-contract-lint:
      # The assumption lint (#584): every CI surface (.github/workflows,
      # .github/actions, templates/ workflow copies) — any JOB referencing a
      # managed path (per the manifest) without a prior materialize step in the
      # same job (arm-gate / release-core init) fails. The mechanical "who still
      # assumes the old shape" sweep that would have caught release#579.
      # The shrink-only baseline was drained to zero and its file deleted
      # (release#588) — the glob entry below stays so re-introducing one
      # re-triggers the lint, but re-creating it is never the fix.
      glob:
        - ".github/workflows/*"
        - ".github/actions/**"
        - "templates/**"
        - "docs/references/consumer-contract.yaml"
        - "docs/references/consumer-contract-lint-baseline.yaml"
      run: |
        if ! command -v python3 >/dev/null 2>&1; then
          echo "ERROR: python3 not installed — the gate does not skip. Re-run the bootstrap (setup-dev-env.sh / release-core init)." >&2
          exit 1
        fi
        bin-internal/lint-consumer-contract.sh

    lint-skills:
      # Markdownlint our OWN skill docs. Vendored skills (those carrying
      # an .upstream provenance marker) are skipped by the script — we
      # don't own them, so cleaning their markdown churns upstream
      # (release#321). Globs on any skill .md so the gate fires whenever
      # a skill doc is touched; the script always lints the full
      # self-authored set (it's fast).
      glob:
        - "skills/*.md"
      run: |
        if ! command -v markdownlint >/dev/null 2>&1; then
          echo "ERROR: markdownlint not installed — the gate does not skip. Re-run the bootstrap (setup-dev-env.sh / release-core init)." >&2
          exit 1
        fi
        bin-internal/lint-skills.sh
